<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>IBERFIT · sesiones publicadas · QA aislado</title>
  <link rel="stylesheet" href="/src/m26/design/tokens.css">
  <link rel="stylesheet" href="/src/m26/design/typography.css">
  <link rel="stylesheet" href="/src/m26/design/icons.css">
  <link rel="stylesheet" href="/src/m26/shell/shell.css">
  <link rel="stylesheet" href="/src/m26/rc39/rc39.css">
  <link rel="stylesheet" href="/src/m26/design/primitives.css">
  <link rel="stylesheet" href="/src/m26/design/role-surfaces.css">
  <link rel="stylesheet" href="/src/m26/design/premium-ux.css">
  <link rel="stylesheet" href="/src/m26/design/adaptive-layout.css">
  <link rel="stylesheet" href="/src/m26/design/signature-ux-v2.css">
  <link rel="stylesheet" href="/src/m26/design/brand-vision.css">
  <link rel="stylesheet" href="/src/m26/design/dark-iberfit-v2.css">
  <link rel="stylesheet" href="/src/m26/design/iberfit-premium-v3.css">
  <style>
    html,body{margin:0;min-height:100%;width:100%;background:#071b13;color:#f6f1e4}
    body{box-sizing:border-box;padding:clamp(.6rem,2.5vw,1.5rem)}
    /* Isolated QA omits the sidebar, so neutralize production's two-column
       shell grid while keeping its real role/workspace CSS selectors. */
    #qa-root.m26-shell{display:block;width:100%;max-width:1180px;margin-inline:auto;min-height:100dvh;min-width:0}
    /* Match production .m26-shell > .m26-workspace > .m26-main,
       but omit sidebar/topbar controls from this isolated test. */
    #qa-root > .m26-workspace{display:block;width:100%;min-inline-size:0;max-inline-size:100%}
    #qa-root .m26-workspace > .m26-main{width:100%;box-sizing:border-box;min-inline-size:0;max-inline-size:100%}
    #qa-workout:not(:empty){margin-top:1.25rem}
    [data-signature-qa-status]{font-size:.8rem}
  </style>
</head>
<body>
  <main id="qa-root" class="m26-shell" data-m26-role="client">
    <section class="m26-workspace" aria-label="IBERFIT QA · superficie de sesiones">
      <div class="m26-main" id="qa-published-route"></div>
      <div id="qa-workout"></div>
    </section>
  </main>
  <script type="module" src="/qa/live-workout/published-sessions.fixture.mjs"></script>
</body>
</html>

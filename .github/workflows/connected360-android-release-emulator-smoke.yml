name: IBERFIT Android Release Startup Smoke
on:
  pull_request:
    branches:
      - canary/rc74-4
    paths:
      - 'native/android-host/**'
      - '.github/workflows/connected360-android-release-emulator-smoke.yml'
      - 'src/m26/wearables/v46-prod-native-channel.js'
      - 'src/m26/wearables/controller.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iberfit-android-release-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-emulator-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android release smoke identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/iberfit-smoke-only.p12" \
            -storepass "$PASS" -keypass "$PASS" -alias smoke \
            -dname "CN=IBERFIT Automated Release Startup Smoke, O=QA Only" \
            -keyalg RSA -keysize 3072 -validity 3
          echo "::add-mask::$PASS"
          echo "IBERFIT_ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/iberfit-smoke-only.p12" >> "$GITHUB_ENV"
          echo "IBERFIT_ANDROID_RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "IBERFIT_ANDROID_RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "IBERFIT_ANDROID_RELEASE_KEY_ALIAS=smoke" >> "$GITHUB_ENV"
      - name: Compile Release source with synthetic non-distributable test key
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p native/android-host :phone-app:testDebugUnitTest :phone-app:assembleRelease
          test -s native/android-host/phone-app/build/outputs/apk/release/phone-app-release.apk
      - name: Enable GitHub hosted runner KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || {
            echo 'IBERFIT_ANDROID_EMULATOR_NO_KVM_DEVICE' >&2
            exit 1
          }
          # Ephemeral GitHub-hosted machine. Restrict KVM to the runner's
          # primary group rather than making it globally writable.
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || {
            echo 'IBERFIT_ANDROID_EMULATOR_KVM_PERMISSIONS_DENIED' >&2
            exit 1
          }
      - name: Launch real Release code path on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # android-emulator-runner invokes script using /usr/bin/sh by
          # default. POSIX -eu is portable; 'pipefail' is a bash-only option.
          # One command: runner invokes each script line in a fresh sh process.
          script: bash qa/connected360/android-release-emulator-startup.sh
      - name: Destroy ephemeral keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/iberfit-smoke-only.p12"

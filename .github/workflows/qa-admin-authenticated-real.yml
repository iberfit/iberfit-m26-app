name: IBERFIT QA Admin Authenticated Real

on:
  pull_request:
    branches:
      - qa/admin-authenticated-multiapp-base-20260918-v8
    paths:
      - '.github/admin-authenticated-run.trigger'

permissions:
  contents: read

concurrency:
  group: iberfit-qa-admin-authenticated-real
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'qa/admin-authenticated-multiapp-base-20260918-v8' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 25
    env:
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Assert isolated source and QA-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_BASE_REF" = 'qa/admin-authenticated-multiapp-base-20260918-v8'
          test "$M26_PROJECT_REF" = 'gjztkdwfmunnzhtvxrsu'
          test "$M26_QA_ONLY" = 'true'
          test "$M26_SUPABASE_URL" = 'https://gjztkdwfmunnzhtvxrsu.supabase.co'
          test -n "$M26_SUPABASE_PUBLISHABLE_KEY"
          test -n "$M26_QA_CLIENT_A_EMAIL"
          test -n "$M26_QA_CLIENT_A_PASSWORD"
          ! printf '%s' "$M26_SUPABASE_PUBLISHABLE_KEY" | grep -Eiq 'service[_-]?role'
          ! grep -R -n 'pjhmrhejsoofmouedavw' qa/admin-authenticated-real playwright.admin-authenticated-real.config.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run QA gate contract
        run: node --test tests/m26_admin_authenticated_real_gate_contract.test.mjs

      - name: Install Chromium system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Restore Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify Chromium browser
        run: node --input-type=module -e "import fs from 'node:fs'; import {chromium} from '@playwright/test'; if(!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"

      - name: Build exact current authenticated QA surface
        run: node qa/rc64/build-authenticated-surface.mjs

      - name: Normalize touch navigation target to the real viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/admin-authenticated-real/admin-authenticated-real.spec.mjs')
          s=p.read_text()
          old='''async function clickNav(page,area,{touch=false}={}){
            const direct=page.locator(`[data-m26-area="${area}"]:visible`).first();
            if(await direct.count()&&await direct.isVisible().catch(()=>false)){
              if(touch)await direct.tap();else await direct.click();
              return;
            }
            const more=page.locator('details.m26-mobile-more:visible').first();
          '''
          new='''async function clickNav(page,area,{touch=false}={}){
            const selector=`[data-m26-area="${area}"]:visible`;
            const mobile=page.locator(`.m26-mobile-nav ${selector}`).first();
            const direct=touch&&await mobile.count()&&await mobile.isVisible().catch(()=>false)
              ? mobile
              : page.locator(selector).first();
            if(await direct.count()&&await direct.isVisible().catch(()=>false)){
              const box=await direct.boundingBox();
              const viewport=page.viewportSize();
              const inViewport=Boolean(box&&viewport&&box.width>0&&box.height>0&&box.x<viewport.width&&box.y<viewport.height&&box.x+box.width>0&&box.y+box.height>0);
              if(inViewport){
                if(touch)await direct.tap();else await direct.click();
                return;
              }
            }
            const more=page.locator('details.m26-mobile-more:visible').first();
          '''
          if old not in s:
              raise SystemExit('QA_NAV_HELPER_CONTRACT_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          node --check qa/admin-authenticated-real/admin-authenticated-real.spec.mjs

      - name: Certify real Admin auth and device interactions
        run: npx playwright test --config playwright.admin-authenticated-real.config.mjs

      - name: Preserve minimised Admin real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-admin-authenticated-real-${{ github.run_id }}
          path: |
            recovery/admin-authenticated-real/evidence.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

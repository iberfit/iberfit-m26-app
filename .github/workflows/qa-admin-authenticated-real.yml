name: IBERFIT QA Admin Authenticated Real

on:
  pull_request:
    branches:
      - qa/admin-authenticated-multiapp-base-20260919-v11
    paths:
      - '.github/admin-authenticated-run.trigger'

permissions:
  contents: read

concurrency:
  group: iberfit-qa-admin-authenticated-real
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'qa/admin-authenticated-multiapp-base-20260919-v11' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 25
    env:
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Assert isolated source and QA-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_BASE_REF" = 'qa/admin-authenticated-multiapp-base-20260919-v11'
          test "$M26_PROJECT_REF" = 'gjztkdwfmunnzhtvxrsu'
          test "$M26_QA_ONLY" = 'true'
          test "$M26_SUPABASE_URL" = 'https://gjztkdwfmunnzhtvxrsu.supabase.co'
          test -n "$M26_SUPABASE_PUBLISHABLE_KEY"
          test -n "$M26_QA_CLIENT_A_EMAIL"
          test -n "$M26_QA_CLIENT_A_PASSWORD"
          ! printf '%s' "$M26_SUPABASE_PUBLISHABLE_KEY" | grep -Eiq 'service[_-]?role'
          ! grep -R -n 'pjhmrhejsoofmouedavw' qa/admin-authenticated-real playwright.admin-authenticated-real.config.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Pin exact candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='05ade2e27fcad28feb0fe9b41bf185a37480b73a'
          new='1e89d4777b5adfeed768a96d81ce45e0a907c3e6'
          for raw in [
              'qa/admin-authenticated-real/admin-authenticated-real.spec.mjs',
              'tests/m26_admin_authenticated_real_gate_contract.test.mjs',
          ]:
              path=Path(raw)
              text=path.read_text()
              if old not in text:
                  raise SystemExit(f'QA_CANDIDATE_MARKER_NOT_FOUND:{raw}')
              path.write_text(text.replace(old,new))
          PY
          grep -q "candidate:'1e89d4777b5adfeed768a96d81ce45e0a907c3e6'" qa/admin-authenticated-real/admin-authenticated-real.spec.mjs

      - name: Run QA gate contract
        run: node --test tests/m26_admin_authenticated_real_gate_contract.test.mjs

      - name: Instrument mobile nav focus viewport diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('qa/admin-authenticated-real/admin-authenticated-real.spec.mjs')
          text=path.read_text()
          more_needle="""  const summaryState=await pointerState(summary);\n  expect(summaryState.inViewport,`Admin More trigger must be inside viewport for ${area}: ${JSON.stringify(summaryState)}`).toBe(true);"""
          more_replacement="""  const summaryState=await pointerState(summary);\n  const navDiagnostic=await summary.evaluate((node)=>{\n    const nav=node.closest('.m26-mobile-nav');\n    const chain=[];\n    for(let current=nav;current;current=current.parentElement){\n      const style=getComputedStyle(current);\n      const rect=current.getBoundingClientRect();\n      chain.push({tag:current.tagName,id:current.id||null,className:String(current.className||''),position:style.position,top:style.top,right:style.right,bottom:style.bottom,left:style.left,transform:style.transform,filter:style.filter,perspective:style.perspective,contain:style.contain,willChange:style.willChange,overflow:style.overflow,overflowY:style.overflowY,rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom,width:rect.width,height:rect.height}});\n    }\n    return {scrollX,scrollY,innerWidth,innerHeight,visualViewport:window.visualViewport?{width:visualViewport.width,height:visualViewport.height,offsetLeft:visualViewport.offsetLeft,offsetTop:visualViewport.offsetTop,pageLeft:visualViewport.pageLeft,pageTop:visualViewport.pageTop,scale:visualViewport.scale}:null,chain};\n  });\n  console.log('M26_MOBILE_NAV_COMPUTED_DIAGNOSTIC='+JSON.stringify(navDiagnostic));\n  expect(summaryState.inViewport,`Admin More trigger must be inside viewport for ${area}: ${JSON.stringify(summaryState)}`).toBe(true);"""
          if more_needle not in text:
              raise SystemExit('M26_MOBILE_NAV_DIAGNOSTIC_ANCHOR_NOT_FOUND')
          text=text.replace(more_needle,more_replacement,1)
          direct_needle="""  if(await direct.count()){\n    const state=await pointerState(direct);\n    expect(state.inViewport,`Admin direct mobile navigation must be inside viewport for ${area}: ${JSON.stringify(state)}`).toBe(true);"""
          direct_replacement="""  if(await direct.count()){\n    const state=await pointerState(direct);\n    const gridDiagnostic=await direct.evaluate((node)=>{\n      const nav=node.closest('.m26-mobile-nav');\n      const navStyle=getComputedStyle(nav);\n      const navRect=nav.getBoundingClientRect();\n      const ancestors=[];\n      for(let current=nav;current;current=current.parentElement){\n        const style=getComputedStyle(current);\n        const rect=current.getBoundingClientRect();\n        ancestors.push({tag:current.tagName,id:current.id||null,className:String(current.className||''),position:style.position,transform:style.transform,filter:style.filter,perspective:style.perspective,contain:style.contain,willChange:style.willChange,overflow:style.overflow,rect:{top:rect.top,bottom:rect.bottom,height:rect.height}});\n      }\n      const active=document.activeElement;\n      const activeRect=active?.getBoundingClientRect?.();\n      const activeStyle=active&&active.nodeType===1?getComputedStyle(active):null;\n      const children=[...nav.children].map((child,index)=>{\n        const style=getComputedStyle(child);\n        const rect=child.getBoundingClientRect();\n        return {index,tag:child.tagName,area:child.getAttribute('data-m26-area'),className:String(child.className||''),position:style.position,display:style.display,order:style.order,transform:style.transform,gridColumn:style.gridColumn,gridRow:style.gridRow,rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom,width:rect.width,height:rect.height}};\n      });\n      return {targetArea:node.getAttribute('data-m26-area'),scrollY,innerHeight,documentClientHeight:document.documentElement.clientHeight,bodyClientHeight:document.body.clientHeight,visualViewport:window.visualViewport?{width:visualViewport.width,height:visualViewport.height,offsetTop:visualViewport.offsetTop,pageTop:visualViewport.pageTop,scale:visualViewport.scale}:null,activeElement:active?{tag:active.tagName,id:active.id||null,name:active.getAttribute?.('name')||null,type:active.getAttribute?.('type')||null,fontSize:activeStyle?.fontSize||null,rect:activeRect?{top:activeRect.top,bottom:activeRect.bottom,height:activeRect.height}:null}:null,nav:{display:navStyle.display,position:navStyle.position,top:navStyle.top,bottom:navStyle.bottom,overflow:navStyle.overflow,gridTemplateColumns:navStyle.gridTemplateColumns,gridTemplateRows:navStyle.gridTemplateRows,gridAutoFlow:navStyle.gridAutoFlow,rect:{left:navRect.left,top:navRect.top,right:navRect.right,bottom:navRect.bottom,width:navRect.width,height:navRect.height},scrollTop:nav.scrollTop,scrollLeft:nav.scrollLeft,childElementCount:nav.childElementCount},ancestors,children};\n    });\n    console.log('M26_MOBILE_NAV_FOCUS_DIAGNOSTIC='+JSON.stringify(gridDiagnostic));\n    await page.evaluate(()=>{const active=document.activeElement;if(active instanceof HTMLElement)active.blur();});\n    await page.waitForTimeout(160);\n    const postBlurState=await pointerState(direct);\n    const postBlurViewport=await page.evaluate(()=>({scrollY,innerHeight,visualViewport:window.visualViewport?{width:visualViewport.width,height:visualViewport.height,offsetTop:visualViewport.offsetTop,pageTop:visualViewport.pageTop,scale:visualViewport.scale}:null}));\n    console.log('M26_MOBILE_NAV_POST_BLUR_DIAGNOSTIC='+JSON.stringify({state:postBlurState,viewport:postBlurViewport}));\n    expect(state.inViewport,`Admin direct mobile navigation must be inside viewport for ${area}: ${JSON.stringify(state)}`).toBe(true);"""
          if direct_needle not in text:
              raise SystemExit('M26_MOBILE_NAV_FOCUS_DIAGNOSTIC_ANCHOR_NOT_FOUND')
          path.write_text(text.replace(direct_needle,direct_replacement,1))
          PY

      - name: Install Chromium system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Restore Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify Chromium browser
        run: node --input-type=module -e "import fs from 'node:fs'; import {chromium} from '@playwright/test'; if(!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"

      - name: Build exact current authenticated QA surface
        run: node qa/rc64/build-authenticated-surface.mjs

      - name: Certify real Admin auth and device interactions
        run: npx playwright test --config playwright.admin-authenticated-real.config.mjs

      - name: Preserve minimised Admin real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-admin-authenticated-real-${{ github.run_id }}
          path: |
            recovery/admin-authenticated-real/evidence.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

name: IBERFIT QA Admin Authenticated Real

on:
  pull_request:
    branches:
      - qa/admin-authenticated-multiapp-base-20260919-v11
    paths:
      - '.github/admin-authenticated-run.trigger'

permissions:
  contents: read

concurrency:
  group: iberfit-qa-admin-authenticated-real
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'qa/admin-authenticated-multiapp-base-20260919-v11' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 25
    env:
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Assert isolated source and QA-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_BASE_REF" = 'qa/admin-authenticated-multiapp-base-20260919-v11'
          test "$M26_PROJECT_REF" = 'gjztkdwfmunnzhtvxrsu'
          test "$M26_QA_ONLY" = 'true'
          test "$M26_SUPABASE_URL" = 'https://gjztkdwfmunnzhtvxrsu.supabase.co'
          test -n "$M26_SUPABASE_PUBLISHABLE_KEY"
          test -n "$M26_QA_CLIENT_A_EMAIL"
          test -n "$M26_QA_CLIENT_A_PASSWORD"
          ! printf '%s' "$M26_SUPABASE_PUBLISHABLE_KEY" | grep -Eiq 'service[_-]?role'
          ! grep -R -n 'pjhmrhejsoofmouedavw' qa/admin-authenticated-real playwright.admin-authenticated-real.config.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Pin exact candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old='05ade2e27fcad28feb0fe9b41bf185a37480b73a'
          new='1e89d4777b5adfeed768a96d81ce45e0a907c3e6'
          for raw in [
              'qa/admin-authenticated-real/admin-authenticated-real.spec.mjs',
              'tests/m26_admin_authenticated_real_gate_contract.test.mjs',
          ]:
              path=Path(raw)
              text=path.read_text()
              if old not in text:
                  raise SystemExit(f'QA_CANDIDATE_MARKER_NOT_FOUND:{raw}')
              path.write_text(text.replace(old,new))
          PY
          grep -q "candidate:'1e89d4777b5adfeed768a96d81ce45e0a907c3e6'" qa/admin-authenticated-real/admin-authenticated-real.spec.mjs

      - name: Normalize responsive Admin navigation hit-testing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('qa/admin-authenticated-real/admin-authenticated-real.spec.mjs')
          text=path.read_text()
          old="  if(await direct.count()&&await direct.isVisible().catch(()=>false)){\n"
          new="""  const directActionable=await direct.count()&&await direct.isVisible().catch(()=>false)&&await direct.evaluate((node)=>{\n    const r=node.getBoundingClientRect();\n    const x=r.left+r.width/2;\n    const y=r.top+r.height/2;\n    if(r.width<=0||r.height<=0||x<0||x>innerWidth||y<0||y>innerHeight)return false;\n    const top=document.elementFromPoint(x,y);\n    return top===node||Boolean(node.contains?.(top));\n  }).catch(()=>false);\n  if(directActionable){\n"""
          if old not in text:
              raise SystemExit('QA_RESPONSIVE_NAV_MARKER_NOT_FOUND')
          path.write_text(text.replace(old,new,1))
          PY
          grep -q 'const directActionable=' qa/admin-authenticated-real/admin-authenticated-real.spec.mjs

      - name: Run QA gate contract
        run: node --test tests/m26_admin_authenticated_real_gate_contract.test.mjs

      - name: Install Chromium system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium

      - name: Restore Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify Chromium browser
        run: node --input-type=module -e "import fs from 'node:fs'; import {chromium} from '@playwright/test'; if(!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"

      - name: Build exact current authenticated QA surface
        run: node qa/rc64/build-authenticated-surface.mjs

      - name: Certify real Admin auth and device interactions
        run: npx playwright test --config playwright.admin-authenticated-real.config.mjs

      - name: Preserve minimised Admin real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-admin-authenticated-real-${{ github.run_id }}
          path: |
            recovery/admin-authenticated-real/evidence.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

name: QA WEB IBERFIT staging real

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/qa-web-iberfit-staging-real.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-web-iberfit-staging-real
  cancel-in-progress: true

env:
  WEB_SHA: '8d6fcb12a9472e9ef78b9973ca3d0cd9d71244ab'
  BASE_URL: 'https://web.iberfit.cl'

jobs:
  qa-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Descargar QA exacto de candidata certificada
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/iberfit/iberfitweb.git /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          test -s /tmp/iberfitweb/.github/scripts/qa_v628_dispositivos.mjs

      - name: Preflight staging real
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /
            /diagnostico-iri/
            /contacto/
            /metodo/
            /sobre-iberfit/
            /online/
            /entrenador-personal-las-condes/
            /privacidad/
            /en/
            /robots.txt
            /sitemap.xml
          )
          mkdir -p /tmp/http
          for path in "${routes[@]}"; do
            safe="$(echo "$path" | sed 's#[^A-Za-z0-9]#_#g')"
            code="$(curl --silent --show-error --location --retry 5 --retry-all-errors               --connect-timeout 10 --max-time 30               -o "/tmp/http/${safe}.body" -D "/tmp/http/${safe}.headers"               -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done
          grep -Fq '>A distancia</a>' /tmp/http/_.body
          grep -Fq '/assets/analytics.v628.js' /tmp/http/_.body
          grep -Fq '<link href="https://iberfit.cl/" rel="canonical"' /tmp/http/_.body
          grep -Fq 'Sitemap: https://iberfit.cl/sitemap.xml' /tmp/http/_robots_txt.body
          grep -Fq '<lastmod>2026-09-12</lastmod>' /tmp/http/_sitemap_xml.body

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: QA multidispositivo staging real
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          BASE_URL="${BASE_URL}" QA_OUT="/tmp/evidence/web-iberfit-staging-real"             node .github/scripts/qa_v628_dispositivos.mjs

      - name: Verificar analytics servido en staging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "${BASE_URL}/assets/analytics.v628.js" -o /tmp/analytics.js
          curl --fail --silent --show-error --location "${BASE_URL}/assets/analytics-config.js" -o /tmp/analytics-config.js
          grep -Fq 'generate_lead' /tmp/analytics.js
          grep -Fq 'G-JXD1JSN7K3' /tmp/analytics-config.js
          grep -Eiq 'consent|analytics_storage' /tmp/analytics.js /tmp/analytics-config.js

      - name: Guardar evidencia staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-iberfit-staging-real-${{ github.run_id }}
          path: |
            /tmp/evidence/web-iberfit-staging-real
            /tmp/http
          if-no-files-found: warn
          retention-days: 30

name: Deploy WEB IBERFIT V6.43.1 certified

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/deploy-web-iberfit-v6431.yml'

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: 'c58402596ed8f3c90bcc51e04fd4c2f2ba8a98b9'
  WEB_VERSION: '6.43.1'
  QA_SOURCE_SHA: 'a8d932d420b8eecb28e2b9126e60748303eaa1c2'
  QA_RUN_ID: '35462233754'
  QA_RUN_NAME: 'Release WEB IBERFIT V6.43.1 accessibility contrast'
  EXPECTED_ROLLBACK_SHA: '8db17d17e45eb235335c408dbe962bc1d8104e43'
  EXPECTED_ROLLBACK_DEPLOYMENT_ID: '7f90acba-f5a9-4669-807e-491aa5e7210f'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure only
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact V6.43 production baseline and capture rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||p.result?.name!==process.env.CF_PROJECT) throw new Error('PROJECT_LOOKUP');
          if(p.result.production_branch!=='production') throw new Error('PRODUCTION_BRANCH:'+p.result.production_branch);
          const domains=p.result.domains||[];
          if(!domains.includes('iberfit.cl')) throw new Error('IBERFIT_DOMAIN_MISSING');
          if(domains.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const current=(d.result||[]).filter(v=>v.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!current?.id) throw new Error('NO_CURRENT_PRODUCTION');
          if(current.id!==process.env.EXPECTED_ROLLBACK_DEPLOYMENT_ID) throw new Error('PRODUCTION_DRIFT_ID:'+current.id);
          const currentSha=current.deployment_trigger?.metadata?.commit_hash||'';
          if(currentSha!==process.env.EXPECTED_ROLLBACK_SHA) throw new Error('PRODUCTION_DRIFT_SHA:'+currentSha);
          fs.appendFileSync(process.env.GITHUB_ENV,`ROLLBACK_DEPLOYMENT_ID=${current.id}\nPRODUCTION_TOUCHED=0\n`);
          console.log(JSON.stringify({project:p.result.name,domains,currentDeploymentId:current.id,currentSha},null,2));
          NODE
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=6431' | tr -d '\r\n ')" = '6.43'
          curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/?preflight=6431' -o /tmp/live-before.html
          grep -q '/assets/analytics.v643.js' /tmp/live-before.html
          grep -q '/assets/menu.v642.js' /tmp/live-before.html
          ! grep -q '/assets/a11y.v6431.css' /tmp/live-before.html
          ! grep -q '/assets/hardening.v630.js' /tmp/live-before.html

      - name: Verify certified QA identity and generated candidate lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa-v6431.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/qa-v6431.json','utf8'));
          if(x.head_sha!==process.env.QA_SOURCE_SHA) throw new Error('QA_SOURCE_SHA:'+x.head_sha);
          if(x.status!=='completed'||x.conclusion!=='success') throw new Error('QA:'+x.status+':'+x.conclusion);
          if(x.name!==process.env.QA_RUN_NAME) throw new Error('QA_NAME:'+x.name);
          console.log(JSON.stringify({run:x.id,name:x.name,sourceSha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=2 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD^)" = "${QA_SOURCE_SHA}"
          test "$(git -C /tmp/iberfitweb log -1 --format=%s)" = 'fix(web): improve gold text contrast in V6.43.1'

      - name: Revalidate exact V6.43.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "${base}/VERSION")" = "${WEB_VERSION}"
          test "$(find "${base}" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/a11y.v6431.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/analytics.v643.js' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          ! grep -R -q '/assets/analytics.v632.js' "${base}" --include='*.html'
          ! grep -R -q '/assets/hardening.v630.js' "${base}" --include='*.html'
          grep -q -- '--gold-text:#806216' "${base}/assets/a11y.v6431.css"
          grep -q 'contact_intent' "${base}/assets/analytics.v643.js"
          grep -q 'iberfit_lead_session_v1' "${base}/assets/analytics.v643.js"
          grep -q '^/assets/a11y.v6431.css$' "${base}/_headers"
          grep -q '^/assets/analytics.v643.js$' "${base}/_headers"
          grep -q "script-src-attr 'none'" "${base}/_headers"
          ! grep -q "'unsafe-inline'" "${base}/_headers"
          ! grep -R -n '"LocalBusiness"' "${base}" --include='*.html'
          python3 - <<'PY'
          def lum(h):
              h=h.lstrip('#'); c=[int(h[i:i+2],16)/255 for i in (0,2,4)]
              c=[v/12.92 if v<=.04045 else ((v+.055)/1.055)**2.4 for v in c]
              return .2126*c[0]+.7152*c[1]+.0722*c[2]
          def ratio(a,b):
              x,y=sorted((lum(a),lum(b)),reverse=True); return (x+.05)/(y+.05)
          checks=[('#806216','#F7F4EE'),('#806216','#FBF8F3'),('#041610','#B8973A'),('#D9B568','#173F2C')]
          vals=[ratio(a,b) for a,b in checks]
          if min(vals)<4.5: raise SystemExit('CONTRAST_REGRESSION:'+repr(vals))
          print('CONTRAST_OK', [round(v,2) for v in vals])
          PY

      - name: Deploy certified V6.43.1 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v6431-certified-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "${CF_PROJECT}" --branch "${PREVIEW_BRANCH}" --commit-hash "${WEB_SHA}" \
            --commit-message 'WEB IBERFIT V6.43.1 certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "${PREVIEW_URL}" || exit 42
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"

      - name: Validate preview gate across full surface
        shell: bash
        run: |
          set -euo pipefail
          cb="$GITHUB_RUN_ID"
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$cb" | tr -d '\r\n ')" = "$WEB_VERSION"
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/?cb=$cb" -o /tmp/preview-home
          grep -q '/assets/a11y.v6431.css' /tmp/preview-home
          grep -q '/assets/analytics.v643.js' /tmp/preview-home
          grep -q '/assets/menu.v642.js' /tmp/preview-home
          ! grep -q '/assets/analytics.v632.js' /tmp/preview-home
          ! grep -q '/assets/hardening.v630.js' /tmp/preview-home
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-home
          grep -q '^content-security-policy:' /tmp/preview-h-home
          grep -q "script-src-attr 'none'" /tmp/preview-h-home
          ! grep -q 'unsafe-inline' /tmp/preview-h-home
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/a11y.v6431.css?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-a11y
          grep -q '^cache-control:.*max-age=31536000' /tmp/preview-h-a11y
          grep -q '^cache-control:.*immutable' /tmp/preview-h-a11y
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          root=Path('/tmp/iberfitweb/candidate/v628')
          base=os.environ['PREVIEW_URL'].rstrip('/')
          htmls=sorted(root.rglob('*.html'))
          if len(htmls)!=33: raise SystemExit('EXPECTED_33_HTML')
          routes=[]
          for p in htmls:
              rel=p.relative_to(root).as_posix()
              if rel=='index.html': route='/'
              elif rel=='404.html': route='/404.html'
              else: route='/' + rel.removesuffix('index.html')
              routes.append(route)
          for route in routes:
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          print('PREVIEW_ROUTES_OK',len(routes))
          PY

      - name: Deploy production V6.43.1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "$CF_PROJECT" --branch production --commit-hash "$WEB_SHA" \
            --commit-message 'WEB IBERFIT V6.43.1 certified production' | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL" || exit 43
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_TOUCHED=1" >> "$GITHUB_ENV"

      - name: Verify live production and deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl -sSLo /tmp/live-version "https://iberfit.cl/VERSION?cb=$suffix" || true
            curl -sSLo /tmp/live-home "https://iberfit.cl/?cb=$suffix" || true
            version="$(tr -d '\r\n ' < /tmp/live-version 2>/dev/null || true)"
            a11y=0; a643=0; menu=0; old=0
            grep -q '/assets/a11y.v6431.css' /tmp/live-home 2>/dev/null && a11y=1 || true
            grep -q '/assets/analytics.v643.js' /tmp/live-home 2>/dev/null && a643=1 || true
            grep -q '/assets/menu.v642.js' /tmp/live-home 2>/dev/null && menu=1 || true
            grep -q '/assets/hardening.v630.js' /tmp/live-home 2>/dev/null && old=1 || true
            echo "Propagation $attempt: version=${version:-missing} a11y=$a11y analytics643=$a643 menu642=$menu oldHardening=$old"
            if [ "$version" = "$WEB_VERSION" ] && [ "$a11y" = 1 ] && [ "$a643" = 1 ] && [ "$menu" = 1 ] && [ "$old" = 0 ]; then ok=1;break;fi
            sleep 4
          done
          test "$ok" = 1 || { echo IBERFIT_CL_V6431_NOT_CONSISTENT;exit 44; }
          cb="$GITHUB_RUN_ID-live"
          curl -fsSL "https://iberfit.cl/assets/a11y.v6431.css?cb=$cb" -o /tmp/live-a11y.css
          grep -q -- '--gold-text:#806216' /tmp/live-a11y.css
          curl -fsSI "https://iberfit.cl/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-home
          grep -q '^content-security-policy:' /tmp/live-h-home
          grep -q "script-src-attr 'none'" /tmp/live-h-home
          ! grep -q 'unsafe-inline' /tmp/live-h-home
          curl -fsSI "https://iberfit.cl/assets/a11y.v6431.css?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-a11y
          grep -q '^cache-control:.*max-age=31536000' /tmp/live-h-a11y
          grep -q '^cache-control:.*immutable' /tmp/live-h-a11y
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const d=(x.result||[]).find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);
          if(!d) throw Error('CERTIFIED_SHA_NOT_DEPLOYED');
          const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,qaName:process.env.QA_RUN_NAME,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/V6431_PRODUCTION_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');
          console.log(JSON.stringify(e,null,2));
          NODE

      - name: Automatic rollback to verified V6.43 if post-deploy verification fails
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_TOUCHED:-0}" != '1' ]; then
            echo 'Production not touched; rollback not required.'
            exit 0
          fi
          test "${ROLLBACK_DEPLOYMENT_ID:-}" = "${EXPECTED_ROLLBACK_DEPLOYMENT_ID}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" \
            --data '{}' -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json');if(!x.success)throw new Error(JSON.stringify(x.errors||[]));console.log('ROLLBACK_API_OK')"
          for attempt in $(seq 1 20); do
            version="$(curl -fsSL --retry 2 --retry-all-errors "https://iberfit.cl/VERSION?rollback=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n ' || true)"
            if [ "$version" = '6.43' ]; then
              curl -fsSL "https://iberfit.cl/?rollback=${GITHUB_RUN_ID}-${attempt}" -o /tmp/rollback-home
              grep -q '/assets/analytics.v643.js' /tmp/rollback-home
              ! grep -q '/assets/a11y.v6431.css' /tmp/rollback-home
              echo 'ROLLBACK_TO_V643_VERIFIED'
              exit 0
            fi
            sleep 4
          done
          echo 'ROLLBACK_PROPAGATION_NOT_VERIFIED'
          exit 52

      - name: Save V6.43.1 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v6431-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v6431.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V6431_PRODUCTION_EVIDENCE.json
            /tmp/preview-h-home
            /tmp/preview-h-a11y
            /tmp/live-h-home
            /tmp/live-h-a11y
            /tmp/rollback.json
          if-no-files-found: warn
          retention-days: 30

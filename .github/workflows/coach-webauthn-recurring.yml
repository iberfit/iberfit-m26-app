name: IBERFIT Coach WebAuthn Recurring

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'qa/coach-webauthn-recurring/**'
      - 'qa/coach-iri-document-privileged/**'
      - 'playwright.coach-webauthn-recurring.config.mjs'
      - 'playwright.coach-iri-document-privileged.config.mjs'
      - 'supabase/functions/iberfit-qa-webauthn-cert-broker/**'
      - 'tests/m26_coach_webauthn_recurring_contract.test.mjs'
      - 'tests/m26_u56_coach_publish_scope.test.mjs'
      - 'docs/DEVICE_EXPERIENCE_POLICY.md'
      - '.github/workflows/coach-webauthn-recurring.yml'
  push:
    branches: [canary/rc74-4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('iberfit-coach-webauthn-contract-pr-{0}', github.event.pull_request.number) || format('iberfit-coach-webauthn-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: coach-webauthn-recurring-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check qa/coach-webauthn-recurring/coach-webauthn-recurring.spec.mjs
      - run: node --check qa/coach-webauthn-recurring/u56-qa-publish.mjs
      - run: node --check qa/coach-webauthn-recurring/u58-execution-policy.mjs
      - run: node --check qa/coach-webauthn-recurring/u58-existing-session-client.mjs
      - run: node --check qa/coach-webauthn-recurring/u59-coach-readback.mjs
      - run: node --check qa/coach-webauthn-recurring/u47-running-policy.mjs
      - run: node --check qa/coach-webauthn-recurring/u47-fresh-running-e2e.mjs
      - run: node --check qa/coach-webauthn-recurring/u48-running-recovery.mjs
      - run: node --check qa/coach-webauthn-recurring/u48-client-visible-readback.mjs
      - run: node --test tests/m26_u48_universal_client_session_visibility.test.mjs
      - run: node --test tests/m26_u48_universal_training_lifecycle.test.mjs
      - run: node --test tests/m26_u47_running_e2e_policy.test.mjs
      - run: node --test tests/m26_u48_resume_scope.test.mjs
      - run: node --test tests/m26_u59_readback_contract.test.mjs
      - run: node --test tests/m26_u58_existing_execution_scope.test.mjs
      - run: node --test tests/m26_u56_coach_publish_scope.test.mjs
      - run: node --test tests/m26_coach_webauthn_recurring_contract.test.mjs

  live-coach-webauthn:
    name: coach-webauthn-real-qa
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Verify Chromium browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium } from '@playwright/test'; if (!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"
      - name: Build authenticated QA surface
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Reset Coach QA WebAuthn fixture
        shell: bash
        env:
          OIDC_AUDIENCE: iberfit-webauthn-qa-cert
          BROKER_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co/functions/v1/iberfit-qa-webauthn-cert-broker
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100
          echo "::add-mask::$token"
          payload="$(jq -nc --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{action:"reset",sourceSha:$sourceSha,runId:$runId}')"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' "$BROKER_URL" -d "$payload" | tee recovery-coach-reset-before.json
          jq -e '.ok == true and .action == "reset" and .target == "qa.rc74.coach@iberfit.cl"' recovery-coach-reset-before.json >/dev/null
      - name: Certify Coach WebAuthn registration and authentication
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          # U56: one-shot QA mutation only on an explicitly titled trusted
          # Canary squash PUSH, never on PR, dispatch, or routine later merges.
          M26_QA_U56_PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'SIGNATURE U56:') }}
          # U58 executes the exact pre-existing QA U56 session only once.
          # No published session is created. A rerun stays read-only.
          M26_QA_U58_EXECUTE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && (startsWith(github.event.head_commit.message, 'SIGNATURE U58:') || startsWith(github.event.head_commit.message, 'SIGNATURE U58R:') || startsWith(github.event.head_commit.message, 'SIGNATURE U58S:')) }}
          # U47: ONE new synthetic QA running session; disabled on PR,
          # manual dispatch, recurring runs, or any rerun. No production writes.
          M26_QA_U47_RUNNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'SIGNATURE U47:') }}
          # U48: resume ONE existing U47 synthetic QA running; never
          # create a second prescription or allow reruns to mutate.
          M26_QA_U48_RUNNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'SIGNATURE U48:') }}
          # Non-writing preflight smoke first, then the independently guarded
          # one-shot existing QA workout. After it completes, the same workout
          # is no longer "en_curso", so a failed-only rerun must not incorrectly
          # demand the now-consumed Continue CTA. No PR, dispatch or rerun writes.
          M26_QA_U48_READBACK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'SIGNATURE U48:') }}
          # U48R: original QA execution is ALREADY closed and acknowledged.
          # Only an explicitly titled first Canary push may read its result.
          # Never rerun, create, update, publish, resume, or complete anything.
          M26_QA_U48_COMPLETED_READBACK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'SIGNATURE U48R:') }}
          # U59: one-shot read-only Coach+Client check of already ACKed U58S.
          # Pull requests, reruns and a second execution NEVER get this flag.
          M26_QA_U59_READBACK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && (startsWith(github.event.head_commit.message, 'SIGNATURE U59:') || startsWith(github.event.head_commit.message, 'SIGNATURE U59R:')) }}

          # U57 readback targets the already-published U56 QA fixture. No new
          # session publication, training start, write permission or bypass.
          M26_QA_U57_VERIFY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && github.run_attempt == 1 && (startsWith(github.event.head_commit.message, 'SIGNATURE U57:') || startsWith(github.event.head_commit.message, 'SIGNATURE U57R:')) }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          # Only the exact SIGNATURE U37 Canary merge tests versioned QA RPCs.
          # The OIDC reset broker intentionally refuses pull_request events.
          M26_QA_U37_VERIFY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' && startsWith(github.event.head_commit.message, 'SIGNATURE U37:') }}
        run: npx playwright test --config playwright.coach-webauthn-recurring.config.mjs
      - name: Reset Coach QA WebAuthn fixture before privileged IRI certification
        shell: bash
        env:
          OIDC_AUDIENCE: iberfit-webauthn-qa-cert
          BROKER_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co/functions/v1/iberfit-qa-webauthn-cert-broker
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          oidc="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#oidc}" -gt 100
          echo "::add-mask::$oidc"
          payload="$(jq -nc --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{action:"reset",sourceSha:$sourceSha,runId:$runId}')"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${oidc}" -H 'Content-Type: application/json' "$BROKER_URL" -d "$payload" | tee recovery-coach-reset-before-iri-document.json
          jq -e '.ok == true and .action == "reset" and .target == "qa.rc74.coach@iberfit.cl" and .state.activeCredentials == 0 and .state.activeChallenges == 0 and .state.activeAssurance == 0' recovery-coach-reset-before-iri-document.json >/dev/null
      - name: Certify privileged IRI document routes through the real Coach UI
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          # Real QA-only synthetic write, permitted only in the OIDC-authorised
          # trusted Canary push job after real Coach WebAuthn MFA verification.
          M26_QA_M44_POSITIVE_CERT: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
        run: npx playwright test --config playwright.coach-iri-document-privileged.config.mjs
      - name: Cleanup Coach QA WebAuthn fixture
        if: always()
        shell: bash
        env:
          OIDC_AUDIENCE: iberfit-webauthn-qa-cert
          BROKER_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co/functions/v1/iberfit-qa-webauthn-cert-broker
        run: |
          set -euo pipefail
          sep='?'; [[ "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100
          echo "::add-mask::$token"
          payload="$(jq -nc --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{action:"reset",sourceSha:$sourceSha,runId:$runId}')"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' "$BROKER_URL" -d "$payload" | tee recovery-coach-reset-after.json
          jq -e '.ok == true and .action == "reset" and .target == "qa.rc74.coach@iberfit.cl"' recovery-coach-reset-after.json >/dev/null
      - name: Preserve Coach WebAuthn evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-webauthn-recurring-${{ github.run_id }}
          path: |
            recovery/coach-webauthn-recurring/
            recovery/coach-iri-document-privileged/
            recovery-coach-reset-before.json
            recovery-coach-reset-before-iri-document.json
            recovery-coach-reset-after.json
            test-results/
          if-no-files-found: warn
          retention-days: 30

  gate:
    name: coach-webauthn-recurring-gate
    if: always()
    needs: [contract,live-coach-webauthn]
    runs-on: ubuntu-latest
    steps:
      - name: Require contract and trusted live evidence
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CONTRACT: ${{ needs.contract.result }}
          LIVE: ${{ needs.live-coach-webauthn.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT" = success
          if [[ "$EVENT" = pull_request ]]; then
            test "$LIVE" = skipped
            echo 'COACH_POST_WEBAUTHN_RECURRING=CONTRACT_GREEN_LIVE_TRUSTED_CANARY_ONLY'
          else
            test "$LIVE" = success
            echo 'KNOWN_GAP_COACH_POST_WEBAUTHN=GREEN'
            echo 'COACH_WEBAUTHN_REGISTRATION=GREEN'
            echo 'COACH_WEBAUTHN_AUTHENTICATION=GREEN'
          fi

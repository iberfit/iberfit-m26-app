name: Temporary regenerate App Shell 518

on:
  push:
    branches:
      - feat/web-push-device-reconciliation-20260919

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-push-device-reconciliation-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical App Shell
        run: node scripts/generate_rc58_app_shell.mjs
      - name: Commit generated App Shell and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/m26/sw.js
          git rm .github/workflows/tmp-regenerate-app-shell-518.yml
          git commit -m "fix(pwa): regenerate app shell for web push"
          git push origin HEAD:feat/web-push-device-reconciliation-20260919

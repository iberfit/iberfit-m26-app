name: IBERFIT Canary Cloudflare Discovery Read Only

on:
  push:
    branches:
      - 'ops/canary-cloudflare-discovery-20260920'
    paths:
      - '.github/workflows/ops-canary-cloudflare-discovery-readonly.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-canary-cloudflare-discovery-readonly
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_CANARY_PROJECT: 'iberfit-m26-canary'
  CANARY_DOMAIN: 'm26-canary.iberfit.cl'

jobs:
  discover:
    name: discover-canary-pages-target-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover exact Pages build and live identity without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }

          curl --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_CANARY_PROJECT}" \
            -o /tmp/project.json

          curl --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_CANARY_PROJECT}/deployments" \
            -o /tmp/deployments.json

          curl --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            -w '%{http_code}' \
            "https://${CANARY_DOMAIN}/version.json?diag=${GITHUB_SHA}" \
            -o /tmp/root-version.body > /tmp/root-version.status

          curl --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            -w '%{http_code}' \
            "https://${CANARY_DOMAIN}/m26/version.json?diag=${GITHUB_SHA}" \
            -o /tmp/m26-version.body > /tmp/m26-version.status

          node <<'NODE'
          const fs=require('fs');
          const projectPayload=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          const deploymentsPayload=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(!projectPayload.success||!projectPayload.result)throw new Error('CF_CANARY_PROJECT_LOOKUP_FAILED');
          if(!deploymentsPayload.success||!Array.isArray(deploymentsPayload.result))throw new Error('CF_CANARY_DEPLOYMENT_LIST_FAILED');
          const p=projectPayload.result;
          const domains=Array.isArray(p.domains)?p.domains:[];
          if(p.name!==process.env.CF_CANARY_PROJECT)throw new Error(`CF_CANARY_PROJECT_MISMATCH:${p.name}`);
          if(!domains.includes(process.env.CANARY_DOMAIN))throw new Error(`CF_CANARY_DOMAIN_NOT_BOUND:${domains.join(',')}`);
          const cleanVersion=(statusPath,bodyPath)=>{
            const status=Number(fs.readFileSync(statusPath,'utf8').trim()||0);
            const raw=fs.readFileSync(bodyPath,'utf8').trim();
            let json=null;
            try{ json=JSON.parse(raw); }catch{}
            return {
              status,
              json:json?{
                release:json.release??null,
                version:json.version??null,
                sourceSha:json.sourceSha??json.commit??json.sha??null,
                sourceBranch:json.sourceBranch??json.branch??null,
                projectRef:json.projectRef??null,
                qaOnly:json.qaOnly??null,
                environment:json.environment??null,
                production:json.production??null,
              }:null,
              rawPreview:json?null:raw.slice(0,240),
            };
          };
          const deployments=deploymentsPayload.result.slice(0,50).map((d)=>({
            id:d.id||null,
            environment:d.environment||null,
            url:d.url||null,
            createdOn:d.created_on||null,
            branch:d.deployment_trigger?.metadata?.branch||null,
            commitHash:d.deployment_trigger?.metadata?.commit_hash||null,
            commitMessage:d.deployment_trigger?.metadata?.commit_message||null,
          }));
          const productionDeployments=deployments.filter((d)=>d.environment==='production');
          const evidence={
            schema:'iberfit.ops.canary-cloudflare-live-identity.v2',
            generatedAt:new Date().toISOString(),
            domain:process.env.CANARY_DOMAIN,
            project:{
              name:p.name,
              productionBranch:p.production_branch||null,
              domains,
              subdomain:p.subdomain||null,
              buildConfig:{
                buildCommand:p.build_config?.build_command??null,
                destinationDir:p.build_config?.destination_dir??null,
                rootDir:p.build_config?.root_dir??null,
              },
              sourceType:p.source?.type??null,
              sourceRepo:p.source?.config?.repo_name??null,
              sourceProductionBranch:p.source?.config?.production_branch??null,
            },
            currentProductionDeployment:productionDeployments[0]||null,
            rootVersion:cleanVersion('/tmp/root-version.status','/tmp/root-version.body'),
            m26Version:cleanVersion('/tmp/m26-version.status','/tmp/m26-version.body'),
            mutationsPerformed:false,
            productionTouched:false,
          };
          fs.writeFileSync('CANARY_CLOUDFLARE_DISCOVERY.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Preserve sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-cloudflare-discovery-readonly
          path: CANARY_CLOUDFLARE_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 2

name: IBERFIT Canary Cloudflare Discovery Read Only

on:
  push:
    branches:
      - 'ops/canary-cloudflare-discovery-20260920'
    paths:
      - '.github/workflows/ops-canary-cloudflare-discovery-readonly.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-canary-cloudflare-discovery-readonly
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_CANARY_PROJECT: 'iberfit-m26-canary'
  CANARY_DOMAIN: 'm26-canary.iberfit.cl'

jobs:
  discover:
    name: discover-canary-pages-target-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover preview/source policy without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_CANARY_PROJECT}" \
            -o /tmp/project.json
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!payload.success||!payload.result)throw new Error('CF_CANARY_PROJECT_LOOKUP_FAILED');
          const p=payload.result;
          const c=p.source?.config||{};
          const evidence={
            schema:'iberfit.ops.canary-cloudflare-source-policy.v1',
            generatedAt:new Date().toISOString(),
            project:p.name,
            productionBranch:p.production_branch||null,
            source:{
              type:p.source?.type||null,
              repoName:c.repo_name||null,
              productionBranch:c.production_branch||null,
              productionDeploymentsEnabled:c.production_deployments_enabled??null,
              previewDeploymentSetting:c.preview_deployment_setting??null,
              previewBranchIncludes:Array.isArray(c.preview_branch_includes)?c.preview_branch_includes:[],
              previewBranchExcludes:Array.isArray(c.preview_branch_excludes)?c.preview_branch_excludes:[],
              pathIncludes:Array.isArray(c.path_includes)?c.path_includes:[],
              pathExcludes:Array.isArray(c.path_excludes)?c.path_excludes:[],
            },
            mutationsPerformed:false,
            productionTouched:false,
          };
          fs.writeFileSync('CANARY_CLOUDFLARE_DISCOVERY.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - name: Preserve sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-cloudflare-discovery-readonly
          path: CANARY_CLOUDFLARE_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 2

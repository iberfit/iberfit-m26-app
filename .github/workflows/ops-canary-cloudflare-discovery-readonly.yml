name: IBERFIT Canary Cloudflare Discovery Read Only

on:
  push:
    branches:
      - 'ops/canary-cloudflare-discovery-20260920'
    paths:
      - '.github/workflows/ops-canary-cloudflare-discovery-readonly.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-canary-cloudflare-discovery-readonly
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CANARY_DOMAIN: 'm26-canary.iberfit.cl'

jobs:
  discover:
    name: discover-canary-pages-target-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover exact Pages project and deployments without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }

          curl --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -o /tmp/projects.json > /tmp/projects.status
          test "$(cat /tmp/projects.status)" = '200' || { cat /tmp/projects.json; exit 42; }

          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/projects.json','utf8'));
          if(!payload.success||!Array.isArray(payload.result))throw new Error('CF_PAGES_PROJECT_LIST_FAILED');
          const domain=process.env.CANARY_DOMAIN;
          const matches=payload.result.filter((p)=>Array.isArray(p.domains)&&p.domains.includes(domain));
          if(matches.length!==1)throw new Error(`CF_CANARY_DOMAIN_MATCH_COUNT:${matches.length}`);
          const p=matches[0];
          if(!p.name)throw new Error('CF_CANARY_PROJECT_NAME_MISSING');
          const project={
            name:p.name,
            productionBranch:p.production_branch||null,
            domains:Array.isArray(p.domains)?p.domains:[],
            subdomain:p.subdomain||null,
            createdOn:p.created_on||null,
            latestDeployment:p.latest_deployment?{
              id:p.latest_deployment.id||null,
              environment:p.latest_deployment.environment||null,
              url:p.latest_deployment.url||null,
              createdOn:p.latest_deployment.created_on||null,
              branch:p.latest_deployment.deployment_trigger?.metadata?.branch||null,
              commitHash:p.latest_deployment.deployment_trigger?.metadata?.commit_hash||null,
            }:null,
          };
          fs.writeFileSync('/tmp/project-sanitized.json',JSON.stringify(project,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,`CF_CANARY_PROJECT=${p.name}\n`);
          NODE

          curl --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_CANARY_PROJECT}/deployments" \
            -o /tmp/deployments.json > /tmp/deployments.status
          test "$(cat /tmp/deployments.status)" = '200' || { cat /tmp/deployments.json; exit 43; }

          node <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('/tmp/project-sanitized.json','utf8'));
          const payload=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(!payload.success||!Array.isArray(payload.result))throw new Error('CF_CANARY_DEPLOYMENT_LIST_FAILED');
          const deployments=payload.result.slice(0,50).map((d)=>({
            id:d.id||null,
            environment:d.environment||null,
            url:d.url||null,
            createdOn:d.created_on||null,
            branch:d.deployment_trigger?.metadata?.branch||null,
            commitHash:d.deployment_trigger?.metadata?.commit_hash||null,
            commitMessage:d.deployment_trigger?.metadata?.commit_message||null,
            latestStageName:Array.isArray(d.stages)&&d.stages.length?d.stages[d.stages.length-1]?.name||null:null,
            latestStageStatus:Array.isArray(d.stages)&&d.stages.length?d.stages[d.stages.length-1]?.status||null:null,
          }));
          const evidence={
            schema:'iberfit.ops.canary-cloudflare-discovery.v1',
            generatedAt:new Date().toISOString(),
            domain:process.env.CANARY_DOMAIN,
            project,
            deployments,
            mutationsPerformed:false,
            productionTouched:false,
          };
          fs.writeFileSync('CANARY_CLOUDFLARE_DISCOVERY.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Preserve sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-cloudflare-discovery-readonly
          path: CANARY_CLOUDFLARE_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 2

name: IBERFIT M44 Authorized Managed Recovery Drill

# One-time, explicitly authorized real-PROD-snapshot rehearsal on the FIXED
# separate M44 sandbox. Never changes PROD; QA is temporarily swapped on Free.
# The only payload leaving GitHub is the authenticated ciphertext into the
# protected runner. No plaintext is uploaded to CI artifacts, logs or Drive.
on:
  push:
    branches:
      - canary/rc74-4
    paths:
      - 'scripts/ops/m44_managed_real_recovery.mjs'
      - '.github/workflows/m44-managed-real-recovery.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: iberfit-m44-managed-real-recovery-one-time
  cancel-in-progress: false

jobs:
  wait-exact-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify latest exact source and Canary deploy before touching QA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'iberfit/iberfit-m26-app'
          test "$GITHUB_REF" = 'refs/heads/canary/rc74-4'
          sha="$(gh api repos/iberfit/iberfit-m26-app/branches/canary/rc74-4 --jq '.commit.sha')"
          test "$sha" = "$TARGET_SHA"
          passed=false
          for _ in $(seq 1 110); do
            state="$(gh api 'repos/iberfit/iberfit-m26-app/actions/workflows/canary-exact-deploy.yml/runs?branch=canary%2Frc74-4&per_page=25' \
              --jq '[.workflow_runs[] | select(.head_sha==env.TARGET_SHA) | .conclusion][0] // "pending"')"
            if [ "$state" = success ]; then passed=true; break; fi
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then
              echo 'M44_MANAGED_EXACT_CANARY_GATE_REJECTED'; exit 1
            fi
            sleep 12
          done
          test "$passed" = true || { echo M44_MANAGED_EXACT_CANARY_GATE_TIMEOUT; exit 1; }
          echo 'M44_MANAGED_EXACT_CANARY_PRECHECK_PASSED'

  managed-recovery:
    needs: wait-exact-canary
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 75
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IBERFIT_BACKUP_PASSPHRASE: ${{ secrets.IBERFIT_BACKUP_PASSPHRASE }}
      M44_USER_AUTHORIZATION: REAL_DATA_CLONE_ONLY_20261121
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block superseded Canary SHA before importing protected data
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node scripts/ops/require_current_canary_sha.mjs
      - name: Verify restore script syntax and policy regression
        run: |
          node --check scripts/ops/m44_managed_real_recovery.mjs
          node --test tests/m44_managed_real_recovery_guard.test.mjs
      - name: Run isolated real-snapshot recovery and ALWAYS restore two Free slots
        shell: bash
        run: node scripts/ops/m44_managed_real_recovery.mjs

name: IBERFIT M26 Gates remotos de solo lectura

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe READ_ONLY_REMOTE_GATE'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ inputs.confirmation == 'READ_ONLY_REMOTE_GATE' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar gate autenticado sin mutaciones
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_authenticated_readonly_gate.mjs
      - name: Conservar evidencia remota
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc29-evidencia-gate-remoto
          path: |
            recovery/RC29_REMOTE_*.json
            recovery/RC74_4_REMOTE_*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preparar Playwright RC64.2B
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validar Canary desplegado en navegador real
        run: node scripts/prelaunch/check_live_canary_gate.mjs

      - name: Conservar evidencia Canary live pre-launch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-live-canary-gate
          path: |
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_GATE.json
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_*_DIAGNOSTIC.json
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_DESKTOP.png
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_MOBILE.png
          if-no-files-found: warn
          retention-days: 7

      - name: Generar candidatos visuales canónicos Linux RC64.2B
        id: visual_candidates
        run: npm run quality:rc64:visual:update

      - name: Conservar candidatos visuales Linux
        if: ${{ always() && steps.visual_candidates.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc64-2b-linux-visual-baseline-candidates
          path: qa/rc64/visual.spec.mjs-snapshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Ejecutar smoke autenticado RC64.2B sobre fuente actual sin mutaciones
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: npm run quality:rc64:auth-smoke

      - name: Conservar evidencia autenticada minimizada RC64.2B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc64-2b-authenticated-readonly-evidence
          path: recovery/RC64_2B_AUTHENTICATED_SMOKE.json
          if-no-files-found: warn
          retention-days: 7

name: IBERFIT M26 Gates remotos de solo lectura

on:
  push:
    branches:
      - canary/rc74-4
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'qa/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/continuous-app-audit.yml'
      - '.github/workflows/hosted-auth-security-hardening.yml'
      - '.github/workflows/production-promote.yml'
      - '.github/workflows/remote-gates.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe READ_ONLY_REMOTE_GATE'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iberfit-qa-authenticated-gates
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'READ_ONLY_REMOTE_GATE' }}
    runs-on: ubuntu-latest
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Ejecutar gate autenticado sin mutaciones
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_authenticated_readonly_gate.mjs
      - name: Conservar evidencia remota
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc29-evidencia-gate-remoto
          path: |
            recovery/RC29_REMOTE_*.json
            recovery/RC74_4_REMOTE_*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preparar dependencias Playwright RC64.2B
        run: |
          npm ci
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install-deps chromium webkit firefox
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-all
      - name: Install Chromium WebKit and Firefox on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit firefox
      - name: Verify Playwright browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium, firefox, webkit } from '@playwright/test'; for (const [name,browser] of Object.entries({chromium,firefox,webkit})) if (!fs.existsSync(browser.executablePath())) throw new Error('PLAYWRIGHT_'+name.toUpperCase()+'_NOT_READY');"
      - name: Validar Canary desplegado en navegador real
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'READ_ONLY_REMOTE_GATE' && github.ref_name == 'canary/rc74-4' }}
        run: node scripts/prelaunch/check_live_canary_gate.mjs

      - name: Conservar evidencia Canary live pre-launch
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'READ_ONLY_REMOTE_GATE' && github.ref_name == 'canary/rc74-4' }}
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-live-canary-gate
          path: |
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_GATE.json
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_*_DIAGNOSTIC.json
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_DESKTOP.png
            recovery/prelaunch-live/PRELAUNCH_LIVE_CANARY_MOBILE.png
          if-no-files-found: warn
          retention-days: 7

      - name: Generar candidatos visuales canónicos Linux RC64.2B
        id: visual_candidates
        run: npm run quality:rc64:visual:update

      - name: Conservar candidatos visuales Linux
        if: ${{ steps.visual_candidates.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc64-2b-linux-visual-baseline-candidates
          path: qa/rc64/visual.spec.mjs-snapshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Ejecutar smoke autenticado RC64.2B sobre fuente actual sin mutaciones
        id: auth_smoke
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: npm run quality:rc64:auth-smoke

      - name: Reproducir P0 login colgado y certificar recuperación sin freeze
        run: npm run quality:p0:auth-no-freeze

      - name: Conservar evidencia autenticada minimizada RC64.2B
        if: ${{ steps.auth_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc64-2b-authenticated-readonly-evidence
          path: recovery/RC64_2B_AUTHENTICATED_SMOKE.json
          if-no-files-found: error
          retention-days: 7

      - name: Capturar evidencia visual autenticada RC64 sin mutaciones
        id: authenticated_visual
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: |
          node qa/rc64/build-authenticated-surface.mjs
          npx playwright test --config playwright.authenticated-visual.config.mjs

      - name: Conservar evidencia visual autenticada RC64
        if: ${{ steps.authenticated_visual.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc64-authenticated-visual-evidence
          path: recovery/rc64-authenticated-visual/**
          if-no-files-found: error
          retention-days: 7

  exercise-media-broker-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'EXERCISE_MEDIA_BROKER_PROBE' && github.ref == 'refs/heads/canary/rc74-4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AUTO_FACTORY_URL: https://pjhmrhejsoofmouedavw.supabase.co/functions/v1/iberfit-exercise-media-auto-factory-v1
      OIDC_AUDIENCE: iberfit-exercise-media-auto-factory
      EXPECTED_PROJECT_REF: pjhmrhejsoofmouedavw
      EXPECTED_REPOSITORY: iberfit/iberfit-m26-app
      EXPECTED_REF: refs/heads/canary/rc74-4
      EXPECTED_WORKFLOW_REF: iberfit/iberfit-m26-app/.github/workflows/remote-gates.yml@refs/heads/canary/rc74-4
    steps:
      - name: Checkout certified Canary source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify probe contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tests/m26_exercise_media_auto_factory.test.mjs
          mkdir -p recovery/auto-factory-probe

      - name: Obtain GitHub OIDC token for broker probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100
          echo "::add-mask::$token"
          echo "IBERFIT_AUTO_FACTORY_OIDC=$token" >> "$GITHUB_ENV"

      - name: Probe live media broker without mutation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${IBERFIT_AUTO_FACTORY_OIDC}" \
            -H 'Content-Type: application/json' \
            "$AUTO_FACTORY_URL" \
            -d '{"action":"probe"}' > recovery/auto-factory-probe/probe.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('recovery/auto-factory-probe/probe.json','utf8'));
          const expected={
            schema:'iberfit.exercise.media.auto-factory.probe.v1',
            project_ref:process.env.EXPECTED_PROJECT_REF,
            repository:process.env.EXPECTED_REPOSITORY,
            ref:process.env.EXPECTED_REF,
            workflow_ref:process.env.EXPECTED_WORKFLOW_REF,
          };
          if(x.ok!==true||x.probe!==true)throw new Error('AUTO_FACTORY_PROBE_NOT_OK');
          for(const [key,value] of Object.entries(expected))if(x[key]!==value)throw new Error(`AUTO_FACTORY_PROBE_${key.toUpperCase()}_MISMATCH`);
          if(!x.run_id||!x.sha)throw new Error('AUTO_FACTORY_PROBE_IDENTITY_INCOMPLETE');
          console.log(JSON.stringify({ok:true,probe:true,project_ref:x.project_ref,repository:x.repository,ref:x.ref,workflow_ref:x.workflow_ref,run_id:x.run_id,sha:x.sha}));
          NODE

      - name: Preserve broker probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-exercise-media-auto-factory-probe-${{ github.run_id }}
          path: recovery/auto-factory-probe/
          if-no-files-found: warn
          retention-days: 30

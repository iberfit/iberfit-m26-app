name: Prepare WEB IBERFIT V6.37 deploy

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/prep-web-v637-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prep-web-v637-deploy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/web-iberfit-worker
          fetch-depth: 0

      - name: Actualizar promoción certificada V6.37
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/provision-web-iberfit-pages.yml')
          s=p.read_text(encoding='utf-8')
          replacements={
            "WEB_SHA: 'bb9332abd06f86b3db59d2e10004964d906ecbe0'":"WEB_SHA: '29cba94937db9b0ab850b8fa5d9794332235f18c'",
            "WEB_VERSION: '6.36'":"WEB_VERSION: '6.37'",
            "QA_RUN_ID: '35101976236'":"QA_RUN_ID: '35272749676'",
            'V6.36':'V6.37',
            'v636-review':'v637-review',
            '/tmp/v636-':'/tmp/v637-',
            'V636_PRODUCTION_EVIDENCE':'V637_PRODUCTION_EVIDENCE',
            'web-iberfit-v636-production':'web-iberfit-v637-production',
          }
          for old,new in replacements.items():
            if old not in s:
              print(f'WARN replacement source not found: {old}')
            s=s.replace(old,new)

          anchor='          test -s "${base}/assets/quality.v636.css"\n'
          addition='''          test -s "${base}/assets/quality.v636.css"\n          test -s "${base}/assets/interaction.v637.css"\n          test "$(grep -R -l 'interaction.v637.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = "33"\n'''
          if 'assets/interaction.v637.css' not in s:
            if anchor not in s: raise SystemExit('candidate CSS anchor not found')
            s=s.replace(anchor,addition,1)

          preview_anchor="          grep -q 'evidence-process-section' /tmp/v637-home.out\n"
          preview_add="""          grep -q 'evidence-process-section' /tmp/v637-home.out\n          grep -q 'interaction.v637.css' /tmp/v637-home.out\n"""
          if preview_anchor in s and "grep -q 'interaction.v637.css' /tmp/v637-home.out" not in s:
            s=s.replace(preview_anchor,preview_add,1)

          prod_anchor="          grep -q 'brand-journey--editorial' /tmp/v637-pages-about.html\n"
          prod_add="""          grep -q 'brand-journey--editorial' /tmp/v637-pages-about.html\n          grep -q 'interaction.v637.css' /tmp/v637-pages-about.html\n"""
          if prod_anchor in s and "grep -q 'interaction.v637.css' /tmp/v637-pages-about.html" not in s:
            s=s.replace(prod_anchor,prod_add,1)

          domain_anchor="            grep -q 'evidence-process-section' /tmp/iberfit-home.html 2>/dev/null && grep -q '<h3>Online</h3>' /tmp/iberfit-home.html 2>/dev/null && home=1 || true\n"
          domain_new="            grep -q 'evidence-process-section' /tmp/iberfit-home.html 2>/dev/null && grep -q '<h3>Online</h3>' /tmp/iberfit-home.html 2>/dev/null && grep -q 'interaction.v637.css' /tmp/iberfit-home.html 2>/dev/null && home=1 || true\n"
          if domain_anchor in s:
            s=s.replace(domain_anchor,domain_new,1)

          evidence_anchor="          curl --fail --silent --show-error \\\n            -H \"Authorization: Bearer ${CLOUDFLARE_API_TOKEN}\""
          # No fragile mutation here: deployment verification already checks immutable Pages + custom domain.

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar workflow actualizado
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/provision-web-iberfit-pages.yml
          grep -q "WEB_SHA: '29cba94937db9b0ab850b8fa5d9794332235f18c'" "$f"
          grep -q "WEB_VERSION: '6.37'" "$f"
          grep -q "QA_RUN_ID: '35272749676'" "$f"
          grep -q 'interaction.v637.css' "$f"
          grep -q 'v637-review' "$f"
          grep -q 'V637_PRODUCTION_EVIDENCE' "$f"
          git diff --check

      - name: Commit promoción V6.37
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/provision-web-iberfit-pages.yml
          git commit -m 'deploy(web): promote certified V6.37 interaction release'
          git push origin HEAD:infra/web-iberfit-worker

name: IBERFIT PROD SMTP Secret Readiness

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-prod-smtp-secret-readiness.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-prod-smtp-secret-readiness
  cancel-in-progress: false

jobs:
  certify-secret-readiness:
    name: certify-smtp-secrets-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check SMTP secret presence without exposing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_HOST: ${{ secrets.IBERFIT_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.IBERFIT_SMTP_PORT }}
          SMTP_USER: ${{ secrets.IBERFIT_SMTP_USER }}
          SMTP_PASS: ${{ secrets.IBERFIT_SMTP_PASS }}
          SMTP_ADMIN_EMAIL: ${{ secrets.IBERFIT_SMTP_ADMIN_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.IBERFIT_SMTP_SENDER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const present=(v)=>typeof v==='string'&&v.length>0;
          const port=Number(process.env.SMTP_PORT);
          const evidence={
            schema:'iberfit.prod-smtp-secret-readiness.v1',
            supabaseAccessTokenPresent:present(process.env.SUPABASE_ACCESS_TOKEN),
            smtpHostPresent:present(process.env.SMTP_HOST),
            smtpPortPresent:present(process.env.SMTP_PORT),
            smtpPortValid:Number.isInteger(port)&&port>=1&&port<=65535,
            smtpUserPresent:present(process.env.SMTP_USER),
            smtpPassPresent:present(process.env.SMTP_PASS),
            smtpAdminEmailPresent:present(process.env.SMTP_ADMIN_EMAIL),
            smtpSenderNamePresent:present(process.env.SMTP_SENDER_NAME),
          };
          evidence.smtpCredentialSetReady=
            evidence.smtpHostPresent &&
            evidence.smtpPortValid &&
            evidence.smtpUserPresent &&
            evidence.smtpPassPresent &&
            evidence.smtpAdminEmailPresent &&
            evidence.smtpSenderNamePresent;

          fs.writeFileSync('PROD_SMTP_SECRET_READINESS.json',JSON.stringify(evidence,null,2)+'\n','utf8');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Preserve sanitized secret readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-smtp-secret-readiness-${{ github.run_id }}
          path: PROD_SMTP_SECRET_READINESS.json
          if-no-files-found: error
          retention-days: 30

name: WEB IBERFIT · Custom Domain Staging

on:
  push:
    branches:
      - infra/web-iberfit-bootstrap-20260912
    paths:
      - ".iberfit/web-iberfit-custom-stage.json"

permissions:
  contents: read

concurrency:
  group: web-iberfit-custom-domain-stage
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: "5b03d387427d367674b9d05b8bdf7c84"
  CF_PROJECT: "web-iberfit"
  STAGE_DOMAIN: "web-stage.iberfit.cl"
  WEB_REPO: "iberfit/iberfitweb"
  WEB_SOURCE_REF: "b5da4c191a13923417385824cf0a80340b0f4221"
  WEB_CANDIDATE_SHA: "8d6fcb12a9472e9ef78b9973ca3d0cd9d71244ab"

jobs:
  custom-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout puente
        uses: actions/checkout@v4

      - name: Checkout QA web
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ env.WEB_SOURCE_REF }}
          path: web
          persist-credentials: false

      - name: Validar proyecto y ausencia de apex
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"             -o PROJECT.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('PROJECT.json','utf8'));
          if(!x.success||!x.result)throw new Error('PROJECT_LOOKUP_FAILED');
          const d=x.result.domains||[];
          if(d.includes('iberfit.cl'))throw new Error('APEX_ALREADY_BOUND_UNEXPECTEDLY');
          console.log(JSON.stringify({name:x.result.name,domains:d},null,2));
          NODE

      - name: Asociar subdominio staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error -o DOMAIN_BEFORE.json -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains/${STAGE_DOMAIN}")"
          if [ "$HTTP" = "404" ]; then
            curl --fail --silent --show-error               -X POST               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H "Content-Type: application/json"               --data '{"name":"web-stage.iberfit.cl"}'               "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains"               -o DOMAIN_CREATE.json
          elif [ "$HTTP" = "200" ]; then
            cp DOMAIN_BEFORE.json DOMAIN_CREATE.json
          else
            cat DOMAIN_BEFORE.json
            exit 42
          fi
          cat DOMAIN_CREATE.json

      - name: Esperar activación TLS/DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=0
          for i in $(seq 1 36); do
            curl --fail --silent --show-error               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains/${STAGE_DOMAIN}"               -o DOMAIN_STATUS.json
            STATUS="$(node -p "require('./DOMAIN_STATUS.json').result?.status || 'unknown'")"
            echo "domain status=$STATUS intento=$i"
            if [ "$STATUS" = "active" ]; then ACTIVE=1; break; fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "blocked" ] || [ "$STATUS" = "deactivated" ]; then
              cat DOMAIN_STATUS.json
              exit 43
            fi
            sleep 5
          done
          test "$ACTIVE" = "1" || { cat DOMAIN_STATUS.json; echo DOMAIN_NOT_ACTIVE; exit 44; }

      - name: Smoke del dominio staging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --connect-timeout 5 --max-time 25             "https://${STAGE_DOMAIN}/" -o /tmp/home.html
          grep -q 'intent-router' /tmp/home.html
          grep -q '>A distancia<' /tmp/home.html
          ! grep -q '>Online<' /tmp/home.html

      - name: QA multidispositivo dominio staging
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          BASE_URL="https://${STAGE_DOMAIN}" QA_OUT="evidence/web-iberfit-custom-stage"             node web/.github/scripts/qa_v628_dispositivos.mjs

      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-custom-stage-${{ github.run_id }}
          path: |
            PROJECT.json
            DOMAIN_BEFORE.json
            DOMAIN_CREATE.json
            DOMAIN_STATUS.json
            evidence/web-iberfit-custom-stage
          if-no-files-found: warn
          retention-days: 30

name: IBERFIT PROD Auth Baseline Hardening

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-prod-auth-baseline-hardening.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-prod-auth-baseline-hardening
  cancel-in-progress: false

env:
  PROD_SUPABASE_REF: 'pjhmrhejsoofmouedavw'

jobs:
  harden-prod-auth:
    name: harden-prod-auth-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact operational branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Apply bounded PROD Auth hardening with rollback guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/auth-config-hardening
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ref=process.env.PROD_SUPABASE_REF;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw new Error('SUPABASE_ACCESS_TOKEN_MISSING');
          const endpoint=`https://api.supabase.com/v1/projects/${ref}/config/auth`;
          async function req(method='GET',body){
            const r=await fetch(endpoint,{
              method,
              headers:{Authorization:`Bearer ${token}`,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},
              ...(body?{body:JSON.stringify(body)}:{})
            });
            let data={}; try{data=await r.json();}catch{}
            if(!r.ok)throw new Error(`PROD_AUTH_CONFIG_${method}_FAILED_${r.status}`);
            return data;
          }

          const before=await req();
          const state={
            schema:'iberfit.auth-config-hardening-state.v1',
            target:'prod',
            projectRef:ref,
            site_url:String(before.site_url||''),
            disable_signup:before.disable_signup===true,
            password_min_length:Number(before.password_min_length),
            security_update_password_require_reauthentication:before.security_update_password_require_reauthentication===true
          };
          if(state.site_url!=='https://app.iberfit.cl/')throw new Error(`PROD_AUTH_SITE_URL_DRIFT:${state.site_url}`);
          if(!Number.isFinite(state.password_min_length)||state.password_min_length>8)throw new Error('PROD_AUTH_PASSWORD_POLICY_UNEXPECTED');
          fs.writeFileSync('recovery/auth-config-hardening/prod-before.json',JSON.stringify(state,null,2)+'\n');

          const patch={disable_signup:true,password_min_length:8};
          const changed=state.disable_signup!==true||state.password_min_length!==8;
          if(changed)await req('PATCH',patch);

          const after=await req();
          const verified=after.disable_signup===true
            && Number(after.password_min_length)===8
            && String(after.site_url||'')==='https://app.iberfit.cl/'
            && after.security_update_password_require_reauthentication===state.security_update_password_require_reauthentication;

          if(!verified){
            if(changed){
              try{await req('PATCH',{disable_signup:state.disable_signup,password_min_length:state.password_min_length});}catch{}
            }
            throw new Error('PROD_AUTH_BASELINE_VERIFY_FAILED');
          }

          const evidence={
            schema:'iberfit.auth-config-hardening-evidence.v1',
            target:'prod',
            projectRef:ref,
            changed,
            before:state,
            after:{
              site_url:String(after.site_url||''),
              disable_signup:after.disable_signup===true,
              password_min_length:Number(after.password_min_length),
              security_update_password_require_reauthentication:after.security_update_password_require_reauthentication===true
            },
            verified:true
          };
          fs.writeFileSync('recovery/auth-config-hardening/prod-after.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify({target:'prod',changed,verified:true,siteUrl:evidence.after.site_url,disableSignup:true,passwordMinLength:8}));
          NODE

      - name: Preserve Auth hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-auth-baseline-hardening-${{ github.run_id }}
          path: recovery/auth-config-hardening/
          if-no-files-found: warn
          retention-days: 30

name: IBERFIT M26 i18n route wire

on:
  push:
    branches:
      - feat/full-i18n
    paths:
      - '.github/workflows/m26-i18n-route-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-i18n
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire extended surface catalogue
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/m26/ui/i18n-surface.js')
          s=p.read_text(encoding='utf-8')
          imp="import {iberfitExtraSurfaceTranslate} from './i18n-surface-extra.js';\n"
          if imp not in s:
              anchor="import {iberfitDynamicSurfaceTranslate} from './i18n-surface-dynamic.js';\n"
              if anchor not in s: raise SystemExit('M26_I18N_DYNAMIC_IMPORT_REQUIRED')
              s=s.replace(anchor,anchor+imp,1)
          old="  const core=source.slice(leading.length,source.length-trailing.length);\n  const composed=translateComposable(core,lang);\n  const translated=composed===core\n    ?iberfitDynamicSurfaceTranslate(core,{language:lang,translatePart:(part)=>translateComposable(part,lang)})\n    :composed;\n  return `${leading}${translated}${trailing}`;"
          new="  const core=source.slice(leading.length,source.length-trailing.length);\n  const exactOrExtra=iberfitExtraSurfaceTranslate(core,{language:lang});\n  const composed=exactOrExtra!==core?exactOrExtra:translateComposable(core,lang);\n  const translated=composed===core\n    ?iberfitDynamicSurfaceTranslate(core,{language:lang,translatePart:(part)=>{\n      const extraPart=iberfitExtraSurfaceTranslate(part,{language:lang});\n      return extraPart!==part?extraPart:translateComposable(part,lang);\n    }})\n    :composed;\n  return `${leading}${translated}${trailing}`;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('M26_I18N_ROUTE_WIRE_ANCHOR_MISSING')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify extended i18n contracts
        run: |
          node --check src/m26/ui/i18n-surface.js
          node --check src/m26/ui/i18n-surface-extra.js
          node --check src/m26/ui/i18n-surface-route-a.js
          node --check src/m26/ui/i18n-surface-route-b.js
          node --check src/m26/ui/i18n-surface-route-c.js
          node --check src/m26/ui/i18n-surface-route-d.js
          node --test tests/m26_full_surface_i18n.test.mjs tests/m26_full_surface_dynamic_i18n.test.mjs tests/m26_route_surface_i18n.test.mjs tests/m26_admin_coach_workspace_i18n.test.mjs
          npm run test:m26:product
          npm run test:m26:rc74-4
      - name: Commit clean functional wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/m26-i18n-route-wire.yml
          git add src/m26/ui/i18n-surface.js
          git commit -m 'feat(i18n): wire complete route surface catalogue'
          git push origin HEAD:feat/full-i18n

name: Preview WEB IBERFIT V6.43.21 final certified

on:
  push:
    branches: [infra/web-iberfit-worker]
    paths: ['.github/workflows/deploy-web-iberfit-v64321-final-preview.yml']

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: '86f62e1f813e10720769a1a9c46887b6d79097b9'
  WEB_VERSION: '6.43.21'
  QA_SOURCE_SHA: '1fa1eca0f7e0a3f0413ec5a1acd9591aa8afc594'
  QA_RUN_ID: '36023863563'
  QA_RUN_NAME: 'Release WEB IBERFIT V6.43.21 contrast system v4'
  EXPECTED_CURRENT_SHA: '869ae776852f37000c4f528161b44b75b4fb6913'
  EXPECTED_CURRENT_VERSION: '6.43.21'
  EXPECTED_CURRENT_DEPLOYMENT_ID: '1f49ce73-d7f9-43d8-b1ab-d40941ae0302'
  SAFE_ROLLBACK_SHA: 'a9af3b52d67332f323f5e648613e609661f31639'
  SAFE_ROLLBACK_DEPLOYMENT_ID: '43884d1e-1b2d-48ea-95bc-1e7d75f06b75'
  WRANGLER_VERSION: '4.120.0'

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify exact current production identity without mutating it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||p.result?.name!==process.env.CF_PROJECT||p.result.production_branch!=='production')throw Error('PROJECT_MISMATCH');
          const domains=p.result.domains||[];
          if(!domains.includes('iberfit.cl')||domains.includes('app.iberfit.cl'))throw Error('DOMAIN_MISMATCH');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const current=(x.result||[]).filter(d=>d.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(current?.id!==process.env.EXPECTED_CURRENT_DEPLOYMENT_ID)throw Error('PRODUCTION_DRIFT_ID:'+current?.id);
          if((current.deployment_trigger?.metadata?.commit_hash||'')!==process.env.EXPECTED_CURRENT_SHA)throw Error('PRODUCTION_DRIFT_SHA:'+(current.deployment_trigger?.metadata?.commit_hash||''));
          const safe=(x.result||[]).find(d=>d.id===process.env.SAFE_ROLLBACK_DEPLOYMENT_ID);
          if(!safe||(safe.deployment_trigger?.metadata?.commit_hash||'')!==process.env.SAFE_ROLLBACK_SHA)throw Error('SAFE_ROLLBACK_MISSING');
          NODE
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=64321-final-preview' | tr -d '\r\n ')" = "$EXPECTED_CURRENT_VERSION"

      - name: Verify certified QA and immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa.json
          node <<'NODE'
          const x=require('/tmp/qa.json');
          if(x.head_sha!==process.env.QA_SOURCE_SHA||x.status!=='completed'||x.conclusion!=='success'||x.name!==process.env.QA_RUN_NAME)throw Error('QA_MISMATCH');
          NODE
          git clone --filter=blob:none --no-checkout "$WEB_REPO" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=2 origin "$WEB_SHA"
          git -C /tmp/iberfitweb checkout --detach "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD^)" = "$QA_SOURCE_SHA"
          test "$(git -C /tmp/iberfitweb log -1 --format=%s)" = 'fix(web): certify V6.43.21 contrast and hybrid semantics'
          b=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$b/VERSION")" = "$WEB_VERSION"
          test "$(find "$b" -type f -name '*.html' | wc -l | tr -d ' ')" = '33'
          test -s "$b/assets/contrast.v64321.css"
          grep -q -- '--text-secondary:#44564c' "$b/assets/contrast.v64321.css"
          grep -q -- '--gold-text-strong:#806216' "$b/assets/contrast.v64321.css"
          grep -q 'background:rgba(255,253,248,.92)' "$b/assets/contrast.v64321.css"
          grep -q 'En estas comunas + seguimiento a distancia' "$b/index.html"
          ! grep -q 'Según cobertura presencial' "$b/index.html"
          grep -q 'Organizamos contigo una forma de entrenar que encaje en tu semana.' "$b/entrenador-personal-las-condes/index.html"
          ! grep -q 'Primero vemos si podemos hacerlo bien, no solo si podemos ir' "$b/entrenador-personal-las-condes/index.html"
          grep -q 'Entrenamos contigo en Peñalolén.' "$b/entrenador-personal-penalolen/index.html"
          grep -q 'href="/hibrido/">Conocer entrenamiento híbrido</a>' "$b/entrenador-personal-vitacura/index.html"
          grep -q 'href="/en/hybrid/">Explore hybrid training</a>' "$b/en/personal-trainer-vitacura/index.html"
          grep -q "script-src-attr 'none'" "$b/_headers"
          ! grep -q "'unsafe-inline'" "$b/_headers"

      - name: Deploy immutable Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          branch="v64321-final-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch "$branch" --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.43.21 final certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=$PREVIEW_URL"

      - name: Validate real preview content CSP routes and semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$GITHUB_RUN_ID" | tr -d '\r\n ')" = "$WEB_VERSION"
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/contrast.v64321.css?cb=$GITHUB_RUN_ID" -o /tmp/contrast.css
          grep -q -- '--text-secondary:#44564c' /tmp/contrast.css
          grep -q -- '--gold-text-strong:#806216' /tmp/contrast.css
          for pair in \
            '/|En estas comunas + seguimiento a distancia' \
            '/entrenador-personal-las-condes/|Organizamos contigo una forma de entrenar' \
            '/entrenador-personal-vitacura/|Conocer entrenamiento híbrido' \
            '/entrenador-personal-penalolen/|Entrenamos contigo en Peñalolén.' \
            '/en/|In these areas + remote support' \
            '/en/personal-trainer-vitacura/|Explore hybrid training'; do
              route="${pair%%|*}"; marker="${pair#*|}"
              curl -fsSL --retry 6 --retry-all-errors "${PREVIEW_URL}${route}?cb=$GITHUB_RUN_ID" -o /tmp/p
              grep -q "$marker" /tmp/p
              ! grep -q 'Primero vemos si podemos hacerlo bien, no solo si podemos ir' /tmp/p
          done
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          r=Path('/tmp/iberfitweb/candidate/v628');base=os.environ['PREVIEW_URL'].rstrip('/')
          htmls=sorted(r.rglob('*.html'));assert len(htmls)==33
          for p in htmls:
              rel=p.relative_to(r).as_posix()
              route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          print('PREVIEW_ROUTES_OK',len(htmls))
          PY
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/entrenador-personal-vitacura/?cb=$GITHUB_RUN_ID" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-headers
          grep -q '^content-security-policy:' /tmp/preview-headers
          grep -q "script-src-attr 'none'" /tmp/preview-headers
          ! grep -q 'unsafe-inline' /tmp/preview-headers

      - name: Browser QA on real preview 390 768 1440
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          npm install --no-save --package-lock=false playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          BASE_URL="$PREVIEW_URL" QA_OUT="/tmp/v64321-preview-screens" node .github/scripts/qa_v64321_browser.mjs

      - name: Record exact preview deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after-preview.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after-preview.json','utf8'));
          const d=(x.result||[]).filter(v=>v.environment==='preview'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA).sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!d)throw Error('PREVIEW_DEPLOYMENT_NOT_FOUND');
          const evidence={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaSourceSha:process.env.QA_SOURCE_SHA,qaRun:process.env.QA_RUN_ID,previewUrl:process.env.PREVIEW_URL,previewDeploymentId:d.id,productionBaselineSha:process.env.EXPECTED_CURRENT_SHA,productionBaselineDeploymentId:process.env.EXPECTED_CURRENT_DEPLOYMENT_ID,safeRollbackSha:process.env.SAFE_ROLLBACK_SHA,safeRollbackDeploymentId:process.env.SAFE_ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/V64321_FINAL_PREVIEW_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Upload final preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v64321-final-preview-evidence
          path: |
            /tmp/V64321_FINAL_PREVIEW_EVIDENCE.json
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/deployments-after-preview.json
            /tmp/qa.json
            /tmp/wrangler-preview.log
            /tmp/preview-headers
            /tmp/v64321-preview-screens
          if-no-files-found: warn
          retention-days: 30

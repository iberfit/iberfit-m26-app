name: Discover IBERFIT web domain target

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/discover-web-iberfit-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
      DOMAIN: 'iberfit.cl'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descubrir proyecto y dominios actuales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            -o /tmp/projects.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/projects.json','utf8'));
          if(!x.success||!Array.isArray(x.result))throw new Error('PAGES_PROJECT_LIST_FAILED');
          const rows=x.result.map(p=>({name:p.name,production_branch:p.production_branch,domains:Array.isArray(p.domains)?p.domains:[],subdomain:p.subdomain||''}));
          const hits=rows.filter(r=>r.domains.includes(process.env.DOMAIN)||r.domains.includes('www.'+process.env.DOMAIN));
          console.log('PAGES_PROJECTS='+JSON.stringify(rows));
          console.log('DOMAIN_MATCHES='+JSON.stringify(hits));
          if(hits.some(h=>h.domains.includes('app.iberfit.cl')))throw new Error('APP_DOMAIN_COLLISION');
          NODE

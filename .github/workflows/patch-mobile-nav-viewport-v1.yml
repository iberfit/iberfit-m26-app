name: IBERFIT patch mobile nav viewport v1

on:
  push:
    branches:
      - fix/p1-multiapp-runtime-application-access-20260918
    paths:
      - '.github/workflows/patch-mobile-nav-viewport-v1.yml'

permissions:
  contents: write

concurrency:
  group: iberfit-patch-mobile-nav-viewport-v1
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'ops: install mobile nav patch runner' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v4
        with:
          ref: fix/p1-multiapp-runtime-application-access-20260918
          fetch-depth: 0

      - name: Apply narrow viewport navigation fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/p1-multiapp-runtime-application-access-20260918'
          python - <<'PY'
          from pathlib import Path

          shell_path=Path('src/m26/shell/shell.css')
          source=shell_path.read_text()
          old='''@media (max-width: 900px) {\n  .m26-mobile-nav { position: relative; z-index: 60; isolation: isolate; }\n  .m26-mobile-more-menu { z-index: 70; }\n}'''
          new='''@media (max-width: 900px) {\n  /* Position is owned by the viewport-fixed mobile navigation layers.\n   * Do not reset it here: doing so can place the rail after long route content. */\n  .m26-mobile-nav { z-index: 60; isolation: isolate; }\n  .m26-mobile-more-menu { z-index: 70; }\n}'''
          if source.count(old) != 1:
              raise SystemExit('MOBILE_NAV_RELATIVE_OVERRIDE_CONTRACT_MISMATCH')
          shell_path.write_text(source.replace(old,new,1))

          test_path=Path('tests/m26_mobile_navigation_persistence.test.mjs')
          test_source=test_path.read_text()
          html_decl="const html=fs.readFileSync(new URL('../public/m26/index.html',import.meta.url),'utf8');"
          css_decl="const shellCss=fs.readFileSync(new URL('../src/m26/shell/shell.css',import.meta.url),'utf8');"
          if html_decl not in test_source:
              raise SystemExit('MOBILE_NAV_TEST_ANCHOR_MISSING')
          if css_decl not in test_source:
              test_source=test_source.replace(html_decl,html_decl+'\n'+css_decl,1)
          regression="""\n\ntest('mobile navigation has no later relative-position override',()=>{\n  assert.doesNotMatch(\n    shellCss,\n    /\\.m26-mobile-nav\\s*\\{[^}]*position:\\s*relative/gu,\n    'the persistent mobile rail must remain viewport-positioned',\n  );\n});\n"""
          if "mobile navigation has no later relative-position override" not in test_source:
              test_source=test_source.rstrip()+regression
          test_path.write_text(test_source)
          PY

      - name: Run focused regressions
        run: |
          set -euo pipefail
          node --test \
            tests/m26_mobile_navigation_persistence.test.mjs \
            tests/m26_multiapp_runtime_application_access.test.mjs \
            tests/m26_multiapp_role_switch_initialization.test.mjs
          git diff --check

      - name: Commit only the product fix and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iberfit'
          git config user.email 'iberfit.cl@gmail.com'
          git add src/m26/shell/shell.css tests/m26_mobile_navigation_persistence.test.mjs
          test -n "$(git status --porcelain -- src/m26/shell/shell.css tests/m26_mobile_navigation_persistence.test.mjs)"
          git commit -m 'fix(nav): keep mobile rail viewport-fixed'
          git push origin HEAD:fix/p1-multiapp-runtime-application-access-20260918

name: TEMP Admin stale form-lock patch

on:
  push:
    branches:
      - fix/admin-mobile-route-stale-form-lock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-mobile-route-stale-form-lock
          fetch-depth: 0

      - name: Apply exact minimal patch and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          controller = Path('src/m26/shell/shell-controller.js')
          source = controller.read_text()
          old = '      releasePointerInteraction({deferRender:false});\n      const documentLike=root.ownerDocument||globalThis.document;\n'
          new = '      releasePointerInteraction({deferRender:false});\n      releaseFormInteraction({deferRender:false});\n      const documentLike=root.ownerDocument||globalThis.document;\n'
          assert source.count(old) == 1, f'controller anchor count={source.count(old)}'
          controller.write_text(source.replace(old, new, 1))

          test_file = Path('tests/m26_shell_pointer_navigation.test.mjs')
          test_source = test_file.read_text()
          replacements = [
              ("test('route navigation releases only the transient pointer lock before committing state',()=>{", "test('route navigation retires transient pointer and stale form locks before committing state',()=>{"),
              ("  const release=block.indexOf('releasePointerInteraction({deferRender:false});');", "  const pointerRelease=block.indexOf('releasePointerInteraction({deferRender:false});');\n  const formRelease=block.indexOf('releaseFormInteraction({deferRender:false});');"),
              ("  assert.ok(release>=0,'route navigation must release pointer interaction');", "  assert.ok(pointerRelease>=0,'route navigation must release pointer interaction');"),
              ("  assert.ok(transition>release,'pointer release must happen before route transition');", "  assert.ok(formRelease>pointerRelease,'route navigation must retire stale form interaction after pointer release');\n  assert.ok(transition>formRelease,'both interaction locks must be retired before route transition');"),
              ("  assert.doesNotMatch(block,/releaseFormInteraction/u,'route clicks must not weaken form continuity');\n", ""),
          ]
          for old_test, new_test in replacements:
              assert test_source.count(old_test) == 1, f'test anchor count={test_source.count(old_test)} for {old_test!r}'
              test_source = test_source.replace(old_test, new_test, 1)
          test_file.write_text(test_source)
          PY

      - name: Run targeted regression
        run: node --test tests/m26_shell_pointer_navigation.test.mjs

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/m26/shell/shell-controller.js tests/m26_shell_pointer_navigation.test.mjs
          git rm .github/workflows/tmp-admin-stale-form-lock-patch.yml
          git commit -m 'fix(shell): retire stale form lock on route navigation'
          git push origin HEAD:fix/admin-mobile-route-stale-form-lock

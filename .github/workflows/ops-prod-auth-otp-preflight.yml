name: IBERFIT PROD Auth OTP Preflight

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-prod-auth-otp-preflight.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-prod-auth-otp-preflight
  cancel-in-progress: false

env:
  PROD_SUPABASE_URL: 'https://pjhmrhejsoofmouedavw.supabase.co'
  PROD_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_R5hU49RTDLAFFx46j4b4Hg_l8o0Pg2k'
  OTP_EMAIL: 'iberfit.cl@gmail.com'

jobs:
  otp-preflight:
    name: request-existing-user-email-otp
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request OTP for existing IBERFIT account only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url=process.env.PROD_SUPABASE_URL+'/auth/v1/otp';
          const key=process.env.PROD_SUPABASE_PUBLISHABLE_KEY;
          const email=process.env.OTP_EMAIL;
          const response=await fetch(url,{
            method:'POST',
            headers:{
              apikey:key,
              Authorization:`Bearer ${key}`,
              'Content-Type':'application/json'
            },
            body:JSON.stringify({email,create_user:false})
          });
          let body={};
          try{body=await response.json();}catch{}
          if(!response.ok){
            console.log(JSON.stringify({
              status:response.status,
              code:body.code||body.error_code||null,
              message:body.msg||body.message||null
            }));
            throw new Error(`OTP_PREFLIGHT_HTTP_${response.status}`);
          }
          console.log(JSON.stringify({ok:true,status:response.status,requestAccepted:true}));
          NODE

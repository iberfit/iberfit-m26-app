name: IBERFIT PROD Auth SMTP Readiness

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-prod-auth-readiness.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-prod-auth-smtp-readiness
  cancel-in-progress: false

env:
  PROD_SUPABASE_REF: 'pjhmrhejsoofmouedavw'
  APP_URL: 'https://app.iberfit.cl'

jobs:
  certify-prod-smtp:
    name: certify-prod-smtp-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact operational branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read and certify PROD Auth SMTP without exposing secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 41; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const projectRef=process.env.PROD_SUPABASE_REF;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          const appUrl=process.env.APP_URL;
          const nonEmpty=(value)=>typeof value==='string'&&value.trim().length>0;

          const response=await fetch(`https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/config/auth`,{
            headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}
          });
          let config=null;
          try{config=await response.json();}catch{}
          if(!response.ok)throw new Error(`PROD_AUTH_CONFIG_READ_FAILED_${response.status}`);
          config=config||{};

          const smtpHostConfigured=nonEmpty(config.smtp_host);
          const smtpAdminConfigured=nonEmpty(config.smtp_admin_email);
          const smtpPort=Number(config.smtp_port);
          const smtpPortConfigured=Number.isFinite(smtpPort)&&smtpPort>0;
          const smtpUserConfigured=nonEmpty(config.smtp_user);
          const smtpSenderNameConfigured=nonEmpty(config.smtp_sender_name);
          const siteUrl=String(config.site_url||'').trim();
          const siteUrlMatchesApp=siteUrl===appUrl||siteUrl===appUrl+'/';

          let smtpAdminDomain=null;
          if(smtpAdminConfigured){
            const at=config.smtp_admin_email.lastIndexOf('@');
            smtpAdminDomain=at>0?config.smtp_admin_email.slice(at+1).toLowerCase():null;
          }

          const evidence={
            schema:'iberfit.prod-auth-smtp-readiness.v1',
            projectRef,
            customSmtpReady:smtpHostConfigured&&smtpAdminConfigured&&smtpPortConfigured,
            smtpHostConfigured,
            smtpPortConfigured,
            smtpPort:smtpPortConfigured?smtpPort:null,
            smtpAdminConfigured,
            smtpAdminDomain,
            smtpUserConfigured,
            smtpSenderNameConfigured,
            siteUrlConfigured:Boolean(siteUrl),
            siteUrl,
            siteUrlMatchesApp,
            uriAllowList:Array.isArray(config.uri_allow_list)?config.uri_allow_list:String(config.uri_allow_list||'').split(',').map((value)=>value.trim()).filter(Boolean),
            authSecurity:{
              disableSignup:config.disable_signup===true,
              externalEmailEnabled:config.external_email_enabled===true,
              externalAnonymousUsersEnabled:config.external_anonymous_users_enabled===true,
              mailerAutoconfirm:config.mailer_autoconfirm===true,
              mailerAllowUnverifiedEmailSignIns:config.mailer_allow_unverified_email_sign_ins===true,
              mailerSecureEmailChangeEnabled:config.mailer_secure_email_change_enabled===true,
              mailerOtpExp:Number.isFinite(Number(config.mailer_otp_exp))?Number(config.mailer_otp_exp):null,
              mailerOtpLength:Number.isFinite(Number(config.mailer_otp_length))?Number(config.mailer_otp_length):null,
              jwtExp:Number.isFinite(Number(config.jwt_exp))?Number(config.jwt_exp):null,
              refreshTokenRotationEnabled:config.refresh_token_rotation_enabled===true,
              refreshTokenReuseInterval:Number.isFinite(Number(config.security_refresh_token_reuse_interval))?Number(config.security_refresh_token_reuse_interval):null,
              passwordMinLength:Number.isFinite(Number(config.password_min_length))?Number(config.password_min_length):null,
              passwordRequiredCharacters:String(config.password_required_characters||''),
              passwordHibpEnabled:config.password_hibp_enabled===true,
              updatePasswordRequireReauthentication:config.security_update_password_require_reauthentication===true,
              captchaEnabled:config.security_captcha_enabled===true,
              captchaProvider:String(config.security_captcha_provider||''),
              sessionsSinglePerUser:config.sessions_single_per_user===true,
              sessionsTimebox:Number.isFinite(Number(config.sessions_timebox))?Number(config.sessions_timebox):null,
              sessionsInactivityTimeout:Number.isFinite(Number(config.sessions_inactivity_timeout))?Number(config.sessions_inactivity_timeout):null,
              rateLimitEmailSent:Number.isFinite(Number(config.rate_limit_email_sent))?Number(config.rate_limit_email_sent):null,
              rateLimitOtp:Number.isFinite(Number(config.rate_limit_otp))?Number(config.rate_limit_otp):null,
              rateLimitVerify:Number.isFinite(Number(config.rate_limit_verify))?Number(config.rate_limit_verify):null,
              rateLimitTokenRefresh:Number.isFinite(Number(config.rate_limit_token_refresh))?Number(config.rate_limit_token_refresh):null,
              mfaMaxEnrolledFactors:Number.isFinite(Number(config.mfa_max_enrolled_factors))?Number(config.mfa_max_enrolled_factors):null
            }
          };
          fs.writeFileSync('PROD_AUTH_SMTP_READINESS.json',JSON.stringify(evidence,null,2)+'\n','utf8');
          console.log(JSON.stringify(evidence,null,2));
          if(!evidence.customSmtpReady)throw new Error('IBERFIT_AUTH_EMAIL_CUSTOM_SMTP_REQUIRED');
          NODE

      - name: Preserve sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-auth-smtp-readiness-${{ github.run_id }}
          path: PROD_AUTH_SMTP_READINESS.json
          if-no-files-found: warn
          retention-days: 30

name: IBERFIT Exercise Media Publish Approved

on:
  push:
    branches:
      - canary/rc74-4
    paths:
      - 'scripts/exercise-media/approved/**/approved-batch.json'
      - 'scripts/exercise-media/approved/**/*.webp'
      - 'scripts/exercise-media/approved/**/*.png'
      - 'scripts/exercise-media/approved/**/*.jpg'
      - 'scripts/exercise-media/approved/**/*.jpeg'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-char commit SHA containing the approved batch and assets
        required: true
        type: string
      manifest_path:
        description: Approved batch manifest path inside source_sha
        required: true
        default: scripts/exercise-media/approved/IBF-ABDUCCION-DE-CADERA-LATERAL/approved-batch.json
        type: string
      confirmation:
        description: Type PUBLISH_APPROVED_MEDIA_PROD
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: iberfit-exercise-media-prod-publisher
  cancel-in-progress: false

env:
  PROD_REF: pjhmrhejsoofmouedavw
  PROD_ORIGIN: https://pjhmrhejsoofmouedavw.supabase.co
  OIDC_AUDIENCE: iberfit-exercise-media-prod
  SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
  MANIFEST_PATH_INPUT: ${{ inputs.manifest_path || '' }}
  CONFIRMATION: ${{ github.event_name == 'push' && 'PUBLISH_APPROVED_MEDIA_PROD' || inputs.confirmation }}

jobs:
  publish-approved:
    name: publish-approved-prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate production intent and source
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'PUBLISH_APPROVED_MEDIA_PROD'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" = 'push' ]]; then
            test "$GITHUB_REF" = 'refs/heads/canary/rc74-4'
          else
            [[ "$MANIFEST_PATH_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{1,499}$ ]]
            [[ "$MANIFEST_PATH_INPUT" != /* ]]
            [[ "$MANIFEST_PATH_INPUT" != *'..'* ]]
          fi

      - name: Checkout trusted publisher
        uses: actions/checkout@v4
        with:
          ref: canary/rc74-4
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          path: approved-source
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve approved manifests
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          mkdir -p recovery
          test "$(git -C approved-source rev-parse HEAD)" = "$SOURCE_SHA"
          : > recovery/approved-manifests.txt

          if [[ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]]; then
            printf '%s\n' "$MANIFEST_PATH_INPUT" > recovery/approved-manifests.txt
          else
            changed_file="$(mktemp)"
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
              git -C approved-source fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true
              git -C approved-source diff --name-only "$BEFORE_SHA" "$SOURCE_SHA" > "$changed_file"
            else
              git -C approved-source diff-tree --root --no-commit-id --name-only -r "$SOURCE_SHA" > "$changed_file"
            fi

            awk '/^scripts\/exercise-media\/approved\/[^/]+\/approved-batch\.json$/' "$changed_file" \
              | sort -u > recovery/approved-manifests.txt

            if [[ ! -s recovery/approved-manifests.txt ]]; then
              awk -F/ '/^scripts\/exercise-media\/approved\/[^/]+\/.+\.(webp|png|jpe?g)$/ {print $1"/"$2"/"$3"/"$4"/approved-batch.json"}' "$changed_file" \
                | sort -u > recovery/approved-manifests.txt
            fi
          fi

          test -s recovery/approved-manifests.txt
          count="$(wc -l < recovery/approved-manifests.txt | tr -d ' ')"
          test "$count" -ge 1
          test "$count" -le 20
          while IFS= read -r manifest; do
            [[ "$manifest" =~ ^scripts/exercise-media/approved/[A-Za-z0-9._:-]+/approved-batch\.json$ ]]
            test -s "approved-source/$manifest"
          done < recovery/approved-manifests.txt
          cat recovery/approved-manifests.txt

      - name: Verify exact source and publisher contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/m26_exercise_media_publisher_broker.test.mjs
          while IFS= read -r manifest; do
            node scripts/exercise-media/publish-approved-via-broker.mjs \
              --manifest "approved-source/$manifest" \
              --source-root approved-source
          done < recovery/approved-manifests.txt

      - name: Obtain GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100
          echo "::add-mask::$token"
          echo "IBERFIT_GITHUB_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish approved batches to PROD
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r manifest; do
            i=$((i+1))
            node scripts/exercise-media/publish-approved-via-broker.mjs \
              --manifest "approved-source/$manifest" \
              --source-root approved-source \
              --apply \
              --evidence "recovery/exercise-media-publish-prod-${i}.json"
          done < recovery/approved-manifests.txt

      - name: Verify public runtime manifest
        shell: bash
        env:
          PROD_PUBLISHABLE_KEY: sb_publishable_R5hU49RTDLAFFx46j4b4Hg_l8o0Pg2k
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "apikey: ${PROD_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${PROD_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            "${PROD_ORIGIN}/rest/v1/rpc/iberfit_exercise_media_manifest_v1" \
            -d '{}' > recovery/exercise-media-runtime-manifest.json
          MANIFEST_LIST=recovery/approved-manifests.txt \
          SOURCE_ROOT=approved-source \
          RUNTIME_MANIFEST=recovery/exercise-media-runtime-manifest.json \
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const manifests=fs.readFileSync(process.env.MANIFEST_LIST,'utf8').trim().split(/\r?\n/).filter(Boolean);
          const wanted=new Set();
          for(const rel of manifests){
            const source=JSON.parse(fs.readFileSync(path.join(process.env.SOURCE_ROOT,rel),'utf8'));
            for(const item of source.items||[]) wanted.add(item.exercise_id);
          }
          const runtime=JSON.parse(fs.readFileSync(process.env.RUNTIME_MANIFEST,'utf8'));
          const items=Array.isArray(runtime?.items)?runtime.items:[];
          for(const id of wanted){
            const found=items.find(x=>x.exercise_id===id&&x.published===true);
            if(!found)throw new Error(`IBERFIT_RUNTIME_MEDIA_MISSING:${id}`);
          }
          console.log(JSON.stringify({runtimeVerified:true,approved:runtime?.summary?.approved,wanted:[...wanted]}));
          NODE

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-exercise-media-prod-${{ github.run_id }}
          path: |
            recovery/approved-manifests.txt
            recovery/exercise-media-publish-prod-*.json
            recovery/exercise-media-runtime-manifest.json
          if-no-files-found: warn
          retention-days: 30

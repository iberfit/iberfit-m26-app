name: Deploy WEB IBERFIT V6.43.21 certified

on:
  push:
    branches: [infra/web-iberfit-worker]
    paths: ['.github/workflows/deploy-web-iberfit-v64321.yml']

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: '869ae776852f37000c4f528161b44b75b4fb6913'
  WEB_VERSION: '6.43.21'
  QA_SOURCE_SHA: '6d4e7fb7ea88afc1b4e40fec7c259a3966bca471'
  QA_RUN_ID: '36015491143'
  QA_RUN_NAME: 'Release WEB IBERFIT V6.43.21 contrast system final'
  EXPECTED_CURRENT_SHA: 'a9af3b52d67332f323f5e648613e609661f31639'
  EXPECTED_CURRENT_VERSION: '6.43.20'
  EXPECTED_CURRENT_DEPLOYMENT_ID: '43884d1e-1b2d-48ea-95bc-1e7d75f06b75'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact V6.43.20 production baseline and capture rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||p.result?.name!==process.env.CF_PROJECT||p.result.production_branch!=='production')throw Error('PROJECT');
          const domains=p.result.domains||[];
          if(!domains.includes('iberfit.cl')||domains.includes('app.iberfit.cl'))throw Error('DOMAIN');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const c=(x.result||[]).filter(d=>d.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(c?.id!==process.env.EXPECTED_CURRENT_DEPLOYMENT_ID)throw Error('DRIFT_ID:'+c?.id);
          if((c.deployment_trigger?.metadata?.commit_hash||'')!==process.env.EXPECTED_CURRENT_SHA)throw Error('DRIFT_SHA');
          fs.appendFileSync(process.env.GITHUB_ENV,`ROLLBACK_DEPLOYMENT_ID=${c.id}\nPRODUCTION_TOUCHED=0\n`);
          NODE
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=64321' | tr -d '\r\n ')" = "$EXPECTED_CURRENT_VERSION"
      - name: Verify certified QA and candidate lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa.json
          node -e "const x=require('/tmp/qa.json');if(x.head_sha!==process.env.QA_SOURCE_SHA||x.status!=='completed'||x.conclusion!=='success'||x.name!==process.env.QA_RUN_NAME)throw Error('QA_MISMATCH')"
          git clone --filter=blob:none --no-checkout "$WEB_REPO" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=2 origin "$WEB_SHA"
          git -C /tmp/iberfitweb checkout --detach "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD^)" = "$QA_SOURCE_SHA"
          test "$(git -C /tmp/iberfitweb log -1 --format=%s)" = 'style(web): strengthen visual hierarchy in V6.43.21'
          b=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$b/VERSION")" = "$WEB_VERSION"
          test "$(find "$b" -type f -name '*.html' | wc -l | tr -d ' ')" = '33'
          test -s "$b/assets/contrast.v64321.css"
          grep -q 'contrast.v64321.css' "$b/index.html"
          grep -q 'Organizamos contigo una forma de entrenar que encaje en tu semana.' "$b/entrenador-personal-las-condes/index.html"
          grep -q 'Entrenamos contigo en Peñalolén.' "$b/entrenador-personal-penalolen/index.html"
          grep -q 'Presencial en Ñuñoa' "$b/personal-trainer-nunoa/index.html"
          grep -q 'En estas comunas + seguimiento a distancia' "$b/index.html"
          ! grep -Rqi 'Primero vemos si podemos hacerlo bien, no solo si podemos ir' "$b" --include='*.html'
          grep -q "script-src-attr 'none'" "$b/_headers"
          ! grep -q "'unsafe-inline'" "$b/_headers"
      - name: Deploy and validate certified preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          branch="v64321-certified-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch "$branch" --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.43.21 certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "$PREVIEW_URL"
          export PREVIEW_URL
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$GITHUB_RUN_ID" | tr -d '\r\n ')" = "$WEB_VERSION"
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/contrast.v64321.css?cb=$GITHUB_RUN_ID" -o /tmp/contrast.css
          grep -q -- '--text-secondary:#44564c' /tmp/contrast.css
          for pair in \
            '/|En estas comunas + seguimiento a distancia' \
            '/entrenador-personal-las-condes/|Organizamos contigo una forma de entrenar' \
            '/entrenador-personal-lo-barnechea/|Entrenamos contigo en Lo Barnechea.' \
            '/personal-trainer-nunoa/|Presencial en Ñuñoa' \
            '/entrenador-personal-penalolen/|Entrenamos contigo en Peñalolén.' \
            '/en/|In these areas + remote support' \
            '/en/personal-trainer-las-condes/|We organise training around the week' \
            '/en/personal-trainer-penalolen/|We train with you in Peñalolén.'; do
              route="${pair%%|*}"; marker="${pair#*|}"
              curl -fsSL --retry 6 --retry-all-errors "${PREVIEW_URL}${route}?cb=$GITHUB_RUN_ID" -o /tmp/p
              grep -q "$marker" /tmp/p
              ! grep -q 'Primero vemos si podemos hacerlo bien, no solo si podemos ir' /tmp/p
          done
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          r=Path('/tmp/iberfitweb/candidate/v628');base=os.environ['PREVIEW_URL'].rstrip('/');htmls=sorted(r.rglob('*.html'));assert len(htmls)==33
          for p in htmls:
              rel=p.relative_to(r).as_posix();route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          PY
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/entrenador-personal-las-condes/?cb=$GITHUB_RUN_ID" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-headers
          grep -q '^content-security-policy:' /tmp/preview-headers
          grep -q "script-src-attr 'none'" /tmp/preview-headers
          ! grep -q 'unsafe-inline' /tmp/preview-headers
      - name: Deploy production V6.43.21
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch production --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.43.21 certified production' | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL"
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo 'PRODUCTION_TOUCHED=1' >> "$GITHUB_ENV"
      - name: Verify live production and deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for a in $(seq 1 20); do
            v="$(curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/VERSION?cb=${GITHUB_RUN_ID}-${a}" | tr -d '\r\n ' || true)"
            curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/entrenador-personal-las-condes/?cb=${GITHUB_RUN_ID}-${a}" -o /tmp/live-las || true
            curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/entrenador-personal-penalolen/?cb=${GITHUB_RUN_ID}-${a}" -o /tmp/live-pen || true
            curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/?cb=${GITHUB_RUN_ID}-${a}" -o /tmp/live-home || true
            if [ "$v" = "$WEB_VERSION" ] \
              && grep -q 'contrast.v64321.css' /tmp/live-las 2>/dev/null \
              && grep -q 'Organizamos contigo una forma de entrenar que encaje en tu semana.' /tmp/live-las 2>/dev/null \
              && ! grep -q 'Primero vemos si podemos hacerlo bien, no solo si podemos ir' /tmp/live-las 2>/dev/null \
              && grep -q 'Entrenamos contigo en Peñalolén.' /tmp/live-pen 2>/dev/null \
              && grep -q 'En estas comunas + seguimiento a distancia' /tmp/live-home 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          curl -fsSL --retry 8 --retry-all-errors 'https://iberfit.cl/assets/contrast.v64321.css?live=64321' -o /tmp/live-contrast.css
          grep -q -- '--gold-text-strong:#755916' /tmp/live-contrast.css
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          r=Path('/tmp/iberfitweb/candidate/v628');htmls=sorted(r.rglob('*.html'));assert len(htmls)==33
          for p in htmls:
              rel=p.relative_to(r).as_posix();route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null','https://iberfit.cl'+route],check=True)
          PY
          curl -fsSI --retry 8 --retry-all-errors 'https://iberfit.cl/entrenador-personal-las-condes/?live=64321' | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-headers
          grep -q '^content-security-policy:' /tmp/live-headers
          grep -q "script-src-attr 'none'" /tmp/live-headers
          ! grep -q 'unsafe-inline' /tmp/live-headers
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const d=(x.result||[]).filter(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA).sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!d)throw Error('CERTIFIED_SHA_NOT_DEPLOYED');
          fs.writeFileSync('/tmp/V64321_PRODUCTION_EVIDENCE.json',JSON.stringify({version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaSourceSha:process.env.QA_SOURCE_SHA,qaRun:process.env.QA_RUN_ID,qaName:process.env.QA_RUN_NAME,previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()},null,2)+'\n');
          NODE
      - name: Automatic rollback to V6.43.20 if verification fails
        if: failure() && env.PRODUCTION_TOUCHED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" -d '{}' -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json');if(!x.success)process.exit(1)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v64321-production-evidence
          path: |
            /tmp/V64321_PRODUCTION_EVIDENCE.json
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/deployments-after.json
            /tmp/qa.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/contrast.css
            /tmp/live-contrast.css
          if-no-files-found: warn
          retention-days: 30

name: IBERFIT Branch Email Release Atomicity Patch

on:
  push:
    branches:
      - 'fix/email-release-atomicity'
    paths:
      - '.github/workflows/branch-email-release-atomicity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch production promotion atomically
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/production-promote.yml';
          let s=fs.readFileSync(p,'utf8');
          const gh='$'+'{{';
          const expr=(body)=>`${gh} ${body} }}`;
          const otp=expr("steps.email-otp.outputs.enabled == 'true'");
          const token=expr('secrets.SUPABASE_ACCESS_TOKEN');
          const prodRef=expr('env.PROD_SUPABASE_REF');
          const rollbackIf=expr("failure() && steps.email-otp.outputs.enabled == 'true' && env.HOSTED_AUTH_EMAIL_MUTATION_ATTEMPTED == 'true'");
          const replaceOnce=(from,to,label)=>{
            const first=s.indexOf(from);
            if(first<0)throw new Error(`PATCH_TARGET_MISSING:${label}`);
            if(s.indexOf(from,first+1)>=0)throw new Error(`PATCH_TARGET_NOT_UNIQUE:${label}`);
            s=s.replace(from,to);
          };
          const oldSync=[
            '      - name: Sync and verify IBERFIT Hosted Auth emails before cutover',
            `        if: ${otp}`,
            '        env:',
            `          SUPABASE_ACCESS_TOKEN: ${token}`,
            `          SUPABASE_PROJECT_REF: ${prodRef}`,
            "          IBERFIT_AUTH_EMAIL_CONFIRMATION: 'SYNC_IBERFIT_AUTH_EMAILS_PROD'",
            '        run: node scripts/auth/sync-hosted-auth-emails.mjs --sync',
            '',
          ].join('\n');
          const atomicSync=[
            '      - name: Capture IBERFIT Hosted Auth email rollback snapshot',
            `        if: ${otp}`,
            '        env:',
            `          SUPABASE_ACCESS_TOKEN: ${token}`,
            `          SUPABASE_PROJECT_REF: ${prodRef}`,
            '          IBERFIT_AUTH_EMAIL_STATE_PATH: /tmp/iberfit-hosted-auth-email-before.json',
            '        run: node scripts/auth/sync-hosted-auth-emails.mjs --capture',
            '',
            '      - name: Sync and verify IBERFIT Hosted Auth emails before cutover',
            `        if: ${otp}`,
            '        env:',
            `          SUPABASE_ACCESS_TOKEN: ${token}`,
            `          SUPABASE_PROJECT_REF: ${prodRef}`,
            "          IBERFIT_AUTH_EMAIL_CONFIRMATION: 'SYNC_IBERFIT_AUTH_EMAILS_PROD'",
            '        shell: bash',
            '        run: |',
            '          set -euo pipefail',
            '          echo \'HOSTED_AUTH_EMAIL_MUTATION_ATTEMPTED=true\' >> "$GITHUB_ENV"',
            '          node scripts/auth/sync-hosted-auth-emails.mjs --sync',
            '',
          ].join('\n');
          replaceOnce(oldSync,atomicSync,'email-sync');
          const upload='      - name: Upload production promotion evidence\n';
          const rollback=[
            '      - name: Roll back Hosted Auth emails automatically if promotion fails',
            `        if: ${rollbackIf}`,
            '        env:',
            `          SUPABASE_ACCESS_TOKEN: ${token}`,
            `          SUPABASE_PROJECT_REF: ${prodRef}`,
            "          IBERFIT_AUTH_EMAIL_ROLLBACK_CONFIRMATION: 'RESTORE_IBERFIT_AUTH_EMAILS_PROD'",
            '          IBERFIT_AUTH_EMAIL_STATE_PATH: /tmp/iberfit-hosted-auth-email-before.json',
            '          IBERFIT_AUTH_EMAIL_ROLLBACK_EVIDENCE_PATH: recovery/hosted-auth-emails/prod-rollback.json',
            '        run: node scripts/auth/sync-hosted-auth-emails.mjs --restore',
            '',
            '      - name: Upload production promotion evidence',
            '',
          ].join('\n');
          replaceOnce(upload,rollback,'rollback-step');
          replaceOnce(
            '            recovery/hosted-auth-security/\n            recovery/production-entry/\n',
            '            recovery/hosted-auth-security/\n            recovery/hosted-auth-emails/\n            recovery/production-entry/\n',
            'rollback-evidence',
          );
          fs.writeFileSync(p,s,'utf8');
          NODE
          node --test tests/m26_rc74_13_hosted_auth_email_sync.test.mjs
          node scripts/auth/sync-hosted-auth-emails.mjs
          git diff --check
      - name: Commit exact branch patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iberfit-ci'
          git config user.email 'iberfit.cl@gmail.com'
          git rm .github/workflows/branch-email-release-atomicity-patch.yml
          git add .github/workflows/production-promote.yml
          git diff --cached --check
          git commit -m 'fix(email): make production release rollback atomic'
          git push origin HEAD:fix/email-release-atomicity

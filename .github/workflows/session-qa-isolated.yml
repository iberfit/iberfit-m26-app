name: IBERFIT Session QA isolated

on:
  pull_request:
    # PRs leaving DRAFT must re-run qa-readonly at the same exact SHA.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/workflows/session-*.js'
      # RC39 session preview and execution policy must run specialized QA.
      - 'src/m26/rc39/route-render.js'
      - 'src/m26/rc39/session-policy.js'
      - 'tests/canary_session_preview_role_experience.test.mjs'
      - 'src/m26/command-bus.js'
      - 'src/m26/ui/i18n-surface-session.js'
      - 'src/m26/design/role-surfaces.css'
      - 'src/m26/design/premium-ux.css'
      - 'qa/live-workout/**'
      - 'playwright.live-workout.config.mjs'
      - 'tests/m26_session*.test.mjs'
      - 'tests/m26_live_workout*.test.mjs'
      - 'tests/m26_*draft_recovery.test.mjs'
      - 'scripts/run_node_tests_offline.mjs'
      - 'scripts/offline_network_guard.mjs'
      - 'scripts/remote-gates/run_authenticated_readonly_gate.mjs'
      - 'package.json'
      - '.github/workflows/session-qa-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-current-head:
    name: P0 Supabase Free - reject superseded PR before QA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify head of live PR without calling Supabase
        id: verify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PR_IS_DRAFT" == true ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'P0_QA_PR_NUMBER_INVALID' >&2; exit 41; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'P0_QA_PR_SHA_INVALID' >&2; exit 42; }
          # Fail-closed on API failures rather than running stale QA.
          response="$(curl --fail --silent --show-error --max-time 8 --retry 1 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_sha="$(jq -er '.head.sha' <<< "$response")"
          live_state="$(jq -er '.state' <<< "$response")"
          live_draft="$(jq -r '.draft | tostring' <<< "$response")"
          if [[ "$live_sha" == "$PR_SHA" && "$live_state" == open && "$live_draft" == false ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "P0_QA_SUPERSEDED_PR_SKIP: no QA credentials or HTTP to Supabase"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  offline:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression without network or secrets
        shell: bash
        run: |
          set -o pipefail
          mkdir -p recovery
          npm run test:offline 2>&1 | tee recovery/session-offline-regression.log
      - name: Preserve offline regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-offline-log-${{ github.run_id }}
          path: recovery/session-offline-regression.log
          if-no-files-found: error
  browser-live-workout:
    needs: offline
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      # Chromium, WebKit and OS libraries are preinstalled in this version-matched image.
      # Avoid mutable apt mirrors in per-PR QA while keeping both browsers in the E2E matrix.
      - name: Verify preinstalled Live Workout browsers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {chromium,webkit} from '@playwright/test';
          import fs from 'node:fs';
          for(const [name,browser] of [['chromium',chromium],['webkit',webkit]]){
            const executable=browser.executablePath();
            if(!executable||!fs.existsSync(executable))throw new Error('LIVE_WORKOUT_BROWSER_MISSING:'+name);
            console.log(name+':'+executable);
          }
          NODE
      - name: Run Live Workout browser E2E matrix
        run: npx playwright test --config=playwright.live-workout.config.mjs
      - name: Preserve SIGNATURE published-session screenshots (synthetic QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-published-sessions-${{ github.run_id }}
          path: recovery/signature-published-sessions/
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve Live Workout browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-workout-browser-failures-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 7

  qa-readonly:
    needs: [offline, pr-current-head]
    if: ${{ needs.pr-current-head.outputs.current == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    # Shared QA Coach/Client identities are exercised by Device Experience and
    # Canary deploy gates. Do not overlap their authenticated certification.
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing authenticated gate restricted to QA
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_authenticated_readonly_gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-qa-readonly-${{ github.run_id }}
          path: recovery/RC74_4_REMOTE_AUTH_EVIDENCE.json
          if-no-files-found: warn

name: Inspect WEB IBERFIT domain status

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/inspect-web-iberfit-domain-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
      CF_PROJECT: 'web-iberfit'
      DOMAIN: 'web.iberfit.cl'
    steps:
      - uses: actions/checkout@v4
      - name: Estado exacto del dominio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains/${DOMAIN}" \
            -o /tmp/domain.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/domain.json','utf8'));
          console.log(JSON.stringify({success:x.success,result:x.result,errors:x.errors,messages:x.messages},null,2));
          NODE
          echo 'DNS:'
          dig +short CNAME "$DOMAIN" || true
          dig +short A "$DOMAIN" || true

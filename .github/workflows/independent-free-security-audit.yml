name: IBERFIT Independent Free Security & Accessibility Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - '.github/workflows/independent-free-security-audit.yml'
      - 'qa/rc64/independent-accessibility.spec.mjs'
      - 'playwright.independent-accessibility.config.mjs'
  push:
    branches: [canary/rc74-4]
    paths:
      - '.github/workflows/independent-free-security-audit.yml'
      - 'qa/rc64/independent-accessibility.spec.mjs'
      - 'playwright.independent-accessibility.config.mjs'

permissions:
  contents: read

jobs:
  semgrep-community:
    name: Semgrep CE - advisory static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep Community
        run: python -m pip install --disable-pip-version-check --only-binary=:all: semgrep==1.184.0
      - name: Scan source (not live PROD)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/independent-security
          semgrep scan \
            --config p/security-audit \
            --config p/javascript \
            --config p/python \
            --exclude '**/node_modules/**' \
            --exclude '**/dist/**' \
            --exclude '**/legacy/**' \
            --exclude '**/*.min.js' \
            --json --output recovery/independent-security/semgrep-raw-local.json \
            src public/m26 supabase/functions backend cloudflare scripts native
          jq '{tool:"semgrep-ce", commit: env.GITHUB_SHA,
            findings: [.results[]? | {rule:.check_id, file:.path, line:.start.line, severity:.extra.severity}],
            errors: [.errors[]? | {type:.type, level:.level}]}' \
            recovery/independent-security/semgrep-raw-local.json \
            > recovery/independent-security/semgrep-summary.json
          rm -f recovery/independent-security/semgrep-raw-local.json
      - name: Upload minimal location-only summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-semgrep-ce
          path: recovery/independent-security/semgrep-summary.json
          if-no-files-found: warn
          retention-days: 14

  playwright-axe:
    name: axe-core - isolated preauth responsive audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build QA-only, disabled-runtime local surface
        run: node qa/rc64/build-current-surface.mjs
      - name: Run automated accessibility audit on local browser
        run: ./node_modules/.bin/playwright test --config playwright.independent-accessibility.config.mjs
      - name: Upload anonymous accessibility rule summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-axe-local
          path: recovery/independent-security/axe-*.json
          if-no-files-found: warn
          retention-days: 14

  zap-local-baseline:
    name: ZAP passive baseline - isolated local static surface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated QA-only static surface
        run: node qa/rc64/build-current-surface.mjs
      - name: Start HTTP server on loopback and verify fail-closed shell
        shell: bash
        run: |
          set -euo pipefail
          node qa/rc64/real-shell-server.mjs 4184 127.0.0.1 > /tmp/iberfit-zap-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4184/ -o /tmp/iberfit-zap-index.html; then break; fi
            sleep 1
          done
          test -s /tmp/iberfit-zap-index.html
          grep -q 'IBERFIT' /tmp/iberfit-zap-index.html
      - name: Run passive-only ZAP baseline against localhost (no PROD, no active scan)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/independent-security
          # ZAP's uid 1000 can write temporary reports; only the runner group can access them.
          # No world-writable directory and no privileged container execution.
          sudo chown 1000:"$(id -g)" recovery/independent-security
          chmod 0770 recovery/independent-security
          docker run --rm --network host --user "1000:$(id -g)" \
            -v "${PWD}/recovery/independent-security:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:4184/ -m 1 -I -J zap-local.json -r zap-local.html
          jq '{tool:"zap-baseline-local", site_count: (.site|length),
            alert_count: ([.site[]?.alerts[]?]|length),
            alerts: [.site[]?.alerts[]? | {pluginid, riskcode, confidence, count}]}' \
            recovery/independent-security/zap-local.json \
            > recovery/independent-security/zap-summary.json
          rm -f recovery/independent-security/zap-local.json recovery/independent-security/zap-local.html
      - name: Upload passive-scan summary (no request bodies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-zap-local
          path: recovery/independent-security/zap-summary.json
          if-no-files-found: warn
          retention-days: 14

name: IBERFIT C Connected360 Isolated PostgreSQL 17
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261111131000_connected360_v47_last_seven_owner_history.sql'
      - 'supabase/rollbacks/20261111131000_connected360_v47_last_seven_owner_history.rollback.sql'
      - 'scripts/data-safety/m26_c_v47_isolated_pg17.sh'
      - 'supabase/release-procedures/connected360_v*.sql'
      - 'supabase/migrations/*connected360*.sql'
      - 'qa/sql/connected360-release-chain/**'
      - 'scripts/data-safety/connected360_v48_v58_isolated_pg17.sh'
      - 'supabase/release-procedures/gx_connected360_report_observations_v1*.sql'
      - 'supabase/release-procedures/gx_connected360_document_*.sql'
      - 'qa/sql/connected360-document/**'
      - 'scripts/data-safety/gx_document_consent_isolated_pg17.sh'
      - 'scripts/data-safety/run_disposable_pg17_ci.sh'
      - '.github/workflows/m26-c-connected360-isolated-pg17.yml'
  push:
    branches: ['canary/rc74-4']
    paths:
      - 'supabase/migrations/20261111131000_connected360_v47_last_seven_owner_history.sql'
      - 'supabase/rollbacks/20261111131000_connected360_v47_last_seven_owner_history.rollback.sql'
      - 'scripts/data-safety/m26_c_v47_isolated_pg17.sh'
      - 'supabase/release-procedures/connected360_v*.sql'
      - 'supabase/migrations/*connected360*.sql'
      - 'qa/sql/connected360-release-chain/**'
      - 'scripts/data-safety/connected360_v48_v58_isolated_pg17.sh'
      - 'supabase/release-procedures/gx_connected360_report_observations_v1*.sql'
      - 'supabase/release-procedures/gx_connected360_document_*.sql'
      - 'qa/sql/connected360-document/**'
      - 'scripts/data-safety/gx_document_consent_isolated_pg17.sh'
      - 'scripts/data-safety/run_disposable_pg17_ci.sh'
      - '.github/workflows/m26-c-connected360-isolated-pg17.yml'
permissions:
  contents: read
concurrency:
  group: m26-c-v47-pg17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-pg17-roles-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact V47 SQL, roles, owner scope and rollback against synthetic PG17
        shell: bash
        run: bash scripts/data-safety/run_disposable_pg17_ci.sh scripts/data-safety/m26_c_v47_isolated_pg17.sh
  isolated-pg17-document-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install exact candidate SQL and exercise document consent and concurrent withdrawal
        shell: bash
        run: bash scripts/data-safety/run_disposable_pg17_ci.sh scripts/data-safety/gx_document_consent_isolated_pg17.sh
  isolated-pg17-provider-release-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install historical V46/V47 and exact V48–V58 release chain
        shell: bash
        run: bash scripts/data-safety/run_disposable_pg17_ci.sh scripts/data-safety/connected360_v48_v58_isolated_pg17.sh

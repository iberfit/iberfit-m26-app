name: IBERFIT M44 WIP Report Quality

on:
  push:
    branches:
      - feat/m44-integral-progress-reporting-ultramegabloque
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/workflows/**'
      - 'src/m26/engagement/**'
      - 'src/m26/publication/client-content.js'
      - 'src/m26/app/workflow-controller.js'
      - 'src/m26/modules/route-render.js'
      - 'supabase/migrations/*m44*'
      - 'tests/m44*'
      - 'tests/m43_report_draft_safety.test.mjs'
      - 'tests/m26_premium_automatic_reports.test.mjs'
      - 'qa/m44/**'
      - 'public/m26/evolution-report.css'
      - 'playwright.m44-report.config.mjs'
      - '.github/workflows/m44-wip-report-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-m44-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-contract:
    name: M44 and M43 canonical reporting contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Execute M44 and M43 contracts
        run: npm run test:m44:contract

  report-a4-chromium:
    name: M44 premium A4 Chromium desktop tablet mobile
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Certify PDF and layout at three viewport sizes
        run: npm run quality:m44:report:a4
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m44-report-a4-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  pdf-broker-deno:
    name: M44 trusted Edge issuer and real pdf-lib PDF bytes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile exact Edge issuer and its PDF renderer
        run: deno check --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json supabase/functions/iberfit-evolution-report-emission-v1/index.ts
      - name: Generate and re-open a long report PDF from synthetic data
        run: deno run --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json --allow-net --allow-read qa/m44/pdf-issuer-smoke.mjs

  prepublication-app-build:
    name: M44 real Canary packager, relative budgets and module integrity
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Canary comparison base
        uses: actions/checkout@v4
        with:
          ref: canary/rc74-4
          path: .tmp/m44-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check changed browser runtime code
        run: |
          node --check src/m26/app/application.js
          node --check src/m26/app/workflow-controller.js
          node --check src/m26/modules/route-render.js
          node --check src/m26/workflows/report-workflow.js
          node --check src/m26/workflows/evolution-report-document.js
          node --check src/m26/workflows/evolution-report-governance.js
      - name: Package real Canary baseline with current deployment packager
        working-directory: .tmp/m44-base
        run: node qa/rc64/build-current-surface.mjs
      - name: Package full WIP application with same deployment packager
        run: node qa/rc64/build-current-surface.mjs
      - name: Compare payloads against deployed branch and enforce growth ceilings
        run: node qa/m44/compare-real-package-budget.mjs .tmp/m44-base/.tmp/rc64-current-surface .tmp/rc64-current-surface
      - name: Confirm M44 official fonts and PDF modules are actually packaged
        run: |
          test -s .tmp/rc64-current-surface/src/m26/workflows/evolution-report-governance.js
          test -s .tmp/rc64-current-surface/src/m26/workflows/evolution-report-document.js
          test -s .tmp/rc64-current-surface/m26/evolution-report.css
          test -s .tmp/rc64-current-surface/m26/fonts/inter-latin-wght-normal.woff2
          test -s .tmp/rc64-current-surface/m26/fonts/source-serif-4-latin-wght-normal.woff2

  qa-edge-anonymous-denial:
    name: QA live Edge anonymous HTTP and CORS negative gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deny all anonymous issued-document access through real QA HTTP
        run: node qa/m44/qa-edge-anonymous-denial.mjs

name: IBERFIT M44 WIP Report Quality

on:
  push:
    branches:
      - feat/m44-integral-progress-reporting-ultramegabloque
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/workflows/**'
      - 'src/m26/engagement/**'
      - 'src/m26/publication/client-content.js'
      - 'src/m26/app/workflow-controller.js'
      - 'src/m26/modules/route-render.js'
      - 'supabase/migrations/*m44*'
      - 'tests/m44*'
      - 'tests/m43_report_draft_safety.test.mjs'
      - 'tests/m26_premium_automatic_reports.test.mjs'
      - 'qa/m44/**'
      - 'public/m26/evolution-report.css'
      - 'playwright.m44-report.config.mjs'
      - '.github/workflows/m44-wip-report-quality.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: iberfit-m44-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-current-head:
    name: P0 Supabase Free - reject superseded PR before QA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify head of live PR without calling Supabase
        id: verify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PR_IS_DRAFT" == true ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'P0_QA_PR_NUMBER_INVALID' >&2; exit 41; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'P0_QA_PR_SHA_INVALID' >&2; exit 42; }
          # Fail-closed on API failures rather than running stale QA.
          response="$(curl --fail --silent --show-error --max-time 8 --retry 1 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_sha="$(jq -er '.head.sha' <<< "$response")"
          live_state="$(jq -er '.state' <<< "$response")"
          live_draft="$(jq -r '.draft | tostring' <<< "$response")"
          if [[ "$live_sha" == "$PR_SHA" && "$live_state" == open && "$live_draft" == false ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "P0_QA_SUPERSEDED_PR_SKIP: no QA credentials or HTTP to Supabase"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  reports-contract:
    name: M44 and M43 canonical reporting contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Execute M44 and M43 contracts
        run: npm run test:m44:contract

  report-a4-chromium:
    name: M44 premium A4 Chromium desktop tablet mobile
    # Preserve real Chromium checks; avoid ubuntu-latest transitional DNS failures.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium
        run: |
          npm ci
          ./node_modules/.bin/playwright install chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({headless:true}); await browser.close();"
      - name: Certify PDF and layout at three viewport sizes
        run: npm run quality:m44:report:a4
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m44-report-a4-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  pdf-broker-deno:
    name: M44 trusted Edge issuer and real pdf-lib PDF bytes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile exact Edge issuer and its PDF renderer
        run: deno check --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json supabase/functions/iberfit-evolution-report-emission-v1/index.ts
      - name: Generate and re-open a long report PDF from synthetic data
        run: deno run --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json --allow-net --allow-read qa/m44/pdf-issuer-smoke.mjs

  prepublication-app-build:
    name: M44 real Canary packager, relative budgets and module integrity
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Canary comparison base
        uses: actions/checkout@v4
        with:
          ref: canary/rc74-4
          path: .tmp/m44-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check changed browser runtime code
        run: |
          node --check src/m26/app/application.js
          node --check src/m26/app/workflow-controller.js
          node --check src/m26/modules/route-render.js
          node --check src/m26/workflows/report-workflow.js
          node --check src/m26/workflows/evolution-report-document.js
          node --check src/m26/workflows/evolution-report-governance.js
      - name: Package real Canary baseline with current deployment packager
        working-directory: .tmp/m44-base
        run: node qa/rc64/build-current-surface.mjs
      - name: Package full WIP application with same deployment packager
        run: node qa/rc64/build-current-surface.mjs
      - name: Compare payloads against deployed branch and enforce growth ceilings
        run: node qa/m44/compare-real-package-budget.mjs .tmp/m44-base/.tmp/rc64-current-surface .tmp/rc64-current-surface
      - name: Confirm M44 official fonts and PDF modules are actually packaged
        run: |
          test -s .tmp/rc64-current-surface/src/m26/workflows/evolution-report-governance.js
          test -s .tmp/rc64-current-surface/src/m26/workflows/evolution-report-document.js
          test -s .tmp/rc64-current-surface/m26/evolution-report.css
          test -s .tmp/rc64-current-surface/m26/fonts/inter-latin-wght-normal.woff2
          test -s .tmp/rc64-current-surface/m26/fonts/source-serif-4-latin-wght-normal.woff2

  qa-edge-anonymous-denial:
    needs: pr-current-head
    if: ${{ needs.pr-current-head.outputs.current == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: QA live Edge anonymous HTTP and CORS negative gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deny all anonymous issued-document access through real QA HTTP
        run: node qa/m44/qa-edge-anonymous-denial.mjs

  qa-authenticated-assurance-denial:
    needs: pr-current-head
    if: ${{ needs.pr-current-head.outputs.current == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: QA real password-only Coach and two Clients denied M44 privileges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate QA test actors and verify MFA fail-closed over hosted HTTP
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node qa/m44/qa-authenticated-assurance-denial.mjs

name: Temp session previous RIR zero

on:
  push:
    branches:
      - fix/session-previous-rir-zero
    paths:
      - scripts/patch-session-previous-rir-zero.mjs
      - .github/workflows/temp-session-previous-rir-zero.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: node scripts/patch-session-previous-rir-zero.mjs
      - name: Focused regression
        run: node --test tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_current_exercise_history.test.mjs
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js tests/m26_session_previous_set_reuse.test.mjs
          git diff --cached --check
          git commit -m "fix(session): preserve previous set RIR zero"
          git push origin HEAD:fix/session-previous-rir-zero

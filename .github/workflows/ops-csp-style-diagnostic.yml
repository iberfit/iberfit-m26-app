name: IBERFIT CSP Runtime Style Diagnostic (temporary)

on:
  push:
    branches:
      - ops/canary-live-observe-20260920
    paths:
      - '.github/workflows/ops-csp-style-diagnostic.yml'

permissions:
  contents: write

env:
  EXPECTED_SHA: 'da0e5535a16c73b35c430f9869833b1f6b8af42f'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ops branch with history
        uses: actions/checkout@v4
        with:
          ref: ops/canary-live-observe-20260920
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact runtime style sources and context
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null || git fetch origin "$EXPECTED_SHA"
          rm -rf /tmp/iberfit-csp-exact
          git worktree add --detach /tmp/iberfit-csp-exact "$EXPECTED_SHA"
          cd /tmp/iberfit-csp-exact
          OUT="$GITHUB_WORKSPACE/CSP_RUNTIME_STYLE_CONTEXT.txt"
          : > "$OUT"
          {
            echo "EXPECTED_SHA=$EXPECTED_SHA"
            echo "ACTUAL_SHA=$(git rev-parse HEAD)"
            echo '=== tracked matching paths ==='
            git ls-files | grep -E '(^|/)(app\.js|report-workflow\.js|route-render\.js|readiness-ui\.js|client-list-shell\.js|client-profile-body\.js|route-component\.js|clients-client-shell\.js)$' || true
            echo '=== dynamic style element context ==='
            git grep -n -C 25 -E "createElement\(['\"]style['\"]\)|\.style\.textContent|style\.textContent" -- 'src/m26/**/*.js' 'src/m26/*.js' 'public/m26/**/*.js' 'public/m26/*.js' || true
            echo '=== style property/write context ==='
            git grep -n -C 12 -E "setAttribute\(['\"]style['\"]|\.style\.[A-Za-z_-]+[[:space:]]*=" -- 'src/m26/**/*.js' 'src/m26/*.js' 'public/m26/**/*.js' 'public/m26/*.js' || true
            echo '=== inline style attribute context ==='
            git grep -n -C 12 -E "style=[\"']" -- 'src/m26/**/*.js' 'src/m26/*.js' 'src/m26/**/*.html' 'public/m26/**/*.js' 'public/m26/*.js' 'public/m26/**/*.html' || true
            echo '=== stylesheet references ==='
            git grep -n -E "rel=[\"']stylesheet|\.css[\"']" -- '*.html' 'src/**/*.js' 'public/**/*.js' || true
          } > "$OUT"
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/iberfit-csp-exact --force

      - name: Commit context evidence to ops branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iberfit'
          git config user.email 'iberfit.cl@gmail.com'
          git add CSP_RUNTIME_STYLE_CONTEXT.txt
          if git diff --cached --quiet; then
            echo 'CONTEXT_UNCHANGED'
            exit 0
          fi
          git commit -m 'chore(ops): persist CSP runtime style context'
          git push origin HEAD:ops/canary-live-observe-20260920
name: IBERFIT CSP Runtime Style Diagnostic (temporary)

on:
  push:
    branches:
      - ops/canary-live-observe-20260920
    paths:
      - '.github/workflows/ops-csp-style-diagnostic.yml'

permissions:
  contents: write

env:
  EXPECTED_SHA: 'da0e5535a16c73b35c430f9869833b1f6b8af42f'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ops branch with history
        uses: actions/checkout@v4
        with:
          ref: ops/canary-live-observe-20260920
          fetch-depth: 0
          persist-credentials: true

      - name: Enumerate exact runtime style sources
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null || git fetch origin "$EXPECTED_SHA"
          rm -rf /tmp/iberfit-csp-exact
          git worktree add --detach /tmp/iberfit-csp-exact "$EXPECTED_SHA"
          OUT="$GITHUB_WORKSPACE/CSP_RUNTIME_STYLE_DIAGNOSTIC.txt"
          : > "$OUT"
          {
            echo "EXPECTED_SHA=$EXPECTED_SHA"
            echo '=== dynamic style elements ==='
            grep -RInE "createElement\(['\"]style['\"]\)|\.style\.textContent|style\.textContent" /tmp/iberfit-csp-exact/src/m26 /tmp/iberfit-csp-exact/public/m26 --include='*.js' --include='*.mjs' || true
            echo '=== setAttribute style and property writes ==='
            grep -RInE "setAttribute\(['\"]style['\"]|\.style\.[A-Za-z_-]+[[:space:]]*=" /tmp/iberfit-csp-exact/src/m26 /tmp/iberfit-csp-exact/public/m26 --include='*.js' --include='*.mjs' || true
            echo '=== inline style HTML attributes ==='
            grep -RInE "style=[\"']" /tmp/iberfit-csp-exact/src/m26 /tmp/iberfit-csp-exact/public/m26 --include='*.html' --include='*.js' --include='*.mjs' || true
            echo '=== target style helper functions ==='
            grep -RInE "ensure[A-Za-z0-9_]*Style|createElement\(['\"]style['\"]\)" /tmp/iberfit-csp-exact/src/m26 /tmp/iberfit-csp-exact/public/m26 --include='*.js' --include='*.mjs' || true
          } | sed 's#/tmp/iberfit-csp-exact/##g' | tee "$OUT"
          git worktree remove /tmp/iberfit-csp-exact --force

      - name: Commit diagnostic evidence to ops branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iberfit'
          git config user.email 'iberfit.cl@gmail.com'
          git add CSP_RUNTIME_STYLE_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            echo 'DIAGNOSTIC_UNCHANGED'
            exit 0
          fi
          git commit -m 'chore(ops): persist CSP runtime style diagnostic'
          git push origin HEAD:ops/canary-live-observe-20260920

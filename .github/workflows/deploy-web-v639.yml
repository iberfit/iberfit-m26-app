name: Deploy WEB IBERFIT V6.39

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/deploy-web-v639.yml'

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: '0120a67e8002ecf9f8cdae3295a194b9d1cf6241'
  WEB_VERSION: '6.39'
  QA_RUN_ID: '35454883035'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar proyecto, dominio y rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));if(!p.success||!p.result)throw Error('PROJECT_LOOKUP_FAILED');const domains=p.result.domains||[];if(p.result.name!==process.env.CF_PROJECT)throw Error('WRONG_PROJECT');if(!domains.includes('iberfit.cl'))throw Error('IBERFIT_DOMAIN_MISSING');if(domains.includes('app.iberfit.cl'))throw Error('APP_DOMAIN_COLLISION');const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));const current=(d.result||[]).filter(x=>x.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];if(!current?.id)throw Error('NO_ROLLBACK_POINT');fs.appendFileSync(process.env.GITHUB_ENV,'ROLLBACK_DEPLOYMENT_ID='+current.id+'\n');console.log(JSON.stringify({project:p.result.name,domains,rollbackDeploymentId:current.id},null,2));
          NODE

      - name: Verificar QA exacta V6.39
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa-v639.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/qa-v639.json','utf8'));if(x.head_sha!==process.env.WEB_SHA)throw Error('QA_SHA_MISMATCH:'+x.head_sha);if(x.status!=='completed'||x.conclusion!=='success')throw Error('QA_NOT_SUCCESS');if(x.name!=='QA WEB IBERFIT V6.39 final')throw Error('UNEXPECTED_QA:'+x.name);console.log(JSON.stringify({run:x.id,sha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE

      - name: Descargar candidata certificada exacta
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$base/VERSION")" = "$WEB_VERSION"
          test "$(find "$base" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test -s "$base/assets/aeo.v639.css"
          test "$(grep -R -l 'data-aeo-answer' "$base" --include='*.html' | wc -l | tr -d ' ')" = '28'
          grep -q '^User-agent: OAI-SearchBot$' "$base/robots.txt"
          grep -q '"@type":"Organization"' "$base/index.html"
          grep -q 'IBERFIT, explicado de forma directa.' "$base/index.html"
          grep -q '¿El IRI es lo mismo que el seguimiento?' "$base/diagnostico-iri/index.html"
          grep -q 'Does IBERFIT offer personal training in Las Condes?' "$base/en/personal-trainer-las-condes/index.html"
          ! grep -R -n '"LocalBusiness"' "$base" --include='*.html'
          ! grep -R -ni --exclude='CHANGELOG.md' --exclude-dir='.git' 'Carlos' "$base"

      - name: Desplegar preview certificada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v639-review-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "${CF_PROJECT}" --branch "${PREVIEW_BRANCH}" --commit-hash "${WEB_SHA}" --commit-message 'WEB IBERFIT V6.39 certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "$PREVIEW_URL" || { echo PREVIEW_URL_NOT_FOUND; exit 42; }
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Smoke preview AEO
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PREVIEW_URL/VERSION?cb=$GITHUB_RUN_ID" -o /tmp/v639-version.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors -A 'OAI-SearchBot' "$PREVIEW_URL/?cb=$GITHUB_RUN_ID" -o /tmp/v639-home.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PREVIEW_URL/diagnostico-iri/?cb=$GITHUB_RUN_ID" -o /tmp/v639-iri.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PREVIEW_URL/robots.txt?cb=$GITHUB_RUN_ID" -o /tmp/v639-robots.out
          test "$(tr -d '\r\n ' < /tmp/v639-version.out)" = "$WEB_VERSION"
          grep -q 'IBERFIT, explicado de forma directa.' /tmp/v639-home.out
          grep -q '"@type":"Organization"' /tmp/v639-home.out
          grep -q '¿El IRI es lo mismo que el seguimiento?' /tmp/v639-iri.out
          grep -q '^User-agent: OAI-SearchBot$' /tmp/v639-robots.out

      - name: Desplegar producción V6.39
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "${CF_PROJECT}" --branch production --commit-hash "${WEB_SHA}" --commit-message 'WEB IBERFIT V6.39 production' | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL" || { echo PRODUCTION_URL_NOT_FOUND; exit 43; }
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Verificar Pages y dominio real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors -A 'OAI-SearchBot' "$PRODUCTION_URL/?cb=$GITHUB_RUN_ID" -o /tmp/v639-pages-home.out
          grep -q 'IBERFIT, explicado de forma directa.' /tmp/v639-pages-home.out
          grep -q '"@type":"Organization"' /tmp/v639-pages-home.out
          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?cb=${suffix}" -o /tmp/live-version || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -A 'OAI-SearchBot' "https://iberfit.cl/?cb=${suffix}" -o /tmp/live-home || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/diagnostico-iri/?cb=${suffix}" -o /tmp/live-iri || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/robots.txt?cb=${suffix}" -o /tmp/live-robots || true
            version="$(tr -d '\r\n ' < /tmp/live-version 2>/dev/null || true)"
            home=0; iri=0; robots=0; org=0
            grep -q 'IBERFIT, explicado de forma directa.' /tmp/live-home 2>/dev/null && home=1 || true
            grep -q '"@type":"Organization"' /tmp/live-home 2>/dev/null && org=1 || true
            grep -q '¿El IRI es lo mismo que el seguimiento?' /tmp/live-iri 2>/dev/null && iri=1 || true
            grep -q '^User-agent: OAI-SearchBot$' /tmp/live-robots 2>/dev/null && robots=1 || true
            echo "Propagation ${attempt}: version=${version:-missing} home=$home org=$org iri=$iri robots=$robots"
            if [ "$version" = "$WEB_VERSION" ] && [ "$home" = 1 ] && [ "$org" = 1 ] && [ "$iri" = 1 ] && [ "$robots" = 1 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1 || { echo IBERFIT_CL_V639_NOT_CONSISTENT; exit 44; }
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));const d=(x.result||[]).find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);if(!d)throw Error('CERTIFIED_SHA_NOT_DEPLOYED');if(d.latest_stage?.status&&d.latest_stage.status!=='success')throw Error('DEPLOYMENT_NOT_SUCCESS');const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};fs.writeFileSync('/tmp/V639_PRODUCTION_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');console.log(JSON.stringify(e,null,2));
          NODE

      - name: Guardar evidencia de producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v639-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v639.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V639_PRODUCTION_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30

name: Deploy WEB IBERFIT V6.43.3 certified

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/deploy-web-iberfit-v6433.yml'

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: '9d47955038d16a09e1e5ad9fcd7697580da30036'
  WEB_VERSION: '6.43.3'
  QA_RUN_ID: '35472740404'
  QA_RUN_NAME: 'QA WEB IBERFIT V6.43.3 mobile evidence fix'
  EXPECTED_ROLLBACK_SHA: 'eb9c42b69088230c0c395f1b39bd0677012355c5'
  EXPECTED_ROLLBACK_DEPLOYMENT_ID: 'ca240ad2-f189-4a15-adda-7c660c5c8f8d'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure only
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact V6.43.2 production baseline and capture rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||p.result?.name!==process.env.CF_PROJECT) throw new Error('PROJECT_LOOKUP');
          if(p.result.production_branch!=='production') throw new Error('PRODUCTION_BRANCH:'+p.result.production_branch);
          const domains=p.result.domains||[];
          if(!domains.includes('iberfit.cl')) throw new Error('IBERFIT_DOMAIN_MISSING');
          if(domains.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const current=(d.result||[]).filter(v=>v.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!current?.id) throw new Error('NO_CURRENT_PRODUCTION');
          if(current.id!==process.env.EXPECTED_ROLLBACK_DEPLOYMENT_ID) throw new Error('PRODUCTION_DRIFT_ID:'+current.id);
          const sha=current.deployment_trigger?.metadata?.commit_hash||'';
          if(sha!==process.env.EXPECTED_ROLLBACK_SHA) throw new Error('PRODUCTION_DRIFT_SHA:'+sha);
          fs.appendFileSync(process.env.GITHUB_ENV,`ROLLBACK_DEPLOYMENT_ID=${current.id}\nPRODUCTION_TOUCHED=0\n`);
          console.log(JSON.stringify({project:p.result.name,domains,currentDeploymentId:current.id,currentSha:sha},null,2));
          NODE
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=6433' | tr -d '\r\n ')" = '6.43.2'
          curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/online/?preflight=6433' -o /tmp/live-before-online.html
          grep -q '/assets/visual.v6432.css' /tmp/live-before-online.html
          grep -q '/assets/app-online-plan.webp' /tmp/live-before-online.html
          ! grep -q '/assets/polish.v6433.css' /tmp/live-before-online.html

      - name: Verify certified QA identity and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa-v6433.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/qa-v6433.json','utf8'));
          if(x.head_sha!==process.env.WEB_SHA) throw new Error('QA_SOURCE_SHA:'+x.head_sha);
          if(x.status!=='completed'||x.conclusion!=='success') throw new Error('QA:'+x.status+':'+x.conclusion);
          if(x.name!==process.env.QA_RUN_NAME) throw new Error('QA_NAME:'+x.name);
          console.log(JSON.stringify({run:x.id,name:x.name,sourceSha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"

      - name: Revalidate exact V6.43.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "${base}/VERSION")" = "${WEB_VERSION}"
          test "$(find "${base}" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/polish.v6433.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/a11y.v6431.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/analytics.v643.js' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test -s "${base}/assets/polish.v6433.css"
          test -s "${base}/assets/app-online-plan-v6433.webp"
          grep -q '/assets/app-online-plan-v6433.webp' "${base}/online/index.html"
          grep -q '/assets/app-online-plan-v6433.webp' "${base}/en/online/index.html"
          grep -q 'pasión por el entrenamiento' "${base}/sobre-iberfit/index.html"
          grep -q 'inquietud constante por la salud' "${base}/sobre-iberfit/index.html"
          grep -q 'passion for training' "${base}/en/about/index.html"
          grep -q 'curiosity about health' "${base}/en/about/index.html"
          grep -q '@media(max-width:640px){.app-story-stage{align-items:start!important}' "${base}/assets/polish.v6433.css"
          grep -q '^/assets/polish.v6433.css$' "${base}/_headers"
          grep -q '^/assets/app-online-plan-v6433.webp$' "${base}/_headers"
          grep -q "script-src-attr 'none'" "${base}/_headers"
          ! grep -q "'unsafe-inline'" "${base}/_headers"
          ! grep -R -q '/assets/hardening.v630.js' "${base}" --include='*.html'
          ! grep -R -n -E 'Cliente QA|Cliente Prueba IBERFIT|Coach QA' "${base}" --include='*.html'

      - name: Deploy certified V6.43.3 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v6433-certified-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "${CF_PROJECT}" --branch "${PREVIEW_BRANCH}" --commit-hash "${WEB_SHA}" \
            --commit-message 'WEB IBERFIT V6.43.3 certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "${PREVIEW_URL}" || exit 42
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"

      - name: Validate preview across full surface
        shell: bash
        run: |
          set -euo pipefail
          cb="$GITHUB_RUN_ID"
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$cb" | tr -d '\r\n ')" = "$WEB_VERSION"
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$cb" -o /tmp/preview-online
          grep -q '/assets/polish.v6433.css' /tmp/preview-online
          grep -q '/assets/visual.v6432.css' /tmp/preview-online
          grep -q '/assets/app-online-plan-v6433.webp' /tmp/preview-online
          grep -q '/assets/analytics.v643.js' /tmp/preview-online
          grep -q '/assets/menu.v642.js' /tmp/preview-online
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/sobre-iberfit/?cb=$cb" -o /tmp/preview-about
          grep -q 'pasión por el entrenamiento' /tmp/preview-about
          grep -q '/assets/polish.v6433.css' /tmp/preview-about
          for asset in polish.v6433.css app-online-plan-v6433.webp; do
            curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/${asset}?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-asset
            grep -q '^cache-control:.*max-age=31536000' /tmp/preview-h-asset
            grep -q '^cache-control:.*immutable' /tmp/preview-h-asset
          done
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-page
          grep -q '^content-security-policy:' /tmp/preview-h-page
          grep -q "script-src-attr 'none'" /tmp/preview-h-page
          ! grep -q 'unsafe-inline' /tmp/preview-h-page
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          root=Path('/tmp/iberfitweb/candidate/v628')
          base=os.environ['PREVIEW_URL'].rstrip('/')
          htmls=sorted(root.rglob('*.html'))
          if len(htmls)!=33: raise SystemExit('EXPECTED_33_HTML')
          for p in htmls:
              rel=p.relative_to(root).as_posix()
              route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          print('PREVIEW_ROUTES_OK',len(htmls))
          PY

      - name: Deploy production V6.43.3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "$CF_PROJECT" --branch production --commit-hash "$WEB_SHA" \
            --commit-message 'WEB IBERFIT V6.43.3 certified production' | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL" || exit 43
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_TOUCHED=1" >> "$GITHUB_ENV"

      - name: Verify live production and deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl -sSLo /tmp/live-version "https://iberfit.cl/VERSION?cb=$suffix" || true
            curl -sSLo /tmp/live-online "https://iberfit.cl/online/?cb=$suffix" || true
            curl -sSLo /tmp/live-about "https://iberfit.cl/sobre-iberfit/?cb=$suffix" || true
            version="$(tr -d '\r\n ' < /tmp/live-version 2>/dev/null || true)"
            polish=0; plan=0; origin=0; analytics=0; menu=0
            grep -q '/assets/polish.v6433.css' /tmp/live-online 2>/dev/null && polish=1 || true
            grep -q '/assets/app-online-plan-v6433.webp' /tmp/live-online 2>/dev/null && plan=1 || true
            grep -q 'pasión por el entrenamiento' /tmp/live-about 2>/dev/null && origin=1 || true
            grep -q '/assets/analytics.v643.js' /tmp/live-online 2>/dev/null && analytics=1 || true
            grep -q '/assets/menu.v642.js' /tmp/live-online 2>/dev/null && menu=1 || true
            if [ "$version" = "$WEB_VERSION" ] && [ "$polish" = 1 ] && [ "$plan" = 1 ] && [ "$origin" = 1 ] && [ "$analytics" = 1 ] && [ "$menu" = 1 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          for route in / /diagnostico-iri/ /metodo/ /presencial/ /hibrido/ /online/ /sobre-iberfit/ /contacto/ /en/ /en/contact/; do
            curl -fsSL --retry 5 --retry-all-errors -o /dev/null "https://iberfit.cl${route}?verify=${GITHUB_RUN_ID}"
          done
          curl -fsSI --retry 6 --retry-all-errors "https://iberfit.cl/online/?verify=${GITHUB_RUN_ID}" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-page
          grep -q '^content-security-policy:' /tmp/live-h-page
          grep -q "script-src-attr 'none'" /tmp/live-h-page
          ! grep -q 'unsafe-inline' /tmp/live-h-page
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const d=(x.result||[]).filter(v=>v.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!d?.id) throw new Error('NO_PRODUCTION_DEPLOYMENT');
          const sha=d.deployment_trigger?.metadata?.commit_hash||'';
          if(sha!==process.env.WEB_SHA) throw new Error('LIVE_DEPLOYMENT_SHA:'+sha);
          const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/V6433_PRODUCTION_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');
          console.log(JSON.stringify(e,null,2));
          NODE

      - name: Automatic rollback to verified V6.43.2 if post-deploy verification fails
        if: failure() && env.PRODUCTION_TOUCHED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" \
            -d '{}' -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json');if(!x.success)process.exit(1)"
          ok=0
          for attempt in $(seq 1 20); do
            version="$(curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/VERSION?rollback=${GITHUB_RUN_ID}-${attempt}" | tr -d '\r\n ' || true)"
            curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/online/?rollback=${GITHUB_RUN_ID}-${attempt}" -o /tmp/rollback-online || true
            oldVisual=0; newPolish=0
            grep -q '/assets/visual.v6432.css' /tmp/rollback-online 2>/dev/null && oldVisual=1 || true
            grep -q '/assets/polish.v6433.css' /tmp/rollback-online 2>/dev/null && newPolish=1 || true
            if [ "$version" = '6.43.2' ] && [ "$oldVisual" = 1 ] && [ "$newPolish" = 0 ]; then ok=1;break;fi
            sleep 4
          done
          test "$ok" = 1

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v6433-production-evidence
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v6433.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V6433_PRODUCTION_EVIDENCE.json
            /tmp/preview-online
            /tmp/preview-about
            /tmp/live-online
            /tmp/live-about
            /tmp/live-h-page
            /tmp/rollback.json
          if-no-files-found: warn
          retention-days: 30

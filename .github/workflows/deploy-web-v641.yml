name: Deploy WEB IBERFIT V6.41

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/deploy-web-v641.yml'

permissions:
  contents: read

concurrency:
  group: web-iberfit-v641-deploy
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: 'f0efe2f95e6e973f82f6666b0e8f15fc6e0df3ee'
  WEB_VERSION: '6.41'
  QA_RUN_ID: '35456249931'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar proyecto y rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));if(!p.success||p.result?.name!==process.env.CF_PROJECT)throw new Error('PROJECT');const domains=p.result.domains||[];if(!domains.includes('iberfit.cl')||domains.includes('app.iberfit.cl'))throw new Error('DOMAIN');const x=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));const cur=(x.result||[]).filter(v=>v.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];if(!cur?.id)throw new Error('NO_ROLLBACK');fs.appendFileSync(process.env.GITHUB_ENV,'ROLLBACK_DEPLOYMENT_ID='+cur.id+'\n');console.log(JSON.stringify({domains,rollbackDeploymentId:cur.id},null,2));
          NODE

      - name: Verificar QA exacta V6.41
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/qa.json','utf8'));if(x.head_sha!==process.env.WEB_SHA)throw new Error('QA_SHA:'+x.head_sha);if(x.status!=='completed'||x.conclusion!=='success')throw new Error('QA:'+x.status+':'+x.conclusion);if(x.name!=='QA WEB IBERFIT V6.41 CSP final')throw new Error('QA_NAME:'+x.name);console.log(JSON.stringify({run:x.id,sha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE

      - name: Descargar candidata certificada
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$WEB_REPO" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "$WEB_SHA"
          git -C /tmp/iberfitweb checkout --detach "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "$WEB_SHA"
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$base/VERSION")" = "$WEB_VERSION"
          test "$(find "$base" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          grep -q "script-src 'self' 'sha256-OvlTbjy6MX3tOPtkkyczJxexU0UitjLSDdZtn3+IzfQ='" "$base/_headers"
          grep -q "script-src-attr 'none'" "$base/_headers"
          ! grep -q "'unsafe-inline'" "$base/_headers"
          grep -q 'Cache-Control: public, max-age=31536000, immutable' "$base/_headers"
          grep -q 'data-aeo-answer' "$base/index.html"
          grep -q '"@type":"Organization"' "$base/index.html"

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v641-review-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.41 certified preview' | tee /tmp/preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/preview.log | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Validar preview real
        shell: bash
        run: |
          set -euo pipefail
          cb="$GITHUB_RUN_ID"
          curl -fsSL --retry 8 --retry-all-errors "$PREVIEW_URL/VERSION?cb=$cb" -o /tmp/version
          test "$(tr -d '\r\n ' < /tmp/version)" = "$WEB_VERSION"
          curl -fsSL --retry 8 --retry-all-errors "$PREVIEW_URL/?cb=$cb" -o /tmp/home
          grep -q "document.documentElement.classList.add('js-v631')" /tmp/home
          grep -q 'IBERFIT, explicado de forma directa.' /tmp/home
          curl -fsSI --retry 8 --retry-all-errors "$PREVIEW_URL/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/h-home
          grep -q '^content-security-policy:' /tmp/h-home
          grep -q "sha256-ovltbjy6mx3toptkkyczjxexu0uitjlsddztn3+izfq=" /tmp/h-home
          grep -q "script-src-attr 'none'" /tmp/h-home
          ! grep -q "unsafe-inline" /tmp/h-home
          curl -fsSI --retry 8 --retry-all-errors "$PREVIEW_URL/assets/app.v632.js?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/h-js
          grep -q '^cache-control:.*max-age=31536000' /tmp/h-js
          grep -q '^cache-control:.*immutable' /tmp/h-js

      - name: Deploy producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch production --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.41 production' | tee /tmp/production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/production.log | tail -1)"
          test -n "$PRODUCTION_URL"
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Verificar producción y CSP real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            suffix="$GITHUB_RUN_ID-$attempt"
            curl -sSLo /tmp/live-version "https://iberfit.cl/VERSION?cb=$suffix" || true
            curl -sSLo /tmp/live-home "https://iberfit.cl/?cb=$suffix" || true
            version="$(tr -d '\r\n ' < /tmp/live-version 2>/dev/null || true)"; home=0
            grep -q 'IBERFIT, explicado de forma directa.' /tmp/live-home 2>/dev/null && home=1 || true
            echo "Propagation $attempt: version=${version:-missing} home=$home"
            if [ "$version" = "$WEB_VERSION" ] && [ "$home" = 1 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1 || { echo IBERFIT_CL_V641_NOT_CONSISTENT; exit 44; }
          cb="$GITHUB_RUN_ID-live"
          curl -fsSI --retry 8 --retry-all-errors "https://iberfit.cl/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-home
          grep -q '^content-security-policy:' /tmp/live-h-home
          grep -q "sha256-ovltbjy6mx3toptkkyczjxexu0uitjlsddztn3+izfq=" /tmp/live-h-home
          grep -q "script-src-attr 'none'" /tmp/live-h-home
          ! grep -q "unsafe-inline" /tmp/live-h-home
          curl -fsSI --retry 8 --retry-all-errors "https://iberfit.cl/assets/app.v632.js?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-js
          grep -q '^cache-control:.*max-age=31536000' /tmp/live-h-js
          grep -q '^cache-control:.*immutable' /tmp/live-h-js
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));const d=(x.result||[]).find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);if(!d)throw new Error('DEPLOYMENT_NOT_FOUND');const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};fs.writeFileSync('/tmp/V641_PRODUCTION_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');console.log(JSON.stringify(e,null,2));
          NODE

      - name: Guardar evidencia producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v641-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa.json
            /tmp/preview.log
            /tmp/production.log
            /tmp/deployments-after.json
            /tmp/V641_PRODUCTION_EVIDENCE.json
            /tmp/h-home
            /tmp/h-js
            /tmp/live-h-home
            /tmp/live-h-js
          if-no-files-found: warn
          retention-days: 30

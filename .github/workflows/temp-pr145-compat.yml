name: TEMP PR145 compatibility patch

on:
  push:
    branches:
      - fix/session-duplicate-exercise-occurrence
    paths:
      - .github/workflows/temp-pr145-compat.yml
      - scripts/temp-pr145-compat.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility patch
        run: node scripts/temp-pr145-compat.mjs
      - name: Focused regression
        run: node --test tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_current_exercise_history.test.mjs tests/m26_session_skipped_progress.test.mjs tests/m26_session_execution_ui.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-execution.js tests/m26_session_duplicate_exercise_occurrence.test.mjs
          git diff --cached --check
          git commit -m "fix(session): preserve legacy storage when unambiguous"
          git push origin HEAD:fix/session-duplicate-exercise-occurrence

name: IBERFIT Production Data Safety Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'canary/rc74-4'
    paths:
      - 'supabase/migrations/**'
      - 'scripts/data-safety/check_migration_safety.mjs'
      - 'scripts/data-safety/check_prod_backup_readiness.mjs'
      - 'tests/m26_prod_data_safety_gate.test.mjs'
      - 'tests/m26_prod_backup_readiness.test.mjs'
      - '.github/workflows/prod-data-safety-gate.yml'
  push:
    branches:
      - 'canary/rc74-4'
    paths:
      - 'supabase/migrations/**'
      - 'scripts/data-safety/check_migration_safety.mjs'
      - 'scripts/data-safety/check_prod_backup_readiness.mjs'
      - 'tests/m26_prod_data_safety_gate.test.mjs'
      - 'tests/m26_prod_backup_readiness.test.mjs'
      - '.github/workflows/prod-data-safety-gate.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-production-data-safety-${{ github.ref }}
  cancel-in-progress: false

env:
  PROD_SUPABASE_REF: 'pjhmrhejsoofmouedavw'

jobs:
  production-data-safety:
    name: production-data-safety-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact migration diff
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'DATA_SAFETY_HEAD_SHA_INVALID'
            exit 31
          fi

          MIGRATION_DIFF="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/**')"
          HAS_MIGRATION_CHANGES=false
          if [ -n "$MIGRATION_DIFF" ]; then
            HAS_MIGRATION_CHANGES=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HAS_MIGRATION_CHANGES=true
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "has_migration_changes=$HAS_MIGRATION_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Enforce append-only non-destructive migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/data-safety/check_migration_safety.mjs \
            '${{ steps.diff.outputs.base_sha }}' \
            '${{ steps.diff.outputs.head_sha }}'

      - name: Test data safety and recovery policy
        run: |
          node --test \
            tests/m26_prod_data_safety_gate.test.mjs \
            tests/m26_prod_backup_readiness.test.mjs

      - name: Verify recoverable Supabase production backup before schema change
        if: ${{ steps.diff.outputs.has_migration_changes == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 41; }
          mkdir -p recovery
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROD_SUPABASE_REF}/database/backups" \
            -o recovery/prod-backup-readiness.json
          node scripts/data-safety/check_prod_backup_readiness.mjs \
            recovery/prod-backup-readiness.json \
            recovery/prod-backup-readiness-summary.json

      - name: Record backup gate applicability
        if: ${{ steps.diff.outputs.has_migration_changes != 'true' }}
        run: echo 'IBERFIT_PROD_BACKUP_GATE_NOT_REQUIRED no schema migration in this candidate'

      - name: Preserve production recovery evidence
        if: ${{ always() && steps.diff.outputs.has_migration_changes == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-backup-readiness-${{ github.run_id }}
          path: |
            recovery/prod-backup-readiness.json
            recovery/prod-backup-readiness-summary.json
          if-no-files-found: warn
          retention-days: 30

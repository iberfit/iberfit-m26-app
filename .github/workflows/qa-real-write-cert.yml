name: IBERFIT QA Real Write Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_m42_avatar_private_gate.mjs'
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_connected360_v45_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_m43_coach_client_write_gate.mjs'
      - 'qa/rc64/m43-client-real-history.spec.mjs'
      - 'qa/rc64/m43-client-interactive.spec.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'playwright.m43-interactive-client.config.mjs'
      - 'playwright.m43-authenticated-browser.config.mjs'
      - 'supabase/qa-migrations/**'
      - 'supabase/qa-rollbacks/**'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - 'scripts/remote-gates/prepare_qa_iri_document_fixture.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'supabase/functions/iberfit-qa-iri-document-fixture/**'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_m42_avatar_private_gate.mjs'
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_connected360_v45_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_m43_coach_client_write_gate.mjs'
      - 'qa/rc64/m43-client-real-history.spec.mjs'
      - 'qa/rc64/m43-client-interactive.spec.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'playwright.m43-interactive-client.config.mjs'
      - 'playwright.m43-authenticated-browser.config.mjs'
      - 'supabase/qa-migrations/**'
      - 'supabase/qa-rollbacks/**'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - 'scripts/remote-gates/prepare_qa_iri_document_fixture.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'supabase/functions/iberfit-qa-iri-document-fixture/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: iberfit-qa-real-write-cert
  cancel-in-progress: false

jobs:

  m42-avatar-private-real-qa:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: M42 private Client avatar real RLS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private Storage owner, Coach and other Client real authenticated access
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_m42_avatar_private_gate.mjs
      - name: Preserve redacted avatar QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m42-avatar-private-qa-${{ github.run_id }}
          path: recovery/m42-qa/avatar-private-real-write.json
          if-no-files-found: warn
          retention-days: 30

  connected360-v45-synthetic-write:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: connected360-v45-authenticated-synthetic-write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify V45 real QA persistence, isolation, idempotency and revocation with synthetic clients
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_connected360_v45_write_gate.mjs
      - name: Preserve redacted V45 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-connected360-v45-write-${{ github.run_id }}
          path: recovery/connected360-v45/qa-real-write.json
          if-no-files-found: warn
          retention-days: 14

  qa-real-write:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: write-persist-idempotency-isolation
    runs-on: ubuntu-latest
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy exact QA IRI report brokers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 41; }
          npx --yes supabase@2.117.0 functions deploy iberfit-iri-report-emission-v1 \
            --project-ref "${M26_PROJECT_REF}" \
            --no-verify-jwt
          npx --yes supabase@2.117.0 functions deploy iberfit-qa-iri-document-fixture \
            --project-ref "${M26_PROJECT_REF}" \
            --no-verify-jwt

      - name: Execute controlled QA write and certify persistence isolation and role boundaries
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_real_write_gate.mjs

      - name: Prepare synthetic private IRI document fixture
        env:
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
        run: node scripts/remote-gates/prepare_qa_iri_document_fixture.mjs

      - name: Seed synthetic bioimpedance annex through QA OIDC boundary
        shell: bash
        env:
          OIDC_AUDIENCE: iberfit-iri-document-qa-fixture
          BROKER_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co/functions/v1/iberfit-qa-iri-document-fixture
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'OIDC_REQUEST_URL_MISSING'; exit 43; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'OIDC_REQUEST_TOKEN_MISSING'; exit 44; }
          sep='?'; [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100 || { echo 'OIDC_TOKEN_INVALID'; exit 45; }
          echo "::add-mask::$token"
          payload="$(jq -nc --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{action:"seed",sourceSha:$sourceSha,runId:$runId}')"
          mkdir -p recovery/iri-report-emission
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            "$BROKER_URL" -d "$payload" \
            | tee recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json
          jq -e '.ok == true and .synthetic == true and .realPersonData == false and .mime_type == "application/pdf" and .visible_to_client == true' \
            recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json >/dev/null

      - name: Certify immutable IRI PDF emission end to end in QA
        env:
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: node scripts/remote-gates/run_qa_iri_report_emission_gate.mjs

      - name: Preserve minimised write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-qa-real-write-${{ github.run_id }}
          path: |
            recovery/P0_QA_REAL_WRITE_EVIDENCE.json
            recovery/iri-report-emission/qa-evidence.json
            recovery/iri-report-emission/qa-fixture-evidence.json
            recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json
            recovery/iri-report-emission/qa-issued-report.pdf
            recovery/iri-report-emission/qa-issued-client.pdf
            recovery/iri-report-emission/qa-issued-coach.pdf
          if-no-files-found: error
          retention-days: 30

  m43-real-coach-client-qa:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: M43 real Coach-Client QA E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute M43 Coach-Client authenticated QA lifecycle
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_m43_coach_client_write_gate.mjs
      - name: Preserve privacy-safe QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m43-real-qa-${{ github.run_id }}-a${{ github.run_attempt }}
          path: recovery/m43-qa/coach-client-real-write.json
          if-no-files-found: warn
          retention-days: 30


  m43-real-client-browser:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: M43 real Client browser current-source
    needs: [m43-real-coach-client-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore Chromium browser cache
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium if cache missed
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build current-source authenticated QA shell
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      # The writer may be from an earlier successful attempt when GitHub only
      # reruns failed jobs. Never invent fixtures under the browser attempt.
      - name: Resolve authenticated writer provenance from this exact run
        id: m43-writer
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: node scripts/remote-gates/m43-writer-handoff.mjs discover
      - name: Download exact successful M43 writer evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.m43-writer.outputs.name }}
          path: .tmp/m43-writer-evidence
      - name: Certify matching writer provenance fail-closed
        env:
          M26_M43_SELECTED_WRITER_ATTEMPT: ${{ steps.m43-writer.outputs.writer_attempt }}
        run: node scripts/remote-gates/m43-writer-handoff.mjs verify
      - name: Certify Client session and history in mobile tablet desktop
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
        run: npx playwright test --config playwright.m43-authenticated-browser.config.mjs
      - name: Certify real Client UI start pause resume set finish and persisted history
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: npx playwright test --config playwright.m43-interactive-client.config.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m43-auth-client-browser-${{ github.run_id }}
          path: |
            recovery/m43-qa/browser/
            recovery/m43-qa/browser-interactive/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30

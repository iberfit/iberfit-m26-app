name: IBERFIT QA Real Write Certification

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'cloudflare/iri-report-renderer/**'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'cloudflare/iri-report-renderer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-qa-real-write-cert
  cancel-in-progress: false

jobs:
  qa-real-write:
    name: write-persist-idempotency-isolation
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure private QA PDF renderer and deploy exact IRI report broker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 41; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 42; }

          RENDER_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${RENDER_SECRET}"

          npx --yes wrangler@4.120.0 deploy \
            --config cloudflare/iri-report-renderer/wrangler.qa.jsonc 2>&1 | tee /tmp/iri-renderer-deploy.log
          RENDER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/iri-renderer-deploy.log | tail -1)"
          test -n "${RENDER_URL:-}" || { echo 'IRI_RENDERER_URL_MISSING'; exit 43; }

          printf '%s' "${RENDER_SECRET}" | npx --yes wrangler@4.120.0 secret put IRI_RENDERER_SHARED_SECRET \
            --config cloudflare/iri-report-renderer/wrangler.qa.jsonc

          IBERFIT_IRI_RENDERER_URL="${RENDER_URL}" IBERFIT_IRI_RENDERER_SHARED_SECRET="${RENDER_SECRET}" node --input-type=module <<'NODE'
          const url=process.env.IBERFIT_IRI_RENDERER_URL;
          const secret=process.env.IBERFIT_IRI_RENDERER_SHARED_SECRET;
          let response=null;
          for(let attempt=0;attempt<3;attempt+=1){
            try{
              response=await fetch(url,{
                method:'POST',
                headers:{authorization:`Bearer ${secret}`,'content-type':'application/json'},
                body:JSON.stringify({html:'<!doctype html><html><body><main class="pdf-page"><h1>IBERFIT QA renderer</h1></main></body></html>'}),
                signal:AbortSignal.timeout(90_000),
              });
            }catch{}
            if(response?.ok)break;
            await new Promise(resolve=>setTimeout(resolve,1_000));
          }
          if(!response?.ok)throw new Error(`IRI_RENDERER_SMOKE_FAILED:${response?.status||0}`);
          const bytes=new Uint8Array(await response.arrayBuffer());
          if(bytes.byteLength<1000||new TextDecoder().decode(bytes.slice(0,5))!=='%PDF-'){
            throw new Error('IRI_RENDERER_SMOKE_PDF_INVALID');
          }
          console.log('IRI_RENDERER_QA_SMOKE=GREEN');
          NODE

          npx --yes supabase@2.117.0 secrets set \
            IBERFIT_IRI_RENDERER_URL="${RENDER_URL}" \
            IBERFIT_IRI_RENDERER_SHARED_SECRET="${RENDER_SECRET}" \
            --project-ref "${M26_PROJECT_REF}"

          npx --yes supabase@2.117.0 functions deploy iberfit-iri-report-emission-v1 \
            --project-ref "${M26_PROJECT_REF}" \
            --no-verify-jwt

      - name: Execute controlled QA write and certify persistence isolation and role boundaries
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_real_write_gate.mjs

      - name: Certify immutable IRI PDF emission end to end in QA
        env:
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: node scripts/remote-gates/run_qa_iri_report_emission_gate.mjs

      - name: Preserve minimised write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-qa-real-write-${{ github.run_id }}
          path: |
            recovery/P0_QA_REAL_WRITE_EVIDENCE.json
            recovery/iri-report-emission/qa-evidence.json
          if-no-files-found: error
          retention-days: 30

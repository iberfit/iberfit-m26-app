name: IBERFIT QA Real Write Certification

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - 'scripts/remote-gates/prepare_qa_iri_document_fixture.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'supabase/functions/iberfit-qa-iri-document-fixture/**'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/remote-gates/run_qa_real_write_gate.mjs'
      - 'scripts/remote-gates/run_qa_iri_report_emission_gate.mjs'
      - 'scripts/remote-gates/prepare_qa_iri_document_fixture.mjs'
      - '.github/workflows/qa-real-write-cert.yml'
      - 'src/m26/command-bus.js'
      - 'src/m26/supabase-transport.js'
      - 'src/m26/workflows/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/iberfit-admin-client-invite-v1/**'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'supabase/functions/iberfit-qa-iri-document-fixture/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: iberfit-qa-real-write-cert
  cancel-in-progress: false

jobs:
  qa-real-write:
    name: write-persist-idempotency-isolation
    runs-on: ubuntu-latest
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy exact QA IRI report brokers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 41; }
          npx --yes supabase@2.117.0 functions deploy iberfit-iri-report-emission-v1 \
            --project-ref "${M26_PROJECT_REF}" \
            --no-verify-jwt
          npx --yes supabase@2.117.0 functions deploy iberfit-qa-iri-document-fixture \
            --project-ref "${M26_PROJECT_REF}" \
            --no-verify-jwt

      - name: Execute controlled QA write and certify persistence isolation and role boundaries
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_qa_real_write_gate.mjs

      - name: Prepare synthetic private IRI document fixture
        env:
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
        run: node scripts/remote-gates/prepare_qa_iri_document_fixture.mjs

      - name: Seed synthetic bioimpedance annex through QA OIDC boundary
        shell: bash
        env:
          OIDC_AUDIENCE: iberfit-iri-document-qa-fixture
          BROKER_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co/functions/v1/iberfit-qa-iri-document-fixture
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'OIDC_REQUEST_URL_MISSING'; exit 43; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'OIDC_REQUEST_TOKEN_MISSING'; exit 44; }
          sep='?'; [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100 || { echo 'OIDC_TOKEN_INVALID'; exit 45; }
          echo "::add-mask::$token"
          payload="$(jq -nc --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{action:"seed",sourceSha:$sourceSha,runId:$runId}')"
          mkdir -p recovery/iri-report-emission
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            "$BROKER_URL" -d "$payload" \
            | tee recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json
          jq -e '.ok == true and .synthetic == true and .realPersonData == false and .mime_type == "application/pdf" and .visible_to_client == true' \
            recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json >/dev/null

      - name: Certify immutable IRI PDF emission end to end in QA
        env:
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: node scripts/remote-gates/run_qa_iri_report_emission_gate.mjs

      - name: Preserve minimised write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-qa-real-write-${{ github.run_id }}
          path: |
            recovery/P0_QA_REAL_WRITE_EVIDENCE.json
            recovery/iri-report-emission/qa-evidence.json
            recovery/iri-report-emission/qa-fixture-evidence.json
            recovery/iri-report-emission/qa-bioimpedance-fixture-evidence.json
            recovery/iri-report-emission/qa-issued-report.pdf
            recovery/iri-report-emission/qa-issued-client.pdf
            recovery/iri-report-emission/qa-issued-coach.pdf
          if-no-files-found: error
          retention-days: 30

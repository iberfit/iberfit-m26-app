name: IBERFIT PR494 CSP mobile patch v2

on:
  push:
    branches:
      - fix/p1-multiapp-runtime-application-access-20260918
    paths:
      - .github/workflows/patch-pr494-csp-mobile-multiapp-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/p1-multiapp-runtime-application-access-20260918
          fetch-depth: 0

      - name: Guard and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/p1-multiapp-runtime-application-access-20260918'
          test "$(git rev-parse HEAD^)" = '565fa2a8f52152e5d10bced8177e013252c49b66'
          python scripts/patch_pr494_csp_mobile_multiapp_v2.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, contract: str) -> None:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{contract}: expected 1 anchor, found {count}")
              path.write_text(source.replace(old, new, 1))

          onboarding_tour = Path('tests/m26_onboarding_tour_lifecycle_hardening.test.mjs')
          replace_once(
              onboarding_tour,
              "  assert.match(shell,/\\.m26-mobile-nav \\{ display: grid; position: sticky; bottom: 0;/u);",
              "  assert.match(shell,/\\.m26-mobile-nav \\{ display: grid; position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 100vw;/u);\n  assert.doesNotMatch(shell,/\\.m26-mobile-nav \\{[^}]*position: relative;/u,'mobile tour navigation must remain viewport anchored');",
              'ONBOARDING_TOUR_STALE_STICKY_NAV_CONTRACT_MISMATCH',
          )

          rc35 = Path('tests/m26_rc35_audit_closure.test.mjs')
          replace_once(
              rc35,
              "  assert.match(css,/\\.m26-mobile-nav \\{ display: grid; position: sticky; bottom: 0;/);",
              "  assert.match(css,/\\.m26-mobile-nav \\{ display: grid; position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 100vw;/);\n  assert.match(css,/\\.m26-workspace \\{[^}]*padding-bottom: calc\\(var\\(--iberfit-ux-mobile-nav, 4\\.35rem\\) \\+ env\\(safe-area-inset-bottom\\)\\);/);\n  assert.doesNotMatch(css,/\\.m26-mobile-nav \\{[^}]*position: relative;/,'late mobile rules must not detach the navigation from the viewport');",
              'RC35_STALE_STICKY_NAV_CONTRACT_MISMATCH',
          )
          PY
          git diff --check

      - name: Focused regressions
        run: |
          set -euo pipefail
          node --test \
            tests/m26_mobile_navigation_persistence.test.mjs \
            tests/m26_onboarding_tour_lifecycle_hardening.test.mjs \
            tests/m26_rc35_audit_closure.test.mjs \
            tests/m26_onboarding_app_choice_gate.test.mjs \
            tests/m26_rc39_integrated_client_coach_multirole.test.mjs \
            tests/m26_rc16_hardening.test.mjs \
            tests/m26_rc64_2a_performance_real_shell_foundation.test.mjs \
            tests/m26_multiapp_runtime_application_access.test.mjs \
            tests/m26_multiapp_role_switch_initialization.test.mjs

      - name: Full offline regression
        run: npm run test:offline

      - name: RC74.4 validation
        run: npm run validate:rc74-4

      - name: Commit validated product change with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          diag="$GITHUB_WORKSPACE/pr494-final-step-diagnostics.txt"
          : > "$diag"
          exec > >(tee -a "$diag") 2>&1
          fail() {
            code="$1"
            echo "FINAL_STEP_FAILURE_CODE=$code"
            exit "$code"
          }

          echo '=== PR494 validated product commit diagnostics ==='
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PARENT=$(git rev-parse HEAD^)"
          echo "REF=$GITHUB_REF_NAME"
          echo '--- git status before commit ---'
          git status --porcelain=v1 --untracked-files=all
          echo '--- git diff name/status ---'
          git diff --name-status

          git diff --check
          rc=$?
          echo "DIFF_CHECK_RC=$rc"
          test "$rc" -eq 0 || fail 40

          actual="$(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            'public/m26/index.html' \
            'src/m26/shell/shell.css' \
            'tests/m26_mobile_navigation_persistence.test.mjs' \
            'tests/m26_onboarding_app_choice_gate.test.mjs' \
            'tests/m26_onboarding_tour_lifecycle_hardening.test.mjs' \
            'tests/m26_rc35_audit_closure.test.mjs' \
            'tests/m26_rc39_integrated_client_coach_multirole.test.mjs' | sort)"
          echo '--- actual allowlist ---'
          printf '%s\n' "$actual"
          echo '--- expected allowlist ---'
          printf '%s\n' "$expected"
          if [ "$actual" != "$expected" ]; then
            echo 'ALLOWLIST_MISMATCH=1'
            fail 41
          fi
          echo 'ALLOWLIST_MATCH=1'

          git config user.name iberfit
          git config user.email iberfit.cl@gmail.com
          git add -- \
            public/m26/index.html \
            src/m26/shell/shell.css \
            tests/m26_mobile_navigation_persistence.test.mjs \
            tests/m26_onboarding_app_choice_gate.test.mjs \
            tests/m26_onboarding_tour_lifecycle_hardening.test.mjs \
            tests/m26_rc35_audit_closure.test.mjs \
            tests/m26_rc39_integrated_client_coach_multirole.test.mjs

          echo '--- staged files ---'
          git diff --cached --name-status
          git diff --cached --check
          rc=$?
          echo "STAGED_DIFF_CHECK_RC=$rc"
          test "$rc" -eq 0 || fail 42

          git commit -m 'fix(nav): restore CSP-safe mobile persistence'
          rc=$?
          echo "COMMIT_RC=$rc"
          test "$rc" -eq 0 || fail 43
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"

          git push origin HEAD:fix/p1-multiapp-runtime-application-access-20260918
          rc=$?
          echo "PUSH_RC=$rc"
          test "$rc" -eq 0 || fail 44
          echo 'FINAL_STEP_SUCCESS=1'

      - name: Upload final-step diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr494-final-step-diagnostics
          path: pr494-final-step-diagnostics.txt
          if-no-files-found: warn
          retention-days: 2

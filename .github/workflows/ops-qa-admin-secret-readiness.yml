name: IBERFIT QA Admin Secret Readiness

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-qa-admin-secret-readiness.yml'

permissions:
  contents: read

jobs:
  qa-admin-secret-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report presence only
        env:
          ADMIN_EMAIL: ${{ secrets.M26_QA_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.M26_QA_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const email=String(process.env.ADMIN_EMAIL||'');
          const password=String(process.env.ADMIN_PASSWORD||'');
          console.log(JSON.stringify({
            adminEmailPresent:Boolean(email),
            adminPasswordPresent:Boolean(password),
            adminCredentialSetReady:Boolean(email&&password),
          }));
          NODE

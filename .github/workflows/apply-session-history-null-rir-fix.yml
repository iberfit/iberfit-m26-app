name: IBERFIT Apply Session History Null RIR Fix

on:
  push:
    branches:
      - feat/session-current-exercise-history
    paths:
      - '.github/workflows/apply-session-history-null-rir-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/session-current-exercise-history
          fetch-depth: 0

      - name: Patch null RIR summary and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/m26/workflows/session-ui.js')
          text = path.read_text()
          old = "        Number.isFinite(Number(recorded.rir))?`RIR ${recorded.rir}`:null,"
          new = "        recorded.rir!=null&&Number.isFinite(Number(recorded.rir))?`RIR ${recorded.rir}`:null,"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one null-RIR summary target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/apply-session-history-null-rir-fix.yml
          git diff --check

      - name: Commit exact product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js .github/workflows/apply-session-history-null-rir-fix.yml
          git commit -m "fix(session): omit absent RIR from rest summary"
          git push origin HEAD:feat/session-current-exercise-history

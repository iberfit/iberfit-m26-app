name: Temporary stale focus-lock patch

on:
  push:
    branches:
      - fix/admin-mobile-route-stale-focus-lock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-mobile-route-stale-focus-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact focus-lock correction
        run: |
          python -c 'from pathlib import Path; p=Path("src/m26/shell/shell-controller.js"); s=p.read_text(); old="function shellInteractionActive(){return Boolean(interactionPointerTarget||interactionFocusTarget||focusedInteractiveControl()||(formInteractionTarget&&root.contains?.(formInteractionTarget)));}"; new="function shellInteractionActive(){return Boolean(interactionPointerTarget||focusedInteractiveControl()||(formInteractionTarget&&root.contains?.(formInteractionTarget)));}"; assert s.count(old)==1, f"expected exactly one anchor, got {s.count(old)}"; p.write_text(s.replace(old,new))'
      - name: Run focused regression
        run: node --test tests/m26_shell_pointer_navigation.test.mjs
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/tmp-apply-stale-focus-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/shell/shell-controller.js tests/m26_shell_pointer_navigation.test.mjs .github/workflows/tmp-apply-stale-focus-lock.yml
          git commit -m "fix(shell): ignore stale focus references for render locks"
          git push origin HEAD:fix/admin-mobile-route-stale-focus-lock

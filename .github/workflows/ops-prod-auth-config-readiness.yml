name: IBERFIT PROD Auth Config Readiness

on:
  push:
    branches:
      - 'ops/prod-auth-readiness-4baf6d52'
    paths:
      - '.github/workflows/ops-prod-auth-config-readiness.yml'

permissions:
  contents: read

jobs:
  auth-config-readiness:
    name: inspect-prod-auth-config-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read sanitized Auth config and DMARC
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_SUPABASE_REF: 'pjhmrhejsoofmouedavw'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {resolveTxt} from 'node:dns/promises';

          const token=String(process.env.SUPABASE_ACCESS_TOKEN||'');
          const ref=process.env.PROD_SUPABASE_REF;
          const response=await fetch(`https://api.supabase.com/v1/projects/${ref}/config/auth`,{
            headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}
          });
          const config=await response.json();
          if(!response.ok)throw new Error(`AUTH_CONFIG_GET_${response.status}`);

          async function txt(name){
            try{return (await resolveTxt(name)).map(parts=>parts.join(''));}
            catch{return [];}
          }
          const authDmarc=await txt('_dmarc.auth.iberfit.cl');
          const rootDmarc=await txt('_dmarc.iberfit.cl');

          console.log(JSON.stringify({
            projectRef:ref,
            siteUrl:config.site_url||null,
            smtpReady:Boolean(config.smtp_host&&config.smtp_user&&config.smtp_admin_email&&config.smtp_sender_name&&Number(config.smtp_port)>0),
            otpLength:Number(config.mailer_otp_length)||null,
            otpExpirySeconds:Number(config.mailer_otp_exp)||null,
            rateLimitOtp:Number(config.rate_limit_otp)||null,
            rateLimitEmailSent:Number(config.rate_limit_email_sent)||null,
            secureEmailChange:config.mailer_secure_email_change_enabled===true,
            passwordChangeReauth:config.security_update_password_require_reauthentication===true,
            signupDisabled:config.disable_signup===true,
            anonymousDisabled:config.external_anonymous_users_enabled!==true,
            authDmarc,
            rootDmarc
          },null,2));
          NODE



# Verify marker: after-dmarc-save

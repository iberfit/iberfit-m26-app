name: IBERFIT QA Mobile Admin Hit Diagnostic

on:
  pull_request:
    branches:
      - qa/mobile-admin-hit-diagnostic-base-20260919-v1
    paths:
      - '.github/mobile-admin-hit-diagnostic.trigger'

permissions:
  contents: read

concurrency:
  group: iberfit-qa-mobile-admin-hit-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'qa/mobile-admin-hit-diagnostic-base-20260919-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-all
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install browsers on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Verify browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import {chromium,webkit} from '@playwright/test'; for(const [name,browser] of Object.entries({chromium,webkit})) if(!fs.existsSync(browser.executablePath())) throw new Error('PLAYWRIGHT_'+name.toUpperCase()+'_NOT_READY');"
      - name: Capture mobile hit-test evidence
        run: npx playwright test --config playwright.mobile-hit-diagnostic.config.mjs

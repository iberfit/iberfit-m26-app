name: Apply session current-exercise history hardening

on:
  push:
    branches:
      - feat/session-current-exercise-history
    paths:
      - .github/workflows/apply-session-current-exercise-history.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-current-exercise-history
      - name: Harden optional effort rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/m26/workflows/session-ui.js')
          text=path.read_text(encoding='utf-8')
          pairs=[
            ("Number.isFinite(Number(result?.rpe))?`RPE ${result.rpe}`:null,","result?.rpe!=null&&Number.isFinite(Number(result.rpe))?`RPE ${result.rpe}`:null,"),
            ("Number.isFinite(Number(result?.rir))?`RIR ${result.rir}`:null,","result?.rir!=null&&Number.isFinite(Number(result.rir))?`RIR ${result.rir}`:null,"),
          ]
          for old,new in pairs:
            if text.count(old)!=1:
              raise SystemExit(f'effort summary anchor mismatch: {old}')
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          node --check src/m26/workflows/session-ui.js
          node --test tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_next_exercise_media.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js
          git commit -m "fix(session): omit absent effort from set history"
          git push origin HEAD:feat/session-current-exercise-history

name: Apply current exercise session history

on:
  push:
    branches:
      - feat/session-current-exercise-history
    paths:
      - .github/workflows/apply-session-current-exercise-history.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-current-exercise-history
      - name: Apply current exercise history patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path=Path('src/m26/workflows/session-ui.js')
          text=path.read_text(encoding='utf-8')
          marker='data-session-current-exercise-history'
          if marker in text:
              raise SystemExit('Patch already present')

          anchor="function groupName(type){return ({biserie:'Biserie',triserie:'Triserie',circuito:'Circuito',amrap:'AMRAP',tabata:'Tabata'})[type]||type;}"
          helper=dedent("""\
          function currentSetResultSummary(result){
            return [
              result?.reps!=null?`${result.reps} rep${Number(result.reps)===1?'':'s'}`:null,
              result?.seconds!=null?`${result.seconds} s`:null,
              result?.load||null,
              Number.isFinite(Number(result?.rpe))?`RPE ${result.rpe}`:null,
              Number.isFinite(Number(result?.rir))?`RIR ${result.rir}`:null,
            ].filter(Boolean).join(' · ')||'Serie registrada';
          }
          function renderCurrentExerciseHistory(execution,step){
            const totalSets=Number(step?.totalSets||0);
            const rows=Object.values(execution?.results||{})
              .filter((result)=>
                result?.exerciseId===step?.exerciseId&&
                Number(result?.setNumber)>=1&&
                Number(result?.setNumber)<=totalSets
              )
              .sort((a,b)=>Number(a.setNumber)-Number(b.setNumber));
            if(!rows.length)return '';
            const items=rows.map((result)=>`<div class="m26-field"><span>Serie ${e(result.setNumber)}</span><strong>${e(currentSetResultSummary(result))}</strong></div>`).join('');
            return `<section class="m26-panel m26-panel-soft" data-session-current-exercise-history aria-label="Series registradas hoy en este ejercicio"><p class="m26-eyebrow">Hoy en este ejercicio</p><div class="m26-field-grid">${items}</div></section>`;
          }
          """)
          if text.count(anchor)!=1:
              raise SystemExit('groupName anchor mismatch')
          text=text.replace(anchor,helper+anchor,1)

          anchor="const exerciseMemory=exerciseMemoryFor?.(step.exerciseId)||null;"
          replacement="const currentExerciseHistory=renderCurrentExerciseHistory(execution,step);\nconst exerciseMemory=exerciseMemoryFor?.(step.exerciseId)||null;"
          if text.count(anchor)!=1:
              raise SystemExit('exercise memory anchor mismatch')
          text=text.replace(anchor,replacement,1)

          anchor="    ${renderExerciseMemorySession(exerciseMemory)}\n    <div class=\"m26-guided-main\">"
          replacement="    ${renderExerciseMemorySession(exerciseMemory)}\n    ${currentExerciseHistory}\n    <div class=\"m26-guided-main\">"
          if text.count(anchor)!=1:
              raise SystemExit('render history anchor mismatch')
          text=text.replace(anchor,replacement,1)

          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          node --check src/m26/workflows/session-ui.js
          node --test tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_next_exercise_media.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js
          git commit -m "feat(session): show current exercise set history"
          git push origin HEAD:feat/session-current-exercise-history

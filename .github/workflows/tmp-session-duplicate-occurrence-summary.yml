name: Temporary Duplicate Occurrence Summary Patch

on:
  push:
    branches:
      - fix/session-duplicate-occurrence-summary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-duplicate-occurrence-summary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          ui = Path('src/m26/workflows/session-ui.js')
          text = ui.read_text()
          old = """  const completedExercises=new Set(\n    results\n      .map((item)=>item?.exerciseId)\n      .filter(Boolean),\n  ).size;\n"""
          new = """  const completedExercises=queue.filter((item)=>{\n    const sets=Math.max(0,Number(item?.sets||0));\n    for(let setNumber=1;setNumber<=sets;setNumber+=1){\n      const step={...item,setNumber,totalSets:item.sets};\n      if(executionResultForStep(execution,step,setNumber))return true;\n    }\n    return false;\n  }).length;\n"""
          if old not in text:
              raise SystemExit('executionTotals completedExercises anchor not found')
          ui.write_text(text.replace(old,new,1))

          test = Path('tests/m26_session_duplicate_exercise_occurrence.test.mjs')
          text = test.read_text()
          anchor = """test('a skipped set in the first occurrence does not resolve the duplicated occurrence',()=>{\n"""
          addition = """test('completion summary counts duplicated exercise occurrences independently',()=>{\n  const {session,execution}=makeExecution({sets:1});\n  recordSet(execution,session,{reps:10,load:'80 kg',rpe:8,rir:2});\n  advanceExecution(execution);\n  assert.equal(currentStep(execution,session).blockId,'block-second');\n  recordSet(execution,session,{reps:8,load:'70 kg',rpe:7.5,rir:3});\n  advanceExecution(execution);\n  assert.equal(execution.status,'awaiting_feedback');\n\n  const html=render(session,execution);\n  const start=html.indexOf('<span>Ejercicios registrados</span>');\n  const end=html.indexOf('</div>',start);\n  assert.ok(start>=0);\n  assert.match(html.slice(start,end),/2 \/ 2/);\n});\n\n"""
          if anchor not in text:
              raise SystemExit('duplicate occurrence test anchor not found')
          test.write_text(text.replace(anchor,addition+anchor,1))
      - name: Focused tests
        run: node --test tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_substitution_progress.test.mjs tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_current_exercise_history.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js tests/m26_session_duplicate_exercise_occurrence.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(session): count duplicate occurrences in summary"
          git push origin HEAD:fix/session-duplicate-occurrence-summary

name: IBERFIT RC74.12 One Shot Patch

on:
  push:
    branches:
      - feature/rc74-12-iri-a11y-report-render

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc74-12-iri-a11y-report-render
          fetch-depth: 0
      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route=Path('src/m26/modules/route-render.js')
          text=route.read_text(encoding='utf-8')
          old='<button type="button" data-workflow-action="iri-prev" disabled>Anterior</button>'
          new='<button type="button" data-workflow-action="iri-prev" disabled aria-disabled="true">Anterior</button>'
          if old in text:
              if text.count(old)!=1: raise SystemExit('PATCH_CONTRACT_FAILED:route-render')
              route.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('PATCH_CONTRACT_FAILED:route-render-anchor')

          controller=Path('src/m26/app/workflow-controller.js')
          text=controller.read_text(encoding='utf-8')
          old='    const previous=form.querySelector?.(\'[data-workflow-action="iri-prev"]\');if(previous)previous.disabled=bounded===0;\n'
          new='    const previous=form.querySelector?.(\'[data-workflow-action="iri-prev"]\');if(previous){const disabled=bounded===0;previous.disabled=disabled;previous.setAttribute?.(\'aria-disabled\',disabled?\'true\':\'false\');}\n'
          if old in text:
              if text.count(old)!=1: raise SystemExit('PATCH_CONTRACT_FAILED:workflow-controller')
              controller.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('PATCH_CONTRACT_FAILED:workflow-controller-anchor')

          report=Path('src/m26/workflows/iri-report-document.js')
          text=report.read_text(encoding='utf-8')
          helper="""function mountIriReportDocument(popup,html){
  const doc=popup?.document;
  const Parser=popup?.DOMParser||doc?.defaultView?.DOMParser||globalThis.DOMParser;
  if(!doc?.documentElement||typeof Parser!=='function'||typeof doc.importNode!=='function'||typeof doc.replaceChild!=='function')throw new Error('M26_IRI_REPORT_POPUP_BLOCKED');
  const parsed=new Parser().parseFromString(String(html||''),'text/html');
  if(!parsed?.documentElement)throw new Error('M26_IRI_REPORT_RENDER_FAILED');
  const imported=doc.importNode(parsed.documentElement,true);
  doc.replaceChild(imported,doc.documentElement);
  return doc;
}
"""
          anchor="export function prepareIriReportPrintTarget(openWindow=globalThis.open){\n"
          if 'function mountIriReportDocument(' not in text:
              if text.count(anchor)!=1: raise SystemExit('PATCH_CONTRACT_FAILED:report-helper-anchor')
              text=text.replace(anchor,helper+anchor,1)
          old="""  const popup=printTarget||prepareIriReportPrintTarget(openWindow);
  if(!popup?.document||typeof popup.document.write!=='function')throw new Error('M26_IRI_REPORT_POPUP_BLOCKED');
  try{
    popup.document.open?.();
    popup.document.write(directIriReportHtml(html,variant));
    popup.document.close?.();
    bindDirectIriReportWindow(popup);
  }catch(error){try{popup.close?.();}catch{}throw error;}
"""
          new="""  const popup=printTarget||prepareIriReportPrintTarget(openWindow);
  if(!popup?.document)throw new Error('M26_IRI_REPORT_POPUP_BLOCKED');
  try{
    mountIriReportDocument(popup,directIriReportHtml(html,variant));
    bindDirectIriReportWindow(popup);
  }catch(error){try{popup.close?.();}catch{}throw error;}
"""
          if old in text:
              if text.count(old)!=1: raise SystemExit('PATCH_CONTRACT_FAILED:report-legacy-block')
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('PATCH_CONTRACT_FAILED:report-render-anchor')
          if 'document.write' in text or 'document.open?.()' in text or 'document.close?.()' in text:
              raise SystemExit('PATCH_CONTRACT_FAILED:legacy-api-remains')
          old_internals='waitForReportAssets,bindDirectIriReportWindow,rawDataPages});'
          new_internals='waitForReportAssets,bindDirectIriReportWindow,mountIriReportDocument,rawDataPages});'
          if old_internals in text:
              if text.count(old_internals)!=1: raise SystemExit('PATCH_CONTRACT_FAILED:report-internals')
              text=text.replace(old_internals,new_internals,1)
          elif new_internals not in text:
              raise SystemExit('PATCH_CONTRACT_FAILED:report-internals-anchor')
          report.write_text(text,encoding='utf-8')

          test=Path('tests/m26_rc74_12_iri_a11y_report_render.test.mjs')
          if not test.exists():
              test.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import {readFile} from 'node:fs/promises';
import {__iriReportInternals} from '../src/m26/workflows/iri-report-document.js';

test('IRI sincroniza disabled y aria-disabled',async()=>{const [route,controller]=await Promise.all([readFile(new URL('../src/m26/modules/route-render.js',import.meta.url),'utf8'),readFile(new URL('../src/m26/app/workflow-controller.js',import.meta.url),'utf8')]);assert.match(route,/data-workflow-action=\"iri-prev\" disabled aria-disabled=\"true\"/);assert.match(controller,/previous\.disabled=disabled;previous\.setAttribute\?\.\('aria-disabled',disabled\?'true':'false'\)/);});

test('informe IRI elimina document.write y monta DOM parseado',async()=>{const source=await readFile(new URL('../src/m26/workflows/iri-report-document.js',import.meta.url),'utf8');assert.doesNotMatch(source,/document\.write\s*\(/);assert.doesNotMatch(source,/document\.open\?\.\(\)/);assert.doesNotMatch(source,/document\.close\?\.\(\)/);assert.match(source,/parseFromString\(String\(html\|\|''\),'text\/html'\)/);assert.match(source,/doc\.importNode\(parsed\.documentElement,true\)/);assert.match(source,/doc\.replaceChild\(imported,doc\.documentElement\)/);});

test('montaje IRI reemplaza el documento y falla cerrado sin parser',()=>{class Parser{parseFromString(html,type){assert.equal(type,'text/html');return {documentElement:{html}};}}const original={};let replacement=null;const document={documentElement:original,importNode(node,deep){assert.equal(deep,true);return {...node,imported:true};},replaceChild(next,current){assert.equal(current,original);replacement=next;}};assert.equal(__iriReportInternals.mountIriReportDocument({document,DOMParser:Parser},'<html><body>IBERFIT</body></html>'),document);assert.equal(replacement.imported,true);assert.match(replacement.html,/IBERFIT/);assert.throws(()=>__iriReportInternals.mountIriReportDocument({document:{documentElement:{}}},'<html></html>'),/M26_IRI_REPORT_POPUP_BLOCKED/);});
""",encoding='utf-8')
          PY
      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/m26/modules/route-render.js src/m26/app/workflow-controller.js src/m26/workflows/iri-report-document.js tests/m26_rc74_12_iri_a11y_report_render.test.mjs; then
            echo RC74_12_ALREADY_PATCHED
            exit 0
          fi
          git config user.name "iberfit-actions"
          git config user.email "iberfit.cl@gmail.com"
          git add src/m26/modules/route-render.js src/m26/app/workflow-controller.js src/m26/workflows/iri-report-document.js tests/m26_rc74_12_iri_a11y_report_render.test.mjs
          git diff --cached --check
          git commit -m "fix: cerrar accesibilidad IRI y renderer de informes"
          git push origin HEAD:feature/rc74-12-iri-a11y-report-render

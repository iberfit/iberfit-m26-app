name: Preview WEB IBERFIT V6.43.22 UX first impression
on:
  push:
    branches: [infra/web-iberfit-worker]
    paths: ['.github/workflows/deploy-web-iberfit-v64322-preview.yml']
permissions:
  contents: read
concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false
env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_SHA: '269072dee546fdbf310fb3f645f221067414dcc4'
  WEB_VERSION: '6.43.22'
  QA_SOURCE_SHA: 'c27fbe5ac7dae8d3a5182978eafb94e237284ec4'
  QA_RUN_ID: '36031373642'
  WRANGLER_VERSION: '4.120.0'
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify live baseline and exact certified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=64322-preview' | tr -d '\r\n ')" = '6.43.21'
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa.json
          node -e "const x=require('/tmp/qa.json');if(x.head_sha!==process.env.QA_SOURCE_SHA||x.status!=='completed'||x.conclusion!=='success'||x.name!=='Release WEB IBERFIT V6.43.22 UX first impression')throw Error('QA_MISMATCH')"
          git clone --filter=blob:none --no-checkout https://github.com/iberfit/iberfitweb.git /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=2 origin "$WEB_SHA"
          git -C /tmp/iberfitweb checkout --detach "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "$WEB_SHA"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD^)" = "$QA_SOURCE_SHA"
          test "$(git -C /tmp/iberfitweb log -1 --format=%s)" = 'feat(web): certify V6.43.22 first-impression UX'
          b=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$b/VERSION")" = "$WEB_VERSION"
          test "$(find "$b" -type f -name '*.html' | wc -l | tr -d ' ')" = '33'
          test -s "$b/assets/ux.v64322.css"
          test -s "$b/assets/ux.v64322.js"
          grep -q 'Si necesitas mucha corrección técnica en directo' "$b/online/index.html"
      - name: Deploy immutable Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          branch="v64322-ux-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 --project-name "$CF_PROJECT" --branch "$branch" --commit-hash "$WEB_SHA" --commit-message 'WEB IBERFIT V6.43.22 preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
      - name: Verify real preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$GITHUB_RUN_ID" | tr -d '\r\n ')" = "$WEB_VERSION"
          for a in ux.v64322.css ux.v64322.js analytics.v64322.js experience.v64322.js; do curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/$a?cb=$GITHUB_RUN_ID" -o "/tmp/$a"; test -s "/tmp/$a"; done
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$GITHUB_RUN_ID" | grep -q 'Si necesitas mucha corrección técnica en directo'
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          r=Path('/tmp/iberfitweb/candidate/v628');base=os.environ['PREVIEW_URL'].rstrip('/')
          htmls=sorted(r.rglob('*.html'));assert len(htmls)==33
          for p in htmls:
              rel=p.relative_to(r).as_posix();route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          print('PREVIEW_ROUTES_OK',len(htmls))
          PY
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$GITHUB_RUN_ID" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-headers
          grep -q '^content-security-policy:' /tmp/preview-headers
          grep -q "script-src-attr 'none'" /tmp/preview-headers
          ! grep -q 'unsafe-inline' /tmp/preview-headers
      - name: Browser QA on real preview
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          npm install --no-save --package-lock=false playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          BASE_URL="$PREVIEW_URL" QA_OUT=/tmp/v64321-preview-regression node .github/scripts/qa_v64321_browser.mjs
          BASE_URL="$PREVIEW_URL" QA_OUT=/tmp/v64322-preview-screens node .github/scripts/qa_v64322_browser.mjs
      - name: Record preview identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs'),x=require('/tmp/deployments.json');const d=(x.result||[]).filter(v=>v.environment==='preview'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA).sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];if(!d)throw Error('PREVIEW_NOT_FOUND');const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,previewUrl:process.env.PREVIEW_URL,previewDeploymentId:d.id,verifiedAt:new Date().toISOString()};fs.writeFileSync('/tmp/V64322_PREVIEW_EVIDENCE.json',JSON.stringify(e,null,2));console.log(JSON.stringify(e,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-v64322-preview-evidence
          path: |
            /tmp/V64322_PREVIEW_EVIDENCE.json
            /tmp/wrangler-preview.log
            /tmp/preview-headers
            /tmp/v64321-preview-regression/metrics.json
            /tmp/v64322-preview-screens
          if-no-files-found: warn
          retention-days: 30

name: IBERFIT Admin Interaction Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/app/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/design/**'
      - 'qa/admin-interaction/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/generate_final_production_runtime_config.mjs'
      - 'scripts/service_worker_release_identity.mjs'
      - 'scripts/verify_production_surface.mjs'
      - 'tests/m26_p0_service_worker_release_identity.test.mjs'
      - 'tests/m26_admin_browser_shards_contract.test.mjs'
      - 'tests/m26_playwright_cache_workflows.test.mjs'
      - 'playwright.admin-interaction.config.mjs'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/admin-interaction-matrix.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/app/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/design/**'
      - 'qa/admin-interaction/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/generate_final_production_runtime_config.mjs'
      - 'scripts/service_worker_release_identity.mjs'
      - 'scripts/verify_production_surface.mjs'
      - 'tests/m26_p0_service_worker_release_identity.test.mjs'
      - 'tests/m26_admin_browser_shards_contract.test.mjs'
      - 'tests/m26_playwright_cache_workflows.test.mjs'
      - 'playwright.admin-interaction.config.mjs'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/admin-interaction-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-admin-interaction-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: >-
              --project=admin-desktop-chromium
              --project=admin-tablet-chromium
              --project=admin-tablet-landscape-chromium
              --project=admin-mobile-chromium
          - browser: webkit
            projects: >-
              --project=admin-desktop-webkit
              --project=admin-mobile-webkit
          - browser: firefox
            projects: >-
              --project=admin-desktop-firefox
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify version-pinned Playwright ${{ matrix.browser }} binary
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium, firefox, webkit } from '@playwright/test'; const browser={chromium,firefox,webkit}[process.env.PW_BROWSER]; if(!browser||!fs.existsSync(browser.executablePath())) throw new Error('PLAYWRIGHT_'+String(process.env.PW_BROWSER||'UNKNOWN').toUpperCase()+'_NOT_READY');"
      - name: Exercise Client Coach Admin inputs selects focus and rerender · ${{ matrix.browser }}
        run: |
          mkdir -p test-results playwright-report
          chown -R pwuser:pwuser test-results playwright-report
          runuser -u pwuser -- npx playwright test --config playwright.admin-interaction.config.mjs ${{ matrix.projects }}
      - name: Preserve failures only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-interaction-matrix-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

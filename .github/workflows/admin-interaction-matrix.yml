name: IBERFIT Admin Interaction Matrix

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/app/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/design/**'
      - 'qa/admin-interaction/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/generate_final_production_runtime_config.mjs'
      - 'scripts/service_worker_release_identity.mjs'
      - 'scripts/verify_production_surface.mjs'
      - 'tests/m26_p0_service_worker_release_identity.test.mjs'
      - 'playwright.admin-interaction.config.mjs'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/admin-interaction-matrix.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/app/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/design/**'
      - 'qa/admin-interaction/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/generate_final_production_runtime_config.mjs'
      - 'scripts/service_worker_release_identity.mjs'
      - 'scripts/verify_production_surface.mjs'
      - 'tests/m26_p0_service_worker_release_identity.test.mjs'
      - 'playwright.admin-interaction.config.mjs'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/admin-interaction-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-admin-interaction-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-all
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium webkit firefox
      - name: Install Chromium WebKit and Firefox on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit firefox
      - name: Verify Playwright browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium, firefox, webkit } from '@playwright/test'; for (const [name,browser] of Object.entries({chromium, firefox, webkit})) if (!fs.existsSync(browser.executablePath())) throw new Error('PLAYWRIGHT_'+name.toUpperCase()+'_NOT_READY');"
      - name: Exercise Client Coach Admin inputs selects focus and rerender
        run: npx playwright test --config playwright.admin-interaction.config.mjs
      - name: Preserve failures only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-interaction-matrix-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

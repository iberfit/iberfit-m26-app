name: PR38 repair and generated asset sync

on:
  push:
    branches:
      - "feat/rc74-4-admin-coach-ux-i18n"

permissions:
  contents: write

concurrency:
  group: pr38-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply contract-preserving repairs
        run: |
          node <<'NODE'
          const fs=require('node:fs');

          function update(path,mutate,verify){
            const before=fs.readFileSync(path,'utf8');
            const after=mutate(before);
            verify(after);
            if(after!==before)fs.writeFileSync(path,after,'utf8');
          }

          update('public/m26/index.html',(source)=>{
            const block=`        <img\n          src="/public/isotipo-iberfit.png"\n          alt=""\n          aria-hidden="true"\n        >\n`;
            return source.replace(block,'');
          },(source)=>{
            if(source.includes('src="/public/isotipo-iberfit.png"'))throw new Error('PR38_PREAUTH_BRAND_FETCH_STILL_ACTIVE');
            if(!source.includes('data-href="/src/m26/design/premium-ux.css"'))throw new Error('PR38_PREMIUM_STYLE_DECLARATION_MISSING');
          });

          update('tests/m26_rc64_2a_performance_real_shell_foundation.test.mjs',(source)=>{
            let next=source.replace('assert.equal(deferred.length,13);','assert.equal(deferred.length,14);');
            if(!next.includes("'/src/m26/design/premium-ux.css'")){
              next=next.replace(
                "    '/src/m26/design/role-surfaces.css',\n",
                "    '/src/m26/design/role-surfaces.css',\n    '/src/m26/design/premium-ux.css',\n"
              );
            }
            next=next.replace(
              '  assert.match(critical,/min-height:44px/u);',
              "  const preauthControlMinHeight=Number(critical.match(/\\.m26-auth-card input,\\.m26-auth-card button\\{[^}]*min-height:(\\d+)px/u)?.[1]||0);\n  assert.ok(preauthControlMinHeight>=44);"
            );
            next=next.replace(
              "test('RC64.2A real-shell inherits the explicit RC23 es-ES locale contract',()=>{",
              "test('RC64.2A real-shell keeps static es-ES bootstrap while app locale defaults to Chile',()=>{"
            );
            next=next.replace(
              '  assert.match(rc23,/RC23 fija castellano de España en documento, PWA y utilidades/u);',
              '  assert.match(rc23,/RC23 conserva castellano y permite locale regional Chile en la aplicación/u);'
            );
            next=next.replace(
              "  assert.match(rc23,/IBERFIT_UI_LOCALE,'es-ES'/u);",
              "  assert.match(rc23,/IBERFIT_UI_LOCALE,'es-CL'/u);"
            );
            return next;
          },(source)=>{
            if(!source.includes('assert.equal(deferred.length,14);'))throw new Error('PR38_DEFERRED_STYLE_COUNT_NOT_UPDATED');
            if(!source.includes("'/src/m26/design/premium-ux.css'"))throw new Error('PR38_PREMIUM_STYLE_CONTRACT_MISSING');
            if(!source.includes('preauthControlMinHeight>=44'))throw new Error('PR38_TOUCH_TARGET_THRESHOLD_MISSING');
            if(!source.includes('app locale defaults to Chile'))throw new Error('PR38_LOCALE_CONTRACT_NOT_UPDATED');
          });

          update('tests/m26_rc71_2_preferences_i18n.test.mjs',(source)=>{
            const start=source.indexOf("test('i18n separa idioma de locale");
            const end=source.indexOf("\ntest('preferencias sociales",start);
            if(start<0||end<0)throw new Error('PR38_I18N_TEST_BOUNDARY_MISSING');
            const replacement=`test('i18n separa idioma de locale y expone los cuatro bundles aprobados',()=>withStorage(()=>{\n  assert.deepEqual(\n    IBERFIT_LANGUAGE_CATALOG.map((item)=>item.value),\n    ['es','en','fr','pt'],\n  );\n\n  assert.deepEqual(\n    iberfitLanguageOptions().map((item)=>item.value),\n    ['es','en','fr','pt'],\n  );\n\n  assert.equal(iberfitPlannedLanguages().length,4);\n  assert.equal(getIberfitLanguage(),'es');\n  assert.equal(getIberfitLocale(),'es-CL');\n\n  assert.deepEqual(\n    iberfitLocaleOptions('es').map((item)=>item.value),\n    ['es-CL','es-ES'],\n  );\n\n  assert.equal(setIberfitLanguage('en'),'en');\n  assert.equal(getIberfitLanguage(),'en');\n  assert.equal(getIberfitLocale('en'),'en-GB');\n\n  assert.equal(\n    setIberfitLocale('en-US',{language:'en'}),\n    'en-US',\n  );\n  assert.equal(getIberfitLocale('en'),'en-US');\n\n  assert.equal(setIberfitLanguage('es'),'es');\n  assert.equal(getIberfitLanguage(),'es');\n  assert.equal(getIberfitLocale('es'),'es-CL');\n}));\n`;
            return source.slice(0,start)+replacement+source.slice(end);
          },(source)=>{
            if(!source.includes("['es','en','fr','pt']"))throw new Error('PR38_FOUR_LANGUAGE_CONTRACT_MISSING');
            if(source.includes("['es','en','de','fr','pt']"))throw new Error('PR38_STALE_GERMAN_CONTRACT_PRESENT');
          });
          NODE

      - name: Generate canonical PWA shell
        run: |
          node scripts/generate_rc58_app_shell.mjs
          node scripts/generate_rc58_app_shell.mjs --check

      - name: Run focused regression set
        run: |
          node --test tests/m26_rc23_castellano_ui.test.mjs
          node --test tests/m26_rc31_civil_dates.test.mjs
          node --test tests/m26_rc58_5c_b_app_integrity.test.mjs
          node --test tests/m26_rc64_2a_performance_real_shell_foundation.test.mjs
          node --test tests/m26_rc71_2_preferences_i18n.test.mjs
          node --test tests/m26_admin_coach_workspace_i18n.test.mjs
          git diff --check

      - name: Commit generated repairs to safe feature branch
        run: |
          if git diff --quiet; then
            echo "PR38_REPAIR_NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/m26/sw.js public/m26/index.html tests/m26_rc64_2a_performance_real_shell_foundation.test.mjs tests/m26_rc71_2_preferences_i18n.test.mjs
          git commit -m "fix(pr38): close i18n pwa and preauth regressions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

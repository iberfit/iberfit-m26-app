name: Verify WEB IBERFIT production state

on:
  push:
    branches: [infra/web-iberfit-worker]
    paths:
      - '.iberfit/web-public-production.json'
      - '.github/workflows/verify-web-public-production-state.yml'

permissions:
  contents: read

concurrency:
  group: verify-web-public-production-state
  cancel-in-progress: true

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest Cloudflare live rollback checkpoint and editorial contracts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 41
          node <<'NODE'
          const fs=require('fs'),m=JSON.parse(fs.readFileSync('.iberfit/web-public-production.json','utf8'));
          const bad=x=>{throw Error(x)};
          if(m.schema!=='iberfit.web.public-production.v1'||m.repository!=='iberfit/iberfitweb'||m.domain!=='https://iberfit.cl')bad('MANIFEST_IDENTITY');
          if(!/^6\.43\.(25|26)$/.test(m.version||''))bad('UNSUPPORTED_VERSION:'+m.version);
          if(!/^[0-9a-f]{40}$/.test(m.sha||'')||!/^[0-9a-f-]{36}$/.test(m.deploymentId||''))bad('MANIFEST_CURRENT');
          if(!m.safeRollback||!/^[0-9a-f]{40}$/.test(m.safeRollback.sha||'')||!/^[0-9a-f-]{36}$/.test(m.safeRollback.deploymentId||''))bad('MANIFEST_ROLLBACK');
          for(const k of ['qaRunId','previewRunId','productionRunId'])if(!Number.isInteger(m[k])||m[k]<=0)bad('MANIFEST_RUN_'+k);
          NODE
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs'),m=require(process.cwd()+'/.iberfit/web-public-production.json'),p=require('/tmp/project.json'),x=require('/tmp/deployments.json');
          if(!p.success||p.result?.production_branch!=='production'||!(p.result?.domains||[]).includes('iberfit.cl')||(p.result?.domains||[]).includes('app.iberfit.cl'))throw Error('PROJECT_OR_DOMAIN_MISMATCH');
          const current=(x.result||[]).filter(d=>d.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(current?.id!==m.deploymentId)throw Error('DRIFT_DEPLOYMENT:'+current?.id);
          if((current?.deployment_trigger?.metadata?.commit_hash||'')!==m.sha)throw Error('DRIFT_SHA');
          const rb=(x.result||[]).find(d=>d.id===m.safeRollback.deploymentId);
          if(!rb||(rb.deployment_trigger?.metadata?.commit_hash||'')!==m.safeRollback.sha)throw Error('ROLLBACK_DRIFT');
          NODE
          VERSION="$(node -p "require('./.iberfit/web-public-production.json').version")"
          SHA="$(node -p "require('./.iberfit/web-public-production.json').sha")"
          test "$(curl -fsSL --retry 6 --retry-all-errors "https://iberfit.cl/VERSION?state=$GITHUB_RUN_ID" | tr -d '\r\n ')" = "$VERSION"
          curl -fsSI --retry 6 --retry-all-errors "https://iberfit.cl/?state=$GITHUB_RUN_ID" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/headers
          grep -q '^content-security-policy:' /tmp/headers
          grep -q "script-src-attr 'none'" /tmp/headers
          ! grep -q 'unsafe-inline' /tmp/headers

          if [ "$VERSION" = '6.43.26' ]; then
            CHECKPOINT='checkpoint/v64326-local-editorial-policy-production-2026-10-01'
            for pair in \
              'entrenador-personal-las-condes|No inferimos cómo te mueves' \
              'entrenador-personal-vitacura|No deducimos tus hábitos' \
              'entrenamiento-personal-providencia|No suponemos que caminas' \
              'entrenador-personal-lo-barnechea|No asumimos montaña'; do
              route="${pair%%|*}"; phrase="${pair#*|}"; file="/tmp/$(echo "$route"|tr '/' '-').html"
              curl -fsSL --retry 6 --retry-all-errors "https://iberfit.cl/${route}/?state=$GITHUB_RUN_ID" -o "$file"
              grep -q "$phrase" "$file"
              grep -q 'La comuna define la cobertura; tu contexto define el plan.' "$file"
            done
            curl -fsSL --retry 6 --retry-all-errors "https://iberfit.cl/personal-trainer-nunoa/?state=$GITHUB_RUN_ID" -o /tmp/nunoa.html
            grep -q 'No inferimos tus hábitos, tus actividades ni tus lugares preferidos por vivir en Ñuñoa.' /tmp/nunoa.html
            ! grep -qi 'vida de barrio' /tmp/nunoa.html
          else
            CHECKPOINT='checkpoint/v64325-person-first-local-production-2026-09-30'
            curl -fsSL --retry 6 --retry-all-errors "https://iberfit.cl/entrenador-personal-la-reina/?state=$GITHUB_RUN_ID" -o /tmp/reina.html
            grep -q 'Tu forma de entrenar no se deduce de la comuna.' /tmp/reina.html
            curl -fsSL --retry 6 --retry-all-errors "https://iberfit.cl/personal-trainer-nunoa/?state=$GITHUB_RUN_ID" -o /tmp/nunoa.html
            grep -q 'No inferimos tus hábitos, tus actividades ni tus lugares preferidos por vivir en Ñuñoa.' /tmp/nunoa.html
          fi

          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/iberfit/iberfitweb/branches/${CHECKPOINT}" -o /tmp/checkpoint.json
          node <<'NODE'
          const fs=require('fs'),m=require(process.cwd()+'/.iberfit/web-public-production.json'),b=require('/tmp/checkpoint.json');
          if(b.commit?.sha!==m.sha)throw Error('CHECKPOINT_DRIFT:'+b.commit?.sha);
          console.log('WEB_PUBLIC_PRODUCTION_STATE_OK',m.version,m.sha,m.deploymentId);
          NODE

name: IBERFIT Exercise Media Regeneration Scheduler

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: iberfit-exercise-media-regeneration-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch-canonical-regeneration-queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Canary regeneration queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exercise-media-human-regeneration.yml/dispatches" \
            -d '{"ref":"canary/rc74-4"}'

name: IBERFIT QA Patch Multiapp Runtime

on:
  pull_request:
    branches:
      - qa/patch-multiapp-runtime-base-20260918
    paths:
      - '.github/qa-patch-multiapp-runtime.trigger'

permissions:
  contents: write

concurrency:
  group: iberfit-qa-patch-multiapp-runtime
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'qa/patch-multiapp-runtime-base-20260918' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/p1-multiapp-runtime-application-access-20260918
      EXPECTED_BASE_SHA: 4cdbc77f4173e406b4f434e52a5680d681da18b5
    steps:
      - name: Checkout exact product fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"

      - name: Remove stale identity dependency and strengthen regression
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          import re

          path=Path('src/m26/app/application.js')
          source=path.read_text(encoding='utf-8')

          cleanup_pattern=re.compile(
              r"(?m)^(?P<i>\s*)const state=store\.getState\(\);\n"
              r"(?P=i)const identity=state\.identity\|\|\{\};\n"
              r"(?P=i)const applicationAccess=state\.applicationAccess\|\|\{\};\n"
              r"(?P=i)const allowed=Array\.isArray\(applicationAccess\.authorizedRoles\)\?applicationAccess\.authorizedRoles:\[\];"
          )
          matches=list(cleanup_pattern.finditer(source))
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one role-switch cleanup block, found {len(matches)}')

          def replace_cleanup(match):
              i=match.group('i')
              return (
                  f"{i}const applicationAccess=store.getState().applicationAccess||{{}};\n"
                  f"{i}const allowed=Array.isArray(applicationAccess.authorizedRoles)?applicationAccess.authorizedRoles:[];"
              )

          source=cleanup_pattern.sub(replace_cleanup,source,count=1)
          path.write_text(source,encoding='utf-8')

          test_path=Path('tests/m26_multiapp_runtime_application_access.test.mjs')
          test_path.write_text(dedent("""\
            import test from 'node:test';
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';

            const applicationSource=await fs.readFile(new URL('../src/m26/app/application.js',import.meta.url),'utf8');

            function between(source,start,end){
              const from=source.indexOf(start);
              assert.notEqual(from,-1,`missing start marker: ${start}`);
              const to=source.indexOf(end,from+start.length);
              assert.notEqual(to,-1,`missing end marker: ${end}`);
              return source.slice(from,to);
            }

            test('runtime role switch authorizes only from applicationAccess',()=>{
              const handler=between(applicationSource,'async function onSwitchRole(event){','function onInspectOperation');
              assert.match(handler,/const applicationAccess=store\.getState\(\)\.applicationAccess\|\|\{\};/u);
              assert.match(handler,/const allowed=Array\.isArray\(applicationAccess\.authorizedRoles\)\?applicationAccess\.authorizedRoles:\[\];/u);
              assert.match(handler,/canSwitchApplication\(applicationAccess\)\|\|!allowed\.includes\(role\)/u);
              assert.doesNotMatch(handler,/identity\.authorizedRoles|canSwitchApplication\(identity\)|const identity=/u);
            });

            test('progressive onboarding stays suppressed until a required multiapp choice is confirmed',()=>{
              const provider=between(applicationSource,'identityProvider:()=>{','mediaExperience=createExerciseVideoExperienceController');
              assert.match(provider,/const applicationAccess=state\.applicationAccess\|\|\{\};/u);
              assert.match(provider,/const roleChoiceConfirmed=applicationAccess\.roleChoiceConfirmed===true\|\|!canSwitchApplication\(applicationAccess\);/u);
              assert.doesNotMatch(provider,/roleChoiceConfirmed=identity\.roleChoiceConfirmed!==false/u);
            });
          """),encoding='utf-8')

      - name: Validate targeted regressions and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test \
            tests/m26_multiapp_runtime_application_access.test.mjs \
            tests/m26_client_multiapp_security_projection.test.mjs

      - name: Commit exact product cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name 'IBERFIT QA Patch Bot'
          git config user.email 'qa-patch-bot@users.noreply.github.com'
          git add src/m26/app/application.js tests/m26_multiapp_runtime_application_access.test.mjs
          git commit -m 'test(auth): tighten multiapp runtime access regression'
          git push origin "HEAD:${TARGET_BRANCH}"

name: Apply session next-exercise preview

on:
  push:
    branches:
      - feat/session-next-exercise-preview
    paths:
      - .github/workflows/apply-session-next-exercise-preview.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-next-exercise-preview
      - name: Apply minimal session UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/m26/workflows/session-ui.js')
          text = path.read_text(encoding='utf-8')
          marker = 'data-session-next-exercise-media'
          if marker in text:
              raise SystemExit('Patch already present')

          anchor = """function nextExecutionCopy(execution,catalog){
            const item=execution?.queue?.[execution.index];
            if(!item)return {label:'Finalizar ejercicio',detail:''};
            if(execution.setIndex+1<item.sets){
              const ex=catalog.get(item.exerciseId);
              return {label:`Continuar · serie ${execution.setIndex+2}`,detail:ex?.name_es||'Mismo ejercicio'};
            }
            const next=execution.queue[execution.index+1];
            if(!next)return {label:'Continuar al cierre',detail:'Última serie completada'};
            const ex=catalog.get(next.exerciseId);
            return {label:'Continuar al siguiente',detail:ex?.name_es||'Siguiente ejercicio'};
          }
          """
          helper = anchor + """function nextDifferentExercisePreview(execution,catalog,mediaMap,role){
            const item=execution?.queue?.[execution.index];
            if(!item||execution.setIndex+1<Number(item.sets||0))return '';
            const next=execution.queue[execution.index+1];
            if(!next||next.exerciseId===item.exerciseId)return '';
            const exercise=catalog.get(next.exerciseId);
            if(!exercise)return '';
            const visual=renderExerciseMedia({
              manifest:mediaMap,
              exercise:{...exercise,id:next.exerciseId},
              role,
              compact:true,
              fallback:false,
            });
            if(!visual)return '';
            return `<div class=\"m26-session-next-exercise-media\" data-session-next-exercise-media aria-label=\"Vista previa del siguiente ejercicio\">${visual}</div>`;
          }
          """
          if text.count(anchor) != 1:
              raise SystemExit('nextExecutionCopy anchor mismatch')
          text = text.replace(anchor, helper, 1)

          anchor = "  const nextCopy=nextExecutionCopy(execution,catalog);\n"
          replacement = anchor + """  const nextExercisePreview=restActive
            ?nextDifferentExercisePreview(execution,catalog,mediaMap,role)
            :'';
          """
          if text.count(anchor) != 1:
              raise SystemExit('nextCopy anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          anchor = "        <p data-session-next-preview>Siguiente: <strong>${e(nextCopy.detail||nextCopy.label)}</strong></p>\n"
          replacement = anchor + "        ${nextExercisePreview}\n"
          if text.count(anchor) != 1:
              raise SystemExit('rest preview anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/m26/workflows/session-ui.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-ui.js
          git commit -m "feat(session): preview next exercise during rest"
          git push origin HEAD:feat/session-next-exercise-preview

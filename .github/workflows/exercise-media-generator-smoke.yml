name: IBERFIT Exercise Media Generator Smoke

on:
  pull_request:
    branches:
      - canary/rc74-4
    paths:
      - 'scripts/exercise-media/generate-cloudflare.mjs'
      - 'scripts/exercise-media/qa-cloudflare.mjs'
      - 'scripts/exercise-media/reference/**'
      - 'tests/m26_exercise_media_cloudflare_generator.test.mjs'
      - '.github/workflows/exercise-media-generator-smoke.yml'
  workflow_dispatch:
    inputs:
      exercise_id:
        description: Canonical exercise_id to generate
        required: true
        default: bw-squat
        type: string
      run_visual_qa:
        description: Run Cloudflare vision QA after generation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: iberfit-exercise-media-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 5b03d387427d367674b9d05b8bdf7c84
  EXERCISE_ID: ${{ inputs.exercise_id || 'bw-squat' }}
  ATHLETE_REFERENCE: scripts/exercise-media/reference/athlete-approved-v1.jpg
  ISOTYPE_REFERENCE: scripts/exercise-media/reference/iberfit-isotype-official-v1.png

jobs:
  generate-quarantined-candidate:
    name: generate-quarantined-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar contrato del generador
        shell: bash
        run: node --test tests/m26_exercise_media_cloudflare_generator.test.mjs

      - name: Validar referencias canónicas
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ATHLETE_REFERENCE"
          test -s "$ISOTYPE_REFERENCE"
          node - <<'NODE'
          const fs=require('fs');
          for(const file of [process.env.ATHLETE_REFERENCE,process.env.ISOTYPE_REFERENCE]){
            const size=fs.statSync(file).size;
            if(size<=0||size>2_000_000)throw new Error(`IBERFIT_REFERENCE_SIZE_INVALID:${file}:${size}`);
          }
          console.log(JSON.stringify({references:true}));
          NODE

      - name: Generar candidato IBERFIT por Workers AI REST
        id: generate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'CLOUDFLARE_API_TOKEN no está disponible en este workflow.' >&2
            exit 1
          fi
          rm -rf recovery/exercise-media-smoke
          mkdir -p recovery
          node scripts/exercise-media/generate-cloudflare.mjs \
            --catalog baseline_m25_2/exercise-catalog-m25.json \
            --exercise-id "$EXERCISE_ID" \
            --athlete-ref "$ATHLETE_REFERENCE" \
            --logo-ref "$ISOTYPE_REFERENCE" \
            --out-dir recovery/exercise-media-smoke | tee recovery/exercise-media-generate.log
          image="$(find recovery/exercise-media-smoke -maxdepth 1 -type f -name '*-candidate.*' ! -name '*.json' | head -n 1)"
          if [[ -z "$image" || ! -s "$image" ]]; then
            echo 'No se generó imagen candidata.' >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: QA visual y biomecánica automático
        if: ${{ github.event_name == 'pull_request' || inputs.run_visual_qa }}
        id: qa
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node scripts/exercise-media/qa-cloudflare.mjs \
            --catalog baseline_m25_2/exercise-catalog-m25.json \
            --exercise-id "$EXERCISE_ID" \
            --image "${{ steps.generate.outputs.image }}" \
            --out recovery/exercise-media-smoke/qa-report.json | tee recovery/exercise-media-qa.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 1 ]]; then
            echo 'El revisor no pudo ejecutarse.' >&2
            exit 1
          fi
          if [[ "$rc" -eq 2 ]]; then
            echo 'Candidato correctamente bloqueado por QA; permanece en cuarentena.'
          fi

      - name: Confirmar aislamiento y no publicación
        shell: bash
        run: |
          set -euo pipefail
          test -f "recovery/exercise-media-smoke/${EXERCISE_ID}-candidate.json"
          node - <<'NODE'
          const fs=require('fs');
          const id=process.env.EXERCISE_ID;
          const x=JSON.parse(fs.readFileSync(`recovery/exercise-media-smoke/${id}-candidate.json`,'utf8'));
          if(x.publishable!==false)throw new Error('SMOKE_CANDIDATE_MUST_NOT_BE_PUBLISHABLE');
          if(x.qa?.biomechanics!=='pending'||x.qa?.visual!=='pending')throw new Error('GENERATION_MUST_NOT_SELF_APPROVE');
          if(x.transport!=='rest_api')throw new Error('SMOKE_MUST_USE_WORKERS_AI_REST');
          if(x.references?.athlete!==true||x.references?.official_isotype!==true)throw new Error('SMOKE_CANONICAL_REFERENCES_REQUIRED');
          console.log(JSON.stringify({safe:true,publishable:x.publishable,qa:x.qa,transport:x.transport,references:x.references}));
          NODE

      - name: Conservar candidato y evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-exercise-media-smoke-${{ env.EXERCISE_ID }}-${{ github.run_id }}
          path: |
            recovery/exercise-media-smoke/**
            recovery/exercise-media-generate.log
            recovery/exercise-media-qa.log
          if-no-files-found: warn
          retention-days: 14

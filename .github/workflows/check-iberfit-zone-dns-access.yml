name: Check iberfit.cl DNS access

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/check-iberfit-zone-dns-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_ZONE_ID: '44302103d0c37a304bad49fbbe0501d5'
      DOMAIN: 'iberfit.cl'
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar lectura DNS por zone ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for NAME in "$DOMAIN" "www.$DOMAIN" "web.$DOMAIN"; do
            OUT="/tmp/$(echo "$NAME"|tr '.' '_').json"
            CODE="$(curl --silent --show-error -o "$OUT" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${NAME}")"
            echo "DNS_READ name=$NAME http=$CODE"
            cat "$OUT"
            echo
          done

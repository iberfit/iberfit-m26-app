name: IBERFIT U66 Closed U60 Real Hosted QA JWT Gate

on:
  push:
    branches: ['feat/u60-training360-r50-reconciled-20261104']
    paths:
      - '.github/workflows/u66-qa-closed-jwt.yml'
      - 'scripts/remote-gates/qa_u60_closed_hosted_jwt_gate.mjs'
      - 'tests/m26_u66_qa_closed_jwt_gate.test.mjs'

permissions:
  contents: read

concurrency:
  group: iberfit-u66-closed-real-qa-jwt
  cancel-in-progress: false

jobs:
  qa-closed-jwt:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: m26-canary-readonly
    env:
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
      M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
      M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
      M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit real JWT QA closure tests
        run: node --test tests/m26_u66_qa_closed_jwt_gate.test.mjs
      - name: Three hosted JWTs, eight HTTP negative gates, no writes
        run: node scripts/remote-gates/qa_u60_closed_hosted_jwt_gate.mjs
      - name: Preserve redacted QA authorization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u66-qa-hosted-jwt-${{ github.run_id }}
          path: recovery/u66-qa-jwt/gate.json
          if-no-files-found: warn
          retention-days: 14

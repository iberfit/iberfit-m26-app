name: QA WEB IBERFIT Pages real

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/qa-web-iberfit-pages-real.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-web-iberfit-pages-real
  cancel-in-progress: true

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  WEB_PROJECT: 'web-iberfit'
  APP_PROJECT: 'iberfit-m26-production'
  WEB_SHA: '8d6fcb12a9472e9ef78b9973ca3d0cd9d71244ab'
  BASE_URL: 'https://web-iberfit.pages.dev'

jobs:
  qa-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout infraestructura
        uses: actions/checkout@v4

      - name: Descargar QA exacto de la candidata certificada
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/iberfit/iberfitweb.git /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          test -s /tmp/iberfitweb/.github/scripts/qa_v628_dispositivos.mjs

      - name: Preflight HTTP, SEO y huella V6.28
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /
            /diagnostico-iri/
            /contacto/
            /metodo/
            /sobre-iberfit/
            /online/
            /entrenador-personal-las-condes/
            /privacidad/
            /en/
            /robots.txt
            /sitemap.xml
          )
          mkdir -p /tmp/http
          for path in "${routes[@]}"; do
            safe="$(echo "$path" | sed 's#[^A-Za-z0-9]#_#g')"
            code="$(curl --silent --show-error --location --retry 4 --retry-all-errors               --connect-timeout 10 --max-time 30               -o "/tmp/http/${safe}.body" -D "/tmp/http/${safe}.headers"               -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done

          grep -Fq '>A distancia</a>' /tmp/http/_.body
          grep -Fq '/assets/analytics.v628.js' /tmp/http/_.body
          grep -Fq 'https://iberfit.cl/' /tmp/http/_.body
          grep -Fq 'Entrenamiento a distancia' /tmp/http/_online_.body
          if grep -Eiq '(^|[[:space:]>])Online([[:space:]<]|$)' /tmp/http/_online_.body; then
            echo 'ONLINE_VISIBLE_EN_ES=true'
            exit 31
          fi
          grep -Fq 'Sitemap: https://iberfit.cl/sitemap.xml' /tmp/http/_robots_txt.body
          grep -Fq '<lastmod>2026-09-12</lastmod>' /tmp/http/_sitemap_xml.body

      - name: Verificar aislamiento WEB y APP en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          for project in "${WEB_PROJECT}" "${APP_PROJECT}"; do
            curl --fail --silent --show-error "${AUTH[@]}"               "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${project}"               -o "/tmp/${project}.json"
          done
          node <<'NODE'
          const fs=require('fs');
          const web=JSON.parse(fs.readFileSync('/tmp/web-iberfit.json','utf8'));
          const app=JSON.parse(fs.readFileSync('/tmp/iberfit-m26-production.json','utf8'));
          if(!web.success||!app.success) throw new Error('PAGES_PROJECT_LOOKUP_FAILED');
          const wd=web.result.domains||[];
          const ad=app.result.domains||[];
          if(wd.includes('app.iberfit.cl')) throw new Error('WEB_PROJECT_HAS_APP_DOMAIN');
          if(!ad.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_MISSING_FROM_APP_PROJECT');
          if(ad.includes('iberfit.cl') || ad.includes('web.iberfit.cl')) throw new Error('APP_PROJECT_HAS_CORPORATE_WEB_DOMAIN');
          console.log('WEB_DOMAINS='+JSON.stringify(wd));
          console.log('APP_DOMAINS='+JSON.stringify(ad));
          NODE

      - name: Preparar Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar navegador de QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: QA multidispositivo contra Pages real
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/iberfitweb
          BASE_URL="${BASE_URL}" QA_OUT="/tmp/evidence/web-iberfit-pages-real"             node .github/scripts/qa_v628_dispositivos.mjs

      - name: Verificar analytics y consentimiento en artefacto servido
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "${BASE_URL}/assets/analytics.v628.js" -o /tmp/analytics.js
          curl --fail --silent --show-error --location "${BASE_URL}/assets/analytics-config.js" -o /tmp/analytics-config.js
          grep -Fq 'generate_lead' /tmp/analytics.js
          grep -Fq 'G-JXD1JSN7K3' /tmp/analytics-config.js
          grep -Eiq 'consent|analytics_storage' /tmp/analytics.js /tmp/analytics-config.js

      - name: Guardar evidencia QA real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-iberfit-pages-real-${{ github.run_id }}
          path: |
            /tmp/evidence/web-iberfit-pages-real
            /tmp/http
          if-no-files-found: warn
          retention-days: 30

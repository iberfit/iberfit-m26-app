name: IBERFIT U73 QA Recover Original U71 Synthetic Workout

# Single known QA synthetic fixture, no new appointments or occurrences.
# Attempt 1 read-only exact-ID verification; second attempt after explicit
# successful-job rerun only, with owner-proof and current-head guard.
on:
  push:
    branches: ['feat/u60-training360-r50-reconciled-20261104']
    paths:
      - '.github/workflows/u73-qa-recover-synthetic.yml'
      - 'scripts/remote-gates/qa_u73_recover_original_workout.mjs'
      - 'tests/m26_u73_qa_recover_original_workout.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: iberfit-qa-shared-auth-readonly
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: m26-canary-readonly
    env:
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
      M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
      M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
      M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Source-level QA one-fixture recovery constraints
        run: node --test tests/m26_u73_qa_recover_original_workout.test.mjs
      - name: Preflight exact synthetic execution; READ ONLY
        if: ${{ github.run_attempt == 1 }}
        run: node scripts/remote-gates/qa_u73_recover_original_workout.mjs preflight
      - name: Preserve immutable scoped preflight
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u73-first-${{ github.run_id }}
          path: recovery/u73-qa-recover/evidence.json
          if-no-files-found: error
          retention-days: 2
      - name: Download original proof from successful first attempt
        if: ${{ github.run_attempt == 2 }}
        uses: actions/download-artifact@v4
        with:
          name: iberfit-u73-first-${{ github.run_id }}
          path: .tmp/u73-first
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Advance and close only the original QA synthetic execution
        if: ${{ github.run_attempt == 2 }}
        run: node scripts/remote-gates/qa_u73_recover_original_workout.mjs apply
      - name: Preserve redacted recovery phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u73-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/u73-qa-recover/evidence.json
          if-no-files-found: warn
          retention-days: 14

name: TEMP substitution progress fix

on:
  push:
    branches:
      - fix/session-substitution-after-progress
    paths:
      - .github/workflows/temp-substitution-progress-fix.yml
      - scripts/temp-substitution-progress-fix.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/temp-substitution-progress-fix.mjs
      - name: Focused regression
        run: node --test tests/m26_session_substitution_progress.test.mjs tests/m26_session_execution_ui.test.mjs tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_current_exercise_history.test.mjs
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-execution.js tests/m26_session_substitution_progress.test.mjs
          git diff --cached --check
          git commit -m "fix(session): block substitution after occurrence progress"
          git push origin HEAD:fix/session-substitution-after-progress

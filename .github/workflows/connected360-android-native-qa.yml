name: IBERFIT Connected 360 Android Native QA
on:
  pull_request:
    paths:
      - "native/android-health-connect/**"
      - "native/android-host/phone-app/**"
      - "src/m26/wearables/qa-native-channel.js"
      - "src/m26/wearables/qa-native-import.js"
      - "src/m26/wearables/controller.js"
      - "tests/m26_connected360_qa_session_transport.test.mjs"
      - "tests/m26_connected360_qa_native_import.test.mjs"
      - "tests/m26_connected360_native_consent_generation.test.mjs"
      - ".github/workflows/connected360-android-native-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-health-connect-library:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Hosted Ubuntu has Android SDK command-line tools. The setup-android action
      # currently attempts to install removed legacy 'tools' and fails closed.
      - name: Prepare installed Android SDK 35
        shell: bash
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build read-only Health Connect SDK and run unit tests
        run: gradle --no-daemon -p native/android-health-connect :healthconnect:testDebugUnitTest :healthconnect:assembleDebug
      - name: Reject writing permissions and credentials
        shell: bash
        run: |
          ! grep -RIn "android.permission.health.WRITE_" native/android-health-connect/healthconnect/src/main/AndroidManifest.xml
          ! grep -RInE "service_role|SUPABASE_SERVICE_KEY|addJavascriptInterface" native/android-health-connect/healthconnect/src/main

  android-existing-phone-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Compile existing native phone host with Health Connect permission screen
        run: gradle --no-daemon -p native/android-host :phone-app:testDebugUnitTest :phone-app:assembleDebug :phone-app:assembleRelease
      - name: Assert authenticated QA handoff never grants remote consent
        shell: bash
        run: |
          set -euo pipefail
          test -s src/m26/wearables/qa-native-channel.js
          grep -Fq 'createConnected360QaNativeChannel' src/m26/wearables/controller.js
          grep -Fq 'oneReadApproved = false' native/android-host/phone-app/src/main/java/cl/iberfit/m26/phone/Connected360SecureWebViewActivity.kt
          ! grep -Eiq 'service_role|SUPABASE_SERVICE_KEY|addJavascriptInterface' native/android-host/phone-app/src/main/java/cl/iberfit/m26/phone/Connected360SecureWebViewActivity.kt
          node --test tests/m26_connected360_qa_session_transport.test.mjs tests/m26_connected360_qa_native_import.test.mjs tests/m26_connected360_native_consent_generation.test.mjs
      - name: Enforce local-only proof and official rationale
        shell: bash
        run: |
          set -euo pipefail
          H=native/android-host/phone-app/src/main/AndroidManifest.xml
          K=native/android-host/phone-app/src/main/java/cl/iberfit/m26/phone/Connected360HealthPermissionsActivity.kt
          grep -Fq 'androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE' "$H"
          grep -Fq 'android.intent.category.HEALTH_PERMISSIONS' "$H"
          WEB=native/android-host/phone-app/src/main/java/cl/iberfit/m26/phone/Connected360SecureWebViewActivity.kt
          GATE=native/android-host/phone-app/src/main/java/cl/iberfit/m26/phone/Connected360OriginGate.kt
          grep -Fq 'android.permission.INTERNET' "$H"
          grep -Fq 'WebViewCompat.addWebMessageListener' "$WEB"
          grep -Fq 'WebViewFeature.WEB_MESSAGE_LISTENER' "$WEB"
          grep -Fq 'm26-canary.iberfit.cl' "$GATE"
          grep -Fq 'isMainFrame' "$WEB"
          ! grep -Eiq 'addJavascriptInterface|service_role|SUPABASE_SERVICE_KEY' "$WEB" "$GATE"
          ! grep -Fq 'IBERFIT_HEALTH_BRIDGE =' "$WEB"
          ! grep -Eqi 'supabase|service_role|addJavascriptInterface|httpclient|fetch\(' "$K"

      # Downloadable only through the repository's GitHub Actions permissions.
      # This is a DEBUG Canary test package, never a release candidate.
      - name: Stamp isolated Canary Android QA APK
        shell: bash
        run: |
          set -euo pipefail
          APK=native/android-host/phone-app/build/outputs/apk/debug/phone-app-debug.apk
          test -s "$APK"
          sha256sum "$APK" > "${APK}.sha256"
      - name: Preserve short-lived Canary DEBUG APK for physical QA
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-connected360-canary-debug-${{ github.run_id }}
          path: |
            native/android-host/phone-app/build/outputs/apk/debug/phone-app-debug.apk
            native/android-host/phone-app/build/outputs/apk/debug/phone-app-debug.apk.sha256
          retention-days: 3
          if-no-files-found: error


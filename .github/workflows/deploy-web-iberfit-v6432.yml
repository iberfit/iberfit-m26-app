name: Deploy WEB IBERFIT V6.43.2 certified

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/deploy-web-iberfit-v6432.yml'

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: 'eb9c42b69088230c0c395f1b39bd0677012355c5'
  WEB_VERSION: '6.43.2'
  QA_SOURCE_SHA: 'ae2a9fb4ec23ceb07eff7d5756cc6371c17d1040'
  QA_RUN_ID: '35470984521'
  QA_RUN_NAME: 'Release WEB IBERFIT V6.43.2 visual storytelling'
  EXPECTED_ROLLBACK_SHA: 'c58402596ed8f3c90bcc51e04fd4c2f2ba8a98b9'
  EXPECTED_ROLLBACK_DEPLOYMENT_ID: 'cfe7e01e-6343-45b7-9679-c8245803465b'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout infrastructure only
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact V6.43.1 production baseline and capture rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||p.result?.name!==process.env.CF_PROJECT) throw new Error('PROJECT_LOOKUP');
          if(p.result.production_branch!=='production') throw new Error('PRODUCTION_BRANCH:'+p.result.production_branch);
          const domains=p.result.domains||[];
          if(!domains.includes('iberfit.cl')) throw new Error('IBERFIT_DOMAIN_MISSING');
          if(domains.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const current=(d.result||[]).filter(v=>v.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!current?.id) throw new Error('NO_CURRENT_PRODUCTION');
          if(current.id!==process.env.EXPECTED_ROLLBACK_DEPLOYMENT_ID) throw new Error('PRODUCTION_DRIFT_ID:'+current.id);
          const currentSha=current.deployment_trigger?.metadata?.commit_hash||'';
          if(currentSha!==process.env.EXPECTED_ROLLBACK_SHA) throw new Error('PRODUCTION_DRIFT_SHA:'+currentSha);
          fs.appendFileSync(process.env.GITHUB_ENV,`ROLLBACK_DEPLOYMENT_ID=${current.id}\nPRODUCTION_TOUCHED=0\n`);
          console.log(JSON.stringify({project:p.result.name,domains,currentDeploymentId:current.id,currentSha},null,2));
          NODE
          test "$(curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/VERSION?preflight=6432' | tr -d '\r\n ')" = '6.43.1'
          curl -fsSL --retry 6 --retry-all-errors 'https://iberfit.cl/online/?preflight=6432' -o /tmp/live-before-online.html
          grep -q '/assets/a11y.v6431.css' /tmp/live-before-online.html
          grep -q '/assets/analytics.v643.js' /tmp/live-before-online.html
          grep -q '/assets/menu.v642.js' /tmp/live-before-online.html
          ! grep -q '/assets/visual.v6432.css' /tmp/live-before-online.html
          ! grep -q '/assets/hardening.v630.js' /tmp/live-before-online.html

      - name: Verify certified QA identity and generated candidate lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" -o /tmp/qa-v6432.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/qa-v6432.json','utf8'));
          if(x.head_sha!==process.env.QA_SOURCE_SHA) throw new Error('QA_SOURCE_SHA:'+x.head_sha);
          if(x.status!=='completed'||x.conclusion!=='success') throw new Error('QA:'+x.status+':'+x.conclusion);
          if(x.name!==process.env.QA_RUN_NAME) throw new Error('QA_NAME:'+x.name);
          console.log(JSON.stringify({run:x.id,name:x.name,sourceSha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=2 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD^)" = "${QA_SOURCE_SHA}"
          test "$(git -C /tmp/iberfitweb log -1 --format=%s)" = 'feat(web): visualise Online and Hybrid with real app evidence'

      - name: Revalidate exact V6.43.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "${base}/VERSION")" = "${WEB_VERSION}"
          test "$(find "${base}" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/a11y.v6431.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/analytics.v643.js' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/visual.v6432.css' "${base}" --include='*.html' | wc -l | tr -d ' ')" = '4'
          for f in app-online-plan.webp app-online-session.webp app-online-progress.webp app-hybrid-feedback.webp; do test -s "${base}/assets/$f"; done
          ! grep -R -q '/assets/analytics.v632.js' "${base}" --include='*.html'
          ! grep -R -q '/assets/hardening.v630.js' "${base}" --include='*.html'
          grep -q '/assets/app-online-plan.webp' "${base}/online/index.html"
          grep -q '/assets/app-online-session.webp' "${base}/online/index.html"
          grep -q '/assets/app-online-progress.webp' "${base}/online/index.html"
          grep -q '/assets/app-hybrid-feedback.webp' "${base}/hibrido/index.html"
          grep -q '/assets/app-online-plan.webp' "${base}/en/online/index.html"
          grep -q '/assets/app-hybrid-feedback.webp' "${base}/en/hybrid/index.html"
          ! grep -R -n -E 'Cliente QA|Cliente Prueba IBERFIT|Coach QA' "${base}" --include='*.html'
          grep -q -- '--gold-text:#806216' "${base}/assets/a11y.v6431.css"
          grep -q 'contact_intent' "${base}/assets/analytics.v643.js"
          grep -q '^/assets/visual.v6432.css$' "${base}/_headers"
          grep -q '^/assets/app-online-plan.webp$' "${base}/_headers"
          grep -q "script-src-attr 'none'" "${base}/_headers"
          ! grep -q "'unsafe-inline'" "${base}/_headers"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/iberfitweb/candidate/v628/assets')
          names=['app-online-plan.webp','app-online-session.webp','app-online-progress.webp','app-hybrid-feedback.webp']
          total=sum((root/n).stat().st_size for n in names)
          if total>30000: raise SystemExit(f'APP_VISUAL_BUDGET:{total}')
          for n in names:
              data=(root/n).read_bytes()
              if not (data.startswith(b'RIFF') and data[8:12]==b'WEBP'):
                  raise SystemExit('NOT_WEBP:'+n)
          print('APP_VISUAL_BYTES',total)
          PY

      - name: Deploy certified V6.43.2 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v6432-certified-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "${CF_PROJECT}" --branch "${PREVIEW_BRANCH}" --commit-hash "${WEB_SHA}" \
            --commit-message 'WEB IBERFIT V6.43.2 certified preview' | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "${PREVIEW_URL}" || exit 42
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"

      - name: Validate preview gate across full surface
        shell: bash
        run: |
          set -euo pipefail
          cb="$GITHUB_RUN_ID"
          test "$(curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=$cb" | tr -d '\r\n ')" = "$WEB_VERSION"
          for route in /online/ /hibrido/ /en/online/ /en/hybrid/; do
            curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}${route}?cb=$cb" -o /tmp/preview-page
            grep -q '/assets/visual.v6432.css' /tmp/preview-page
            grep -q '/assets/a11y.v6431.css' /tmp/preview-page
            grep -q '/assets/analytics.v643.js' /tmp/preview-page
            grep -q '/assets/menu.v642.js' /tmp/preview-page
            ! grep -q '/assets/hardening.v630.js' /tmp/preview-page
          done
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$cb" -o /tmp/preview-online
          grep -q '/assets/app-online-plan.webp' /tmp/preview-online
          grep -q '/assets/app-online-session.webp' /tmp/preview-online
          grep -q '/assets/app-online-progress.webp' /tmp/preview-online
          curl -fsSL --retry 8 --retry-all-errors "${PREVIEW_URL}/hibrido/?cb=$cb" -o /tmp/preview-hybrid
          grep -q '/assets/app-hybrid-feedback.webp' /tmp/preview-hybrid
          for asset in visual.v6432.css app-online-plan.webp app-online-session.webp app-online-progress.webp app-hybrid-feedback.webp; do
            curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/assets/${asset}?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-asset
            grep -q '^cache-control:.*max-age=31536000' /tmp/preview-h-asset
            grep -q '^cache-control:.*immutable' /tmp/preview-h-asset
          done
          curl -fsSI --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/preview-h-page
          grep -q '^content-security-policy:' /tmp/preview-h-page
          grep -q "script-src-attr 'none'" /tmp/preview-h-page
          ! grep -q 'unsafe-inline' /tmp/preview-h-page
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          root=Path('/tmp/iberfitweb/candidate/v628')
          base=os.environ['PREVIEW_URL'].rstrip('/')
          htmls=sorted(root.rglob('*.html'))
          if len(htmls)!=33: raise SystemExit('EXPECTED_33_HTML')
          for p in htmls:
              rel=p.relative_to(root).as_posix()
              route='/' if rel=='index.html' else ('/404.html' if rel=='404.html' else '/'+rel.removesuffix('index.html'))
              subprocess.run(['curl','-fsSL','--retry','4','--retry-all-errors','-o','/dev/null',base+route],check=True)
          print('PREVIEW_ROUTES_OK',len(htmls))
          PY

      - name: Deploy production V6.43.2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "$CF_PROJECT" --branch production --commit-hash "$WEB_SHA" \
            --commit-message 'WEB IBERFIT V6.43.2 certified production' | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL" || exit 43
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_TOUCHED=1" >> "$GITHUB_ENV"

      - name: Verify live production and deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl -sSLo /tmp/live-version "https://iberfit.cl/VERSION?cb=$suffix" || true
            curl -sSLo /tmp/live-online "https://iberfit.cl/online/?cb=$suffix" || true
            version="$(tr -d '\r\n ' < /tmp/live-version 2>/dev/null || true)"
            visual=0; a11y=0; a643=0; menu=0; plan=0; old=0
            grep -q '/assets/visual.v6432.css' /tmp/live-online 2>/dev/null && visual=1 || true
            grep -q '/assets/a11y.v6431.css' /tmp/live-online 2>/dev/null && a11y=1 || true
            grep -q '/assets/analytics.v643.js' /tmp/live-online 2>/dev/null && a643=1 || true
            grep -q '/assets/menu.v642.js' /tmp/live-online 2>/dev/null && menu=1 || true
            grep -q '/assets/app-online-plan.webp' /tmp/live-online 2>/dev/null && plan=1 || true
            grep -q '/assets/hardening.v630.js' /tmp/live-online 2>/dev/null && old=1 || true
            echo "Propagation $attempt: version=${version:-missing} visual=$visual a11y=$a11y analytics643=$a643 menu642=$menu plan=$plan oldHardening=$old"
            if [ "$version" = "$WEB_VERSION" ] && [ "$visual" = 1 ] && [ "$a11y" = 1 ] && [ "$a643" = 1 ] && [ "$menu" = 1 ] && [ "$plan" = 1 ] && [ "$old" = 0 ]; then ok=1;break;fi
            sleep 4
          done
          test "$ok" = 1 || { echo IBERFIT_CL_V6432_NOT_CONSISTENT;exit 44; }
          cb="$GITHUB_RUN_ID-live"
          for route in /online/ /hibrido/ /en/online/ /en/hybrid/; do
            curl -fsSL "https://iberfit.cl${route}?cb=$cb" -o /tmp/live-page
            grep -q '/assets/visual.v6432.css' /tmp/live-page
          done
          curl -fsSL "https://iberfit.cl/assets/visual.v6432.css?cb=$cb" -o /tmp/live-visual.css
          grep -q '.app-story-section' /tmp/live-visual.css
          for asset in app-online-plan.webp app-online-session.webp app-online-progress.webp app-hybrid-feedback.webp; do
            curl -fsS "https://iberfit.cl/assets/${asset}?cb=$cb" -o "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done
          curl -fsSI "https://iberfit.cl/online/?cb=$cb" | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/live-h-page
          grep -q '^content-security-policy:' /tmp/live-h-page
          grep -q "script-src-attr 'none'" /tmp/live-h-page
          ! grep -q 'unsafe-inline' /tmp/live-h-page
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const d=(x.result||[]).find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);
          if(!d) throw Error('CERTIFIED_SHA_NOT_DEPLOYED');
          const e={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,qaName:process.env.QA_RUN_NAME,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/V6432_PRODUCTION_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');
          console.log(JSON.stringify(e,null,2));
          NODE

      - name: Automatic rollback to verified V6.43.1 if post-deploy verification fails
        if: failure() && env.PRODUCTION_TOUCHED == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" \
            -d '{}' -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json');if(!x.success)process.exit(1)"
          ok=0
          for attempt in $(seq 1 20); do
            version="$(curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/VERSION?rollback=${GITHUB_RUN_ID}-${attempt}" | tr -d '\r\n ' || true)"
            curl -fsSL --retry 4 --retry-all-errors "https://iberfit.cl/online/?rollback=${GITHUB_RUN_ID}-${attempt}" -o /tmp/rollback-online || true
            oldVisual=0; a11y=0
            grep -q '/assets/visual.v6432.css' /tmp/rollback-online 2>/dev/null && oldVisual=1 || true
            grep -q '/assets/a11y.v6431.css' /tmp/rollback-online 2>/dev/null && a11y=1 || true
            if [ "$version" = '6.43.1' ] && [ "$oldVisual" = 0 ] && [ "$a11y" = 1 ]; then ok=1;break;fi
            sleep 4
          done
          test "$ok" = 1

      - name: Save V6.43.2 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v6432-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v6432.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V6432_PRODUCTION_EVIDENCE.json
            /tmp/preview-h-page
            /tmp/live-h-page
            /tmp/rollback.json
          if-no-files-found: warn
          retention-days: 30

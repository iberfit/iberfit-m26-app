name: Activate web.iberfit.cl on WEB IBERFIT

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/activate-web-iberfit-staging-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
      CF_ZONE_ID: '44302103d0c37a304bad49fbbe0501d5'
      CF_PROJECT: 'web-iberfit'
      DOMAIN: 'web.iberfit.cl'
      CERTIFIED_SHA: '8d6fcb12a9472e9ef78b9973ca3d0cd9d71244ab'
    steps:
      - uses: actions/checkout@v4

      - name: Verificar proyecto y obtener target Pages real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          curl --fail --silent --show-error "${AUTH[@]}"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"             -o /tmp/project.json
          curl --fail --silent --show-error "${AUTH[@]}"             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments"             -o /tmp/deployments.json

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          const d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(!p.success||!p.result) throw new Error('WEB_IBERFIT_PROJECT_LOOKUP_FAILED');
          if(!d.success||!Array.isArray(d.result)) throw new Error('WEB_IBERFIT_DEPLOYMENTS_LOOKUP_FAILED');
          if(p.result.name!=='web-iberfit') throw new Error('WRONG_PAGES_PROJECT');
          if((p.result.domains||[]).includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          const target=p.result.subdomain;
          if(target!=='web-iberfit.pages.dev') throw new Error('UNEXPECTED_PAGES_TARGET:'+target);
          const exact=d.result.find(x =>
            x.environment==='production' &&
            x.deployment_trigger?.metadata?.commit_hash===process.env.CERTIFIED_SHA
          );
          if(!exact) throw new Error('CERTIFIED_SHA_NOT_DEPLOYED');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PAGES_TARGET='+target+'\n');
          console.log('PAGES_TARGET='+target);
          console.log('CERTIFIED_DEPLOYMENT='+exact.id);
          NODE

      - name: Asociar custom domain en Pages sin duplicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains"
          GET_CODE="$(curl --silent --show-error -o /tmp/domain.json -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json'             "$BASE/${DOMAIN}")"
          if [ "$GET_CODE" = "404" ]; then
            curl --fail --silent --show-error -X POST               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "{\"name\":\"${DOMAIN}\"}"               "$BASE" -o /tmp/domain-created.json
            echo 'PAGES_DOMAIN_ASSOCIATED=created'
          elif [ "$GET_CODE" = "200" ]; then
            echo 'PAGES_DOMAIN_ASSOCIATED=existing'
          else
            cat /tmp/domain.json
            exit 42
          fi

      - name: Crear CNAME staging de forma fail-closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          DNS_BASE="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          CODE="$(curl --silent --show-error -o /tmp/dns.json -w '%{http_code}' "${AUTH[@]}"             "${DNS_BASE}?name=${DOMAIN}")"

          if [ "$CODE" != "200" ]; then
            cat /tmp/dns.json || true
            echo 'MISSING_PERMISSION=Zone -> DNS -> Edit (DNS Write) scoped only to zone iberfit.cl'
            echo 'No DNS change was attempted.'
            exit 45
          fi

          ACTION="$(node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/dns.json','utf8'));
          if(!x.success||!Array.isArray(x.result)) throw new Error('DNS_LOOKUP_FAILED');
          const rows=x.result;
          const target=process.env.PAGES_TARGET;
          const domain=process.env.DOMAIN;
          if(rows.length===0){
            process.stdout.write('create');
            process.exit(0);
          }
          if(rows.length===1 && rows[0].type==='CNAME' &&
             String(rows[0].name).toLowerCase()===domain.toLowerCase() &&
             String(rows[0].content).replace(/\.$/,'').toLowerCase()===target.toLowerCase()){
            process.stdout.write('keep');
            process.exit(0);
          }
          console.error('DNS_CONFLICT='+JSON.stringify(rows.map(r=>({
            id:r.id,type:r.type,name:r.name,content:r.content,proxied:r.proxied
          }))));
          process.exit(46);
          NODE
          )"

          if [ "$ACTION" = "create" ]; then
            node <<'NODE' >/tmp/dns-create-payload.json
          console.log(JSON.stringify({
            type:'CNAME',
            name:process.env.DOMAIN,
            content:process.env.PAGES_TARGET,
            ttl:1,
            proxied:true
          }));
          NODE
            curl --fail --silent --show-error -X POST "${AUTH[@]}"               -H 'Content-Type: application/json'               --data @/tmp/dns-create-payload.json               "${DNS_BASE}" -o /tmp/dns-created.json
            node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/dns-created.json','utf8'));
          if(!x.success||!x.result) throw new Error('DNS_CREATE_FAILED:'+JSON.stringify(x.errors||[]));
          console.log('DNS_CREATED='+JSON.stringify({
            type:x.result.type,name:x.result.name,content:x.result.content,proxied:x.result.proxied
          }));
          NODE
          else
            echo "DNS_EXISTING_MATCH=true target=${PAGES_TARGET}"
          fi

      - name: Esperar custom domain activo y certificado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/domains"
          STATUS='unknown'
          for i in $(seq 1 60); do
            curl --fail --silent --show-error               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               "$BASE/${DOMAIN}" -o /tmp/domain-current.json
            STATUS="$(node -e "const x=require('/tmp/domain-current.json');process.stdout.write(x.result?.status||'unknown')")"
            VERIFY="$(node -e "const x=require('/tmp/domain-current.json');process.stdout.write(x.result?.verification_data?.status||'unknown')")"
            ERROR="$(node -e "const x=require('/tmp/domain-current.json');process.stdout.write(x.result?.verification_data?.error_message||'')")"
            echo "DOMAIN_STATUS=${STATUS} VERIFY=${VERIFY} ERROR=${ERROR}"
            if [ "$STATUS" = "active" ]; then break; fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "blocked" ] || [ "$STATUS" = "deactivated" ]; then
              cat /tmp/domain-current.json
              exit 43
            fi
            sleep 5
          done
          test "$STATUS" = "active" || { cat /tmp/domain-current.json; exit 44; }

      - name: Verificar web.iberfit.cl sobre V6.28
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date +%s)"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors             "https://${DOMAIN}/?verify=${STAMP}" -o /tmp/home.html
          grep -Fq '>A distancia</a>' /tmp/home.html
          grep -Fq '/assets/analytics.v628.js' /tmp/home.html
          grep -Fq 'https://iberfit.cl/' /tmp/home.html

          curl --fail --silent --show-error --location             "https://${DOMAIN}/assets/analytics.v628.js?verify=${STAMP}" -o /tmp/analytics.js
          grep -Fq 'generate_lead' /tmp/analytics.js

          curl --fail --silent --show-error --location             "https://${DOMAIN}/sitemap.xml?verify=${STAMP}" -o /tmp/sitemap.xml
          grep -Fq '<lastmod>2026-09-12</lastmod>' /tmp/sitemap.xml

          curl --fail --silent --show-error --location             "https://${DOMAIN}/robots.txt?verify=${STAMP}" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://iberfit.cl/sitemap.xml' /tmp/robots.txt

          echo 'STAGING_CERTIFIED=web.iberfit.cl active on WEB IBERFIT V6.28'

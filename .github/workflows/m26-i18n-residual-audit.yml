name: IBERFIT M26 i18n residual audit

on:
  push:
    branches:
      - feat/full-i18n
    paths:
      - '.github/workflows/m26-i18n-residual-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-i18n
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit untranslated Spanish UI literals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {iberfitSurfaceTranslate} from './src/m26/ui/i18n-surface.js';
          const roots=['src/m26/modules','src/m26/app','src/m26/admin','src/m26/ui','src/m26/workflows','src/m26/wearables','src/m26/onboarding'];
          const excludes=[/i18n(?:-|\.)/,/guided-tour\.js$/,/(?:protocol|catalog|norms|evidence)/,/base\.js$/,/iri-report-document\.js$/,/report-workflow\.js$/,/iri-external-report-controller\.js$/,/iri-report-page\.js$/,/contextual-guidance\.js$/,/historical-acquisition\.js$/,/contracts\.js$/,/\.css$/,/exercise-video-player\.js$/,/exercise-media\.js$/];
          const files=[];
          function walk(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(/\.(?:js|mjs)$/u.test(e.name))files.push(p);}}
          roots.forEach(walk);
          const spanish=/[áéíóúüñÁÉÍÓÚÜÑ¿¡]|\b(?:cliente|clientes|sesión|sesiones|entrenamiento|entrenador|agenda|revisar|pendiente|confirmad[oa]s?|disponible|datos|informe|cita|evaluación|progreso|siguiente|guardad[oa]|selecciona|bienestar|sueño|estrés|dispositivo|expediente|planificación|ejercicio|ejercicios|sincronización|contraseña)\b/iu;
          const quoted=/(?:'([^'\\]*(?:\\.[^'\\]*)*)'|"([^"\\]*(?:\\.[^"\\]*)*)"|`([^`\\]*(?:\\.[^`\\]*)*)`)/gs;
          const staticResidual=[];
          const dynamic=[];
          for(const file of files){
            if(excludes.some((r)=>r.test(file)))continue;
            const src=fs.readFileSync(file,'utf8');
            let m;
            quoted.lastIndex=0;
            while((m=quoted.exec(src))){
              const raw=m[1]??m[2]??m[3]??'';
              if(raw.includes('${')){
                const plain=raw.replace(/\$\{[^}]*\}/gs,'{…}').replace(/\\[nrt]/g,' ').replace(/\s+/g,' ').trim();
                if(plain.length>=2&&plain.length<=360&&spanish.test(plain))dynamic.push({file,line:src.slice(0,m.index).split(/\r?\n/u).length,template:plain});
                continue;
              }
              const value=raw.replace(/\\'/g,"'").replace(/\\"/g,'"').replace(/\\[nrt]/g,' ').replace(/\s+/g,' ').trim();
              if(value.length<2||value.length>320||!spanish.test(value))continue;
              if(/^(?:M26_|https?:|\/|\.|#|data-|aria-)/u.test(value))continue;
              const translated=iberfitSurfaceTranslate(value,{language:'en'});
              if(translated===value)staticResidual.push({file,line:src.slice(0,m.index).split(/\r?\n/u).length,text:value});
            }
          }
          const uniqueStatic=[...new Map(staticResidual.map((x)=>[`${x.file}:${x.text}`,x])).values()];
          const uniqueDynamic=[...new Map(dynamic.map((x)=>[`${x.file}:${x.template}`,x])).values()];
          fs.writeFileSync('i18n-static-residual.json',JSON.stringify({count:uniqueStatic.length,items:uniqueStatic},null,2)+'\n');
          fs.writeFileSync('i18n-dynamic-residual.json',JSON.stringify({count:uniqueDynamic.length,items:uniqueDynamic},null,2)+'\n');
          console.log(`static_residual=${uniqueStatic.length} dynamic_templates=${uniqueDynamic.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m26-i18n-residual-${{ github.run_id }}
          path: |
            i18n-static-residual.json
            i18n-dynamic-residual.json
          retention-days: 7

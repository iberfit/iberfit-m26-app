name: IBERFIT M26 i18n surface apply

on:
  push:
    branches:
      - feat/full-i18n
    paths:
      - '.github/workflows/m26-i18n-surface-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-i18n
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize deterministic surface catalogue and tests
        shell: bash
        env:
          SURFACE_GZ_B64: ''
          TEST_GZ_B64: ''
        run: |
          set -euo pipefail
          mkdir -p src/m26/ui tests
          printf '%s' "$SURFACE_GZ_B64" | base64 -d | gzip -d > src/m26/ui/i18n-surface.js
          printf '%s' "$TEST_GZ_B64" | base64 -d | gzip -d > tests/m26_full_surface_i18n.test.mjs
          node <<'NODE'
          const fs=require('fs');
          const i18nPath='src/m26/ui/i18n.js';
          let i18n=fs.readFileSync(i18nPath,'utf8').replace(/\r\n?/g,'\n');
          if(!i18n.includes("import('./i18n-surface.js')")){
            i18n += `\n// M26_FULL_SURFACE_I18N_BEGIN\nif(typeof document!=='undefined'){\n  queueMicrotask(()=>{\n    import('./i18n-surface.js')\n      .then(({installIberfitSurfaceI18n})=>{\n        const root=document.querySelector?.('#app');\n        if(root)installIberfitSurfaceI18n(root);\n      })\n      .catch((error)=>{try{console.error('[IBERFIT:i18n-surface]',error?.message||error);}catch{}});\n  });\n}\n// M26_FULL_SURFACE_I18N_END\n`;
            fs.writeFileSync(i18nPath,i18n,'utf8');
          }
          const indexPath='src/m26/ui/index.js';
          let index=fs.readFileSync(indexPath,'utf8').replace(/\r\n?/g,'\n');
          if(!index.includes("export * from './i18n-surface.js';")){
            index += "export * from './i18n-surface.js';\n";
            fs.writeFileSync(indexPath,index,'utf8');
          }
          NODE
      - name: Verify syntax and directed i18n contracts
        run: |
          set -euo pipefail
          node --check src/m26/ui/i18n-surface.js
          node --check src/m26/ui/i18n.js
          node --test tests/m26_full_surface_i18n.test.mjs tests/m26_admin_coach_workspace_i18n.test.mjs
          npm run test:m26:product
          npm run test:m26:rc74-4
      - name: Commit clean functional patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m26-i18n-inventory.yml .github/workflows/m26-i18n-surface-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(i18n): translate full application surface'
          git push origin HEAD:feat/full-i18n

name: Coach Launch WIP PR Apply

on:
  pull_request:
    branches:
      - canary/rc74-4
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/coach-launch-single-source-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic final regression patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "recordId(field(record,'clientId','client_id')||recordId(record))" src/m26/onboarding/coach-launch-journey.js; then
            python scripts/ci/apply_coach_launch_single_source_patch.py
          else
            echo "Final Coach Launch regression patch already applied; skipping helper."
          fi
          node scripts/generate_rc58_app_shell.mjs
          git diff --check

      - name: Commit final regression patch when changed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            public/m26/sw.js \
            src/m26/onboarding/coach-launch-journey.js \
            src/m26/rc39/route-render.js \
            tests/m26_coach_launch_identity_parity.test.mjs \
            tests/m26_coach_launch_self_journey.test.mjs
          if git diff --cached --quiet; then
            echo "No final regression changes to commit."
          else
            git config user.name "iberfit-ci"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "fix(coach): close launch journey regressions"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run targeted Coach Launch tests
        run: >-
          node --test
          tests/m26_coach_launch_domain_truth.test.mjs
          tests/m26_coach_launch_journey.test.mjs
          tests/m26_coach_launch_readiness.test.mjs
          tests/m26_coach_launch_self_journey.test.mjs
          tests/m26_coach_launch_identity_parity.test.mjs
          tests/m26_coach_launch_bootstrap_contract.test.mjs

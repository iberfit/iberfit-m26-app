name: IBERFIT U77 One-Shot Protected M44 Recovery Dispatch

# One new workflow-file push; no recurring polling and no PROD credentials.
# Dispatches the existing M44 workflow on protected Canary with its own gates.
on:
  push:
    branches: ['feat/u60-training360-r50-reconciled-20261104']
    paths:
      - '.github/workflows/u77-dispatch-protected-m44-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: iberfit-u77-once-protected-m44-dispatch
  cancel-in-progress: false

jobs:
  dispatch-once:
    if: github.event_name == 'push' && github.run_attempt == 1
    name: Verify Canary exact SHA; request official encrypted PG17 M44 backup
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate one-shot cross-workflow safety boundary
        run: node --test tests/m26_u77_protected_m44_dispatch_contract.test.mjs
      - name: Dispatch official M44 only if SHA pinned and no active backup
        run: node scripts/ops/u77_dispatch_protected_m44.mjs

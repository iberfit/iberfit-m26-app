name: IBERFIT U74 Real QA Dated Browser Write E2E

# Attempt 1 is read-only. Explicit rerun of the SAME job, runId, SHA
# and signed future slot only permits bounded synthetic QA writes. Never PROD.
on:
  push:
    branches:
      - 'feat/iberfit-real-training-360-20261114'
      - 'feat/real-training-360-one-release-20261117'
    paths:
      - '.github/workflows/u74-qa-dated-browser-e2e.yml'
      - 'scripts/remote-gates/qa_u60_real_dated_journey.mjs'
      - 'qa/rc64/u74-dated-ui-write.spec.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'playwright.u74-dated-write.config.mjs'
      - 'tests/m26_u74_qa_dated_browser_e2e.test.mjs'
      # PR #1367: exact dated SQL and Client/Coach UI source inputs;
      # preflight is read-only; signed synthetic write requires rerun 2.
      - 'supabase/release-procedures/20261117_m1_u72_prod_guarded_materialized_v1.sql'
      - 'supabase/release-procedures/20261117_m1_u72_prod_guarded_materialized_v1.rollback.sql'
      - 'src/m26/workflows/occurrence-*.js'
      - 'src/m26/app/workflow-controller.js'
      # The transport and auth shell form part of the dated Client journey:
      # a changed RPC mapping must trigger a new exact-SHA browser proof.
      - 'src/m26/supabase-transport.js'
      - 'src/m26/app/application.js'
      # Every change to workout CAS/ACK refresh and QA source renderer must
      # re-certify the actual signed, two-attempt dated browser E2E.
      - 'src/m26/command-bus.js'
      - 'qa/rc64/build-authenticated-surface.mjs'
      - 'tests/m26_p0_free_progress_ack_deferred_read_qa.test.mjs'
      - 'src/m26/modules/route-render.js'
      - 'tests/m26_u72_prod_materialized_candidate.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: iberfit-qa-shared-auth-readonly
  queue: max
  cancel-in-progress: false
jobs:
  dated-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
      M26_QA_ONLY: 'true'
      M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
      M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
      M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
      M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
      M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
      M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
      M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
      M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    environment: m26-canary-readonly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - name: Pinned dependencies
        run: npm ci
      - name: Scope, command and two-attempt boundary contracts
        run: node --test tests/m26_u74_qa_dated_browser_e2e.test.mjs
      - name: READ-ONLY hosted JWT and signed date preflight
        if: ${{ github.run_attempt == 1 }}
        run: node scripts/remote-gates/qa_u60_real_dated_journey.mjs preflight-browser
      - name: Preserve immutable first-attempt proof
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u74-first-${{ github.run_id }}
          path: recovery/u71-qa-authenticated-workout/evidence.json
          if-no-files-found: error
          retention-days: 2
      - name: Recover exact original proof, only on explicit second attempt
        if: ${{ github.run_attempt == 2 }}
        uses: actions/download-artifact@v4
        with:
          name: iberfit-u74-first-${{ github.run_id }}
          path: .tmp/u71-first
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Coach creates two QA dates, leaves first unstarted for Client UI
        if: ${{ github.run_attempt == 2 }}
        run: node scripts/remote-gates/qa_u60_real_dated_journey.mjs prepare-browser
      - name: Build exact source authenticated QA Chromium surface
        if: ${{ github.run_attempt == 2 }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Real Client touch UI start pause resume sets feedback and completion
        if: ${{ github.run_attempt == 2 }}
        run: npx playwright test --config playwright.u74-dated-write.config.mjs
      - name: Real Coach JWT verifies first completed, second untouched, B denied
        if: ${{ github.run_attempt == 2 }}
        run: node scripts/remote-gates/qa_u60_real_dated_journey.mjs verify-browser
      - name: Preserve redacted QA outcome and partial failure phase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u74-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/u71-qa-authenticated-workout/evidence.json
          if-no-files-found: warn
          retention-days: 14

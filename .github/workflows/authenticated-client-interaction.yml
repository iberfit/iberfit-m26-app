name: IBERFIT Authenticated Client Interaction

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/app/**'
      - 'src/m26/design/**'
      - 'src/m26/engagement/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/ui/**'
      - 'qa/rc64/authenticated-interaction.spec.mjs'
      - 'qa/rc64/u60-dated-ui-readonly.spec.mjs'
      - 'playwright.u60-dated-readonly.config.mjs'
      - 'tests/m26_m1_u60_qa_readonly_network_boundary.test.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'qa/rc64/build-authenticated-surface.mjs'
      - 'qa/rc64/real-shell-server.mjs'
      - 'playwright.authenticated-interaction.config.mjs'
      - '.github/workflows/authenticated-client-interaction.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/app/**'
      - 'src/m26/design/**'
      - 'src/m26/engagement/**'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/shell/**'
      - 'src/m26/ui/**'
      - 'qa/rc64/authenticated-interaction.spec.mjs'
      - 'qa/rc64/u60-dated-ui-readonly.spec.mjs'
      - 'playwright.u60-dated-readonly.config.mjs'
      - 'tests/m26_m1_u60_qa_readonly_network_boundary.test.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'qa/rc64/build-authenticated-surface.mjs'
      - 'qa/rc64/real-shell-server.mjs'
      - 'playwright.authenticated-interaction.config.mjs'
      - '.github/workflows/authenticated-client-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: iberfit-authenticated-client-interaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-current-head:
    name: P0 Supabase Free - reject superseded PR before QA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify head of live PR without calling Supabase
        id: verify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PR_IS_DRAFT" == true ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'P0_QA_PR_NUMBER_INVALID' >&2; exit 41; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'P0_QA_PR_SHA_INVALID' >&2; exit 42; }
          # Fail-closed on API failures rather than running stale QA.
          response="$(curl --fail --silent --show-error --max-time 8 --retry 1 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_sha="$(jq -er '.head.sha' <<< "$response")"
          live_state="$(jq -er '.state' <<< "$response")"
          live_draft="$(jq -r '.draft | tostring' <<< "$response")"
          if [[ "$live_sha" == "$PR_SHA" && "$live_state" == open && "$live_draft" == false ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "P0_QA_SUPERSEDED_PR_SKIP: no QA credentials or HTTP to Supabase"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  authenticated-client-controls:
    needs: pr-current-head
    if: ${{ needs.pr-current-head.outputs.current == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Keep real authenticated Chromium checks on the proven LTS image.
    runs-on: ubuntu-24.04
    concurrency:
      group: iberfit-authenticated-client-interaction-readonly
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium
      - name: Verify Chromium browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium } from '@playwright/test'; if (!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"
      - name: Verify real Chromium headless launch
        run: node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({headless:true}); await browser.close();"
      - name: Build authenticated current-source QA surface
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Certify authenticated Client focus touch keyboard and native controls
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node node_modules/@playwright/test/cli.js test --config playwright.authenticated-interaction.config.mjs
      - name: Upload authenticated interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-authenticated-client-interaction-${{ github.run_id }}
          path: |
            recovery/p0-authenticated-interaction/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  # The U71 writer remains on its separate two-attempt, exact-run proof.
  # This job is READ-ONLY, even while the single M1 PR is Draft.
  # No backend mutation route is allowlisted, and source bytes are checked
  # out from the exact PR head SHA rather than GitHub's synthetic merge ref.
  u60-real-qa-client-readonly:
    if: ${{ github.event_name == 'pull_request' }}
    name: Real U60 Client QA browser, read-only 320 to 1440
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: m26-canary-readonly
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail closed if PR head moved or no longer belongs to M1
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Universal 360 replaces merged M1 #1335; retain a strict, single-PR allowlist.
          test "$PR_NUMBER" = "1340"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          result="$(curl --fail --silent --show-error --max-time 12 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -er '.head.sha' <<< "$result")" = "$EXPECTED_HEAD"
          test "$(jq -er '.state' <<< "$result")" = open
      - run: npm ci --ignore-scripts
      - name: Prepare pinned Chromium
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Build exact-source QA browser using nonprivileged publishable key
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Verify U60 QA network is read-only
        run: node --test tests/m26_m1_u60_qa_readonly_network_boundary.test.mjs
      - name: Real Chromium Client A U60 and cross-owner isolation
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node node_modules/@playwright/test/cli.js test --config playwright.u60-dated-readonly.config.mjs
      - name: Certify QA Client A full-history recovery without data changes
        # Exact-source Chromium, QA Client A/B only, independent from U60 writes.
        # Run within the existing auth mutex; no new workflow or shared fixtures.
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node node_modules/@playwright/test/cli.js test --config playwright.authenticated.config.mjs --project authenticated-readonly-chromium --grep 'P0 QA free completed history live browser'
      - name: Preserve PII-free U60 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-u60-qa-readonly-${{ github.run_id }}
          path: |
            recovery/u60-qa-browser-readonly/
            test-results/
          if-no-files-found: warn
          retention-days: 14

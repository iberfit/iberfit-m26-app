name: IBERFIT M44 Synthetic Roles ACL Restore Drill

on:
  pull_request:
    branches: ['canary/rc74-4']
    paths:
      - '.github/workflows/m44-role-acl-synthetic-drill.yml'
      - 'scripts/ops/m44_synthetic_acl_restore_drill.sh'
      - 'tests/m44_synthetic_acl_restore_drill.test.mjs'
  push:
    branches: ['canary/rc74-4']
    paths:
      - '.github/workflows/m44-role-acl-synthetic-drill.yml'
      - 'scripts/ops/m44_synthetic_acl_restore_drill.sh'
      - 'tests/m44_synthetic_acl_restore_drill.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m44-isolated-acl-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres17-synthetic-acl-recovery:
    name: m44-isolated-role-acl-recovery-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: m44-local-fixture-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guard and regression contracts without database access
        run: node --test tests/m44_synthetic_acl_restore_drill.test.mjs
      - name: Prove data-only restore loses access until owners ACL defaults reconciled
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          chmod 700 "$scratch"
          docker run --rm --network host \
            -e IBERFIT_M44_SYNTHETIC_ONLY=true \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGDATABASE=postgres -e PGUSER=supabase_admin \
            -e PGPASSWORD=m44-local-fixture-only \
            -e IBERFIT_M44_DRILL_DIR=/work \
            -v "$scratch:/work" \
            -v "$PWD/scripts/ops/m44_synthetic_acl_restore_drill.sh:/drill.sh:ro" \
            postgres:17-alpine sh /drill.sh

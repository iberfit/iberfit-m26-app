name: IBERFIT M44 Encrypted Offsite Disaster Recovery

# IBERFIT SIGNATURE U46 — fresh offsite release readiness, 2026-10-25.
# A certified merge to Canary requests a new encrypted production DB+Storage
# archive, isolated PG17 restoration and integrity proof. Comment-only change:
# no job logic, grants, secrets, permissions, safeguards or app code modified.

# SIGNATURE B13 production proof 2026-10-25. Source 0788e4496a68:
# trigger fresh encrypted PROD DB + Storage archive, verified isolated
# PostgreSQL 17 restore and integrity; no modification to jobs, secrets,
# backup semantics, security policies, or frontend app behavior.

# SIGNATURE P0 seven-gate release matrix 2026-10-25: renewal-only push.
# Refresh exact-SHA encrypted PROD DB and Storage isolated PG17 proof after
# all required Canary QA workflow path filters cover M44-only release commits.
# No changed jobs, scope, credentials, secrets, retention or fail-closed rules.

# SIGNATURE P0 release 2026-10-25: renewal-only Canary push trigger.
# Reissue an independent encrypted PROD DB + Storage recovery point and
# isolated PG17 restore after the certified Client A/B and JWT bootstrap merge.
# This edit intentionally changes no permissions, secrets, backup operations,
# restore requirements, workflow concurrency or fail-closed checks.

# SIGNATURE B2 Client 2026-10-24: comment-only certified Canary merge trigger.
# Renew unchanged encrypted PROD DB+Storage backup, isolated PostgreSQL 17 restore
# and integrity proof before the single frontend-only B2 production promotion.
# No changes to jobs, permissions, secrets, encryption or data-write policy.

# U49 2026-10-22 privacy release preflight: this comment-only workflow change
# requests a fresh encrypted PROD DB+Storage backup and isolated PostgreSQL 17
# restore on the next certified Canary push. No backup or secret policy changes.


on:
  pull_request:
    branches: ['canary/rc74-4']
    paths:
      - '.github/workflows/m44-encrypted-disaster-recovery.yml'
      - 'scripts/ops/m44_encrypted_backup_archive.mjs'
      - 'scripts/ops/m44_storage_backup_bytes.mjs'
      - 'scripts/ops/m44_storage_metadata_snapshot.sql'
      - 'scripts/ops/m44_storage_metadata_parity.mjs'
      - 'scripts/ops/m44_platform_recovery_catalog.sql'
      - 'scripts/ops/m44_global_roles_archive_check.mjs'
      - 'tests/m44_role_globals_encrypted_backup.test.mjs'
      - 'tests/m44_storage_metadata_parity.test.mjs'
      - 'tests/m44_storage_full_recovery_workflow.test.mjs'
      - 'tests/m44_pgcustom_acl_archive_contract.test.mjs'
      - 'scripts/ops/m44_acl_toc_selector.mjs'
      - 'tests/m44_acl_toc_selector.test.mjs'
      - 'tests/m44_encrypted_backup_archive_contract.test.mjs'
      - 'tests/m44_storage_backup_bytes_contract.test.mjs'
  push:
    branches: ['canary/rc74-4']
    paths:
      - '.github/workflows/m44-encrypted-disaster-recovery.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Export production DB and Storage; encrypted output; isolated restore'
        required: true
        type: choice
        options: [BACKUP_ENCRYPT_AND_VERIFY_PROD]

permissions:
  contents: read

# SIGNATURE 2026-10-21: release-preflight trigger only, after frontend gates.
# Protected PROD DB+Storage encrypted snapshot + isolated PostgreSQL 17 restore.
# No change to schedule, security, code, policies, secrets or job logic.
# Do not treat this comment as a recovery certificate; the live M44 job must pass.
# Ops 2026-10-20 U22 bootstrap P0: comment-only trigger after certified
# Canary merge to renew unchanged encrypted PROD DB+Storage PG17 restore proof.
# Ops checkpoint 2026-10-20 SIGNATURE U22 release proof refresh:
# Comment-only trigger: after a certified Canary merge, create a new protected
# encrypted production DB+Storage recovery point with isolated PostgreSQL 17
# restore and object-integrity evidence. No guard, secret, input, job or
# production write policy is changed; production promotion remains fail closed.
# Ops checkpoint 2026-10-19 U19 macro exact-release freshness:
# On certified Canary merge, refresh the protected encrypted production DB/Storage
# backup, isolated PostgreSQL 17 restore and Storage bytes/parity evidence.
# Comment-only trigger: no change to jobs, secrets, permissions or fail-closed gates.
# Ops checkpoint 2026-10-19 U17 verified exact-release proof refresh:
# Re-run the existing protected encrypted DB+Storage archive and isolated
# PostgreSQL 17 restore on a certified Canary merge for current <=2h proof.
# Comment-only; unchanged credentials, jobs, concurrency, safety and budgets.
# Ops checkpoint 2026-10-19 U15 exact release proof refresh:
# Trigger a fresh encrypted DB/Storage archive and isolated PG17 restore on
# certified Canary merge, leaving every job, time limit and secret unchanged.
# Ops checkpoint 2026-10-19 U14 proof refresh trigger: re-run protected PROD+Storage
# backup, encrypted archive, isolated PostgreSQL 17 restore and byte parity.
# This comment-only change does not alter any guard, secret or job behavior.
# Ops checkpoint 2026-10-19: refresh the protected encrypted PROD+Storage
# recovery proof after M44_OFFSITE_RUN_TOO_OLD blocked an otherwise certified
# frontend-only release. No job, secret, timeout or restore policy is changed.
concurrency:
  group: iberfit-m44-prod-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crypto-contract:
    name: m44-encrypted-archive-and-storage-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify encryption integrity and storage contracts
        run: |
          node --test \
            tests/m44_encrypted_backup_archive_contract.test.mjs \
            tests/m44_storage_backup_bytes_contract.test.mjs \
            tests/m44_storage_metadata_parity.test.mjs \
            tests/m44_storage_full_recovery_workflow.test.mjs \
            tests/m44_role_globals_encrypted_backup.test.mjs \
            tests/m44_pgcustom_acl_archive_contract.test.mjs \
            tests/m44_acl_toc_selector.test.mjs

  synthetic-restore:
    name: m44-synthetic-postgresql17-restore-proof
    runs-on: ubuntu-latest
    needs: crypto-contract
    services:
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: local-synthetic-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify matching Supabase Vault extension binaries are present
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh supabase/postgres:17.6.1.147 -c 'test -f "$(pg_config --sharedir)/extension/supabase_vault.control"'
          echo 'IBERFIT_SUPABASE_PG17_VAULT_EXTENSION_AVAILABLE'
      - name: Prove passwordless global role export against isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PGPASSWORD=local-synthetic-only
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=supabase_admin
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          # This is a throwaway container database, never IBERFIT PROD or QA.
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER \
            postgres:17-alpine psql -X -q -v ON_ERROR_STOP=1 -d postgres \
            > /dev/null 2> "$scratch/pg-private-errors" <<'SQL'
          SELECT format('CREATE ROLE %I;', roles.role_name)
            FROM (VALUES ('postgres'),('anon'),('authenticated'),('authenticator'),
                 ('service_role'),('supabase_admin'),('supabase_auth_admin'),
                 ('supabase_storage_admin')) AS roles(role_name)
            WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles p WHERE p.rolname=roles.role_name)
          \gexec
          SQL
          if ! docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER \
            -v "$scratch:/work" postgres:17-alpine pg_dumpall --roles-only \
            --no-role-passwords --database=postgres --file=/work/synthetic-roles.sql \
            > /dev/null 2> "$scratch/pg-private-errors"; then
            # Only a predefined non-sensitive error CATEGORY may enter CI.
            # The original stderr remains private and is deleted by trap.
            if grep -Eqi 'unrecognized option|invalid option' "$scratch/pg-private-errors"; then
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_OPTION_UNSUPPORTED'
            elif grep -Eqi 'permission denied|must be superuser|not permitted' "$scratch/pg-private-errors"; then
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_PRIVILEGE_DENIED'
            elif grep -Eqi 'could not connect|connection to server|password authentication' "$scratch/pg-private-errors"; then
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_AUTH_FAILED'
            elif grep -Eqi 'could not open output file|No such file or directory|Is a directory' "$scratch/pg-private-errors"; then
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_OUTPUT_PATH_FAILED'
            elif grep -Eqi 'does not exist|database' "$scratch/pg-private-errors"; then
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_DATABASE_FAILED'
            else
              echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLE_EXPORT_UNKNOWN'
            fi
            exit 61
          fi
          node scripts/ops/m44_global_roles_archive_check.mjs "$scratch/synthetic-roles.sql"
          echo 'IBERFIT_SYNTHETIC_GLOBAL_ROLES_PASSWORDLESS_PG17_VERIFIED'
      - name: Exercise binary dump, authenticated encryption and restored data
        env:
          IBERFIT_BACKUP_PASSPHRASE: only-a-synthetic-fixture-passphrase-never-use-in-production-2026
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PGPASSWORD=local-synthetic-only
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=supabase_admin
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER postgres:17-alpine \
            psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.iberfit_restore_fixture(id integer PRIMARY KEY, note text NOT NULL)' >/dev/null
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER postgres:17-alpine \
            psql -d postgres -v ON_ERROR_STOP=1 -c "INSERT INTO public.iberfit_restore_fixture VALUES (1,'safe fixture')" >/dev/null
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER \
            -v "$scratch:/work" postgres:17-alpine pg_dump -Fc -d postgres -t public.iberfit_restore_fixture \
            -f /work/source.dump
          node scripts/ops/m44_encrypted_backup_archive.mjs encrypt "$scratch/source.dump" "$scratch/archive.ibf"
          rm -f "$scratch/source.dump"
          node scripts/ops/m44_encrypted_backup_archive.mjs decrypt "$scratch/archive.ibf" "$scratch/decrypted.dump"
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER postgres:17-alpine \
            createdb iberfit_isolated_restore
          docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER \
            -v "$scratch:/work" postgres:17-alpine pg_restore --exit-on-error --no-owner --no-acl \
            -d iberfit_isolated_restore /work/decrypted.dump
          result="$(docker run --rm --network host -e PGPASSWORD -e PGHOST -e PGPORT -e PGUSER postgres:17-alpine \
            psql -d iberfit_isolated_restore -At -c 'SELECT count(*) FROM public.iberfit_restore_fixture')"
          test "$result" = '1'
          echo 'IBERFIT_SYNTHETIC_POSTGRES17_ENCRYPTED_RESTORE_SUCCESS'

  production-backup:
    name: m44-prod-db-storage-encrypted-backup-and-restore
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.confirmation == 'BACKUP_ENCRYPT_AND_VERIFY_PROD')
    needs: [crypto-contract, synthetic-restore]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: m26-canary-readonly
    services:
      postgres:
        image: supabase/postgres:17.6.1.147
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: isolated-restore-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 8
    env:
      IBERFIT_PROD_DATABASE_URL: ${{ secrets.IBERFIT_PROD_DATABASE_URL }}
      IBERFIT_PROD_STORAGE_SERVICE_KEY: ${{ secrets.IBERFIT_PROD_STORAGE_SERVICE_KEY }}
      IBERFIT_BACKUP_PASSPHRASE: ${{ secrets.IBERFIT_BACKUP_PASSPHRASE }}
      IBERFIT_PROD_STORAGE_URL: https://pjhmrhejsoofmouedavw.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if protected production backup credentials are unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IBERFIT_PROD_DATABASE_URL:-}" || { echo 'IBERFIT_BACKUP_DATABASE_URL_NOT_CONFIGURED'; exit 41; }
          test -n "${IBERFIT_PROD_STORAGE_SERVICE_KEY:-}" || { echo 'IBERFIT_BACKUP_STORAGE_KEY_NOT_CONFIGURED'; exit 42; }
          test "${#IBERFIT_BACKUP_PASSPHRASE}" -ge 32 || { echo 'IBERFIT_BACKUP_PASSPHRASE_NOT_CONFIGURED'; exit 43; }
          node -e 'const x=new URL(process.env.IBERFIT_PROD_DATABASE_URL);
            const ref="pjhmrhejsoofmouedavw";
            if(x.username!=="postgres."+ref)process.exit(44);
            if(x.hostname!=="db."+ref+".supabase.co" && !/^[a-z0-9-]+\.pooler\.supabase\.com$/i.test(x.hostname))process.exit(44);
            if(x.protocol!=="postgresql:"&&x.protocol!=="postgres:")process.exit(44);
            if(x.port!=="5432"||x.pathname!=="/postgres")process.exit(44);
            if(x.searchParams.get("sslmode")!=="require"&&x.searchParams.get("sslmode")!=="verify-full")process.exit(45);'
          echo 'IBERFIT_PROD_TARGET_AND_REQUIRED_SECRETS_PRESENT'
      - name: Export complete PG17 DB and all Storage object bytes to ephemeral private workspace
        id: export
        env:
          WORK: ${{ runner.temp }}/iberfit-recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK/plain/storage" "$WORK/cipher"
          echo "$WORK" > "$RUNNER_TEMP/iberfit-backup-work-path"
          docker run --rm --network host -e IBERFIT_PROD_DATABASE_URL \
            -v "$WORK/plain:/work" postgres:17-alpine sh -c \
            'pg_dump -Fc --dbname="$IBERFIT_PROD_DATABASE_URL" -f /work/database.pgcustom 2>/work/pg-private-errors'
          # PostgreSQL globals (roles and memberships) are NOT in pg_dump -Fc.
          # Export WITHOUT any role passwords, only to the ephemeral private
          # workspace. Never print the SQL or grant the runner public access.
          docker run --rm --network host -e IBERFIT_PROD_DATABASE_URL \
            -v "$WORK/plain:/work" postgres:17-alpine sh -c \
            'pg_dumpall --roles-only --no-role-passwords \
              --dbname="$IBERFIT_PROD_DATABASE_URL" \
              --file=/work/global-roles.sql 2>> /work/pg-private-errors'
          node scripts/ops/m44_global_roles_archive_check.mjs "$WORK/plain/global-roles.sql"
          # This source inventory is intentionally plaintext ONLY inside the
          # temporary runner workspace; its paths and metadata are encrypted.
          docker run --rm --network host -e IBERFIT_PROD_DATABASE_URL \
            -v "$WORK/plain:/work" \
            -v "$PWD/scripts/ops/m44_storage_metadata_snapshot.sql:/storage-query.sql:ro" \
            postgres:17-alpine sh -c \
            'psql -X -A -t -v ON_ERROR_STOP=1 --dbname="$IBERFIT_PROD_DATABASE_URL" \
             -f /storage-query.sql > /work/storage-inventory.json 2>> /work/pg-private-errors'
          node scripts/ops/m44_storage_backup_bytes.mjs export "$WORK/plain/storage-inventory.json" "$WORK/plain/storage"
          # Second independent read detects objects altered/added/deleted while
          # byte downloads were in progress (name, ID, version, updated_at, size).
          docker run --rm --network host -e IBERFIT_PROD_DATABASE_URL \
            -v "$WORK/plain:/work" \
            -v "$PWD/scripts/ops/m44_storage_metadata_snapshot.sql:/storage-query.sql:ro" \
            postgres:17-alpine sh -c \
            'psql -X -A -t -v ON_ERROR_STOP=1 --dbname="$IBERFIT_PROD_DATABASE_URL" \
             -f /storage-query.sql > /work/storage-post-inventory.json 2>> /work/pg-private-errors'
          node scripts/ops/m44_storage_metadata_parity.mjs source \
            "$WORK/plain/storage-inventory.json" "$WORK/plain/storage-post-inventory.json" \
            "$WORK/plain/storage/manifest.json"
          # Capture the owner/ACL/RLS/constraint catalog INSIDE ciphertext for
          # a future role+Auth restore drill; snapshot parity alone is not proof.
          docker run --rm --network host -e IBERFIT_PROD_DATABASE_URL \
            -v "$WORK/plain:/work" \
            -v "$PWD/scripts/ops/m44_platform_recovery_catalog.sql:/catalog-query.sql:ro" \
            postgres:17-alpine sh -c \
            'psql -X -A -t -v ON_ERROR_STOP=1 --dbname="$IBERFIT_PROD_DATABASE_URL" \
             -f /catalog-query.sql > /work/platform-catalog-source.json 2>> /work/pg-private-errors'
          node --input-type=module -e 'import fs from "node:fs";import {validatePlatformCatalog} from "./scripts/ops/m44_platform_recovery_compare.mjs";validatePlatformCatalog(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))' \
            "$WORK/plain/platform-catalog-source.json"
          rm -f "$WORK/plain/pg-private-errors"
          tar -C "$WORK/plain" -cf "$WORK/plain.tar" \
            database.pgcustom global-roles.sql storage storage-inventory.json \
            storage-post-inventory.json platform-catalog-source.json
          echo 'IBERFIT_PROD_DB_AND_STORAGE_PLAINTEXT_STAGED_PRIVATELY'
      - name: Encrypt authenticated recovery archive before any upload
        id: encrypt
        env:
          WORK: ${{ runner.temp }}/iberfit-recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/ops/m44_encrypted_backup_archive.mjs encrypt "$WORK/plain.tar" "$WORK/cipher/iberfit-prod-recovery.ibf"
          rm -rf "$WORK/plain" "$WORK/plain.tar"
          echo 'IBERFIT_CIPHERTEXT_ONLY_READY'
      - name: Reopen ciphertext and verify restored Storage bytes in isolated workspace
        id: restore
        env:
          WORK: ${{ runner.temp }}/iberfit-recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK/isolated"
          node scripts/ops/m44_encrypted_backup_archive.mjs decrypt "$WORK/cipher/iberfit-prod-recovery.ibf" "$WORK/restore.tar"
          tar -C "$WORK/isolated" --no-same-owner --no-same-permissions -xf "$WORK/restore.tar"
          rm -f "$WORK/restore.tar"
          # Verify the encrypted PG17 custom archive retained BOTH object
          # GRANT/REVOKE and ALTER DEFAULT PRIVILEGES entries. The existing
          # first-stage --no-acl restore remains restricted on purpose.
          # TOC entries can include private object names: never print them.
          docker run --rm --network host \
            -v "$WORK/isolated:/work" postgres:17-alpine sh -c \
            'pg_restore --list /work/database.pgcustom > /work/acl-toc-private.list'
          # Construct a strictly allowlisted ACL-only TOC for a future
          # isolated role reconciliation drill. Do NOT replay it in this
          # first-stage data restore or against PROD/QA.
          node scripts/ops/m44_acl_toc_selector.mjs \
            "$WORK/isolated/acl-toc-private.list" \
            "$WORK/isolated/acl-only-private.list"
          rm -f "$WORK/isolated/acl-toc-private.list" "$WORK/isolated/acl-only-private.list"
          echo 'IBERFIT_PGCUSTOM_ACL_DEFAULTS_ARCHIVED_ENCRYPTED_ONLY'
          node scripts/ops/m44_storage_backup_bytes.mjs verify ignored "$WORK/isolated/storage"
          docker run --rm --network host -e PGPASSWORD=isolated-restore-only \
            postgres:17-alpine createdb -h 127.0.0.1 -U supabase_admin iberfit_recovery_test
          # Never stream SQL, error details or actual client data to job logs.
          if ! docker run --rm --network host -e PGPASSWORD=isolated-restore-only \
            -v "$WORK/isolated:/work" postgres:17-alpine pg_restore --exit-on-error \
            --no-owner --no-acl -h 127.0.0.1 -U supabase_admin -d iberfit_recovery_test \
            /work/database.pgcustom > "$WORK/restore-private-log" 2>&1; then
            echo 'IBERFIT_PROD_DB_LOCAL_RESTORE_FAILED_NO_RECOVERY_CERTIFICATE'
            exit 51
          fi
          # Restored metadata MUST refer to precisely the encrypted Storage
          # bytes. Query ONLY the isolated localhost database, never PROD.
          docker run --rm --network host -e PGPASSWORD=isolated-restore-only \
            -v "$WORK/isolated:/work" \
            -v "$PWD/scripts/ops/m44_storage_metadata_snapshot.sql:/storage-query.sql:ro" \
            postgres:17-alpine sh -c \
            'psql -X -A -t -v ON_ERROR_STOP=1 \
             -h 127.0.0.1 -U supabase_admin -d iberfit_recovery_test \
             -f /storage-query.sql > /work/isolated-db-storage-inventory.json \
             2> /work/isolation-private-errors'
          node scripts/ops/m44_storage_metadata_parity.mjs isolated \
            "$WORK/isolated/storage-inventory.json" \
            "$WORK/isolated/isolated-db-storage-inventory.json" \
            "$WORK/isolated/storage/manifest.json"
          node --input-type=module -e 'import fs from "node:fs";import {validatePlatformCatalog} from "./scripts/ops/m44_platform_recovery_compare.mjs";validatePlatformCatalog(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))' \
            "$WORK/isolated/platform-catalog-source.json"
          node scripts/ops/m44_global_roles_archive_check.mjs "$WORK/isolated/global-roles.sql"
          # Role SQL is evidence only, never executed in a PROD connection or
          # claimed to be a restoration of hosted Supabase authentication.
          echo 'IBERFIT_GLOBAL_ROLES_ARCHIVED_BUT_NOT_APPLIED'
          echo 'IBERFIT_SOURCE_CATALOG_ENCRYPTED_PLATFORM_RECOVERY_NOT_YET_VERIFIED'
          echo 'IBERFIT_PROD_LOCAL_DB_AND_STORAGE_RESTORE_SUCCESS'
      - name: Publish verified encrypted archive for immediate private-drive transfer
        if: ${{ steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-ciphertext-${{ github.run_id }}
          path: ${{ runner.temp }}/iberfit-recovery/cipher/*.ibf
          retention-days: 1
          if-no-files-found: error
      - name: Remove all temporary plaintext and ciphertext from runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/iberfit-recovery" "$RUNNER_TEMP/iberfit-backup-work-path"

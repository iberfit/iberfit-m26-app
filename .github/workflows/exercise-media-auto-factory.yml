name: IBERFIT Exercise Media Auto Factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Queue to process
        required: true
        type: choice
        default: normal
        options:
          - normal
          - human_regeneration

permissions:
  contents: read
  id-token: write

concurrency:
  group: iberfit-exercise-media-auto-factory
  cancel-in-progress: false

env:
  AUTO_FACTORY_URL: https://pjhmrhejsoofmouedavw.supabase.co/functions/v1/iberfit-exercise-media-auto-factory-v1
  OIDC_AUDIENCE: iberfit-exercise-media-auto-factory
  IBERFIT_FACTORY_MODE: ${{ inputs.mode || 'normal' }}
  MASTER: public/iberfit/master/IBERFIT_MALE_MASTER_V1/front-master-v1.jpg
  OFFICIAL_ISOTIPO: public/isotipo-iberfit.png
  WRANGLER_CONFIG: scripts/exercise-media/wrangler.ai-system-v1.toml
  PAGES_AI_PROJECT: iberfit-exercise-auto-${{ github.run_id }}-${{ github.run_attempt }}
  PAGES_AI_DIR: recovery/exercise-media-auto-proxy
  IBERFIT_FACTORY_DEFER_FILE: recovery/auto-factory/provider-capacity.json
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'

jobs:
  process-next-exercise:
    name: process-next-exercise
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Checkout certified Canary source
        uses: actions/checkout@v4
        with:
          ref: canary/rc74-4
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node and Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify factory contracts and official assets
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/m26_exercise_media_system_v1.test.mjs tests/m26_exercise_media_system_v1_pilot.test.mjs tests/m26_exercise_media_auto_factory.test.mjs tests/m26_exercise_media_auto_factory_retry.test.mjs tests/m26_exercise_media_provider_capacity.test.mjs tests/m26_exercise_media_human_gate_fail_closed.test.mjs tests/m26_admin_media_review.test.mjs
          test "$(sha256sum "$MASTER" | awk '{print $1}')" = 'b74f8de6b50e484fa11b5d6c928b681d4b63451ad5909d81630123603e44e0bb'
          test "$(sha256sum "$OFFICIAL_ISOTIPO" | awk '{print $1}')" = 'd4707b688db39e11fee7d027bf9d3f2514225dfc806797ae3f9379d710ef07aa'
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow==11.3.0'
          mkdir -p recovery/auto-factory recovery/auto-factory/reference

      - name: Obtain GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          sep='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" | jq -r '.value')"
          test "${#token}" -gt 100
          echo "::add-mask::$token"
          echo "IBERFIT_AUTO_FACTORY_OIDC=$token" >> "$GITHUB_ENV"

      - name: Inspect queue before provisioning AI proxy
        shell: bash
        run: |
          set -euo pipefail
          case "${IBERFIT_FACTORY_MODE}" in
            normal|human_regeneration) ;;
            *) echo 'IBERFIT_FACTORY_MODE_INVALID'; exit 42 ;;
          esac
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "Authorization: Bearer ${IBERFIT_AUTO_FACTORY_OIDC}" \
            -H 'Content-Type: application/json' \
            "$AUTO_FACTORY_URL" \
            -d "$(jq -nc --arg mode "$IBERFIT_FACTORY_MODE" '{action:"peek",mode:$mode}')" \
            > recovery/auto-factory/peek.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('recovery/auto-factory/peek.json','utf8'));
          if(x.ok!==true||typeof x.eligible!=='boolean')throw new Error('AUTO_FACTORY_PEEK_INVALID');
          if(x.schema!=='iberfit.exercise.media.auto-factory.peek.v3'||x.mode!==process.env.IBERFIT_FACTORY_MODE){
            throw new Error(`AUTO_FACTORY_BROKER_VERSION_MISMATCH:${String(x.schema||'missing')}:${String(x.mode||'missing')}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,`IBERFIT_FACTORY_DONE=${x.eligible?'false':'true'}\n`);
          console.log(JSON.stringify({schema:x.schema,mode:x.mode,eligible:x.eligible,eligible_count:x.eligible_count,remaining:x.remaining,blocked:x.blocked,awaiting_review:x.awaiting_review,system_v1:x.system_v1,done:x.done}));
          NODE

      - name: Create isolated Workers AI proxy
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          rm -rf "$PAGES_AI_DIR"; mkdir -p "$PAGES_AI_DIR"
          cp scripts/exercise-media/worker-ai-system-v1.mjs "$PAGES_AI_DIR/_worker.js"
          cp "$WRANGLER_CONFIG" wrangler.toml
          sed -i "s/^name = .*/name = \"$PAGES_AI_PROJECT\"/" wrangler.toml
          printf '%s\n' 'IBERFIT exercise media auto factory isolated AI proxy' > "$PAGES_AI_DIR/index.html"
          smoke_token="$(openssl rand -hex 32)"; echo "::add-mask::$smoke_token"

          project_ready=false
          for cf_attempt in 1 2 3 4; do
            if npx --yes wrangler@4 pages project create "$PAGES_AI_PROJECT" --production-branch smoke --compatibility-date 2026-09-21; then
              project_ready=true
              break
            fi
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PAGES_AI_PROJECT}" \
              | jq -e --arg name "$PAGES_AI_PROJECT" '.success == true and .result.name == $name' >/dev/null; then
              project_ready=true
              break
            fi
            sleep $((cf_attempt*3))
          done
          [[ "$project_ready" == 'true' ]]
          echo 'IBERFIT_AI_PROXY_CREATED=true' >> "$GITHUB_ENV"

          secret_ready=false
          for cf_attempt in 1 2 3 4; do
            if printf '%s' "$smoke_token" | npx --yes wrangler@4 pages secret put SMOKE_TOKEN --project-name "$PAGES_AI_PROJECT"; then
              secret_ready=true
              break
            fi
            sleep $((cf_attempt*3))
          done
          [[ "$secret_ready" == 'true' ]]

          deploy_ready=false
          : > recovery/auto-factory/pages-deploy.log
          for cf_attempt in 1 2 3 4; do
            if npx --yes wrangler@4 pages deploy "$PAGES_AI_DIR" --project-name "$PAGES_AI_PROJECT" --branch smoke --commit-dirty=true | tee recovery/auto-factory/pages-deploy.log; then
              deploy_ready=true
              break
            fi
            sleep $((cf_attempt*3))
          done
          [[ "$deploy_ready" == 'true' ]]

          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' recovery/auto-factory/pages-deploy.log | tail -n 1)"
          stable_url="https://${PAGES_AI_PROJECT}.pages.dev"
          proxy_url=''
          for attempt in $(seq 1 24); do
            for candidate in "$stable_url" "$preview_url"; do
              [[ -z "$candidate" ]] && continue
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 8 -X POST -H "Authorization: Bearer $smoke_token" "$candidate/health" > recovery/auto-factory/ai-health.json; then
                if node -e "const x=require('./recovery/auto-factory/ai-health.json');if(x.ok!==true||x.ai!==true)process.exit(1)"; then proxy_url="$candidate";break 2;fi
              fi
            done
            sleep 3
          done
          test -n "$proxy_url"
          echo "IBERFIT_AI_PROXY_URL=$proxy_url" >> "$GITHUB_ENV"
          echo "IBERFIT_AI_PROXY_TOKEN=$smoke_token" >> "$GITHUB_ENV"

      - name: Verify Workers AI capacity before claim
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$IBERFIT_FACTORY_DEFER_FILE" recovery/auto-factory/provider-preflight.json
          payload='{"messages":[{"role":"user","content":"Return exactly one JSON object with ok=true."}],"temperature":0,"stream":false,"max_completion_tokens":16,"chat_template_kwargs":{"enable_thinking":false,"preserve_thinking":false},"response_format":{"type":"json_object"}}'
          http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "Authorization: Bearer ${IBERFIT_AI_PROXY_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$IBERFIT_AI_PROXY_URL/qa" \
            -d "$payload" \
            -o recovery/auto-factory/provider-preflight.json \
            -w '%{http_code}')"
          if [[ "$http_code" =~ ^2 ]]; then
            node -e "const x=require('./recovery/auto-factory/provider-preflight.json');if(x.ok!==true)process.exit(1)"
            exit 0
          fi
          detail="$(cat recovery/auto-factory/provider-preflight.json 2>/dev/null || true)"
          if printf '%s' "$detail" | grep -Eqi '4006|used up your daily free allocation|10,?000 neurons'; then
            jq -n --arg reason 'AI_PROVIDER_DAILY_QUOTA_EXHAUSTED' --arg detail "$detail" '{schema:"iberfit.exercise.media.provider-deferral.v1",reason:$reason,detail:$detail}' > "$IBERFIT_FACTORY_DEFER_FILE"
            echo 'IBERFIT_FACTORY_DONE=true' >> "$GITHUB_ENV"
            echo 'IBERFIT_FACTORY_DEFERRED=true' >> "$GITHUB_ENV"
            echo 'Workers AI daily allocation exhausted; no exercise was claimed and no attempt was consumed.'
            exit 0
          fi
          printf '%s\n' "$detail" >&2
          exit 1

      - name: Claim next missing System v1 exercise
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          claim_ok=false
          for claim_attempt in 1 2 3; do
            rm -f recovery/auto-factory/claim.tmp recovery/auto-factory/claim.json
            if curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 45 \
              -X POST \
              -H "Authorization: Bearer ${IBERFIT_AUTO_FACTORY_OIDC}" \
              -H 'Content-Type: application/json' \
              "$AUTO_FACTORY_URL" \
              -d "$(jq -nc --arg mode "$IBERFIT_FACTORY_MODE" '{action:"claim",mode:$mode}')" \
              -o recovery/auto-factory/claim.tmp; then
              mv recovery/auto-factory/claim.tmp recovery/auto-factory/claim.json
              claim_ok=true
              break
            fi
            rm -f recovery/auto-factory/claim.tmp
            sleep $((claim_attempt*2))
          done
          [[ "$claim_ok" == 'true' ]]
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('recovery/auto-factory/claim.json','utf8'));
          if(x.ok!==true)throw new Error('AUTO_FACTORY_CLAIM_INVALID');
          if(x.mode!==process.env.IBERFIT_FACTORY_MODE)throw new Error('AUTO_FACTORY_CLAIM_MODE_MISMATCH');
          const env=process.env.GITHUB_ENV;
          if(!x.claim){fs.appendFileSync(env,'IBERFIT_FACTORY_DONE=true\n');console.log(JSON.stringify({done:x.done,remaining:x.remaining,blocked:x.blocked,awaiting_review:x.awaiting_review,system_v1:x.system_v1,review_ready:x.review_ready===true}));process.exit(0);}
          fs.appendFileSync(env,`IBERFIT_FACTORY_DONE=false\nIBERFIT_JOB_ID=${x.claim.job.id}\nIBERFIT_EXERCISE_ID=${x.claim.exercise.id}\nIBERFIT_ANATOMY_INFERRED=${x.claim.inferred_anatomy===true}\n`);
          console.log(JSON.stringify({exercise_id:x.claim.exercise.id,attempts:x.claim.job.attempts,inferred_anatomy:x.claim.inferred_anatomy,recovered:x.recovered===true}));
          NODE

      - name: Prepare approved identity reference
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          MASTER="$MASTER" python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          src=os.environ['MASTER'];out='recovery/auto-factory/reference/athlete.png'
          with Image.open(src) as image:
              image=ImageOps.exif_transpose(image).convert('RGB')
              image.thumbnail((512,640),Image.Resampling.LANCZOS)
              image.save(out,'PNG',optimize=True)
          PY
          echo 'ATHLETE_REFERENCE=recovery/auto-factory/reference/athlete.png' >> "$GITHUB_ENV"

      - name: Plan exact movement and anatomy
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: node scripts/exercise-media/auto-factory-plan.mjs --claim recovery/auto-factory/claim.json --out recovery/auto-factory/plan.json

      - name: Generate start and final phases
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -uo pipefail
          classify_quality_rejection() {
            local log_file="$1"
            local phase="$2"
            local reason
            reason="$(grep -Eo '(START_PHASE_QA_FAILED|RAW_PHASE_QA_FAILED):[^[:space:]]+' "$log_file" | tail -n 1 || true)"
            if [[ -z "$reason" ]]; then return 1; fi
            jq -n --arg exercise_id "$IBERFIT_EXERCISE_ID" --arg job_id "$IBERFIT_JOB_ID" --arg phase "$phase" --arg reason "$reason" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT"               '{schema:"iberfit.exercise.media.quality-rejection.v1",exercise_id:$exercise_id,job_id:$job_id,phase:$phase,reason:$reason,run_id:$run_id,run_attempt:$run_attempt,expected_quality_rejection:true}'               > recovery/auto-factory/quality-rejection.json
            echo 'IBERFIT_FACTORY_QUALITY_REJECTED=true' >> "$GITHUB_ENV"
            echo 'IBERFIT_FACTORY_DONE=true' >> "$GITHUB_ENV"
            echo "Exercise media candidate rejected by fail-closed quality gate: $reason"
            return 0
          }

          set +e
          node scripts/exercise-media/auto-factory-generate.mjs --claim recovery/auto-factory/claim.json --plan recovery/auto-factory/plan.json --phase start --athlete-ref "$ATHLETE_REFERENCE" --out-dir recovery/auto-factory 2>&1 | tee recovery/auto-factory/generate-start.log
          start_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$start_rc" -ne 0 ]]; then
            if classify_quality_rejection recovery/auto-factory/generate-start.log start; then exit 0; fi
            exit "$start_rc"
          fi

          set +e
          node scripts/exercise-media/auto-factory-generate.mjs --claim recovery/auto-factory/claim.json --plan recovery/auto-factory/plan.json --phase final --athlete-ref "$ATHLETE_REFERENCE" --out-dir recovery/auto-factory 2>&1 | tee recovery/auto-factory/generate-final.log
          final_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$final_rc" -ne 0 ]]; then
            if classify_quality_rejection recovery/auto-factory/generate-final.log final; then exit 0; fi
            exit "$final_rc"
          fi

          start="$(find recovery/auto-factory -maxdepth 1 -type f -name "${IBERFIT_EXERCISE_ID}-start.*" ! -name '*.json' | head -n 1)"
          final="$(find recovery/auto-factory -maxdepth 1 -type f -name "${IBERFIT_EXERCISE_ID}-final.*" ! -name '*.json' | head -n 1)"
          test -s "$start"; test -s "$final"
          echo "IBERFIT_START_IMAGE=$start" >> "$GITHUB_ENV"
          echo "IBERFIT_FINAL_IMAGE=$final" >> "$GITHUB_ENV"

      - name: Locate deterministic shirt anchors
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/exercise-media/auto-factory-locate.mjs --image "$IBERFIT_START_IMAGE" --exercise-id "$IBERFIT_EXERCISE_ID" --phase start --out recovery/auto-factory/start-anchor.json
          node scripts/exercise-media/auto-factory-locate.mjs --image "$IBERFIT_FINAL_IMAGE" --exercise-id "$IBERFIT_EXERCISE_ID" --phase final --out recovery/auto-factory/final-anchor.json

      - name: Compose canonical System v1 master and delivery asset
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/exercise-media/compose-system-v1-auto.py \
            --claim recovery/auto-factory/claim.json \
            --plan recovery/auto-factory/plan.json \
            --start "$IBERFIT_START_IMAGE" \
            --final "$IBERFIT_FINAL_IMAGE" \
            --start-anchor recovery/auto-factory/start-anchor.json \
            --final-anchor recovery/auto-factory/final-anchor.json \
            --official-isotipo "$OFFICIAL_ISOTIPO" \
            --master-out recovery/auto-factory/master.webp \
            --delivery-out recovery/auto-factory/delivery.webp \
            --meta-out recovery/auto-factory/metadata.json

      - name: Dual fail-closed QA
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/exercise-media/auto-factory-qa.mjs --mode biomechanics --claim recovery/auto-factory/claim.json --plan recovery/auto-factory/plan.json --meta recovery/auto-factory/metadata.json --image recovery/auto-factory/delivery.webp --out recovery/auto-factory/qa-biomechanics.json
          node scripts/exercise-media/auto-factory-qa.mjs --mode visual --claim recovery/auto-factory/claim.json --plan recovery/auto-factory/plan.json --meta recovery/auto-factory/metadata.json --image recovery/auto-factory/delivery.webp --out recovery/auto-factory/qa-visual.json

      - name: Build immutable QA-approved review candidate
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/exercise-media/auto-factory-build-item.mjs \
            --claim recovery/auto-factory/claim.json \
            --plan recovery/auto-factory/plan.json \
            --meta recovery/auto-factory/metadata.json \
            --qa-biomechanics recovery/auto-factory/qa-biomechanics.json \
            --qa-visual recovery/auto-factory/qa-visual.json \
            --file recovery/auto-factory/delivery.webp \
            --out recovery/auto-factory/item.json
          jq -n \
            --arg schema 'iberfit.exercise.media.review-evidence.v1' \
            --arg exercise_id "$IBERFIT_EXERCISE_ID" \
            --arg job_id "$IBERFIT_JOB_ID" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg artifact_name "iberfit-exercise-media-auto-factory-${GITHUB_RUN_ID}" \
            '{schema:$schema,exercise_id:$exercise_id,job_id:$job_id,run_id:$run_id,run_attempt:$run_attempt,workflow_sha:$workflow_sha,artifact_name:$artifact_name,state:"awaiting_human_approval",human_approved:false}' \
            > recovery/auto-factory/review-evidence.json

      - name: Stage review pixels privately
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$IBERFIT_START_IMAGE"
          test -s "$IBERFIT_FINAL_IMAGE"
          test -s recovery/auto-factory/delivery.webp

          # curl infers application/octet-stream for .webp unless MIME is explicit.
          mime_for_review() {
            local mime
            mime="$(file --brief --mime-type "$1")"
            case "$mime" in
              image/jpeg|image/png|image/webp) printf '%s' "$mime" ;;
              *) echo "AUTO_FACTORY_STAGE_UNSUPPORTED_IMAGE_TYPE" >&2; return 1 ;;
            esac
          }
          start_mime="$(mime_for_review "$IBERFIT_START_IMAGE")"
          final_mime="$(mime_for_review "$IBERFIT_FINAL_IMAGE")"
          delivery_mime="$(mime_for_review recovery/auto-factory/delivery.webp)"
          test "$delivery_mime" = 'image/webp'

          response='recovery/auto-factory/staging-response.tmp'
          set +e
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 90 \
            -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $IBERFIT_AUTO_FACTORY_OIDC" \
            "$AUTO_FACTORY_URL" \
            -F action=stage_review \
            -F "job_id=$IBERFIT_JOB_ID" \
            -F "exercise_id=$IBERFIT_EXERCISE_ID" \
            -F "start=@$IBERFIT_START_IMAGE;type=$start_mime" \
            -F "final=@$IBERFIT_FINAL_IMAGE;type=$final_mime" \
            -F "delivery=@recovery/auto-factory/delivery.webp;type=image/webp")"
          curl_rc=$?
          set -e
          if [[ "$curl_rc" -ne 0 || "$status" != '200' ]]; then
            # Never print or upload raw response bodies, filenames, JWTs or pixels.
            STAGE_HTTP_STATUS="$status" STAGE_CURL_EXIT="$curl_rc" node - <<'NODE'
          const fs=require('node:fs');
          const rawFile='recovery/auto-factory/staging-response.tmp';
          let errorCode='AUTO_FACTORY_STAGE_REMOTE_ERROR';
          try {
            const response=JSON.parse(fs.readFileSync(rawFile,'utf8'));
            const candidate=String(response?.error||'').split(':',1)[0];
            if(/^IBERFIT_AUTO_FACTORY_[A-Z0-9_]{3,96}$/.test(candidate))errorCode=candidate;
          } catch {}
          const rawStatus=String(process.env.STAGE_HTTP_STATUS||'');
          const status=/^[0-9]{3}$/.test(rawStatus)?Number(rawStatus):0;
          const curlExit=Number(process.env.STAGE_CURL_EXIT);
          const diagnostic={
            schema:'iberfit.exercise.media.stage-diagnostic.v1',
            stage:'stage_review',
            http_status:status,
            curl_exit_code:Number.isInteger(curlExit)?curlExit:-1,
            error_code:errorCode
          };
          fs.writeFileSync('recovery/auto-factory/stage-diagnostic.json',JSON.stringify(diagnostic)+'\n');
          fs.rmSync(rawFile,{force:true});
          console.error('AUTO_FACTORY_STAGE_FAILED:'+diagnostic.http_status+':'+diagnostic.error_code);
          NODE
            exit 1
          fi
          mv "$response" recovery/auto-factory/staging.json
          node - <<'NODE'
          const fs=require('node:fs');
          const staged=JSON.parse(fs.readFileSync('recovery/auto-factory/staging.json','utf8'));
          const item=JSON.parse(fs.readFileSync('recovery/auto-factory/item.json','utf8'));
          if(staged.ok!==true||staged.staged!==true||staged.job_id!==process.env.IBERFIT_JOB_ID||staged.exercise_id!==process.env.IBERFIT_EXERCISE_ID)throw new Error('AUTO_FACTORY_STAGE_INVALID');
          if(staged.staging?.delivery_sha256!==item.proof?.delivery_sha256)throw new Error('AUTO_FACTORY_STAGE_DELIVERY_SHA_MISMATCH');
          for(const key of ['start_path','start_sha256','final_path','final_sha256','delivery_path','delivery_sha256'])if(!staged.staging?.[key])throw new Error('AUTO_FACTORY_STAGE_FIELD_MISSING:'+key);
          NODE

      - name: Preserve review candidate evidence
        if: env.IBERFIT_FACTORY_DONE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-exercise-media-auto-factory-${{ github.run_id }}
          path: recovery/auto-factory/
          if-no-files-found: error
          retention-days: 30

      - name: Register candidate awaiting human approval
        if: env.IBERFIT_FACTORY_DONE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg job "$IBERFIT_JOB_ID" \
            --arg artifact "iberfit-exercise-media-auto-factory-${GITHUB_RUN_ID}" \
            --slurpfile item recovery/auto-factory/item.json \
            --slurpfile metadata recovery/auto-factory/metadata.json \
            --slurpfile bio recovery/auto-factory/qa-biomechanics.json \
            --slurpfile visual recovery/auto-factory/qa-visual.json \
            --slurpfile staging recovery/auto-factory/staging.json \
            '{action:"review",job_id:$job,artifact_name:$artifact,item:$item[0],metadata:$metadata[0],qa_biomechanics:$bio[0],qa_visual:$visual[0],staging:$staging[0].staging}')"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "Authorization: Bearer ${IBERFIT_AUTO_FACTORY_OIDC}" \
            -H 'Content-Type: application/json' \
            "$AUTO_FACTORY_URL" \
            --data-binary "$payload" \
            > recovery/auto-factory/review.json
          node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('recovery/auto-factory/review.json','utf8'));
          if(x.ok!==true||x.review_ready!==true||x.status!=='qa'||x.exercise_id!==process.env.IBERFIT_EXERCISE_ID)throw new Error('AUTO_FACTORY_REVIEW_REGISTER_INVALID');
          fs.appendFileSync(process.env.GITHUB_ENV,'IBERFIT_REVIEW_READY=true\n');
          console.log(JSON.stringify({review_ready:x.exercise_id,status:x.status,artifact_name:x.artifact_name,sha256:x.sha256,inferred_anatomy:x.inferred_anatomy}));
          NODE

      - name: Quarantine failed claimed exercise
        if: always() && env.IBERFIT_JOB_ID != '' && env.IBERFIT_REVIEW_READY != 'true' && (env.IBERFIT_FACTORY_DONE != 'true' || env.IBERFIT_FACTORY_QUALITY_REJECTED == 'true')
        shell: bash
        run: |
          set +e
          err="workflow_failed_run_${GITHUB_RUN_ID}_attempt_${GITHUB_RUN_ATTEMPT}"
          action='fail'
          reason=''
          if [[ -s recovery/auto-factory/stage-diagnostic.json ]]; then
            err="$(jq -r '.error_code // "AUTO_FACTORY_STAGE_REMOTE_ERROR"' recovery/auto-factory/stage-diagnostic.json 2>/dev/null)"
            [[ "$err" =~ ^(IBERFIT_AUTO_FACTORY_[A-Z0-9_]+|AUTO_FACTORY_STAGE_REMOTE_ERROR)$ ]] || err="AUTO_FACTORY_STAGE_REMOTE_ERROR"
          fi
          if [[ -s recovery/auto-factory/quality-rejection.json ]]; then
            err="$(jq -r '.reason // empty' recovery/auto-factory/quality-rejection.json 2>/dev/null)"
            [[ -n "$err" ]] || err="AUTO_FACTORY_QUALITY_REJECTED"
          fi
          if [[ -s "$IBERFIT_FACTORY_DEFER_FILE" ]]; then
            reason="$(jq -r '.reason // empty' "$IBERFIT_FACTORY_DEFER_FILE" 2>/dev/null)"
            if [[ "$reason" == 'AI_PROVIDER_DAILY_QUOTA_EXHAUSTED' ]]; then action='defer'; fi
          fi
          if [[ "$action" == 'defer' ]]; then
            payload="$(jq -nc --arg job "$IBERFIT_JOB_ID" --arg id "$IBERFIT_EXERCISE_ID" --arg reason "$reason" '{action:"defer",job_id:$job,exercise_id:$id,reason:$reason}')"
          else
            payload="$(jq -nc --arg job "$IBERFIT_JOB_ID" --arg id "$IBERFIT_EXERCISE_ID" --arg err "$err" '{action:"fail",job_id:$job,exercise_id:$id,error:$err}')"
          fi
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${IBERFIT_AUTO_FACTORY_OIDC}" -H 'Content-Type: application/json' "$AUTO_FACTORY_URL" --data-binary "$payload" > recovery/auto-factory/fail.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('recovery/auto-factory/fail.json','utf8'));
          if(x.ok!==true||x.job_id!==process.env.IBERFIT_JOB_ID||x.exercise_id!==process.env.IBERFIT_EXERCISE_ID)throw new Error('AUTO_FACTORY_QUARANTINE_CONFIRMATION_INVALID');
          if(!['failed','blocked'].includes(String(x.status||''))&&x.deferred!==true)throw new Error(`AUTO_FACTORY_QUARANTINE_STATE_INVALID:${String(x.status||'missing')}`);
          NODE

      - name: Preserve terminal failure evidence
        if: always() && env.IBERFIT_JOB_ID != '' && env.IBERFIT_REVIEW_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-exercise-media-auto-factory-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/auto-factory/fail.json
            recovery/auto-factory/stage-diagnostic.json
            recovery/auto-factory/provider-capacity.json
            recovery/auto-factory/quality-rejection.json
            recovery/auto-factory/claim.json
            recovery/auto-factory/plan.json
            recovery/auto-factory/generate-start.log
            recovery/auto-factory/generate-final.log
            recovery/auto-factory/start-phase-qa*.json
            recovery/auto-factory/raw-phase-qa*.json
            recovery/auto-factory/*-start.jpg
            recovery/auto-factory/*-start.png
            recovery/auto-factory/*-start.webp
            recovery/auto-factory/*-final.jpg
            recovery/auto-factory/*-final.png
            recovery/auto-factory/*-final.webp
            recovery/auto-factory/rejected/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retire isolated Workers AI proxy
        if: always() && env.IBERFIT_AI_PROXY_CREATED == 'true'
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project delete "$PAGES_AI_PROJECT" --yes

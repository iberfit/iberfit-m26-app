name: IBERFIT Exercise Media Auto Factory Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches:
      - prepublicacion/rc29
    paths:
      - '.github/workflows/exercise-media-auto-factory.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: iberfit-exercise-media-auto-factory-scheduler
  cancel-in-progress: true

jobs:
  dispatch-canary-factory:
    name: dispatch-canary-factory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify guarded Canary factory contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/exercise-media-auto-factory.yml?ref=canary%2Frc74-4"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            | jq -r '.content' \
            | base64 --decode \
            > /tmp/iberfit-canary-factory.yml
          grep -Fq 'Inspect queue before provisioning AI proxy' /tmp/iberfit-canary-factory.yml
          grep -Fq 'Verify Workers AI capacity before claim' /tmp/iberfit-canary-factory.yml
          grep -Fq 'IBERFIT_FACTORY_DEFER_FILE' /tmp/iberfit-canary-factory.yml
          grep -Fq 'Quarantine failed claimed exercise' /tmp/iberfit-canary-factory.yml
          if grep -Eq '^[[:space:]]+schedule:' /tmp/iberfit-canary-factory.yml; then
            echo 'Canary factory must remain manually dispatched; scheduler owns recurrence.' >&2
            exit 1
          fi

      - name: Dispatch guarded Canary factory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=/tmp/iberfit-dispatch-response.json
          code="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exercise-media-auto-factory.yml/dispatches" \
            -d '{"ref":"canary/rc74-4"}')"
          if [[ "$code" != '204' ]]; then
            cat "$body" >&2 || true
            echo "IBERFIT_FACTORY_DISPATCH_FAILED_HTTP_${code}" >&2
            exit 1
          fi
          echo 'Canary exercise-media factory dispatched successfully.'

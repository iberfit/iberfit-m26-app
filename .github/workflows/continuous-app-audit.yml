name: IBERFIT M26 Continuous App Audit

on:
  pull_request:
    paths:
      - 'public/m26/**'
      - 'src/m26/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/audit/**'
      - 'scripts/lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/remote-gates.yml'
      - '.github/workflows/continuous-app-audit.yml'
  push:
    branches:
      - canary/rc74-4
    paths:
      - 'public/m26/**'
      - 'src/m26/**'
      - 'qa/p0-pwa-upgrade/**'
      - 'scripts/audit/**'
      - 'scripts/lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.p0-pwa-upgrade.config.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/remote-gates.yml'
      - '.github/workflows/continuous-app-audit.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      audit_ref:
        description: 'Ref exacta a auditar cuando se invoca como workflow reutilizable'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: m26-continuous-app-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-read-only:
    name: audit-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Preparar carpeta de evidencia
        run: mkdir -p recovery/continuous-audit

      - name: Regresión Node completa
        shell: bash
        run: |
          set -o pipefail
          npm run test:offline 2>&1 | tee recovery/continuous-audit/full-node-regression.log

      - name: Translation Coverage Gate
        run: node --test tests/m26_rc74_18_translation_coverage_gate.test.mjs

      - name: Accessibility Gate
        run: node --test tests/m26_rc74_18_accessibility_gate.test.mjs

      - name: UX State Gate
        run: node --test tests/m26_rc74_18_ux_state_gate.test.mjs

      - name: Validar contratos Cliente Coach Admin
        run: |
          node --test \
            tests/m26_role_route_navigation_contract.test.mjs \
            tests/m26_shell_roles.test.mjs \
            tests/m26_rc38_client_bottom_navigation.test.mjs \
            tests/m26_rc40_admin_complete.test.mjs \
            tests/m26_rc71_2_preferences_i18n.test.mjs

      - name: Auditar acciones Admin operativas
        run: node scripts/audit/admin_action_surface_audit.mjs

      - name: Auditar registro de acciones
        run: node scripts/audit/action_registry_audit.mjs

      - name: Ejecutar auditoría integral read-only
        env:
          M26_AUDIT_APP_URL: https://app.iberfit.cl
        run: node scripts/audit/continuous_app_audit.mjs

      - name: Ejecutar auditoría profunda de producto
        env:
          M26_AUDIT_APP_URL: https://app.iberfit.cl
        run: node scripts/audit/deep_product_audit.mjs

      - name: Auditar experiencia estética y de entrenamiento
        run: node scripts/audit/product_experience_audit.mjs

      - name: Conservar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m26-continuous-audit-${{ github.run_id }}
          path: recovery/continuous-audit/
          if-no-files-found: warn
          retention-days: 30

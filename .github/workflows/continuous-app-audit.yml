name: IBERFIT M26 Continuous App Audit

on:
  pull_request:
    paths:
      - 'public/m26/**'
      - 'src/m26/**'
      - 'scripts/audit/**'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/continuous-app-audit.yml'
  push:
    branches:
      - prep/final-production-rc74-4
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: m26-continuous-app-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-read-only:
    name: audit-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar carpeta de evidencia
        run: mkdir -p recovery/continuous-audit

      - name: P0 sesión WebAuthn y login
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/m26_final_delivery_auth_ux.test.mjs \
            2>&1 | tee recovery/continuous-audit/p0-final-delivery-auth-ux.log

      - name: P0 MFA privilegiado
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/m26_rc65c1_privileged_mfa.test.mjs \
            2>&1 | tee recovery/continuous-audit/p0-privileged-mfa.log

      - name: P0 navegación por roles
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/m26_role_route_navigation_contract.test.mjs \
            2>&1 | tee recovery/continuous-audit/p0-role-navigation.log

      - name: P0 PWA instalación y scope raíz
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/m26_pwa_install_experience.test.mjs \
            tests/m26_pwa_root_contract.test.mjs \
            2>&1 | tee recovery/continuous-audit/p0-pwa.log

      - name: Regresión Node completa
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee recovery/continuous-audit/full-node-regression.log

      - name: Validar contratos Cliente Coach Admin
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/m26_role_route_navigation_contract.test.mjs \
            tests/m26_shell_roles.test.mjs \
            tests/m26_rc38_client_bottom_navigation.test.mjs \
            tests/m26_rc40_admin_complete.test.mjs \
            tests/m26_rc71_2_preferences_i18n.test.mjs \
            2>&1 | tee recovery/continuous-audit/role-contracts.log

      - name: Ejecutar auditoría integral read-only
        if: always()
        env:
          M26_AUDIT_APP_URL: https://app.iberfit.cl
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit/continuous_app_audit.mjs \
            2>&1 | tee recovery/continuous-audit/auditor-runtime.log

      - name: Conservar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m26-continuous-audit-${{ github.run_id }}
          path: recovery/continuous-audit/
          if-no-files-found: warn
          retention-days: 30

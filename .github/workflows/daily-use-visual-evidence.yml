name: IBERFIT Daily Use Visual Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/design/**'
      - 'src/m26/shell/**'
      - 'src/m26/rc39/**'
      - 'public/m26/index.html'
      - 'qa/admin-interaction/fixture.html'
      - 'qa/admin-interaction/client-form-continuity.fixture.html'
      - 'qa/admin-interaction/admin-visual-evidence.spec.mjs'
      - 'playwright.daily-admin-visual.config.mjs'
      - 'qa/coach-today/**'
      - 'playwright.coach-today-visual.config.mjs'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/ui/progress-continuity.js'
      - 'qa/coach-progress/**'
      - 'playwright.coach-progress-visual.config.mjs'
      - 'qa/coach-builder/**'
      - 'playwright.coach-builder-visual.config.mjs'
      - 'qa/rc64/authenticated-visual-evidence.spec.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'playwright.authenticated-visual.config.mjs'
      - '.github/workflows/daily-use-visual-evidence.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/design/**'
      - 'src/m26/shell/**'
      - 'src/m26/rc39/**'
      - 'public/m26/index.html'
      - 'qa/admin-interaction/fixture.html'
      - 'qa/admin-interaction/client-form-continuity.fixture.html'
      - 'qa/admin-interaction/admin-visual-evidence.spec.mjs'
      - 'playwright.daily-admin-visual.config.mjs'
      - 'qa/coach-today/**'
      - 'playwright.coach-today-visual.config.mjs'
      - 'src/m26/modules/route-render.js'
      - 'src/m26/ui/progress-continuity.js'
      - 'qa/coach-progress/**'
      - 'playwright.coach-progress-visual.config.mjs'
      - 'qa/coach-builder/**'
      - 'playwright.coach-builder-visual.config.mjs'
      - 'qa/rc64/authenticated-visual-evidence.spec.mjs'
      - 'qa/rc64/secure-current-source-auth.mjs'
      - 'playwright.authenticated-visual.config.mjs'
      - '.github/workflows/daily-use-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: iberfit-daily-use-visual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-current-head:
    name: P0 Supabase Free - reject superseded PR before QA
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify head of live PR without calling Supabase
        id: verify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PR_IS_DRAFT" == true ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'P0_QA_PR_NUMBER_INVALID' >&2; exit 41; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'P0_QA_PR_SHA_INVALID' >&2; exit 42; }
          # Fail-closed on API failures rather than running stale QA.
          response="$(curl --fail --silent --show-error --max-time 8 --retry 1 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_sha="$(jq -er '.head.sha' <<< "$response")"
          live_state="$(jq -er '.state' <<< "$response")"
          live_draft="$(jq -r '.draft | tostring' <<< "$response")"
          if [[ "$live_sha" == "$PR_SHA" && "$live_state" == open && "$live_draft" == false ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "P0_QA_SUPERSEDED_PR_SKIP: no QA credentials or HTTP to Supabase"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  capture:
    needs: pr-current-head
    if: ${{ needs.pr-current-head.outputs.current == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify current Canary SHA before shared QA operations
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node scripts/ops/require_current_canary_sha.mjs
      - run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Verify Chromium browser cache
        run: node --input-type=module -e "import fs from 'node:fs'; import { chromium } from '@playwright/test'; if (!fs.existsSync(chromium.executablePath())) throw new Error('PLAYWRIGHT_CHROMIUM_NOT_READY');"
      - name: Verify real Chromium headless launch
        run: node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({headless:true}); await browser.close();"
      - name: Build authenticated current-source surface
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Capture authenticated Client and Coach evidence
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: npx playwright test --config playwright.authenticated-visual.config.mjs
      - name: Capture Admin daily-use surfaces
        run: npx playwright test --config playwright.daily-admin-visual.config.mjs
      - name: Capture Coach Hoy current-source visual evidence
        run: npx playwright test --config playwright.coach-today-visual.config.mjs
      - name: Capture Coach Progreso decision-scan visual evidence
        run: npx playwright test --config playwright.coach-progress-visual.config.mjs
      - name: Capture SIGNATURE Coach Builder states 320 390 tablet desktop
        run: npx playwright test --config playwright.coach-builder-visual.config.mjs
      - name: Upload current visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-daily-use-visual-${{ github.run_id }}
          path: |
            recovery/rc64-authenticated-visual/
            recovery/daily-use-visual/
          if-no-files-found: error
          retention-days: 30
name: IBERFIT Daily Use Visual Evidence

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/design/**'
      - 'src/m26/shell/**'
      - 'src/m26/rc39/**'
      - 'public/m26/index.html'
      - 'qa/admin-interaction/fixture.html'
      - 'qa/admin-interaction/client-form-continuity.fixture.html'
      - 'qa/admin-interaction/admin-visual-evidence.spec.mjs'
      - 'playwright.daily-admin-visual.config.mjs'
      - 'qa/coach-today/**'
      - 'playwright.coach-today-visual.config.mjs'
      - '.github/workflows/daily-use-visual-evidence.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'src/m26/admin/**'
      - 'src/m26/design/**'
      - 'src/m26/shell/**'
      - 'src/m26/rc39/**'
      - 'public/m26/index.html'
      - 'qa/admin-interaction/fixture.html'
      - 'qa/admin-interaction/client-form-continuity.fixture.html'
      - 'qa/admin-interaction/admin-visual-evidence.spec.mjs'
      - 'playwright.daily-admin-visual.config.mjs'
      - 'qa/coach-today/**'
      - 'playwright.coach-today-visual.config.mjs'
      - '.github/workflows/daily-use-visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-daily-use-visual-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    concurrency:
      group: iberfit-qa-shared-auth-readonly
      queue: max
      cancel-in-progress: false
    environment: m26-canary-readonly
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build authenticated current-source surface
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
        run: node qa/rc64/build-authenticated-surface.mjs
      - name: Capture authenticated Client and Coach evidence
        env:
          M26_PROJECT_REF: gjztkdwfmunnzhtvxrsu
          M26_QA_ONLY: 'true'
          M26_SUPABASE_URL: https://gjztkdwfmunnzhtvxrsu.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
        run: npx playwright test --config playwright.authenticated-visual.config.mjs
      - name: Capture Admin daily-use surfaces
        run: npx playwright test --config playwright.daily-admin-visual.config.mjs
      - name: Capture Coach Hoy current-source visual evidence
        run: npx playwright test --config playwright.coach-today-visual.config.mjs
      - name: Upload current visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-daily-use-visual-${{ github.run_id }}
          path: |
            recovery/rc64-authenticated-visual/
            recovery/daily-use-visual/
          if-no-files-found: error
          retention-days: 30

name: IBERFIT synthetic annual report PDF sample
on:
  push:
    branches: [feature/global-excellence-intelligence-360]
    paths:
      - 'qa/m44/generate-synthetic-annual-report.mjs'
      - '.github/workflows/gx-annual-report-sample.yml'
      - 'supabase/functions/iberfit-evolution-report-emission-v1/**'
      - 'public/m26/fonts/report-*.ttf'
      - 'src/m26/workflows/report-*.js'
      - 'src/m26/workflows/evolution-report-document.js'
      - 'public/m26/evolution-report.css'
      - 'public/m26/iri-report.css'
      - 'src/m26/workflows/iri-report-*.js'
      - 'supabase/functions/iberfit-iri-report-emission-v1/**'
      - 'tests/m26_iri_elite_measurements.test.mjs'
      - 'tests/m26_report_private_audience.test.mjs'
      - 'tests/m44_evolution_report_visual_quality.test.mjs'
      - 'tests/m44_server_pdf_renderer.test.mjs'
      - 'tests/m44_pdf_issuance_broker_contract.test.mjs'
      - 'src/m26/admin/business-report.js'
      - 'tests/m26_business_report.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-report:
    name: Exact report model and PDF renderer, synthetic data only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Validate committed first-party report fonts
        run: |
          for font in public/m26/fonts/report-{inter,serif}-{regular,bold}.ttf; do
            test -s "$font"
          done
      - name: Verify Elite trend and existing renderer contracts
        run: node --test tests/m26_elite_report_trends.test.mjs tests/m44_server_pdf_renderer.test.mjs tests/m26_report_private_audience.test.mjs tests/m44_evolution_report_visual_quality.test.mjs tests/m26_life360_sport_reports.test.mjs tests/m26_business_report.test.mjs tests/m26_rc47_admin_command_center.test.mjs tests/m26_report_cycle_objective.test.mjs tests/m26_life360_cycle_goals.test.mjs tests/m26_premium_automatic_reports.test.mjs tests/m26_iri_elite_measurements.test.mjs tests/m26_iri_client_report_human_premium.test.mjs tests/m26_iri_report_premium_v1.test.mjs tests/m26_iri_report_governance_contract.test.mjs tests/m26_iri2_live_history_report.test.mjs
      - name: Typecheck IRI and evolution official emitters
        run: |
          deno check --node-modules-dir=auto supabase/functions/iberfit-iri-report-emission-v1/index.ts
          deno check --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json supabase/functions/iberfit-evolution-report-emission-v1/index.ts
          stage="$(node scripts/ops/stage_gx_evolution_edge.mjs)"
          trap 'rm -rf "$stage"' EXIT
          deno check --config "$stage/supabase/functions/iberfit-evolution-report-emission-v1/deno.json" "$stage/supabase/functions/iberfit-evolution-report-emission-v1/index.ts"
      - name: Generate official-template synthetic PDF
        run: deno run --config supabase/functions/iberfit-evolution-report-emission-v1/deno.json --allow-read --allow-write=qa-output/annual-report-sample --allow-env=GITHUB_SHA qa/m44/generate-synthetic-annual-report.mjs
      - name: Raster preview of actual PDF pages
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
            for file in qa-output/annual-report-sample/*.pdf; do
              pdftoppm -r 100 -png "$file" "${file%.pdf}-page"
              pdftotext -layout "$file" "${file%.pdf}.txt"
            done
            grep -F 'Tu año en IBERFIT' qa-output/annual-report-sample/Tu-ano-en-IBERFIT-muestra.txt
            grep -F '104' qa-output/annual-report-sample/Tu-ano-en-IBERFIT-muestra.txt
            grep -iF 'Tendencia:' qa-output/annual-report-sample/Tu-ano-en-IBERFIT-muestra.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tu-ano-en-IBERFIT-muestra
          path: qa-output/annual-report-sample/
          if-no-files-found: error
          retention-days: 14

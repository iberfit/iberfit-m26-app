name: IBERFIT M26 CI

on:
  push:
    branches:
      - main
      - "canary/**"
      - "feature/rc58-design-system"
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe READ_ONLY_REMOTE_GATE para ejecutar el gate remoto
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: m26-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar RC29
        if: ${{ github.ref != 'refs/heads/canary/rc30' && github.head_ref != 'canary/rc30' && github.ref != 'refs/heads/canary/rc31' && github.head_ref != 'canary/rc31' && github.ref != 'refs/heads/canary/rc32' && github.head_ref != 'canary/rc32' && github.ref != 'refs/heads/canary/rc33' && github.head_ref != 'canary/rc33' && github.ref != 'refs/heads/canary/rc35' && github.head_ref != 'canary/rc35' && github.ref != 'refs/heads/canary/rc36' && github.head_ref != 'canary/rc36' && github.ref != 'refs/heads/canary/rc37' && github.head_ref != 'canary/rc37' && github.ref != 'refs/heads/canary/rc38' && github.head_ref != 'canary/rc38' && github.ref != 'refs/heads/feature/rc46-total-experience' && github.head_ref != 'feature/rc46-total-experience' && github.ref != 'refs/heads/feature/rc47-command-center' && github.head_ref != 'feature/rc47-command-center' && github.ref != 'refs/heads/feature/rc48-session-experience' && github.head_ref != 'feature/rc48-session-experience' && github.ref != 'refs/heads/feature/rc49-coach-copilot' && github.head_ref != 'feature/rc49-coach-copilot' && github.ref != 'refs/heads/feature/rc50-adaptive-experience' && github.head_ref != 'feature/rc50-adaptive-experience' && github.ref != 'refs/heads/feature/rc51-health-device-foundation' && github.head_ref != 'feature/rc51-health-device-foundation' && github.ref != 'refs/heads/feature/rc52-live-wearable-experience' && github.head_ref != 'feature/rc52-live-wearable-experience' && github.ref != 'refs/heads/feature/rc53-native-device-bridges' && github.head_ref != 'feature/rc53-native-device-bridges' && github.ref != 'refs/heads/feature/rc54-native-build-harness' && github.head_ref != 'feature/rc54-native-build-harness' && github.ref != 'refs/heads/feature/rc55-device-app-runtime' && github.head_ref != 'feature/rc55-device-app-runtime' && github.ref != 'refs/heads/feature/rc56-native-compile-readiness' && github.head_ref != 'feature/rc56-native-compile-readiness' && github.ref != 'refs/heads/feature/rc56-3-hardware-e2e-closure' && github.head_ref != 'feature/rc56-3-hardware-e2e-closure' && github.ref != 'refs/heads/feature/rc58-design-system' && github.head_ref != 'feature/rc58-design-system' }}
        run: npm run validate:rc29

      - name: Validar RC46 feature
        if: ${{ github.ref == 'refs/heads/feature/rc46-total-experience' || github.head_ref == 'feature/rc46-total-experience' }}
        run: npm run validate:rc456:local

      - name: Validar RC47 feature
        if: ${{ github.ref == 'refs/heads/feature/rc47-command-center' || github.head_ref == 'feature/rc47-command-center' }}
        run: npm run validate:rc47:local

      - name: Validar RC48 feature
        if: ${{ github.ref == 'refs/heads/feature/rc48-session-experience' || github.head_ref == 'feature/rc48-session-experience' }}
        run: npm run validate:rc48:local

      - name: Validar RC49 feature
        if: ${{ github.ref == 'refs/heads/feature/rc49-coach-copilot' || github.head_ref == 'feature/rc49-coach-copilot' }}
        run: npm run validate:rc49:local

      - name: Validar RC50 feature
        if: ${{ github.ref == 'refs/heads/feature/rc50-adaptive-experience' || github.head_ref == 'feature/rc50-adaptive-experience' }}
        run: npm run validate:rc50:local

      - name: Validar RC51 feature
        if: ${{ github.ref == 'refs/heads/feature/rc51-health-device-foundation' || github.head_ref == 'feature/rc51-health-device-foundation' }}
        run: npm run validate:rc51:local

      - name: Validar RC52 feature
        if: ${{ github.ref == 'refs/heads/feature/rc52-live-wearable-experience' || github.head_ref == 'feature/rc52-live-wearable-experience' }}
        run: npm run validate:rc52:local

      - name: Validar RC53 feature
        if: ${{ github.ref == 'refs/heads/feature/rc53-native-device-bridges' || github.head_ref == 'feature/rc53-native-device-bridges' }}
        run: npm run validate:rc53:local

      - name: Validar RC54 feature
        if: ${{ github.ref == 'refs/heads/feature/rc54-native-build-harness' || github.head_ref == 'feature/rc54-native-build-harness' }}
        run: npm run validate:rc54:local

      - name: Validar RC55 feature
        if: ${{ github.ref == 'refs/heads/feature/rc55-device-app-runtime' || github.head_ref == 'feature/rc55-device-app-runtime' }}
        run: npm run validate:rc55:local

      - name: Validar RC56 feature
        if: ${{ github.ref == 'refs/heads/feature/rc56-native-compile-readiness' || github.head_ref == 'feature/rc56-native-compile-readiness' }}
        run: npm run validate:rc56:local

      - name: Validar RC56.3 hardware closure
        if: ${{ github.ref == 'refs/heads/feature/rc56-3-hardware-e2e-closure' || github.head_ref == 'feature/rc56-3-hardware-e2e-closure' }}
        run: |
          npm run validate:rc56:local
          node scripts/verify_rc56_hardware_validation.mjs
          node --test tests/m26_rc56_hardware_validation.test.mjs

      - name: Preparar Quality Platform RC64
        if: ${{ github.ref == 'refs/heads/feature/rc58-design-system' || github.head_ref == 'feature/rc58-design-system' }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validar RC58 app integrity
        if: ${{ github.ref == 'refs/heads/feature/rc58-design-system' || github.head_ref == 'feature/rc58-design-system' }}
        run: |
          node scripts/check_utf8_mojibake.mjs
          node scripts/generate_rc58_app_shell.mjs --check
          npm test
          npm run quality:rc64:browser
          npm run quality:rc64:real-shell
          npm run quality:rc64:performance
      - name: Validar RC30 canary
        if: ${{ github.ref == 'refs/heads/canary/rc30' || github.head_ref == 'canary/rc30' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc30
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc30
        run: npm run validate:rc30:canary

      - name: Validar RC31 canary
        if: ${{ github.ref == 'refs/heads/canary/rc31' || github.head_ref == 'canary/rc31' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc31
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc31
        run: npm run validate:rc31:ci

      - name: Validar RC32 canary
        if: ${{ github.ref == 'refs/heads/canary/rc32' || github.head_ref == 'canary/rc32' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc32
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc32
        run: npm run validate:rc32:ci

      - name: Validar RC33 canary
        if: ${{ github.ref == 'refs/heads/canary/rc33' || github.head_ref == 'canary/rc33' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc33
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc33
        run: npm run validate:rc33:ci

      - name: Validar RC35 canary
        if: ${{ github.ref == 'refs/heads/canary/rc35' || github.head_ref == 'canary/rc35' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc35
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc35
        run: npm run validate:rc35:ci

      - name: Validar RC36 canary
        if: ${{ github.ref == 'refs/heads/canary/rc36' || github.head_ref == 'canary/rc36' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc36
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc36
        run: npm run validate:rc36:ci

      - name: Validar RC37 canary
        if: ${{ github.ref == 'refs/heads/canary/rc37' || github.head_ref == 'canary/rc37' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc37
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc37
        run: npm run validate:rc37:ci

      - name: Validar RC38 canary
        if: ${{ github.ref == 'refs/heads/canary/rc38' || github.head_ref == 'canary/rc38' }}
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_validation_rc38
          M26_QA_ONLY: 'true'
          M26_RUNTIME_VALIDATION_ONLY: 'true'
          CF_PAGES_BRANCH: canary/rc38
        run: npm run validate:rc38:ci

      - name: Conservar evidencia RC29
        if: ${{ always() && github.ref != 'refs/heads/canary/rc30' && github.head_ref != 'canary/rc30' && github.ref != 'refs/heads/canary/rc31' && github.head_ref != 'canary/rc31' && github.ref != 'refs/heads/canary/rc32' && github.head_ref != 'canary/rc32' && github.ref != 'refs/heads/canary/rc33' && github.head_ref != 'canary/rc33' && github.ref != 'refs/heads/canary/rc35' && github.head_ref != 'canary/rc35' && github.ref != 'refs/heads/canary/rc36' && github.head_ref != 'canary/rc36' && github.ref != 'refs/heads/canary/rc37' && github.head_ref != 'canary/rc37' && github.ref != 'refs/heads/canary/rc38' && github.head_ref != 'canary/rc38' && github.ref != 'refs/heads/feature/rc46-total-experience' && github.head_ref != 'feature/rc46-total-experience' && github.ref != 'refs/heads/feature/rc47-command-center' && github.head_ref != 'feature/rc47-command-center' && github.ref != 'refs/heads/feature/rc48-session-experience' && github.head_ref != 'feature/rc48-session-experience' && github.ref != 'refs/heads/feature/rc49-coach-copilot' && github.head_ref != 'feature/rc49-coach-copilot' && github.ref != 'refs/heads/feature/rc50-adaptive-experience' && github.head_ref != 'feature/rc50-adaptive-experience' && github.ref != 'refs/heads/feature/rc51-health-device-foundation' && github.head_ref != 'feature/rc51-health-device-foundation' && github.ref != 'refs/heads/feature/rc52-live-wearable-experience' && github.head_ref != 'feature/rc52-live-wearable-experience' && github.ref != 'refs/heads/feature/rc53-native-device-bridges' && github.head_ref != 'feature/rc53-native-device-bridges' && github.ref != 'refs/heads/feature/rc54-native-build-harness' && github.head_ref != 'feature/rc54-native-build-harness' && github.ref != 'refs/heads/feature/rc55-device-app-runtime' && github.head_ref != 'feature/rc55-device-app-runtime' && github.ref != 'refs/heads/feature/rc56-native-compile-readiness' && github.head_ref != 'feature/rc56-native-compile-readiness' && github.ref != 'refs/heads/feature/rc56-3-hardware-e2e-closure' && github.head_ref != 'feature/rc56-3-hardware-e2e-closure' && github.ref != 'refs/heads/feature/rc58-design-system' && github.head_ref != 'feature/rc58-design-system' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc29-evidencia-validacion
          path: |
            recovery/RC29_*.json
            recovery/RC29_*.md
            recovery/RC29_*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC30
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc30' || github.head_ref == 'canary/rc30') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc30-evidencia-validacion
          path: |
            recovery/RC30_*.json
            recovery/RC30_*.md
            recovery/RC30_*.txt
            release/RC30_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC31
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc31' || github.head_ref == 'canary/rc31') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc31-evidencia-validacion
          path: |
            recovery/RC31_*.json
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC32
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc32' || github.head_ref == 'canary/rc32') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc32-evidencia-validacion
          path: |
            recovery/RC32_*.json
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC33
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc33' || github.head_ref == 'canary/rc33') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc33-evidencia-validacion
          path: |
            recovery/RC33_*.json
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC35
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc35' || github.head_ref == 'canary/rc35') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc35-evidencia-validacion
          path: |
            recovery/RC35_*.json
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14


      - name: Conservar evidencia RC36
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc36' || github.head_ref == 'canary/rc36') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc36-evidencia-validacion
          path: |
            recovery/RC36_*.json
            recovery/RC36_*.md
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC37
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc37' || github.head_ref == 'canary/rc37') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc37-evidencia-validacion
          path: |
            recovery/RC37_*.json
            recovery/RC37_*.md
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar evidencia RC38
        if: ${{ always() && (github.ref == 'refs/heads/canary/rc38' || github.head_ref == 'canary/rc38') }}
        uses: actions/upload-artifact@v4
        with:
          name: rc38-evidencia-validacion
          path: |
            recovery/RC38_*.json
            recovery/RC38_*.md
            recovery/RC29_MODULE_GRAPH_REPORT.json
          if-no-files-found: warn
          retention-days: 14

  remote_readonly:
    name: Gate remoto A/B de solo lectura
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/canary/rc31' || github.ref == 'refs/heads/canary/rc32' || github.ref == 'refs/heads/canary/rc33' || github.ref == 'refs/heads/canary/rc35' || github.ref == 'refs/heads/canary/rc36' || github.ref == 'refs/heads/canary/rc37' || github.ref == 'refs/heads/canary/rc38') && inputs.confirmation == 'READ_ONLY_REMOTE_GATE' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar gate autenticado sin mutaciones
        env:
          M26_SUPABASE_URL: ${{ secrets.M26_SUPABASE_URL }}
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_QA_COACH_EMAIL: ${{ secrets.M26_QA_COACH_EMAIL }}
          M26_QA_COACH_PASSWORD: ${{ secrets.M26_QA_COACH_PASSWORD }}
          M26_QA_CLIENT_A_EMAIL: ${{ secrets.M26_QA_CLIENT_A_EMAIL }}
          M26_QA_CLIENT_A_PASSWORD: ${{ secrets.M26_QA_CLIENT_A_PASSWORD }}
          M26_QA_CLIENT_B_EMAIL: ${{ secrets.M26_QA_CLIENT_B_EMAIL }}
          M26_QA_CLIENT_B_PASSWORD: ${{ secrets.M26_QA_CLIENT_B_PASSWORD }}
        run: node scripts/remote-gates/run_authenticated_readonly_gate.mjs

      - name: Conservar evidencia remota
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canary-gate-remoto-solo-lectura
          path: |
            recovery/RC29_REMOTE_*.json
            recovery/RC31_REMOTE_*.json
            recovery/RC32_REMOTE_*.json
            recovery/RC33_REMOTE_*.json
          if-no-files-found: warn
          retention-days: 14

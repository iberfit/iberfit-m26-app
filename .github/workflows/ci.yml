name: IBERFIT M26 CI

on:
  push:
    branches:
      - main
      - "canary/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: m26-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar RC29
        run: npm run validate:rc29
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc29-evidencia-validacion
          path: |
            recovery/RC29_*.json
            recovery/RC29_*.md
            recovery/RC29_*.txt
          if-no-files-found: warn
          retention-days: 14
# Trigger Cloudflare RC30 canary deployment
name: IBERFIT M44 Offline ACL Archive Coverage (No Free Swap)
on:
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/ops/m44_offline_acl_archive_coverage.mjs'
      - 'tests/m44_offline_acl_archive_coverage.test.mjs'
      - '.github/workflows/m44-offline-acl-archive-coverage.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: iberfit-m44-offline-acl-archive
  cancel-in-progress: false
jobs:
  offline-acl-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: m26-canary-readonly
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IBERFIT_BACKUP_PASSPHRASE: ${{ secrets.IBERFIT_BACKUP_PASSPHRASE }}
      M44_OFFLINE_DIAGNOSTIC_AUTHORIZATION: ACL_ARCHIVE_COVERAGE_ONLY_20261122
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify no-secrets-in-logs offline read-only contract
        run: |
          node --check scripts/ops/m44_offline_acl_archive_coverage.mjs
          node --test tests/m44_offline_acl_archive_coverage.test.mjs
      - name: Examine ONLY encrypted authenticated archive vs live PROD catalog, no project swaps
        run: node scripts/ops/m44_offline_acl_archive_coverage.mjs

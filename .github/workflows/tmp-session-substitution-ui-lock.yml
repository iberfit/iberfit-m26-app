name: Temporary Session Substitution UI Lock Patch

on:
  push:
    branches:
      - fix/session-substitution-ui-lock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-substitution-ui-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          execution = Path('src/m26/workflows/session-execution.js')
          text = execution.read_text()
          old = """function occurrenceHasResolvedSet(execution,item){\n  if(!item)return false;\n  for(let setNumber=1;setNumber<=Number(item.sets||0);setNumber+=1){\n    const step={...item,setNumber,totalSets:item.sets};\n    if(executionResultForStep(execution,step,setNumber)||skippedSetForStep(execution,step,setNumber))return true;\n  }\n  return false;\n}\nexport function substituteExercise(execution,session,{fromExerciseId,toExerciseId,catalog,reason,actor=null}={}){\n"""
          new = """function occurrenceHasResolvedSet(execution,item){\n  if(!item)return false;\n  for(let setNumber=1;setNumber<=Number(item.sets||0);setNumber+=1){\n    const step={...item,setNumber,totalSets:item.sets};\n    if(executionResultForStep(execution,step,setNumber)||skippedSetForStep(execution,step,setNumber))return true;\n  }\n  return false;\n}\nexport function canSubstituteCurrentExercise(execution){\n  const item=execution?.queue?.[execution.index];\n  return Boolean(item)&&!occurrenceHasResolvedSet(execution,item);\n}\nexport function substituteExercise(execution,session,{fromExerciseId,toExerciseId,catalog,reason,actor=null}={}){\n"""
          if old not in text:
              raise SystemExit('session-execution anchor not found')
          text = text.replace(old, new, 1)
          old = """  if(itemIndex===execution.index){\n    if(occurrenceHasResolvedSet(execution,item))throw new Error('M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED');\n    clearActiveSetDraft(execution);\n  }\n"""
          new = """  if(itemIndex===execution.index){\n    if(!canSubstituteCurrentExercise(execution))throw new Error('M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED');\n    clearActiveSetDraft(execution);\n  }\n"""
          if old not in text:
              raise SystemExit('substitute guard anchor not found')
          execution.write_text(text.replace(old, new, 1))

          ui = Path('src/m26/workflows/session-ui.js')
          text = ui.read_text()
          old = "import { currentStep,executionResultForStep,previousSetDraftValues } from './session-execution.js';"
          new = "import { canSubstituteCurrentExercise,currentStep,executionResultForStep,previousSetDraftValues } from './session-execution.js';"
          if old not in text:
              raise SystemExit('session-ui import anchor not found')
          text = text.replace(old, new, 1)
          old = "  const recorded=executionResultForStep(execution,step);"
          new = "  const recorded=executionResultForStep(execution,step);\n  const substitutionLocked=!canSubstituteCurrentExercise(execution);"
          if old not in text:
              raise SystemExit('session-ui recorded anchor not found')
          text = text.replace(old, new, 1)
          old = "${recorded?'disabled aria-disabled=\"true\" title=\"Continúa a la siguiente serie antes de sustituir\"':''}>Usar alternativa</button>"
          new = "${substitutionLocked?'disabled aria-disabled=\"true\" title=\"Este ejercicio ya tiene progreso registrado\"':''}>Usar alternativa</button>"
          if old not in text:
              raise SystemExit('session-ui button anchor not found')
          ui.write_text(text.replace(old, new, 1))

          test = Path('tests/m26_session_substitution_progress.test.mjs')
          text = test.read_text()
          old = "import {createExecution,startExecution,recordSet,advanceExecution,skipExecutionSet,substituteExercise} from '../src/m26/workflows/session-execution.js';"
          new = "import {canSubstituteCurrentExercise,createExecution,startExecution,recordSet,advanceExecution,skipExecutionSet,substituteExercise} from '../src/m26/workflows/session-execution.js';\nimport {renderGuidedExecution} from '../src/m26/workflows/session-ui.js';"
          if old not in text:
              raise SystemExit('test import anchor not found')
          text = text.replace(old, new, 1)
          old = """  startExecution(execution);\n  recordSet(execution,session,{reps:10,rpe:7});\n  advanceExecution(execution);\n  assert.equal(execution.setIndex,1);\n  assert.throws(()=>substituteExercise(execution,session,{fromExerciseId:from,toExerciseId:to,catalog,reason:'Cambio tardío'}),/M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED/);\n"""
          new = """  startExecution(execution);\n  assert.equal(canSubstituteCurrentExercise(execution),true);\n  recordSet(execution,session,{reps:10,rpe:7});\n  advanceExecution(execution);\n  assert.equal(execution.setIndex,1);\n  assert.equal(canSubstituteCurrentExercise(execution),false);\n  const markup=renderGuidedExecution({execution,session,catalog});\n  const substituteButton=markup.match(/<button[^>]+data-session-action=\"substitute\"[^>]*>/)?.[0]||'';\n  assert.match(substituteButton,/disabled aria-disabled=\"true\"/);\n  assert.throws(()=>substituteExercise(execution,session,{fromExerciseId:from,toExerciseId:to,catalog,reason:'Cambio tardío'}),/M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED/);\n"""
          if old not in text:
              raise SystemExit('recorded test anchor not found')
          text = text.replace(old, new, 1)
          old = """  startExecution(execution);\n  skipExecutionSet(execution,session,{reason:'Molestia puntual'});\n  assert.equal(execution.setIndex,1);\n  assert.throws(()=>substituteExercise(execution,session,{fromExerciseId:from,toExerciseId:to,catalog,reason:'Cambio tardío'}),/M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED/);\n"""
          new = """  startExecution(execution);\n  skipExecutionSet(execution,session,{reason:'Molestia puntual'});\n  assert.equal(execution.setIndex,1);\n  assert.equal(canSubstituteCurrentExercise(execution),false);\n  const markup=renderGuidedExecution({execution,session,catalog});\n  const substituteButton=markup.match(/<button[^>]+data-session-action=\"substitute\"[^>]*>/)?.[0]||'';\n  assert.match(substituteButton,/disabled aria-disabled=\"true\"/);\n  assert.throws(()=>substituteExercise(execution,session,{fromExerciseId:from,toExerciseId:to,catalog,reason:'Cambio tardío'}),/M26_EXECUTION_SUBSTITUTION_AFTER_SET_RECORDED/);\n"""
          if old not in text:
              raise SystemExit('skipped test anchor not found')
          test.write_text(text.replace(old, new, 1))
      - name: Focused tests
        run: node --test tests/m26_session_substitution_progress.test.mjs tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_current_exercise_history.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m26/workflows/session-execution.js src/m26/workflows/session-ui.js tests/m26_session_substitution_progress.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(session): lock substitution UI after progress"
          git push origin HEAD:fix/session-substitution-ui-lock

name: IBERFIT Final Production Frontend

on:
  push:
    branches:
      - prep/final-production-rc74-4

permissions:
  contents: read

jobs:
  validate-production-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert frontend parity with approved Canary
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=1d00bdc60c63a002eb26a33bc8bbe8655487a848
          git cat-file -e "$APPROVED^{commit}"
          CHANGED="$(git diff --name-only "$APPROVED"..HEAD -- src public shared assets || true)"
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
            echo 'FINAL_PROD_FRONTEND_SOURCE_DIVERGED'
            exit 1
          fi
          echo "APPROVED_FRONTEND_SHA=$APPROVED"

      - name: Verify production frontend contracts
        run: node --test tests/m26_final_production_frontend.test.mjs

      - name: Build canonical current surface
        run: node qa/rc64/build-current-surface.mjs

      - name: Generate validation-only production runtime
        env:
          M26_SUPABASE_URL: https://pjhmrhejsoofmouedavw.supabase.co
          M26_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_only_prod_rc74_4_0000000000000000
          M26_PROJECT_REF: pjhmrhejsoofmouedavw
          M26_QA_ONLY: 'false'
          M26_SOURCE_SHA: 1d00bdc60c63a002eb26a33bc8bbe8655487a848
          M26_PROMOTION_HEAD: ${{ github.sha }}
          M26_BUILD_DIR: .tmp/rc64-current-surface
        run: node scripts/generate_final_production_runtime_config.mjs

      - name: Verify generated PROD surface
        shell: bash
        run: |
          set -euo pipefail
          R=.tmp/rc64-current-surface/m26/runtime-config.js
          V=.tmp/rc64-current-surface/m26/version.json
          H=.tmp/rc64-current-surface/_headers
          test -s "$R" && test -s "$V" && test -s "$H"
          grep -q '"projectRef": "pjhmrhejsoofmouedavw"' "$R"
          grep -q '"qaOnly": false' "$R"
          grep -q '"enabled": true' "$R"
          grep -q '"sourceSha": "1d00bdc60c63a002eb26a33bc8bbe8655487a848"' "$V"
          grep -q '"environment": "PRODUCTION"' "$V"
          grep -q 'https://pjhmrhejsoofmouedavw.supabase.co' "$H"
          ! grep -q 'gjztkdwfmunnzhtvxrsu' "$R" "$V" "$H"
          ! grep -qi 'm26-canary.iberfit.cl' "$R" "$V" "$H"
          ! grep -qi 'service[_-]*role' "$R" "$V" "$H"
          sha256sum "$R" "$V" "$H" | tee FINAL_PRODUCTION_FRONTEND_VALIDATION.sha256

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-production-frontend-validation
          path: FINAL_PRODUCTION_FRONTEND_VALIDATION.sha256
          if-no-files-found: error
          retention-days: 7

name: IBERFIT Canary Exact Deploy + Certify (temporary)

on:
  push:
    branches:
      - ops/canary-live-observe-20260920
    paths:
      - '.github/workflows/ops-canary-live-observe.yml'

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'iberfit-m26-canary'
  CANARY_DOMAIN: 'm26-canary.iberfit.cl'
  EXPECTED_SHA: 'da0e5535a16c73b35c430f9869833b1f6b8af42f'
  QA_REF: 'gjztkdwfmunnzhtvxrsu'
  QA_URL: 'https://gjztkdwfmunnzhtvxrsu.supabase.co'
  PROD_REF: 'pjhmrhejsoofmouedavw'
  WRANGLER_VERSION: '4.120.0'

jobs:
  deploy-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m26-canary-readonly
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact dependencies
        run: npm ci

      - name: Build exact QA-only Canary artifact
        env:
          M26_SUPABASE_URL: ${{ env.QA_URL }}
          M26_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.M26_SUPABASE_PUBLISHABLE_KEY }}
          M26_PROJECT_REF: ${{ env.QA_REF }}
          M26_QA_ONLY: 'true'
          M26_BUILD_DIR: '.tmp/rc64-current-surface'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "${M26_SUPABASE_PUBLISHABLE_KEY:-}" || { echo 'QA_PUBLISHABLE_KEY_MISSING'; exit 42; }
          node qa/rc64/build-current-surface.mjs
          node scripts/generate_rc74_4_runtime_config.mjs
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='.tmp/rc64-current-surface';
          const v={
            release:'IBERFIT_M26_CANARY_RC74_4_PHASE_A',
            version:'26.0.0-canary.74.4-phase-a',
            sourceSha:process.env.EXPECTED_SHA,
            sourceBranch:'canary/rc74-4',
            environment:'QA',
            projectRef:process.env.QA_REF,
            qaOnly:true,
            production:false,
          };
          const text=JSON.stringify(v,null,2)+'\n';
          fs.writeFileSync(path.join(root,'version.json'),text,'utf8');
          fs.writeFileSync(path.join(root,'m26','version.json'),text,'utf8');
          NODE

      - name: Fail-closed artifact verification
        shell: bash
        run: |
          set -euo pipefail
          R=.tmp/rc64-current-surface/m26/runtime-config.js
          V=.tmp/rc64-current-surface/version.json
          VM=.tmp/rc64-current-surface/m26/version.json
          H=.tmp/rc64-current-surface/_headers
          test -s "$R" && test -s "$V" && test -s "$VM" && test -s "$H"
          grep -Fq "$EXPECTED_SHA" "$V"
          grep -Fq '"sourceBranch": "canary/rc74-4"' "$V"
          grep -Fq '"qaOnly": true' "$V"
          grep -Fq '"production": false' "$V"
          grep -Fq "$QA_REF" "$V"
          grep -Fq "$QA_REF" "$R"
          grep -Fq "$QA_URL" "$R"
          grep -Fq '"qaOnly": true' "$R"
          grep -Fq '"enabled": true' "$R"
          grep -Fq "$QA_URL" "$H"
          ! grep -R -Fq "$PROD_REF" "$R" "$V" "$VM" "$H"
          ! grep -R -Eqi 'service[_-]?role' "$R" "$V" "$VM" "$H"
          cmp "$V" "$VM"
          find .tmp/rc64-current-surface -type f -print0 | sort -z | xargs -0 sha256sum > CANARY_EXACT_ARTIFACT.sha256

      - name: Direct-upload exact SHA to Canary only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 43; }
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy .tmp/rc64-current-surface \
            --project-name "$CF_PROJECT" \
            --branch 'canary/rc74-4' \
            --commit-hash "$EXPECTED_SHA" \
            --commit-message "IBERFIT Canary exact ${EXPECTED_SHA:0:12}" \
            --commit-dirty=true | tee WRANGLER_CANARY_EXACT.log

      - name: Verify live identity moved to exact SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 24); do
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "https://${CANARY_DOMAIN}/version.json?exact=${GITHUB_RUN_ID}-${i}" -o /tmp/live-version.json || true
            if node -e "const v=require('/tmp/live-version.json');process.exit(v.sourceSha===process.env.EXPECTED_SHA&&v.sourceBranch==='canary/rc74-4'&&v.qaOnly===true&&v.projectRef===process.env.QA_REF?0:1)" 2>/dev/null; then
              ok=true
              break
            fi
            sleep 5
          done
          "$ok" || { echo 'CANARY_EXACT_SHA_NOT_LIVE'; cat /tmp/live-version.json || true; exit 44; }
          cat /tmp/live-version.json

      - name: Install Chromium for live certification
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Certify exact live Canary desktop and mobile
        env:
          M26_EXPECTED_CANARY_SHA: ${{ env.EXPECTED_SHA }}
        run: node scripts/prelaunch/check_live_canary_gate.mjs

      - name: Read Cloudflare canonical deployment after certification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -o CLOUDFLARE_CANARY_AFTER.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('CLOUDFLARE_CANARY_AFTER.json','utf8'));
          if(!x.success||!x.result)throw new Error('CF_PROJECT_LOOKUP_FAILED');
          const d=x.result.canonical_deployment;
          const sha=d?.deployment_trigger?.metadata?.commit_hash||'';
          const aliases=Array.isArray(d?.aliases)?d.aliases:[];
          const stage=d?.latest_stage?.status||'';
          const out={project:x.result.name,canonicalDeploymentId:d?.id||null,canonicalCommitHash:sha,stage,aliases,productionBranch:x.result.production_branch||null};
          fs.writeFileSync('CANARY_CLOUDFLARE_CANONICAL.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(sha!==process.env.EXPECTED_SHA)throw new Error(`CF_CANONICAL_SHA_MISMATCH:${sha}`);
          if(stage!=='success')throw new Error(`CF_CANONICAL_STAGE_NOT_SUCCESS:${stage}`);
          if(!aliases.includes(`https://${process.env.CANARY_DOMAIN}`))throw new Error('CF_CANARY_ALIAS_MISSING');
          NODE

      - name: Preserve deployment certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-exact-certification-${{ github.run_id }}
          path: |
            CANARY_EXACT_ARTIFACT.sha256
            WRANGLER_CANARY_EXACT.log
            CLOUDFLARE_CANARY_AFTER.json
            CANARY_CLOUDFLARE_CANONICAL.json
            recovery/prelaunch-live/**
          if-no-files-found: warn
          retention-days: 7

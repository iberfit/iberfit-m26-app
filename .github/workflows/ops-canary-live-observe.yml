name: IBERFIT Canary Live Observe (temporary)

on:
  push:
    branches:
      - ops/canary-live-observe-20260920
    paths:
      - '.github/workflows/ops-canary-live-observe.yml'

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'iberfit-m26-canary'
  CANARY_DOMAIN: 'm26-canary.iberfit.cl'
  EXPECTED_SHA: 'da0e5535a16c73b35c430f9869833b1f6b8af42f'

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read Cloudflare Pages state and live version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" -o /tmp/project.json
          curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments?per_page=25" -o /tmp/deployments.json
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors -H 'Cache-Control: no-cache' "https://${CANARY_DOMAIN}/version.json?observe=${GITHUB_RUN_ID}" -o /tmp/version.json
          node <<'NODE'
          const fs=require('fs');
          const deployments=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(!deployments.success||!Array.isArray(deployments.result))throw new Error('CF_DEPLOYMENTS_LOOKUP_FAILED');
          const newest=deployments.result.find((d)=>d.environment==='production');
          if(!newest?.id)throw new Error('CF_NEWEST_PRODUCTION_DEPLOYMENT_MISSING');
          fs.writeFileSync('/tmp/newest-production-id',newest.id);
          NODE
          newest_id="$(cat /tmp/newest-production-id)"
          curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments/${newest_id}" -o /tmp/newest-deployment.json

          node <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          const deployments=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const newestDetail=JSON.parse(fs.readFileSync('/tmp/newest-deployment.json','utf8'));
          const version=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));
          const fail=(code)=>{throw new Error(code)};
          if(!project.success||!project.result)fail('CF_PROJECT_LOOKUP_FAILED');
          if(!deployments.success||!Array.isArray(deployments.result))fail('CF_DEPLOYMENTS_LOOKUP_FAILED');
          if(!newestDetail.success||!newestDetail.result)fail('CF_DEPLOYMENT_DETAIL_LOOKUP_FAILED');
          const p=project.result;
          const domains=Array.isArray(p.domains)?p.domains:[];
          const sanitizeDeployment=(d)=>d?({id:d.id||null,environment:d.environment||null,createdOn:d.created_on||null,modifiedOn:d.modified_on||null,url:d.url||null,aliases:Array.isArray(d.aliases)?d.aliases:[],latestStage:d.latest_stage?{name:d.latest_stage.name||null,startedOn:d.latest_stage.started_on||null,endedOn:d.latest_stage.ended_on||null,status:d.latest_stage.status||null}:null,stages:Array.isArray(d.stages)?d.stages.map((s)=>({name:s.name||null,startedOn:s.started_on||null,endedOn:s.ended_on||null,status:s.status||null})):[],deploymentTriggerType:d.deployment_trigger?.type||null,commitHash:d.deployment_trigger?.metadata?.commit_hash||null,branch:d.deployment_trigger?.metadata?.branch||null}):null;
          const source=p.source?{
            type:p.source.type||null,
            repoName:p.source.config?.repo_name||null,
            owner:p.source.config?.owner||null,
            productionBranch:p.source.config?.production_branch||p.production_branch||null,
            deploymentsEnabled:p.source.config?.deployments_enabled??null,
            productionDeploymentsEnabled:p.source.config?.production_deployments_enabled??null,
            previewDeploymentSetting:p.source.config?.preview_deployment_setting||null,
            previewBranchIncludes:Array.isArray(p.source.config?.preview_branch_includes)?p.source.config.preview_branch_includes:[],
            previewBranchExcludes:Array.isArray(p.source.config?.preview_branch_excludes)?p.source.config.preview_branch_excludes:[],
          }:null;
          const build={
            buildCommand:p.build_config?.build_command||null,
            destinationDir:p.build_config?.destination_dir||null,
            rootDir:p.build_config?.root_dir||null,
            webAnalyticsTokenPresent:Boolean(p.build_config?.web_analytics_token),
            webAnalyticsTagPresent:Boolean(p.build_config?.web_analytics_tag),
          };
          const sanitizeDeploymentConfig=(x)=>x?({
            compatibilityDate:x.compatibility_date||null,
            compatibilityFlags:Array.isArray(x.compatibility_flags)?x.compatibility_flags:[],
            envVarNames:Object.keys(x.env_vars||{}).sort(),
            durableObjectBindings:(x.durable_object_namespaces||[]).map((v)=>v?.name||null).filter(Boolean),
            kvBindings:(x.kv_namespaces||[]).map((v)=>v?.binding||null).filter(Boolean),
            r2Bindings:(x.r2_buckets||[]).map((v)=>v?.binding||null).filter(Boolean),
          }):null;
          const deploymentConfigs={
            production:sanitizeDeploymentConfig(p.deployment_configs?.production),
            preview:sanitizeDeploymentConfig(p.deployment_configs?.preview),
          };
          const rows=deployments.result.map(sanitizeDeployment);
          const canonical=sanitizeDeployment(p.canonical_deployment);
          const latest=sanitizeDeployment(p.latest_deployment);
          const detail=sanitizeDeployment(newestDetail.result);
          const live={sourceSha:String(version.sourceSha||version.commit||version.sha||'').trim().toLowerCase(),sourceBranch:String(version.sourceBranch||version.branch||'').trim(),qaOnly:version.qaOnly===true,projectRef:String(version.projectRef||'').trim(),version:String(version.version||'').trim()};
          const evidence={schema:'iberfit.ops.canary-live-observe.v3',generatedAt:new Date().toISOString(),expectedSha:process.env.EXPECTED_SHA,cloudflare:{project:p.name,productionBranch:p.production_branch||null,domains,source,build,deploymentConfigs,canonicalDeployment:canonical,latestDeployment:latest,newestProductionDeploymentDetail:detail,newestProductionDeployments:rows.filter((d)=>d.environment==='production').slice(0,5)},live,mutationPerformed:false,productionTouched:false};
          fs.writeFileSync('CANARY_LIVE_OBSERVE.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          if(!domains.includes(process.env.CANARY_DOMAIN))fail(`CF_CANARY_DOMAIN_NOT_BOUND:${domains.join(',')}`);
          if(!/^[0-9a-f]{40}$/.test(live.sourceSha))fail('CANARY_LIVE_VERSION_SHA_INVALID');
          if(live.sourceSha!==process.env.EXPECTED_SHA)fail(`CANARY_LIVE_SHA_MISMATCH:${live.sourceSha}:${process.env.EXPECTED_SHA}`);
          if(live.sourceBranch!=='canary/rc74-4')fail(`CANARY_LIVE_BRANCH_MISMATCH:${live.sourceBranch}`);
          if(live.qaOnly!==true)fail('CANARY_LIVE_NOT_QA');
          NODE

      - name: Preserve read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-live-observe-${{ github.run_id }}
          path: CANARY_LIVE_OBSERVE.json
          if-no-files-found: warn
          retention-days: 2

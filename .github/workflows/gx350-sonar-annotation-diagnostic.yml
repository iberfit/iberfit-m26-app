name: GX350 Sonar annotation diagnostic (read only)
on:
  push:
    branches: [ops/gx350-m44-managed-recovery-preflight]
    paths: ['.github/workflows/gx350-sonar-annotation-diagnostic.yml']
permissions:
  checks: read
  contents: read
jobs:
  read-fixed-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read exact previous Sonar check without repository checkout or secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = iberfit/iberfit-m26-app
          test "$GITHUB_REF" = refs/heads/ops/gx350-m44-managed-recovery-preflight
          gh api repos/iberfit/iberfit-m26-app/check-runs/140590815128 --jq '{name,head_sha,conclusion,annotations:.output.annotations_count}' > "$RUNNER_TEMP/sonar-check.json"
          jq -e '.name=="SonarCloud Code Analysis" and .head_sha=="9cd8b15cf99e380d8394cc9e8c9091ca618f35a8" and .annotations==3' "$RUNNER_TEMP/sonar-check.json" >/dev/null
          gh api repos/iberfit/iberfit-m26-app/check-runs/140590815128/annotations --paginate > "$RUNNER_TEMP/sonar-annotations.json"
          # No message bodies, code snippets, raw details, or credentials in logs.
          jq -c '.[] | {path,start_line,end_line,level:.annotation_level,rule_ids:([(.title // ""),(.message // "")]|map(scan("(?:javascript|typescript|js|ts):S[0-9]+|S[0-9]{3,5}"))|flatten|unique)}' "$RUNNER_TEMP/sonar-annotations.json"
          rm -f "$RUNNER_TEMP/sonar-check.json" "$RUNNER_TEMP/sonar-annotations.json"

name: IBERFIT M26 i18n template inventory

on:
  push:
    branches:
      - feat/full-i18n
    paths:
      - '.github/workflows/m26-i18n-template-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-i18n
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find Spanish dynamic templates in UI scope
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const roots=['src/m26/modules','src/m26/app','src/m26/admin','src/m26/ui','src/m26/workflows','src/m26/wearables','src/m26/onboarding'];
          const excludes=[/i18n(?:-|\.)/,/guided-tour\.js$/,/(?:protocol|catalog|norms|evidence)/,/base\.js$/,/iri-report-document\.js$/,/report-workflow\.js$/,/iri-external-report-controller\.js$/,/iri-report-page\.js$/,/contextual-guidance\.js$/,/historical-acquisition\.js$/,/contracts\.js$/];
          const files=[]; function walk(d){if(!fs.existsSync(d))return;for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.js')||e.name.endsWith('.mjs'))files.push(p)}} roots.forEach(walk);
          const spanish=/[áéíóúüñÁÉÍÓÚÜÑ¿¡]|\b(?:cliente|sesión|entrenador|agenda|revisar|pendiente|confirmad[oa]s?|disponible|datos|informe|cita|evaluación|progreso|días?|siguiente|guardad[oa]|selecciona|sin|con|para|del|de la|el|la)\b/iu;
          const out=[];
          for(const file of files){if(excludes.some(r=>r.test(file)))continue;const src=fs.readFileSync(file,'utf8');const re=/`((?:\\.|[^`])*)`/gs;let m;while((m=re.exec(src))){const raw=m[1];if(!raw.includes('${'))continue;const plain=raw.replace(/\$\{[^}]*\}/gs,'{…}').replace(/\\[nrt]/g,' ').replace(/\s+/g,' ').trim();if(plain.length<2||plain.length>320||!spanish.test(plain))continue;const line=src.slice(0,m.index).split(/\r?\n/).length;out.push({file,line,template:plain,raw});}}
          fs.writeFileSync('i18n-dynamic-templates.json',JSON.stringify({count:out.length,templates:out},null,2)+'\n');
          console.log('dynamic_templates='+out.length);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m26-i18n-dynamic-${{ github.run_id }}
          path: i18n-dynamic-templates.json
          retention-days: 7

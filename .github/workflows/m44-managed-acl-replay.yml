name: IBERFIT M44 Verify Persisted App ACL on Sealed Sandbox
on:
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/ops/m44_managed_acl_replay_isolated.mjs'
      - 'tests/m44_managed_acl_replay_isolated.test.mjs'
      - '.github/workflows/m44-managed-acl-replay.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: iberfit-qa-shared-auth-readonly
  queue: max
  cancel-in-progress: false
jobs:
  verify-existing-app-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: m26-canary-readonly
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_READ_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IBERFIT_BACKUP_PASSPHRASE: ${{ secrets.IBERFIT_BACKUP_PASSPHRASE }}
      M44_USER_AUTHORIZATION: APP_ACL_SANDBOX_ONLY_20261122
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify current protected Canary and previous exact managed restoration
        run: node scripts/ops/require_current_canary_sha.mjs
      - name: Test strict app-only ACL TOC and fail-closed isolation
        run: |
          node --check scripts/ops/m44_managed_acl_replay_isolated.mjs
          node --test tests/m44_managed_acl_replay_isolated.test.mjs tests/m44_acl_toc_selector.test.mjs
      - name: Check persisted app ACLs without replaying SQL or resetting passwords
        run: node scripts/ops/m44_managed_acl_replay_isolated.mjs
  restore-free-slots:
    needs: [verify-existing-app-acl]
    if: ${{ always() && github.repository == 'iberfit/iberfit-m26-app' }}
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Return Free slots after any job outcome
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const prod='pjhmrhejsoofmouedavw',qa='gjztkdwfmunnzhtvxrsu',clone='zfvaouggafdbqfbpwhfx';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(process.env.GITHUB_REF!=='refs/heads/canary/rc74-4'||!token)
            throw Error('M44_SLOTS_PROTECTED_CONTEXT_REQUIRED');
          async function req(ref,path='',method='GET'){
            const res=await fetch('https://api.supabase.com/v1/projects/'+ref+path,{
              method,redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(20000)});
            if(!res.ok)throw Error('M44_SLOTS_MANAGEMENT_HTTP_'+res.status);
            const body=await res.text();
            if(!body.trim()){
              if(method==='GET')throw Error('M44_SLOTS_EMPTY_GET');
              return {accepted:true};
            }
            try{return JSON.parse(body);}
            catch{
              if(method==='GET')throw Error('M44_SLOTS_INVALID_GET_JSON');
              return {accepted:true,opaque:true};
            }
          }
          async function state(ref){return (await req(ref)).status;}
          async function until(ref,desired){
            for(let i=0;i<80;i++){
              if(await state(ref)===desired)return;
              await new Promise(r=>setTimeout(r,7000));
            }
            throw Error('M44_SLOTS_REPAIR_TIMEOUT');
          }
          const original=await state(prod);
          if(original!=='ACTIVE_HEALTHY')throw Error('M44_SLOTS_PROD_NOT_HEALTHY');
          const sandbox=await state(clone);
          if(sandbox!=='INACTIVE'){
            if(['COMING_UP','RESTORING'].includes(sandbox))
              await until(clone,'ACTIVE_HEALTHY');
            if(sandbox!=='PAUSING')await req(clone,'/pause','POST');
            await until(clone,'INACTIVE');
          }
          const qaState=await state(qa);
          if(qaState!=='ACTIVE_HEALTHY'){
            if(qaState==='PAUSING')await until(qa,'INACTIVE');
            if(!['RESTORING','COMING_UP'].includes(qaState))
              await req(qa,'/restore','POST');
            await until(qa,'ACTIVE_HEALTHY');
          }
          console.log('M44_MANAGED_FREE_SLOTS_RESTORED:prod_active=1:qa_active=1:clone_inactive=1');
          JS

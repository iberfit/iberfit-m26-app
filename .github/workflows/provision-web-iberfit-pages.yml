name: Provision WEB IBERFIT Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: 'b293c1a3ecc64a14d56a5c0c45edb15636e57182'
  WEB_VERSION: '6.38'
  QA_RUN_ID: '35354827491'
  WRANGLER_VERSION: '4.120.0'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout infraestructura
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar proyecto y rollback actual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -o /tmp/project.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" \
            -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||!p.result) throw new Error('PROJECT_LOOKUP_FAILED');
          if(p.result.name!==process.env.CF_PROJECT) throw new Error('WRONG_PROJECT');
          if(p.result.production_branch!=='production') throw new Error('WRONG_PRODUCTION_BRANCH');
          const domains=Array.isArray(p.result.domains)?p.result.domains:[];
          if(!domains.includes('iberfit.cl')) throw new Error('IBERFIT_DOMAIN_MISSING');
          if(domains.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          const ds=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          if(!ds.success||!Array.isArray(ds.result)) throw new Error('DEPLOYMENT_LIST_FAILED');
          const current=ds.result.filter(d=>d.environment==='production').sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!current?.id) throw new Error('NO_ROLLBACK_POINT');
          fs.appendFileSync(process.env.GITHUB_ENV,'ROLLBACK_DEPLOYMENT_ID='+current.id+'\n');
          console.log(JSON.stringify({project:p.result.name,domains,rollbackDeploymentId:current.id},null,2));
          NODE

      - name: Verificar QA certificada exacta V6.38
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" \
            -o /tmp/qa-v638.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/qa-v638.json','utf8'));
          if(x.head_sha!==process.env.WEB_SHA) throw new Error('QA_SHA_MISMATCH:'+x.head_sha);
          if(x.status!=='completed'||x.conclusion!=='success') throw new Error('QA_NOT_SUCCESS:'+x.status+':'+x.conclusion);
          if(x.name!=='QA WEB IBERFIT V6.38 final') throw new Error('UNEXPECTED_QA:'+x.name);
          NODE

      - name: Descargar candidata exacta y validar contratos
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"
          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "$base/VERSION")" = "$WEB_VERSION"
          test "$(find "$base" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          grep -q '<title>IBERFIT | Entrenamiento personal con criterio</title>' "$base/index.html"
          grep -q '<title>Personal trainer en Las Condes | Entrenamiento personal IBERFIT</title>' "$base/entrenador-personal-las-condes/index.html"
          grep -q 'Si buscas un personal trainer en Las Condes' "$base/entrenador-personal-las-condes/index.html"
          grep -q 'Entrenamiento personal online desde cualquier lugar | IBERFIT' "$base/online/index.html"
          grep -q 'formación universitaria en España' "$base/sobre-iberfit/index.html"
          grep -q 'Las Condes — entrenamiento personal / personal trainer:' "$base/llms.txt"
          ! grep -R -ni --exclude='CHANGELOG.md' --exclude-dir='.git' 'Carlos' "$base"

      - name: Desplegar preview certificada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v638-review-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "$CF_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$WEB_SHA" \
            --commit-message 'WEB IBERFIT V6.38 certified preview' \
            | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Smoke preview
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PREVIEW_URL/VERSION?cb=$GITHUB_RUN_ID" -o /tmp/version.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PREVIEW_URL/entrenador-personal-las-condes/?cb=$GITHUB_RUN_ID" -o /tmp/local.out
          test "$(tr -d '\r\n ' < /tmp/version.out)" = "$WEB_VERSION"
          grep -q '<title>Personal trainer en Las Condes | Entrenamiento personal IBERFIT</title>' /tmp/local.out
          grep -q 'Si buscas un personal trainer en Las Condes' /tmp/local.out

      - name: Desplegar producción certificada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "$CF_PROJECT" \
            --branch production \
            --commit-hash "$WEB_SHA" \
            --commit-message 'WEB IBERFIT V6.38 production' \
            | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "$PRODUCTION_URL"
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Verificar producción y dominio real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "$PRODUCTION_URL/VERSION?cb=$GITHUB_RUN_ID" -o /tmp/pages-version.out
          test "$(tr -d '\r\n ' < /tmp/pages-version.out)" = "$WEB_VERSION"
          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?cb=$suffix" -o /tmp/domain-version.out || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/entrenador-personal-las-condes/?cb=$suffix" -o /tmp/domain-local.out || true
            version="$(tr -d '\r\n ' < /tmp/domain-version.out 2>/dev/null || true)"
            local=0
            grep -q '<title>Personal trainer en Las Condes | Entrenamiento personal IBERFIT</title>' /tmp/domain-local.out 2>/dev/null && grep -q 'Si buscas un personal trainer en Las Condes' /tmp/domain-local.out 2>/dev/null && local=1 || true
            if [ "$version" = "$WEB_VERSION" ] && [ "$local" = 1 ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1 || { echo IBERFIT_CL_RELEASE_NOT_CONSISTENT; exit 44; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" \
            -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          const d=x.result?.find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);
          if(!d) throw new Error('CERTIFIED_SHA_NOT_DEPLOYED');
          if(d.latest_stage?.status && d.latest_stage.status!=='success') throw new Error('DEPLOYMENT_NOT_SUCCESS');
          const evidence={version:process.env.WEB_VERSION,sha:process.env.WEB_SHA,qaRun:process.env.QA_RUN_ID,project:process.env.CF_PROJECT,domain:'iberfit.cl',previewUrl:process.env.PREVIEW_URL,productionUrl:process.env.PRODUCTION_URL,deploymentId:d.id,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,verifiedAt:new Date().toISOString()};
          fs.writeFileSync('/tmp/V638_PRODUCTION_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Guardar evidencia de despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v638-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v638.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V638_PRODUCTION_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30

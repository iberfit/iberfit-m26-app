name: Provision WEB IBERFIT Pages

on:
  push:
    branches:
      - infra/web-iberfit-worker
    paths:
      - '.github/workflows/provision-web-iberfit-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-iberfit-pages-provision
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
  CF_PROJECT: 'web-iberfit'
  WEB_REPO: 'https://github.com/iberfit/iberfitweb.git'
  WEB_SHA: 'bb9332abd06f86b3db59d2e10004964d906ecbe0'
  WEB_VERSION: '6.36'
  QA_RUN_ID: '35101976236'
  WRANGLER_VERSION: '4.120.0'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout infraestructura
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar proyecto, dominio y rollback actual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -o /tmp/project.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" \
            -o /tmp/deployments-before.json

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if(!p.success||!p.result) throw new Error('WEB_IBERFIT_PAGES_LOOKUP_FAILED');
          if(p.result.name!=='web-iberfit') throw new Error('WRONG_PROJECT_NAME:'+p.result.name);
          if(p.result.production_branch!=='production') throw new Error('UNEXPECTED_PRODUCTION_BRANCH:'+p.result.production_branch);
          const domains=Array.isArray(p.result.domains)?p.result.domains:[];
          if(domains.includes('app.iberfit.cl')) throw new Error('APP_DOMAIN_COLLISION');
          if(!domains.includes('iberfit.cl')) throw new Error('IBERFIT_DOMAIN_NOT_ATTACHED:'+domains.join(','));

          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          if(!d.success||!Array.isArray(d.result)) throw new Error('DEPLOYMENTS_LOOKUP_FAILED');
          const current=d.result.filter(v=>v.environment==='production')
            .sort((a,b)=>new Date(b.created_on||0)-new Date(a.created_on||0))[0];
          if(!current?.id) throw new Error('NO_PRODUCTION_ROLLBACK_POINT');
          fs.appendFileSync(process.env.GITHUB_ENV,'ROLLBACK_DEPLOYMENT_ID='+current.id+'\n');
          console.log(JSON.stringify({project:p.result.name,domains,rollbackDeploymentId:current.id},null,2));
          NODE

      - name: Verificar QA certificada V6.36
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/iberfit/iberfitweb/actions/runs/${QA_RUN_ID}" \
            -o /tmp/qa-v636.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/qa-v636.json','utf8'));
          if(x.head_sha!==process.env.WEB_SHA) throw new Error('QA_SHA_MISMATCH:'+x.head_sha);
          if(x.status!=='completed'||x.conclusion!=='success') throw new Error('QA_NOT_SUCCESS:'+x.status+':'+x.conclusion);
          console.log(JSON.stringify({run:x.id,name:x.name,sha:x.head_sha,conclusion:x.conclusion},null,2));
          NODE

      - name: Descargar candidata web certificada exacta
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${WEB_REPO}" /tmp/iberfitweb
          git -C /tmp/iberfitweb fetch --depth=1 origin "${WEB_SHA}"
          git -C /tmp/iberfitweb checkout --detach "${WEB_SHA}"
          test "$(git -C /tmp/iberfitweb rev-parse HEAD)" = "${WEB_SHA}"

          base=/tmp/iberfitweb/candidate/v628
          test "$(tr -d '\r\n ' < "${base}/VERSION")" = "${WEB_VERSION}"
          test -s "${base}/index.html"
          test -s "${base}/404.html"
          test -s "${base}/sitemap.xml"
          test -s "${base}/robots.txt"
          test -s "${base}/llms.txt"
          test -s "${base}/assets/quality.v636.css"
          test -s "${base}/assets/flag-es.svg"
          test -s "${base}/assets/flag-de.svg"
          test -s "${base}/assets/flag-cl.svg"

          grep -q 'evidence-process-section' "${base}/index.html"
          grep -q 'Entrenamiento personal online desde cualquier lugar | IBERFIT' "${base}/online/index.html"
          grep -q '<h3>Online</h3>' "${base}/index.html"
          grep -q 'contact-direct-note' "${base}/contacto/index.html"
          grep -q 'Orientador opcional' "${base}/contacto/index.html"
          grep -q 'local--logistics' "${base}/entrenador-personal-las-condes/index.html"
          grep -q 'local--environment' "${base}/entrenador-personal-vitacura/index.html"
          grep -q 'local--rhythm' "${base}/entrenamiento-personal-providencia/index.html"
          grep -q 'page-breadcrumbs' "${base}/entrenador-personal-las-condes/index.html"
          grep -q 'brand-journey--editorial' "${base}/sobre-iberfit/index.html"
          grep -q 'formación universitaria en España' "${base}/sobre-iberfit/index.html"
          grep -q 'contextos distintos, el español y el alemán' "${base}/sobre-iberfit/index.html"
          grep -q 'Spanish and German contexts' "${base}/en/about/index.html"
          grep -q 'local-context-note' "${base}/entrenador-personal-las-condes/index.html"
          grep -q 'local-context-note' "${base}/en/personal-trainer-las-condes/index.html"
          grep -q 'quality.v636.css' "${base}/sobre-iberfit/index.html"

          ! grep -R -ni --exclude-dir='.git' 'Carlos' "${base}"
          ! grep -R -n --include='*.html' '#founder' "${base}"
          ! grep -R -n --include='*.html' 'founder-identity-section' "${base}"

      - name: Desplegar preview V6.36
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v636-review-${GITHUB_RUN_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "${CF_PROJECT}" \
            --branch "${PREVIEW_BRANCH}" \
            --commit-hash "${WEB_SHA}" \
            --commit-message 'WEB IBERFIT V6.36 certified preview' \
            | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-preview.log | tail -1)"
          test -n "${PREVIEW_URL}" || { echo PREVIEW_URL_NOT_FOUND; exit 42; }
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "${GITHUB_ENV}"

      - name: Smoke preview V6.36
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/VERSION?cb=${GITHUB_RUN_ID}" -o /tmp/v636-version.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-home.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/sobre-iberfit/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-about.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/en/about/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-about-en.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/online/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-online.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/entrenador-personal-las-condes/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-las-condes.out
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PREVIEW_URL}/llms.txt?cb=${GITHUB_RUN_ID}" -o /tmp/v636-llms.out

          test "$(tr -d '\r\n ' < /tmp/v636-version.out)" = "${WEB_VERSION}"
          grep -q 'evidence-process-section' /tmp/v636-home.out
          grep -q '<h3>Online</h3>' /tmp/v636-home.out
          grep -q 'brand-journey--editorial' /tmp/v636-about.out
          grep -q 'formación universitaria en España' /tmp/v636-about.out
          grep -q 'contextos distintos, el español y el alemán' /tmp/v636-about.out
          grep -q 'Spanish and German contexts' /tmp/v636-about-en.out
          grep -q 'quality.v636.css' /tmp/v636-about.out
          grep -q 'Entrenamiento personal online desde cualquier lugar | IBERFIT' /tmp/v636-online.out
          grep -q 'page-breadcrumbs' /tmp/v636-online.out
          grep -q 'local--logistics' /tmp/v636-las-condes.out
          grep -q 'page-breadcrumbs' /tmp/v636-las-condes.out
          grep -q 'historia pública debe presentarse como origen y evolución de la marca' /tmp/v636-llms.out
          ! grep -qi 'Carlos' /tmp/v636-about.out
          ! grep -qi 'Carlos' /tmp/v636-about-en.out
          ! grep -q '#founder' /tmp/v636-about.out
          ! grep -q 'founder-identity-section' /tmp/v636-about.out

      - name: Desplegar V6.36 en producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy /tmp/iberfitweb/candidate/v628 \
            --project-name "${CF_PROJECT}" \
            --branch production \
            --commit-hash "${WEB_SHA}" \
            --commit-message 'WEB IBERFIT V6.36 production' \
            | tee /tmp/wrangler-production.log
          PRODUCTION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/wrangler-production.log | tail -1)"
          test -n "${PRODUCTION_URL}" || { echo PRODUCTION_URL_NOT_FOUND; exit 43; }
          echo "PRODUCTION_URL=${PRODUCTION_URL}" >> "${GITHUB_ENV}"

      - name: Verificar producción y dominio real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PRODUCTION_URL}/VERSION?cb=${GITHUB_RUN_ID}" -o /tmp/v636-pages-version.out
          test "$(tr -d '\r\n ' < /tmp/v636-pages-version.out)" = "${WEB_VERSION}"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${PRODUCTION_URL}/sobre-iberfit/?cb=${GITHUB_RUN_ID}" -o /tmp/v636-pages-about.html
          grep -q 'brand-journey--editorial' /tmp/v636-pages-about.html
          grep -q 'formación universitaria en España' /tmp/v636-pages-about.html
          grep -q 'quality.v636.css' /tmp/v636-pages-about.html
          ! grep -qi 'Carlos' /tmp/v636-pages-about.html
          ! grep -q '#founder' /tmp/v636-pages-about.html
          ! grep -q 'founder-identity-section' /tmp/v636-pages-about.html

          ok=0
          for attempt in $(seq 1 20); do
            suffix="${GITHUB_RUN_ID}-${attempt}"
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?cb=${suffix}" -o /tmp/iberfit-version.out || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/?cb=${suffix}" -o /tmp/iberfit-home.html || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/sobre-iberfit/?cb=${suffix}" -o /tmp/iberfit-about.html || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/online/?cb=${suffix}" -o /tmp/iberfit-online.html || true
            curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/entrenador-personal-las-condes/?cb=${suffix}" -o /tmp/iberfit-las-condes.html || true

            version="$(tr -d '\r\n ' < /tmp/iberfit-version.out 2>/dev/null || true)"
            home=0; about=0; clean=0; online=0; local=0
            grep -q 'evidence-process-section' /tmp/iberfit-home.html 2>/dev/null && grep -q '<h3>Online</h3>' /tmp/iberfit-home.html 2>/dev/null && home=1 || true
            grep -q 'brand-journey--editorial' /tmp/iberfit-about.html 2>/dev/null && grep -q 'formación universitaria en España' /tmp/iberfit-about.html 2>/dev/null && about=1 || true
            if ! grep -qi 'Carlos' /tmp/iberfit-about.html 2>/dev/null && ! grep -q '#founder' /tmp/iberfit-about.html 2>/dev/null && ! grep -q 'founder-identity-section' /tmp/iberfit-about.html 2>/dev/null; then clean=1; fi
            grep -q 'Entrenamiento personal online desde cualquier lugar | IBERFIT' /tmp/iberfit-online.html 2>/dev/null && grep -q 'page-breadcrumbs' /tmp/iberfit-online.html 2>/dev/null && online=1 || true
            grep -q 'local--logistics' /tmp/iberfit-las-condes.html 2>/dev/null && grep -q 'page-breadcrumbs' /tmp/iberfit-las-condes.html 2>/dev/null && local=1 || true

            echo "Production propagation attempt ${attempt}: version=${version:-missing} home=${home} about=${about} clean=${clean} online=${online} local=${local}"
            if [ "${version}" = "${WEB_VERSION}" ] && [ "${home}" = "1" ] && [ "${about}" = "1" ] && [ "${clean}" = "1" ] && [ "${online}" = "1" ] && [ "${local}" = "1" ]; then
              ok=1
              break
            fi
            sleep 4
          done
          test "${ok}" = "1" || { echo IBERFIT_CL_RELEASE_NOT_CONSISTENT; exit 44; }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments" \
            -o /tmp/deployments-after.json

          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          if(!x.success||!Array.isArray(x.result)) throw new Error('DEPLOYMENT_LIST_FAILED');
          const d=x.result.find(v=>v.environment==='production'&&v.deployment_trigger?.metadata?.commit_hash===process.env.WEB_SHA);
          if(!d) throw new Error('CERTIFIED_WEB_SHA_NOT_DEPLOYED');
          if(d.latest_stage?.status && d.latest_stage.status!=='success') throw new Error('DEPLOYMENT_NOT_SUCCESS:'+d.latest_stage.status);
          const evidence={
            version:process.env.WEB_VERSION,
            sha:process.env.WEB_SHA,
            qaRun:process.env.QA_RUN_ID,
            project:process.env.CF_PROJECT,
            domain:'iberfit.cl',
            previewUrl:process.env.PREVIEW_URL,
            productionUrl:process.env.PRODUCTION_URL,
            deploymentId:d.id,
            rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,
            verifiedAt:new Date().toISOString()
          };
          fs.writeFileSync('/tmp/V636_PRODUCTION_EVIDENCE.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Guardar evidencia de despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v636-production-${{ github.run_id }}
          path: |
            /tmp/project.json
            /tmp/deployments-before.json
            /tmp/qa-v636.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/deployments-after.json
            /tmp/V636_PRODUCTION_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30

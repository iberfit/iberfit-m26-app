name: Apply duplicate occurrence fix

on:
  push:
    branches:
      - fix/session-duplicate-exercise-occurrence
    paths:
      - .github/workflows/apply-duplicate-occurrence-fix.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node .iberfit/apply-duplicate-occurrence-fix.mjs
      - name: Validate focused regression
        run: |
          git diff --check
          node --test tests/m26_session_duplicate_exercise_occurrence.test.mjs tests/m26_session_previous_set_reuse.test.mjs tests/m26_session_current_exercise_history.test.mjs
      - name: Commit functional change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/m26/workflows/session-execution.js src/m26/workflows/session-ui.js tests/m26_session_duplicate_exercise_occurrence.test.mjs
          git commit -m "fix(session): isolate duplicate exercise occurrences"
          git push origin HEAD:fix/session-duplicate-exercise-occurrence

name: IBERFIT Build + Deploy Production Frontend E67C89C

on:
  push:
    branches:
      - release/prod-frontend-e67c89c

permissions:
  contents: read

concurrency:
  group: iberfit-m26-production-deploy
  cancel-in-progress: false

jobs:
  build-deploy-production-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert certified frontend source
        shell: bash
        run: |
          set -euo pipefail
          CERTIFIED=e67c89c97d69eabe7f7b6682176e47e68ad6fde2
          CHANGED="$(git diff --name-only "$CERTIFIED" HEAD)"
          test "$CHANGED" = '.github/workflows/build-production-frontend-e67c89c.yml'

      - name: Focused production frontend regressions
        run: |
          node --test tests/m26_p0_production_login_layout_hotfix.test.mjs
          node --test tests/m26_auth_persistence_same_device.test.mjs
          node --test tests/m26_first_access_password.test.mjs
          node --test tests/m26_pwa_install_experience.test.mjs
          node --test tests/m26_rc41_pwa_diagnostics.test.mjs

      - name: Build canonical current surface
        run: node qa/rc64/build-current-surface.mjs

      - name: Reuse current public PROD runtime only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            https://app.iberfit.cl/m26/runtime-config.js \
            -o /tmp/runtime-config.live.js
          node <<'NODE'
          const fs=require('fs');
          const runtime=fs.readFileSync('/tmp/runtime-config.live.js','utf8');
          const required=[
            'pjhmrhejsoofmouedavw',
            'https://pjhmrhejsoofmouedavw.supabase.co'
          ];
          for(const marker of required)if(!runtime.includes(marker))throw new Error(`PROD_RUNTIME_MARKER_MISSING:${marker}`);
          if(!/qaOnly["']?\s*:\s*false/u.test(runtime))throw new Error('PROD_RUNTIME_QA_ONLY_NOT_FALSE');
          if(!/enabled["']?\s*:\s*true/u.test(runtime))throw new Error('PROD_RUNTIME_NOT_ENABLED');
          if(runtime.includes('gjztkdwfmunnzhtvxrsu'))throw new Error('PROD_RUNTIME_QA_LEAK');
          if(/service[_-]?role/iu.test(runtime))throw new Error('PROD_RUNTIME_PRIVILEGED_KEY_FORBIDDEN');
          NODE
          cp /tmp/runtime-config.live.js .tmp/rc64-current-surface/m26/runtime-config.js

      - name: Seal production release identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='.tmp/rc64-current-surface';
          const swPath=path.join(root,'m26','sw.js');
          let sw=fs.readFileSync(swPath,'utf8').replace(/\r\n?/g,'\n');
          const oldVersion=(sw.match(/^const VERSION='([^']+)';/m)||[])[1];
          if(!oldVersion)throw new Error('PROD_SW_VERSION_MISSING');
          sw=sw.replace(/^const VERSION='[^']+';/m,"const VERSION='m26-prod-e67c89c97d69';");
          sw=sw.replace(/^const PREVIOUS_VERSION='[^']+';/m,`const PREVIOUS_VERSION='${oldVersion}';`);
          if(!sw.includes('/src/m26/design/auth-native.css'))throw new Error('PROD_SW_AUTH_NATIVE_MISSING');
          fs.writeFileSync(swPath,sw,'utf8');

          const version={
            release:'IBERFIT_M26_PRODUCTION_E67C89C',
            version:'26.0.0-production.e67c89c',
            sourceSha:'e67c89c97d69eabe7f7b6682176e47e68ad6fde2',
            sourceBranch:'canary/rc74-4',
            previousLiveSha:'cb423a12402206a383d4174a168707b2d860c023',
            environment:'PRODUCTION',
            projectRef:'pjhmrhejsoofmouedavw',
            qaOnly:false,
            production:true
          };
          fs.writeFileSync(path.join(root,'m26','version.json'),JSON.stringify(version,null,2)+'\n','utf8');

          const sourceHeaders=path.join(root,'m26','_headers');
          let headers=fs.readFileSync(sourceHeaders,'utf8').replace(/\r\n?/g,'\n');
          if(headers.includes('gjztkdwfmunnzhtvxrsu')||headers.includes('m26-canary.iberfit.cl'))throw new Error('PROD_HEADERS_NONPROD_LEAK');
          headers=headers.replace('  Cache-Control: no-store\n\n/m26/runtime-config.js','  Cache-Control: no-store, no-transform\n\n/m26/runtime-config.js');
          headers=headers.replace('/m26/index.html\n  Cache-Control: no-cache, must-revalidate','/m26/index.html\n  Cache-Control: no-cache, must-revalidate, no-transform');
          fs.writeFileSync(sourceHeaders,headers,'utf8');
          fs.writeFileSync(path.join(root,'_headers'),headers,'utf8');
          NODE

      - name: Verify deployable production surface
        shell: bash
        run: |
          set -euo pipefail
          R=.tmp/rc64-current-surface/m26/runtime-config.js
          V=.tmp/rc64-current-surface/m26/version.json
          S=.tmp/rc64-current-surface/m26/sw.js
          H=.tmp/rc64-current-surface/_headers
          test -s "$R" && test -s "$V" && test -s "$S" && test -s "$H"
          grep -q 'e67c89c97d69eabe7f7b6682176e47e68ad6fde2' "$V"
          grep -q '"environment": "PRODUCTION"' "$V"
          grep -q '"projectRef": "pjhmrhejsoofmouedavw"' "$V"
          grep -q "const VERSION='m26-prod-e67c89c97d69';" "$S"
          grep -q '/src/m26/design/auth-native.css' "$S"
          grep -q 'https://pjhmrhejsoofmouedavw.supabase.co' "$H"
          ! grep -R -q 'gjztkdwfmunnzhtvxrsu' "$R" "$V" "$H"
          ! grep -R -Eqi 'service[_-]?role' "$R" "$V" "$H"
          cd .tmp/rc64-current-surface
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../PROD_FRONTEND_E67C89C.sha256

      - name: Upload deployable production frontend
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m26-production-e67c89c
          path: .tmp/rc64-current-surface/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Discover exact Cloudflare production project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN_MISSING'; exit 41; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/iberfit-m26-production" \
            -o CLOUDFLARE_PROJECT_BEFORE.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('CLOUDFLARE_PROJECT_BEFORE.json','utf8'));
          if(!x.success||!x.result)throw new Error('CLOUDFLARE_PROJECT_LOOKUP_FAILED');
          const p=x.result;
          if(p.name!=='iberfit-m26-production')throw new Error(`WRONG_CF_PROJECT:${p.name}`);
          if(!p.production_branch)throw new Error('CF_PRODUCTION_BRANCH_MISSING');
          const domains=Array.isArray(p.domains)?p.domains:[];
          if(!domains.includes('app.iberfit.cl'))throw new Error(`APP_DOMAIN_NOT_BOUND:${domains.join(',')}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`CF_PRODUCTION_BRANCH=${p.production_branch}\n`);
          console.log(JSON.stringify({name:p.name,productionBranch:p.production_branch,domains,latestDeploymentId:p.latest_deployment?.id||null,latestDeploymentEnvironment:p.latest_deployment?.environment||null},null,2));
          NODE

      - name: Deploy certified frontend with Wrangler to exact production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_PRODUCTION_BRANCH:-}" || { echo 'CF_PRODUCTION_BRANCH_MISSING'; exit 43; }
          npx --yes wrangler@4.120.0 pages deploy .tmp/rc64-current-surface \
            --project-name iberfit-m26-production \
            --branch "$CF_PRODUCTION_BRANCH" \
            --commit-hash e67c89c97d69eabe7f7b6682176e47e68ad6fde2 \
            --commit-message "IBERFIT M26 production e67c89c" \
            --commit-dirty=true

      - name: Verify production live exact identity read-only
        env:
          EXPECTED_SHA: e67c89c97d69eabe7f7b6682176e47e68ad6fde2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=process.env.EXPECTED_SHA;
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const getText=async(url)=>{
            const r=await fetch(url,{headers:{'cache-control':'no-cache'}});
            if(!r.ok)throw new Error(`HTTP_${r.status}:${url}`);
            return r.text();
          };
          let version=null;
          let lastError=null;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const raw=await getText(`https://app.iberfit.cl/m26/version.json?release=${expected}&attempt=${attempt}`);
              const v=JSON.parse(raw);
              if(v.sourceSha===expected&&v.environment==='PRODUCTION'&&v.projectRef==='pjhmrhejsoofmouedavw'&&v.production===true&&v.qaOnly===false){
                version=v;
                break;
              }
              lastError=new Error(`LIVE_VERSION_MISMATCH:${raw}`);
            }catch(error){lastError=error;}
            await sleep(4000);
          }
          if(!version)throw lastError||new Error('PROD_LIVE_SOURCE_SHA_MISMATCH');

          const runtime=await getText(`https://app.iberfit.cl/m26/runtime-config.js?release=${expected}`);
          for(const marker of ['pjhmrhejsoofmouedavw','https://pjhmrhejsoofmouedavw.supabase.co']){
            if(!runtime.includes(marker))throw new Error(`LIVE_RUNTIME_MARKER_MISSING:${marker}`);
          }
          if(!/qaOnly["']?\s*:\s*false/u.test(runtime))throw new Error('LIVE_RUNTIME_QA_ONLY_NOT_FALSE');
          if(!/enabled["']?\s*:\s*true/u.test(runtime))throw new Error('LIVE_RUNTIME_NOT_ENABLED');
          if(runtime.includes('gjztkdwfmunnzhtvxrsu'))throw new Error('LIVE_RUNTIME_QA_LEAK');
          if(/service[_-]?role/iu.test(runtime))throw new Error('LIVE_RUNTIME_PRIVILEGED_KEY_FORBIDDEN');

          const index=await getText(`https://app.iberfit.cl/m26/index.html?release=${expected}`);
          for(const marker of ['Primera vez o no recuerdo mi contraseña','/public/isotipo-iberfit.png','/src/m26/design/auth-native.css']){
            if(!index.includes(marker))throw new Error(`LIVE_INDEX_MARKER_MISSING:${marker}`);
          }
          console.log(JSON.stringify({ok:true,sourceSha:version.sourceSha,environment:version.environment,projectRef:version.projectRef},null,2));
          NODE

      - name: Record exact Cloudflare production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '5b03d387427d367674b9d05b8bdf7c84'
          EXPECTED_SHA: e67c89c97d69eabe7f7b6682176e47e68ad6fde2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/iberfit-m26-production" \
            -o CLOUDFLARE_PROJECT_AFTER.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/iberfit-m26-production/deployments" \
            -o CLOUDFLARE_PROD_DEPLOYMENTS.json
          node <<'NODE'
          const fs=require('fs');
          const expected=process.env.EXPECTED_SHA;
          const project=JSON.parse(fs.readFileSync('CLOUDFLARE_PROJECT_AFTER.json','utf8'));
          if(!project.success||!project.result)throw new Error('CLOUDFLARE_PROJECT_AFTER_FAILED');
          const p=project.result;
          const latest=p.latest_deployment;
          const latestSha=latest?.deployment_trigger?.metadata?.commit_hash||latest?.source?.config?.production_branch||null;
          const deployments=JSON.parse(fs.readFileSync('CLOUDFLARE_PROD_DEPLOYMENTS.json','utf8'));
          if(!deployments.success||!Array.isArray(deployments.result))throw new Error('CLOUDFLARE_DEPLOYMENT_LIST_FAILED');
          const exact=deployments.result.find(d=>d.environment==='production'&&(d.deployment_trigger?.metadata?.commit_hash===expected||d.source?.config?.commit_hash===expected));
          if(!exact)throw new Error('EXACT_PRODUCTION_DEPLOYMENT_NOT_FOUND');
          if(!Array.isArray(p.domains)||!p.domains.includes('app.iberfit.cl'))throw new Error('APP_DOMAIN_NOT_BOUND_AFTER_DEPLOY');
          console.log(JSON.stringify({project:p.name,productionBranch:p.production_branch,latestDeploymentId:latest?.id||null,latestDeploymentSha:latestSha,exactDeploymentId:exact.id,exactDeploymentUrl:exact.url,exactEnvironment:exact.environment,exactCommit:exact.deployment_trigger?.metadata?.commit_hash||null,domains:p.domains},null,2));
          NODE

      - name: Upload checksum and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-m26-production-e67c89c-evidence
          path: |
            PROD_FRONTEND_E67C89C.sha256
            CLOUDFLARE_PROJECT_BEFORE.json
            CLOUDFLARE_PROJECT_AFTER.json
            CLOUDFLARE_PROD_DEPLOYMENTS.json
          if-no-files-found: warn
          retention-days: 7

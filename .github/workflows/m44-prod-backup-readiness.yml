name: IBERFIT M44 PROD Backup Inventory Readiness

on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/ops/m44_prod_backup_inventory_guard.mjs'
      - 'tests/m44_production_backup_inventory_contract.test.mjs'
      - '.github/workflows/m44-prod-backup-readiness.yml'
      - '.github/workflows/production-promote.yml'
  push:
    branches: [canary/rc74-4]
    paths:
      - 'scripts/ops/m44_prod_backup_inventory_guard.mjs'
      - '.github/workflows/m44-prod-backup-readiness.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Read-only backup inventory check; no production writes'
        required: true
        type: choice
        options: [CHECK_PROD_BACKUP_INVENTORY]

permissions:
  contents: read

concurrency:
  group: m44-prod-backup-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: m44-backup-inventory-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify fail-closed inventory source
        run: node --test tests/m44_production_backup_inventory_contract.test.mjs

  inventory:
    name: m44-prod-backup-readonly-check
    needs: contract
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.confirmation == 'CHECK_PROD_BACKUP_INVENTORY')
    runs-on: ubuntu-latest
    environment: m26-canary-readonly
    timeout-minutes: 5
    env:
      PROD_SUPABASE_REF: 'pjhmrhejsoofmouedavw'
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert backup inventory without reading customer data
        run: node scripts/ops/m44_prod_backup_inventory_guard.mjs

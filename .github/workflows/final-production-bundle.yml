name: IBERFIT Production Current Baseline Evidence - NO GO
on:
  pull_request:
    branches: [canary/rc74-4]
    paths:
      - '.github/workflows/final-production-bundle.yml'
      - 'scripts/ops/verify_current_prod_baseline.mjs'
      - 'scripts/build_final_production_promotion.mjs'
      - 'scripts/build_final_production_promotion_prod_compat.mjs'
      - 'tests/m26_prod_current_baseline.test.mjs'
  push:
    branches: [canary/rc74-4]
permissions:
  contents: read
concurrency:
  group: iberfit-prod-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    name: static-release-boundary-no-obsolete-DDL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run historical contract offline and current release firewall
        run: |
          node --test tests/m26_final_production_promotion.test.mjs
          node --test tests/m26_final_production_promotion_prod_compat.test.mjs
          node --test tests/m26_prod_current_baseline.test.mjs
      - name: Never publish an executable legacy SQL artifact
        run: test ! -e backend/production/generated/FINAL_PRODUCTION_PROMOTION.sql
  current-prod-readonly:
    name: verify actual PROD catalog as non-promotable evidence only
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary/rc74-4' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m26-canary-readonly
    env:
      PROD_SUPABASE_REF: pjhmrhejsoofmouedavw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require SHA exact on protected Canary
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: node scripts/ops/require_current_canary_sha.mjs
      - name: Inspect PROD migration ledger, permissions and U60 staged state - READ ONLY
        run: node scripts/ops/verify_current_prod_baseline.mjs
      - name: Preserve non-executable evidence only
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-prod-readonly-NO-GO-${{ github.run_id }}
          path: recovery/PROD_CURRENT_BASELINE_READONLY.json
          if-no-files-found: error
          retention-days: 14

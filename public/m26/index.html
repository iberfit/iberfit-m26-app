.m26-auth-page,.m26-auth-page *{box-sizing:border-box}
.m26-auth-page{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(clamp(1.25rem,4vw,3rem),env(safe-area-inset-top)) max(clamp(1.25rem,4vw,3rem),env(safe-area-inset-right)) max(clamp(1.25rem,4vw,3rem),env(safe-area-inset-bottom)) max(clamp(1.25rem,4vw,3rem),env(safe-area-inset-left));color:#f7f1e4;background:radial-gradient(circle at 78% 8%,rgba(200,166,93,.10),transparent 30rem),radial-gradient(circle at 12% 88%,rgba(38,108,77,.15),transparent 34rem),#07150f}
.m26-auth-card{width:min(34rem,100%);max-width:100%;margin-block:auto;padding:clamp(.75rem,2.5vw,1.5rem) 0;overflow-wrap:anywhere;border:0;border-radius:0;background:transparent;box-shadow:none}
.m26-auth-brand{display:grid;justify-items:center;gap:.4rem;margin:0 0 1.1rem;text-align:center}
.m26-auth-logo{display:block;width:clamp(4.25rem,8vw,5.25rem);height:auto;max-height:5.25rem;margin:0;object-fit:contain}
.m26-eyebrow{margin:0;color:#e4cd98;font-size:.68rem;font-weight:760;letter-spacing:.15em;text-transform:uppercase}
.m26-auth-card h1{max-width:15ch;margin:.4rem auto .6rem;color:#f7f1e4;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.05rem,5vw,3rem);font-weight:560;line-height:1.04;letter-spacing:-.018em;text-align:center}
.m26-auth-card>p:not(.m26-notice):not(.m26-auth-notice){margin:0 auto;color:#ddd4c1;line-height:1.55;text-align:center}
.m26-auth-card form{display:grid;gap:.88rem;margin-top:1.25rem}
.m26-auth-card label{display:grid;gap:.4rem;color:#ddd4c1;font-size:.82rem;font-weight:650}
.m26-auth-card input,.m26-auth-card button{width:100%;min-height:48px;border:1px solid rgba(228,205,152,.18);border-radius:.9rem;font:inherit}
.m26-auth-card input{padding:.76rem .85rem;color:#f7f1e4;background:rgba(5,18,13,.72)}
.m26-auth-card button{padding:.76rem 1rem;color:#f7f1e4;background:rgba(199,164,90,.08);cursor:pointer}
.m26-password-field{position:relative}
.m26-password-field input{padding-right:6.2rem}
.m26-password-toggle{position:absolute;right:.42rem;top:50%;width:auto!important;min-height:2.35rem!important;padding:.36rem .62rem!important;transform:translateY(-50%);border:0!important;border-radius:.62rem!important;color:#e4cd98!important;background:rgba(228,205,152,.08)!important;font-size:.76rem!important;font-weight:700!important}
.m26-auth-options{display:flex;align-items:center;justify-content:space-between;gap:.7rem;flex-wrap:wrap}
.m26-auth-card .m26-remember-email{display:inline-flex;grid-template-columns:none;align-items:center;gap:.5rem;color:#ddd4c1;font-size:.78rem;font-weight:560;cursor:pointer}
.m26-auth-card .m26-remember-email input{width:1.05rem;min-height:1.05rem;height:1.05rem;margin:0;padding:0;accent-color:#c8a65d}
.m26-auth-link{width:auto!important;min-height:auto!important;padding:.28rem 0!important;border:0!important;border-radius:0!important;color:#e4cd98!important;background:transparent!important;font-size:.78rem!important}
.m26-auth-card .m26-primary-action{margin:.1rem 0 0;color:#07150f;background:#c8a65d;font-weight:760}
.m26-auth-card button:disabled{opacity:.62;cursor:not-allowed}
.m26-auth-card input:focus-visible,.m26-auth-card button:focus-visible{outline:3px solid #f2dca8;outline-offset:2px}
.m26-notice,.m26-auth-notice{margin:.9rem 0 0;padding:.78rem .9rem;border:1px solid rgba(228,205,152,.18);border-radius:.9rem;color:#ddd4c1;background:rgba(199,164,90,.08);line-height:1.45}
.m26-notice.is-warning{border-color:rgba(231,201,138,.35)}
.m26-auth-notice.is-error{border-color:rgba(232,169,146,.36);color:#f7e7dd;background:rgba(134,61,44,.15)}
.m26-auth-card small{display:block;margin-top:.85rem;color:#c8c0af;line-height:1.45;text-align:center}
@media(max-height:760px) and (min-width:581px){.m26-auth-page{padding-top:.7rem;padding-bottom:.7rem}.m26-auth-card{padding:.55rem 0}.m26-auth-brand{margin-bottom:.65rem}.m26-auth-logo{width:3.7rem}.m26-auth-card h1{margin:.25rem auto .38rem;font-size:clamp(1.9rem,4vw,2.55rem)}.m26-auth-card form{gap:.6rem;margin-top:.75rem}.m26-notice,.m26-auth-notice{margin-top:.6rem;padding:.62rem .78rem}.m26-auth-card small{margin-top:.55rem}}
@media(max-width:580px){.m26-auth-page{padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1.25rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}.m26-auth-card{width:100%;padding:.5rem 0}.m26-auth-brand{margin-bottom:1rem}.m26-auth-logo{width:4.35rem}.m26-auth-card h1{font-size:clamp(2rem,10vw,2.65rem)}.m26-auth-options{align-items:flex-start}.m26-auth-link{margin-left:auto}}</style>

  <title>IBERFIT</title>

<body>
  <div id="app">
    <main class="m26-auth-page" data-static-auth-bootstrap="true">
      <section class="m26-auth-card" aria-labelledby="m26-auth-title" aria-busy="false">
        <header class="m26-auth-brand">
          <img class="m26-auth-logo" src="/public/isotipo-iberfit.png" alt="" aria-hidden="true">
          <p class="m26-eyebrow">IBERFIT</p>
        </header>
        <h1 id="m26-auth-title" tabindex="-1">Entrenamiento personal con criterio</h1>
        <p>Diagnóstico, planificación, control y seguimiento.</p>
        <form data-auth-form="login">
          <label>
            Correo
            <input
              type="email"
              name="email"
              autocomplete="username"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              maxlength="254"
              required
            >
          </label>
          <label>
            Contraseña
            <span class="m26-password-field">
              <input
                id="m26-login-password"
                type="password"
                name="password"
                autocomplete="current-password"
                required
                minlength="8"
                maxlength="1024"
              >
              <button
                type="button"
                class="m26-password-toggle"
                data-password-toggle
                aria-controls="m26-login-password"
                aria-pressed="false"
                aria-label="Mostrar contraseña"
              >Mostrar</button>
            </span>
          </label>
          <div class="m26-auth-options">
            <label class="m26-remember-email" for="m26-remember-email">
              <input id="m26-remember-email" type="checkbox" name="rememberEmail">
              <span>Recordar correo</span>
            </label>
            <button type="button" class="m26-auth-link" data-auth-action="forgot-password">
              Primera vez o no recuerdo mi contraseña
            </button>
          </div>
          <button
            type="submit"
            class="m26-primary-action"
            disabled
            aria-disabled="true"
          >
            Entrar
          </button>
        </form>
        <p class="m26-notice is-warning">Cargando acceso seguro a IBERFIT...</p>
        <small>Acceso protegido por autenticación y permisos de cuenta.</small>
      </section>
    </main>
  </div>
  <noscript>IBERFIT necesita JavaScript para funcionar.</noscript>
  <script src="/m26/runtime-config.js"></script>
  <script type="module" src="/m26/app.js"></script>
</body>
</html>

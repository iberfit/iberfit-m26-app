<!doctype html>
<html lang="es-ES">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2419">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="IBERFIT · Diagnóstico, planificación, control y seguimiento.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="application-name" content="IBERFIT">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/m26/manifest.webmanifest">
  <link rel="icon" href="/m26/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/m26/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="/m26/preauth-critical.css">
  <link rel="stylesheet" href="/src/m26/design/tokens.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/design/typography.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/design/icons.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/shell/shell.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/workflows/iri-external-report.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/ui/client-bottom-nav.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/rc39/rc39.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/communication/communication.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/admin/admin.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/rc42/rc42.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/rc44/rc44.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/design/primitives.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/design/role-surfaces.css" data-iberfit-full-style media="not all">
  <link rel="stylesheet" href="/src/m26/design/adaptive-layout.css" data-iberfit-full-style media="not all">
  <title>IBERFIT</title>
</head>
<body>
  <div id="app">
    <main class="m26-auth-page" data-static-auth-bootstrap="true">
      <section class="m26-auth-card" aria-labelledby="m26-auth-title" aria-busy="false">

        <p class="m26-eyebrow">IBERFIT</p>
        <h1 id="m26-auth-title" tabindex="-1">Entrenamiento personal con criterio</h1>
        <p>Diagnóstico, planificación, control y seguimiento.</p>
        <form data-auth-form="login">
          <label>
            Correo
            <input
              type="email"
              name="email"
              autocomplete="username"
              maxlength="254"
              required
            >
          </label>
          <label>
            Contraseña
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="8"
              maxlength="1024"
            >
          </label>
          <button
            type="submit"
            class="m26-primary-action"
            disabled
            aria-disabled="true"
          >
            Entrar
          </button>
          <button
            type="button"
            data-auth-action="forgot-password"
          >
            Olvidé mi contraseña
          </button>
        </form>
        <p class="m26-notice is-warning">El acceso no está disponible temporalmente en este sitio.</p>
        <small>Acceso restringido a las cuentas autorizadas para esta revisión.</small>
      </section>
    </main>
  </div>
  <noscript>IBERFIT necesita JavaScript para funcionar.</noscript>
  <script src="/m26/runtime-config.js"></script>
  <script type="module" src="/m26/app.js"></script>
</body>
</html>

html,body{margin:0;min-width:0;min-height:100%;background:#07150f}
body{min-height:100dvh;overflow-x:hidden;color:#f7f1e4;background:#07150f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.m26-auth-page,.m26-auth-page *{box-sizing:border-box}
.m26-auth-page{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:max(clamp(1rem,4vw,2rem),env(safe-area-inset-top)) max(clamp(1rem,4vw,2rem),env(safe-area-inset-right)) max(clamp(1rem,4vw,2rem),env(safe-area-inset-bottom)) max(clamp(1rem,4vw,2rem),env(safe-area-inset-left));color:#f7f1e4;background:radial-gradient(circle at 50% 12%,rgba(200,166,93,.14),transparent 24rem),#07150f}
.m26-auth-card{width:min(38rem,100%);max-width:100%;margin-block:auto;padding:clamp(1.25rem,4vw,2rem);overflow-wrap:anywhere;border:1px solid rgba(228,205,152,.18);border-radius:1.25rem;background:rgba(13,36,25,.92);box-shadow:0 24px 70px rgba(2,10,7,.28)}
.m26-auth-card>img{display:block;width:3.25rem;height:3.25rem;margin:0 0 .45rem;object-fit:contain}
.m26-eyebrow{margin:0;color:#e4cd98;font-size:.68rem;font-weight:760;letter-spacing:.15em;text-transform:uppercase}
.m26-auth-card h1{max-width:14ch;margin:.4rem 0 .55rem;color:#f7f1e4;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.05rem,5vw,2.85rem);font-weight:560;line-height:1.04;letter-spacing:-.018em}
.m26-auth-card>p:not(.m26-eyebrow):not(.m26-notice):not(.m26-auth-notice){margin:0;color:#ddd4c1;line-height:1.55}
.m26-auth-card form{display:grid;gap:.8rem;margin-top:1.05rem}
.m26-auth-card label{display:grid;gap:.4rem;color:#ddd4c1;font-size:.82rem;font-weight:650}
.m26-auth-card input,.m26-auth-card button{width:100%;min-height:46px;border:1px solid rgba(228,205,152,.18);border-radius:.9rem;font:inherit}
.m26-auth-card input{padding:.72rem .8rem;color:#f7f1e4;background:rgba(5,18,13,.72)}
.m26-auth-card button{padding:.72rem 1rem;color:#f7f1e4;background:rgba(199,164,90,.08);cursor:pointer}
.m26-auth-card .m26-primary-action{margin:0;color:#07150f;background:#c8a65d;font-weight:760}
.m26-auth-card button:disabled{opacity:.62;cursor:not-allowed}
.m26-auth-card input:focus-visible,.m26-auth-card button:focus-visible{outline:3px solid #f2dca8;outline-offset:2px}
.m26-notice,.m26-auth-notice{margin:.9rem 0 0;padding:.78rem .9rem;border:1px solid rgba(228,205,152,.18);border-radius:.9rem;color:#ddd4c1;background:rgba(199,164,90,.08);line-height:1.45}
.m26-notice.is-warning{border-color:rgba(231,201,138,.35)}
.m26-auth-notice.is-error{border-color:rgba(232,169,146,.36);color:#f7e7dd;background:rgba(134,61,44,.15)}
.m26-auth-card small{display:block;margin-top:.8rem;color:#c8c0af;line-height:1.45}
@media(max-height:860px) and (min-width:581px){.m26-auth-page{padding-top:.75rem;padding-bottom:.75rem}.m26-auth-card{padding:1.15rem 1.4rem}.m26-auth-card>img{width:2.65rem;height:2.65rem;margin-bottom:.25rem}.m26-auth-card h1{margin:.28rem 0 .4rem;font-size:clamp(2rem,4vw,2.55rem)}.m26-auth-card form{gap:.58rem;margin-top:.75rem}.m26-notice,.m26-auth-notice{margin-top:.65rem;padding:.65rem .8rem}.m26-auth-card small{margin-top:.6rem}}
@media(max-width:580px){.m26-auth-page{padding:max(.75rem,env(safe-area-inset-top)) max(.75rem,env(safe-area-inset-right)) max(.75rem,env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left))}.m26-auth-card{width:100%;margin-block:0 auto;padding:1rem}.m26-auth-card h1{font-size:clamp(2rem,10vw,2.5rem)}}</style>

  <title>IBERFIT</title>
</head>
<body>
  <div id="app">
    <main class="m26-auth-page" data-static-auth-bootstrap="true">
      <section class="m26-auth-card" aria-labelledby="m26-auth-title" aria-busy="false">
        <p class="m26-eyebrow">IBERFIT</p>
        <h1 id="m26-auth-title" tabindex="-1">Entrenamiento personal con criterio</h1>
        <p>Diagnóstico, planificación, control y seguimiento.</p>
        <form data-auth-form="login">
          <label>
            Correo
            <input
              type="email"
              name="email"
              autocomplete="username"
              maxlength="254"
              required
            >
          </label>
          <label>
            Contraseña
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="8"
              maxlength="1024"
            >
          </label>
          <button
            type="submit"
            class="m26-primary-action"
            disabled
            aria-disabled="true"
          >
            Entrar
          </button>
          <button
            type="button"
            data-auth-action="forgot-password"
          >
            Olvidé mi contraseña
          </button>
        </form>
        <p class="m26-notice is-warning">Cargando acceso seguro a IBERFIT...</p>
        <small>Acceso protegido por autenticación y permisos de cuenta.</small>
      </section>
    </main>
  </div>
  <noscript>IBERFIT necesita JavaScript para funcionar.</noscript>
  <script src="/m26/runtime-config.js"></script>
  <script type="module" src="/m26/app.js"></script>
</body>
